 talkyuting24:{speaker:'陳宇軒',text:'「她每天早上打工，來學校又當班長。」\n\n佳穎點頭。「所以看到她的時候，不要只問她為什麼沒來。」\n\n關心一個人，有時不是追問缺席，而是讓她回來時不必先道歉。',effect:s=>s.flags.plannedGentlerReturnForYuting=true,next:'ch24end'},
 justlunch24:{text:'他們坐在福利社後方，把午餐慢慢吃完。\n\n佳穎講新班同學的綽號，宇軒說父親週末回家仍像住旅館。沒有另外兩個人，談話也沒有因此變得不完整。',effect:s=>s.flags.acceptedTwoPersonFridayLunch=true,next:'ch24end'},
 ch24end:{chapter:'第二十四章・完',date:'1989年9月15日｜星期五',location:'島北高中・午後',bg:'linear-gradient(155deg,#625e57,#424c49 55%,#283234)',text:'高二的友情，開始由許多短時間組成。\n\n走廊三分鐘、午休十一分鐘、放學到公車進站以前的七分鐘。\n\n他們再也不能用整個下午證明彼此重要，只能把重要藏進每一段被課表切碎的空隙。\n\n而宇軒漸漸發現，即使四個人的關係仍在，自己開始期待的，有時只是走廊另一端那一個人朝他走來。',next:'ch25title'},

 ch25title:{chapter:'第二十五章',date:'1989年10月7日｜星期六',location:'島北高中・棒球場',bg:'linear-gradient(160deg,#7b735f,#4f5a4e 56%,#2e3937)',text:'十七號的替補席\n\n秋天還沒有真正變冷。操場的紅土被太陽曬出乾燥氣味，風一吹，細沙便貼在鐵網和觀眾的褲腳上。\n\n家豪穿著十七號球衣，坐在最靠近飲水桶的位置。\n\n比賽已經進行到第五局，他一次也沒有站起來熱身。',next:'bench25'},
 bench25:{speaker:'陳宇軒',text:'宇軒和雨婷站在鐵網外。佳穎去替音樂社排練，說結束後會趕來。\n\n家豪沒有朝這裡看。他把手套夾在膝間，跟著場上的每一球轉動視線，像只要看得夠專心，就能假裝自己也是比賽的一部分。',choices:[['在局間休息時喊他的名字','callbench25'],['先安靜看完這一局','watchbench25']]},
 callbench25:{speaker:'陳宇軒',text:'「十七號！」\n\n家豪終於抬頭。宇軒舉起手裡兩瓶汽水，隔著鐵網晃了晃。\n\n他愣了一下，隨即用拳頭碰了碰胸前的號碼。那個動作很小，卻像在回答：我還在。',effect:s=>s.flags.calledJiahaoFromBench=true,next:'coach25'},
 watchbench25:{text:'宇軒忍住沒有喊。\n\n他看見家豪在隊友漏接時第一個站起來提醒補位，也看見教練回頭時，他立刻把失望收回臉裡。\n\n有些難過不是不能碰，只是最好等對方不用同時假裝堅強的時候。',effect:s=>s.flags.waitedBeforeSpeakingToBenchedJiahao=true,next:'coach25'},
 coach25:{speaker:'棒球隊教練',text:'第六局下半，教練終於朝替補席勾了勾手。\n\n「十七號，去右外野。先把該接的接住，不要想一次把前兩週都打回來。」\n\n家豪抓起球帽時踢倒了水瓶。他扶正瓶子，跑出去的背影比平常僵硬。',next:'flyball25'},
 flyball25:{text:'兩出局後，一顆飛球越過二壘手頭頂。\n\n家豪往前衝了三步，又忽然停住。球在風裡偏向界外，他側身追上，手套抬得太早，最後仍在落地前把球收了進去。\n\n觀眾席沒有歡呼，只響起幾下理所當然的掌聲。家豪站在原地，低頭確認球真的在手套裡。',next:'aftergame25'},
 aftergame25:{date:'1989年10月7日｜星期六',location:'棒球場後方水泥階梯',bg:'linear-gradient(150deg,#746a58,#4a4d47 58%,#2b3434)',speaker:'陳家豪',text:'比賽結束後，他們坐在器材室外的階梯。佳穎抱著樂譜趕到，只看見記分板上的終場比數。\n\n家豪喝了半瓶汽水才說：「我以為進球隊以後，只要努力就會一直往前。」\n\n瓶身凝結的水滑進他掌心。\n\n「結果有時候，努力只是讓你還能坐在這裡。」',choices:[['「坐在這裡也不等於沒有前進。」','answerbench25'],['「你剛才那球接得很好。」','answercatch25'],['陪他把汽水喝完','answersilent25']]},
 answerbench25:{speaker:'陳宇軒',text:'「至少你沒有因為沒上場，就假裝場上的事跟你無關。」\n\n家豪看著瓶蓋，好半天才笑了一聲。「你現在講話越來越像黃老師。」\n\n雨婷在旁邊說：「這應該不是稱讚吧。」',effect:s=>s.flags.toldJiahaoBenchStillCounts=true,next:'fathergate25'},
 answercatch25:{speaker:'陳宇軒',text:'「我只看到最後兩局。可是那顆球，你真的接得很好。」\n\n家豪沒有說謝謝，只把手套放到宇軒膝上。掌心的位置磨得發白，縫線旁沾著剛才那顆球留下的紅土。',effect:s=>s.flags.rememberedJiahaoCatch=true,next:'fathergate25'},
 answersilent25:{text:'四個人把汽水喝完。\n\n校隊在遠處收拾壘包，鋁製球棒碰撞的聲音一下一下傳來。沒有人急著把失望解釋成成長；那天下午，陪伴只是讓家豪可以暫時不必振作。',effect:s=>s.flags.sharedBenchSilence=true,next:'fathergate25'},
 fathergate25:{speaker:'陳家豪',text:'走到校門口時，一輛舊貨車停在路邊。家豪的父親坐在駕駛座，車窗降了一半。\n\n「我爸。」家豪的聲音立刻變小。\n\n男人沒有問比數，只看了看他沾滿紅土的球褲。\n\n「有上場嗎？」\n\n「兩局。」\n\n他點點頭。「那就上車。」',next:'ch25end'},
 ch25end:{chapter:'第二十五章・完',date:'1989年10月7日｜星期六',location:'校門外',bg:'linear-gradient(160deg,#766b59,#4c514b 58%,#2c3636)',text:'貨車開走前，家豪從窗裡伸出手，朝他們比了一個很短的再見。\n\n宇軒忽然明白，朋友的夢想並不總在最耀眼的時候發生。\n\n更多時候，它坐在替補席上，鞋底沾著不能上場的紅土，仍要替別人的安打鼓掌。',next:'ch26title'},

 ch26title:{chapter:'第二十六章',date:'1989年10月28日｜星期六',location:'島北高中・音樂教室',bg:'linear-gradient(150deg,#6f685d,#51565a 55%,#303b3f)',text:'秋天的練習曲\n\n週六的校舍比平日空。風穿過沒有關緊的氣窗，把走廊上的考卷吹得輕輕掀角。\n\n宇軒替班上送校慶表格，經過音樂教室時，聽見同一小節被彈了六次。\n\n第七次開始以前，琴聲停了。',next:'door26'},
 door26:{speaker:'張佳穎',text:'「你在外面站多久了？」\n\n門忽然打開。佳穎一手扶著門框，另一手還握著鉛筆，指尖因反覆標記樂譜而沾了灰。\n\n宇軒說只聽見兩次。\n\n「騙人。」她看了他一眼，卻把門讓開。',choices:[['問她為什麼一直重彈','askrepeat26'],['說第六次最好聽','sixth26']]},
 askrepeat26:{speaker:'張佳穎',text:'「因為老師說這裡要像話說到一半。」\n\n她坐回琴前，按下一組沒有收束的和弦。聲音懸在空教室裡，像有人走到門口，卻忘了最後要說什麼。\n\n「可是我每次都太急著把它講完。」',effect:s=>s.flags.knowsJiayingStrugglesWithUnresolvedPhrase=true,next:'sitpiano26'},
 sixth26:{speaker:'陳宇軒',text:'「第六次比較像……沒有馬上走掉。」\n\n佳穎轉過頭。「你明明就全部聽到了。」\n\n她笑了，沒有追究，反而在譜上第六次出錯的位置畫了一個很小的圈。',effect:s=>s.flags.heardJiayingAutumnPractice=true,next:'sitpiano26'},
 sitpiano26:{text:'宇軒坐在最後一排。\n\n琴蓋的黑漆映著窗外斜進來的光，佳穎每次抬手，袖口便掠過那片倒影。她沒有像校慶那天那樣緊張，卻比那天更容易停下。\n\n不是彈不下去。像是在聽自己到底想把曲子帶往哪裡。',next:'future26'},
 future26:{speaker:'張佳穎',text:'「我媽問我，高中畢業要不要真的去念音樂。」\n\n她沒有回頭。\n\n「以前大家問，我都說再看看。最近開始覺得，再看看也算一種決定，而且通常是別人替你決定。」',choices:[['問她自己想不想去','wantmusic26'],['問她最怕的是什麼','fearmusic26'],['先不替她逼出答案','noprodding26']]},
 wantmusic26:{speaker:'張佳穎',text:'「想。」她答得比宇軒預期快。\n\n接著又低聲補了一句：「可是想念音樂，和想離開這裡，不一定是同一件事。」\n\n宇軒第一次聽見她把未來說得那麼近。近到只剩一年多，卻又遠得像島南以外的海。',effect:s=>{s.flags.knowsJiayingWantsMusicSchool=true;s.flags.heardJiayingFearOfLeaving=true},next:'playagain26'},
 fearmusic26:{speaker:'張佳穎',text:'「怕真的去念以後，才發現我只是比較會彈，不是真的喜歡。」\n\n她把鉛筆夾進譜裡。\n\n「也怕如果不去，以後每次聽到鋼琴，都會覺得自己少走了一條路。」',effect:s=>s.flags.knowsJiayingMusicDoubt=true,next:'playagain26'},
 noprodding26:{speaker:'陳宇軒',text:'宇軒沒有再問。\n\n他替她把被風吹落的譜撿起來，按頁碼排好。佳穎接過去時說：「你不問，我反而會自己一直想講。」\n\n有些沉默不是避開答案，而是替答案留位置。',effect:s=>s.flags.gaveJiayingSpaceAtPiano=true,next:'playagain26'},
 playagain26:{speaker:'張佳穎',text:'「那我再彈一次。你幫我聽最後那個和弦。」\n\n這一次，她沒有急著踩下延音踏板。幾個音在午後裡慢慢靠近，最後停在一個沒有完全解決的位置。\n\n宇軒等了很久，才確定曲子真的結束。',next:'ch26end'},
 ch26end:{chapter:'第二十六章・完',date:'1989年10月28日｜星期六',location:'島北高中・音樂教室',bg:'linear-gradient(145deg,#71695d,#4b5358 58%,#2b373c)',text:'離開以前，佳穎在那一頁樂譜右下角寫下日期。\n\n她說，也許過幾年再彈，會知道今天為什麼一直停在這裡。\n\n宇軒沒有告訴她，自己已經記住那個沒有解決的和弦。\n\n不是因為它特別好聽，而是因為聲音消失後，他仍覺得佳穎有一句話留在教室裡。',next:'ch27title'},

 ch27title:{chapter:'第二十七章',date:'1989年11月17日｜星期五',location:'島北高中・二年五班',bg:'linear-gradient(160deg,#777064,#55555a 56%,#34383d)',text:'校慶前的謠言\n\n午休前，黑板右下角多了一行粉筆字：\n\n「陳宇軒每天等張佳穎下課。」\n\n沒有人承認是誰寫的。值日生擦掉時，全班笑得比看到那行字時更大聲。',next:'reaction27'},
 reaction27:{speaker:'陳宇軒',text:'宇軒把課本翻到老師指定的頁數，卻一個字也看不進去。\n\n佳穎坐在斜前方，低頭削鉛筆。木屑一圈圈落在桌上，她沒有回頭，也沒有跟著笑。',choices:[['下課後先去找她說清楚','findjiaying27'],['等她決定要不要提起','waitjiaying27']]},
 findjiaying27:{speaker:'陳宇軒',text:'鐘聲一響，他便追到樓梯口。\n\n「黑板那個——」\n\n「我知道。」佳穎停下腳步，手裡的樂譜抱得很緊。「你不用跟我道歉，又不是你寫的。」\n\n她的語氣平靜，平靜得讓他不知道下一句該站在哪裡。',effect:s=>s.flags.approachedJiayingAboutRumor=true,next:'awkward27'},
 waitjiaying27:{text:'宇軒沒有追出去。\n\n直到第五節前，佳穎才把一張對折的紙推到他桌角。上面只寫：「今天午餐還是老地方。不要因為別人很無聊，我們也跟著變奇怪。」',effect:s=>s.flags.jiayingNamedRumorFirst=true,next:'awkward27'},
 awkward27:{date:'1989年11月17日｜星期五',location:'福利社後方',bg:'linear-gradient(155deg,#756d5f,#505556 57%,#303a3c)',text:'他們還是去了。\n\n雨婷替書攤顧貨，家豪臨時加練。原本習慣的四個位置，只坐了兩個人。\n\n佳穎撕開麵包袋的聲音很響。宇軒問她排練如何，她說還好；她問他英文小考，他也說還好。\n\n兩個「還好」之後，談話斷了。',next:'rumortalk27'},
 rumortalk27:{speaker:'張佳穎',text:'「我不是怕別人以為我們怎樣。」\n\n她望著空操場。\n\n「我是討厭他們好像只要替一段關係取名字，就有資格評斷裡面的每一件事。」\n\n風把她額前的頭髮吹亂，她沒有伸手整理。',choices:[['「那我們不用替他們證明什麼。」','noprove27'],['坦白自己也會在意那些話','admitrumor27']]},
 noprove27:{speaker:'陳宇軒',text:'「明天如果我還是想等妳下課，我就等。不是要證明他們錯，只是本來就會。」\n\n佳穎看了他幾秒，然後低頭咬了一口麵包。\n\n「你這樣講，害我很難接話。」她說，嘴角卻慢慢鬆開。',effect:s=>s.flags.refusedToLetRumorChangeThem=true,next:'yuting27'},
 admitrumor27:{speaker:'陳宇軒',text:'「可是我會在意。」\n\n佳穎沒有笑他。\n\n「我也會。」她說。「不是因為他們一定講錯，是因為我還不知道自己要怎麼回答。」\n\n那句話停在兩人中間，比謠言更輕，也更難當作沒聽見。',effect:s=>s.flags.sharedUncertaintyAboutRumor=true,next:'yuting27'},
 yuting27:{speaker:'黃雨婷',text:'下午，雨婷把一疊校慶傳單送來五班。她聽完後只說：「如果有人問我，我就說你們是朋友。」\n\n佳穎問：「就這樣？」\n\n「嗯。剩下的不是我知道的事。」\n\n雨婷把傳單放下。她給出的不是答案，而是一條不越過朋友的界線。',effect:s=>s.flags.yutingRespectedUnnamedRelationship=true,next:'festival27'},
 festival27:{date:'1989年11月18日｜星期六',location:'島北高中・校慶會場',bg:'linear-gradient(160deg,#846f59,#5d5550 55%,#343b3d)',text:'隔天校慶，人群把昨天的話沖淡。\n\n家豪穿著球隊外套在攤位搬冰桶，雨婷替文藝社看顧舊書義賣。佳穎演奏結束後從禮堂側門出來，遠遠看見宇軒。\n\n她沒有因為旁邊有人就停下，只抬手指了指販賣部。那是「去老地方」的意思。',next:'ch27end'},
 ch27end:{chapter:'第二十七章・完',date:'1989年11月18日｜星期六',location:'福利社後方',bg:'linear-gradient(150deg,#7d6e5e,#515756 58%,#30393a)',text:'他們四個終於在傍晚湊齊。\n\n沒有人提黑板上的字。家豪抱怨冰桶太重，雨婷把義賣剩下的一本小說塞給宇軒，佳穎把演奏時斷掉的髮夾放在桌上。\n\n謠言沒有替他們決定任何事。\n\n但從那天起，宇軒知道，有些沒有名字的感情，也會因為被別人說出口而改變重量。',next:'ch28title'},

 ch28title:{chapter:'第二十八章',date:'1989年12月30日｜星期六',location:'老地方',bg:'linear-gradient(155deg,#696761,#4b5455 56%,#30383a)',text:'一九八九最後一封信\n\n今年最後一個星期六，福利社沒有開。四個人把從家裡帶來的熱茶放在水泥桌上，杯口冒出的白氣很快被風吹散。\n\n雨婷帶了四個信封。\n\n「寫給明年的自己。」她說。「明年最後一天才能拆。」',next:'letters28'},
 letters28:{speaker:'陳家豪',text:'「這不是小學生才做的事嗎？」\n\n家豪嘴上嫌棄，卻第一個拿走信紙。他趴在桌上寫了兩行，立刻用手臂遮住。\n\n佳穎問宇軒：「你要寫現在最想要的，還是最怕失去的？」',choices:[['寫下最想要的事','wantletter28'],['寫下最怕失去的事','fearletter28'],['不寫願望，只記下今天','todayletter28']]},
 wantletter28:{text:'宇軒寫：希望明年這個時候，四個人還能坐在同一張桌子。\n\n寫完以後，他才發現那不是願望那麼簡單。新課表、球隊、打工、練琴，每一樣都在把他們往不同方向拉。',effect:s=>s.flags.letterWishedFourStayTogether=true,next:'seal28'},
 fearletter28:{text:'宇軒寫：我怕有一天大家走散了，卻沒有人知道那一天就是最後一次。\n\n他盯著這句話很久，最後沒有劃掉。承認害怕，至少比假裝永遠不會失去誠實。',effect:s=>s.flags.letterAdmittedFearOfLastTime=true,next:'seal28'},
 todayletter28:{text:'宇軒沒有預測未來。\n\n他寫下家豪的藍色球隊外套、雨婷信封上歪掉的郵票圖案、佳穎握筆時會用拇指壓住食指，以及熱茶變冷以前短暫的白霧。',effect:s=>s.flags.letterRecordedOrdinaryDay=true,next:'seal28'},
 seal28:{speaker:'黃雨婷',text:'四封信封好後，雨婷把它們裝進餅乾鐵盒。\n\n「放我家不行，市場會潮。」\n\n家豪說放球隊器材室更不行。最後佳穎說可以收在鋼琴椅裡，母親幾乎不會打開那個暗格。',next:'jiayingletter28'},
 jiayingletter28:{speaker:'張佳穎',text:'大家起身時，佳穎仍握著自己的信。\n\n「你寫完了嗎？」宇軒問。\n\n「寫完了。」她把信放進鐵盒最底下。「只是有一句，不知道明年的我看不看得懂。」\n\n她沒有說是哪一句。',choices:[['告訴她，看不懂也沒有關係','understand28'],['約定明年一起拆開','promiseopen28']]},
 understand28:{speaker:'陳宇軒',text:'「明年的妳如果看不懂，至少今年的妳知道。」\n\n佳穎把鐵盒蓋上，輕聲說：「那你要幫我記得，今年的我確實知道。」',effect:s=>s.flags.promisedRememberJiayingKnew=true,next:'lastbus28'},
 promiseopen28:{speaker:'陳宇軒',text:'「明年一起拆。到時候看不懂，可以問現在在場的人。」\n\n佳穎笑了一下。「你怎麼確定明年的我們會老實回答？」\n\n「那就先確定人有來。」',effect:s=>s.flags.promisedOpenLettersTogether=true,next:'lastbus28'},
 lastbus28:{date:'1989年12月30日｜星期六',location:'島北市・公車站',bg:'linear-gradient(170deg,#5c5f60,#3f4b50 58%,#253136)',text:'末班前的公車站很安靜。\n\n雨婷先搭上往南門市場的車，家豪被父親的貨車接走。只剩宇軒和佳穎站在站牌下，看遠處商店一盞盞關燈。\n\n鐵盒由佳穎抱在懷裡，隨她呼吸輕輕起伏。',next:'yearend28'},
 yearend28:{speaker:'張佳穎',text:'「明年會不會很快？」\n\n「什麼很快？」\n\n「高三、考試、畢業。」她看著馬路盡頭。「以前覺得兩年很久。現在一年過完，才發現很多事還沒來得及想清楚。」',next:'ch28end'},
 ch28end:{chapter:'第二十八章・完',date:'1989年12月30日｜星期六',location:'島北市・冬夜',bg:'linear-gradient(165deg,#595d60,#3b484d 58%,#222e34)',text:'佳穎的公車進站時，車燈把兩人的影子拉長，又迅速壓到腳下。\n\n她上車前回頭說：「明年見。」\n\n不是明天，也不是下星期。只是隔著兩個字，一九八九便像被車門關在了後面。\n\n宇軒站在原地，看公車尾燈慢慢縮小。那一年沒有真正解決任何問題，卻留下了足夠多的事，讓他們願意走進下一年。',next:'ch29title'},

 ch29title:{chapter:'第二十九章',date:'1990年1月20日｜星期六',location:'老地方',bg:'linear-gradient(160deg,#65645e,#475152 58%,#293538)',text:'寒假裡的空位\n\n寒假第三天，水泥桌冷得沒有人願意把手掌貼上去。\n\n家豪帶來一包還熱的花生，佳穎從大衣口袋拿出四張電影票。\n\n他們等到約定時間過了二十分鐘，雨婷的位置仍然空著。',next:'waityuting29'},
 waityuting29:{speaker:'張佳穎',text:'「她昨天說一定會來。」\n\n佳穎把第四張票壓在茶杯底下。家豪提議去她家找，說完又看向宇軒。\n\n沒有人有手機，也沒有人知道一個人的遲到應該等多久才算需要擔心。',choices:[['先到市場公共電話打給她','callyuting29'],['留一個人等，另外兩人去找','splitsearch29']]},
 callyuting29:{text:'市場入口的公共電話沾著油煙。宇軒投下兩枚硬幣，電話響了很久，一個陌生女人才接起。\n\n「雨婷在早餐店幫忙，今天臨時有人沒來。」\n\n背景裡碗盤相碰，還能聽見雨婷喊著豆漿數量。',effect:s=>s.flags.calledYutingWhenAbsent=true,next:'breakfast29'},
 splitsearch29:{text:'家豪留在老地方，宇軒和佳穎往南門市場走。\n\n沿路每一班公車靠站，他們都會回頭。佳穎說雨婷不是會忘記約定的人；宇軒第一次明白，真正熟悉一個人，也包括知道她的缺席不尋常。',effect:s=>s.flags.searchedForYutingDuringHoliday=true,next:'breakfast29'},
 breakfast29:{date:'1990年1月20日｜星期六',location:'南門市場・早餐店',bg:'linear-gradient(150deg,#756958,#54514a 58%,#343737)',speaker:'黃雨婷',text:'雨婷穿著大一號的圍裙，站在蒸氣後面。\n\n看見他們時，她先看牆上的鐘，再看佳穎手裡的電影票。\n\n「對不起，我本來想做到九點就走，可是阿姨一個人忙不過來。」',choices:[['留下來幫她收桌','helpbreakfast29'],['問她幾點才能下班','askoff29']]},
 helpbreakfast29:{text:'四個人把袖子捲起來。\n\n宇軒收碗，家豪擦桌，佳穎把用過的筷子按長短分開。雨婷起初一直說不用，後來客人又進來兩桌，她只好把抹布遞給家豪。\n\n錯過的電影，在碗盤聲裡逐漸變得沒那麼重要。',effect:s=>s.flags.helpedYutingAtBreakfastShop=true,next:'afterwork29'},
 askoff29:{speaker:'黃雨婷',text:'「可能下午一點。」\n\n電影十一點開演。佳穎看了票幾秒，把它們收回信封。\n\n「那就不看了。我們去租錄影帶，晚上到妳家。」\n\n雨婷想拒絕，卻被家豪一句「票又不是妳叫人缺班的」堵了回去。',effect:s=>s.flags.changedPlanForYutingShift=true,next:'afterwork29'},
 afterwork29:{date:'1990年1月20日｜星期六',location:'南門市場・午後',bg:'linear-gradient(155deg,#81715d,#58564e 58%,#353b3c)',speaker:'黃雨婷',text:'收店後，雨婷把沒賣完的饅頭裝成四份。\n\n「我爸最近工地比較少班，我想寒假多做一點。」她說得像在解釋天氣。「不是什麼大事。」\n\n佳穎沒有說她不該這麼辛苦，只問：「那下次約時間，妳先把班表拿出來。」',next:'emptyseat29'},
 emptyseat29:{speaker:'陳宇軒',text:'他們最後沒有去電影院。四個人坐在雨婷家狹小的客廳，看一卷畫面不時跳動的舊錄影帶。\n\n雨婷的父親傍晚回來，提著一袋橘子，對突然出現的三個同學愣了很久。\n\n「她很少帶人回來。」他說。',choices:[['告訴他雨婷常照顧大家','tellfather29'],['只說打擾了，幫忙把橘子洗好','washorange29']]},
 tellfather29:{speaker:'陳宇軒',text:'「在學校，通常是她照顧我們。」\n\n雨婷立刻轉頭瞪他，耳朵卻紅了。她父親笑得很輕，把最大的橘子放到女兒面前。',effect:s=>s.flags.toldYutingFatherSheCaresForFriends=true,next:'ch29end'},
 washorange29:{text:'宇軒沒有替雨婷介紹她的人生。他把橘子拿到廚房洗，佳穎找盤子，家豪研究錄影機為什麼一直倒帶。\n\n讓一個陌生的家多出三個人，不必靠熱鬧證明親近。',effect:s=>s.flags.respectedYutingHomeQuiet=true,next:'ch29end'},
 ch29end:{chapter:'第二十九章・完',date:'1990年1月20日｜星期六',location:'雨婷家',bg:'linear-gradient(150deg,#6e6558,#4d504d 58%,#2d3839)',text:'錄影帶播完時，窗外已經全黑。\n\n佳穎把那張沒有用掉的電影票夾進雨婷母親留下的書裡，說以後看到就會記得今天。\n\n原本空著的位置，最後沒有被誰補上。\n\n他們只是把整個下午搬到雨婷所在的地方。',next:'ch30title'},

 ch30title:{chapter:'第三十章',date:'1990年2月19日｜星期一',location:'島北高中・校門',bg:'linear-gradient(160deg,#667077,#48585d 58%,#283a40)',text:'高二下的第一場雨\n\n開學日從早上就下雨。校門口擠滿收傘的人，深色制服被雨水染成一片相似的顏色。\n\n宇軒在穿堂看見佳穎。她剪短了頭髮，懷裡抱著一疊裝在塑膠袋裡的樂譜。\n\n他差一點沒有立刻認出來。',next:'hair30'},
 hair30:{speaker:'張佳穎',text:'「很怪嗎？」\n\n她先摸了摸耳邊，顯然已經被問過很多次。\n\n宇軒搖頭。雨滴從她髮尾落到衣領，少了原本遮住表情的長髮，她等待回答的樣子反而更明顯。',choices:[['說很適合她','suithair30'],['說只是需要重新習慣','habithair30']]},
 suithair30:{speaker:'陳宇軒',text:'「很適合妳。」\n\n佳穎把視線移向雨中的操場。「你最好不是因為不知道還能說什麼。」\n\n「不是。」\n\n這次她沒有再追問。',effect:s=>s.flags.toldJiayingShortHairSuits=true,next:'auditionnotice30'},
 habithair30:{speaker:'陳宇軒',text:'「不是怪。只是昨天以前，我記得的妳不是這樣。」\n\n佳穎怔了一下。「那你慢慢重新記。」\n\n她說得隨意，宇軒卻在進教室後仍想著那個「重新」。',effect:s=>s.flags.promisedToRememberChangedJiaying=true,next:'auditionnotice30'},
 auditionnotice30:{speaker:'張佳穎',text:'她把塑膠袋打開一角，露出一張音樂班校外甄選簡章。\n\n「五月，在島南。」\n\n宇軒想起暑假那通長途電話，也想起她在空教室說過想離開又害怕離開。\n\n「我報名了。」',next:'rainwalk30'},
 rainwalk30:{date:'1990年2月19日｜星期一',location:'教學樓長廊',bg:'linear-gradient(150deg,#627078,#46585e 56%,#283b41)',text:'上課鐘還沒響，他們沿長廊慢慢走。屋簷的雨連成透明的線，把操場切在另一邊。\n\n佳穎說母親支持，鋼琴老師也覺得她該試；說到這些時，她語速很快，像把準備充分當成不害怕的證明。',choices:[['問她希望誰去聽','wholisten30'],['問她現在最想練好哪一段','whichpart30']]},
 wholisten30:{speaker:'張佳穎',text:'「我媽應該會去。」她停了一下。「你們如果有空，也可以。」\n\n那句「你們」說得很安全。雨聲太大，宇軒仍聽出它在出口以前猶豫過。',effect:s=>s.flags.invitedToJiayingAudition=true,next:'umbrella30'},
 whichpart30:{speaker:'張佳穎',text:'「就是去年那個沒解決的和弦。」\n\n她笑得有點無奈。「我換了三種彈法，現在反而不知道最開始為什麼喜歡。」\n\n宇軒說，也許先不要急著把它變成考試的答案。',effect:s=>s.flags.remembersUnresolvedChordWithJiaying=true,next:'umbrella30'},
 umbrella30:{text:'放學時雨沒有停。宇軒的傘一邊骨架歪了，佳穎的傘又小得只能遮一個人。\n\n他們最後各撐各的，並肩走到公車站。兩把傘偶爾撞在一起，便各自移開一點，過幾步又靠近。',next:'ch30end'},
 ch30end:{chapter:'第三十章・完',date:'1990年2月19日｜星期一',location:'島北市・雨中',bg:'linear-gradient(165deg,#5e6b72,#42545a 58%,#26383e)',text:'公車來時，佳穎收傘跑上車。她隔著起霧的窗，用手指寫下「五月」兩個字。\n\n車子開走，字很快被新的水氣蓋住。\n\n高二下學期就這樣開始了。所有人都在談更遠的未來，而他們還得先學會，如何在雨裡走完眼前這一段路。',next:'ch31title'},

 ch31title:{chapter:'第三十一章',date:'1990年3月9日｜星期五',location:'島北高中・早自習',bg:'linear-gradient(160deg,#686d6c,#4d5555 58%,#2d393b)',text:'雨婷不見的早自習\n\n雨婷連續三天沒有來學校。\n\n二年二班的點名簿上，她的名字旁邊先寫病假，後來改成事假。班導師只說家裡有事。\n\n星期五早自習，宇軒在她抽屜裡看見三天份的講義，被同學整齊疊好，卻沒有人知道該送去哪裡。',next:'askclass31'},
 askclass31:{speaker:'二年二班同學',text:'「她爸在工地摔傷，住在仁愛醫院。」\n\n說話的女生壓低聲音，像傷勢會因被人聽見而加重。「聽說腳骨折，雨婷晚上都在醫院。」\n\n宇軒抱著講義站在走廊，第一個念頭是立刻去找她。第二個念頭，才想起雨婷最討厭別人用同情替她做決定。',choices:[['先打電話問她需要什麼','callfirst31'],['約另外兩人放學一起去醫院','visitplan31']]},
 callfirst31:{text:'午休時，宇軒用福利社旁的電話打到醫院。轉了三次分機，雨婷終於接起。\n\n她聽見他的聲音，安靜了兩秒。\n\n「我本來明天就會回學校。」她先解釋，像缺課比父親受傷更需要道歉。',effect:s=>s.flags.calledYutingBeforeHospitalVisit=true,next:'needs31'},
 visitplan31:{text:'佳穎準備水果，家豪去問教練能不能晚到。三人約好放學在醫院門口碰面。\n\n出發前，宇軒仍先打了一通電話。雨婷在那頭說不用來，接著又很小聲地補了一句：「如果已經出門，就不要買太貴的東西。」',effect:s=>s.flags.plannedHospitalVisitTogether=true,next:'needs31'},
 needs31:{speaker:'陳宇軒',text:'「講義要送過去。還有，妳需要我們做什麼？」\n\n電話那頭傳來推車經過的金屬聲。\n\n雨婷說父親沒有大礙，只要休養兩個月；她最擔心的是早餐店的班和學校缺的課。說完，她又立刻說自己可以處理。',next:'hospital31'},
 hospital31:{date:'1990年3月9日｜星期五',location:'仁愛醫院・骨科病房',bg:'linear-gradient(150deg,#747873,#56605d 58%,#344142)',text:'病房有消毒水、橘子皮和潮濕棉被混在一起的氣味。\n\n雨婷的父親右腿打著石膏，看到三個孩子進門，第一句是：「她是不是又沒跟你們說？」\n\n雨婷站在床尾，手裡還拿著繳費單。',choices:[['把講義交給她，只談明天的課','normaltalk31'],['直接分配三人能幫忙的事','dividehelp31']]},
 normaltalk31:{speaker:'陳宇軒',text:'「數學老師明天會講第三章，英文要小考。」\n\n宇軒把講義依科目排在床邊。佳穎接著抱怨班上的流言，家豪說教練今天又罵錯人。\n\n他們把學校帶進病房，不讓雨婷只剩下病人家屬這一個身分。',effect:s=>s.flags.keptHospitalVisitOrdinary=true,next:'yutingthanks31'},
 dividehelp31:{speaker:'張佳穎',text:'「筆記我抄，早餐店的週末班家豪去問能不能搬貨，宇軒幫妳把請假單送完。」\n\n雨婷皺起眉。「妳們不要——」\n\n「不是替妳決定。」佳穎把紙筆放到她手裡。「不需要的劃掉。」',effect:s=>s.flags.offeredYutingEditableHelp=true,next:'yutingthanks31'},
 yutingthanks31:{speaker:'黃雨婷',text:'父親睡著後，雨婷送他們到樓梯間。\n\n「我不是故意不說。」她低頭看著繳費單邊角。「我只是每次說了，事情就會變成大家看我的表情。」\n\n佳穎問：「那我們現在是什麼表情？」\n\n雨婷抬頭看了一圈，終於笑了。「很吵的表情。」',next:'return31'},
 return31:{date:'1990年3月12日｜星期一',location:'島北高中・早自習',bg:'linear-gradient(155deg,#77766c,#545a56 58%,#323d3d)',text:'星期一，雨婷回到座位。\n\n抽屜裡沒有慰問卡，也沒有全班募集的錢，只有按日期排好的筆記、一張早餐店代班時間表，和家豪畫得很難看的骨頭復原圖。\n\n她把那張圖折起來，收進鉛筆盒。',next:'ch31end'},
 ch31end:{chapter:'第三十一章・完',date:'1990年3月12日｜星期一',location:'島北高中',bg:'linear-gradient(160deg,#716e63,#505854 58%,#303b3b)',text:'早自習鐘聲響起以前，四個人在走廊只見了兩分鐘。\n\n雨婷沒有再為缺席道歉。她只問星期五還去不去老地方。\n\n有些人回來，不需要先說明自己為什麼消失。\n\n真正替她留住的位置，本來就不該附帶一場報告。',next:'ch32title'},

 ch32title:{chapter:'第三十二章',date:'1990年3月31日｜星期六',location:'島北高中・棒球場',bg:'linear-gradient(160deg,#77705d,#526052 56%,#303d39)',text:'家豪的右手\n\n家豪最近開始先發。\n\n他不再坐在飲水桶旁，背號十七出現在打序第八棒。可宇軒注意到，他每次傳球後都會把右手藏到身後，悄悄甩兩下。\n\n第七局，他把一顆近在面前的滾地球傳偏了。',next:'afterthrow32'},
 afterthrow32:{speaker:'棒球隊教練',text:'「十七號，換下來！」\n\n家豪沒有爭辯。他跑回休息區時臉色發白，手套摘了兩次才摘下來。\n\n教練握住他的手腕，拇指輕壓掌根。家豪立刻縮了一下。',next:'confront32'},
 confront32:{date:'1990年3月31日｜星期六',location:'球場器材室外',bg:'linear-gradient(150deg,#706956,#4d574c 58%,#2d3936)',speaker:'陳家豪',text:'「只是扭到。」\n\n賽後，他把右手塞進外套口袋。\n\n「下個月有先發名單，現在休息就沒了。」\n\n佳穎盯著他。「你現在不休息，可能以後都沒有。」\n\n「妳又不懂打球。」家豪說出口便後悔了。',choices:[['阻止兩人繼續吵，問家豪痛多久了','askpain32'],['告訴家豪，害怕失去位置不丟臉','fearposition32']]},
 askpain32:{speaker:'陳宇軒',text:'「先不要講以後。你到底痛多久了？」\n\n家豪靠著牆，過了很久才說兩個星期。先是揮棒，後來連寫字都痛。\n\n他不是不知道嚴重，只是每多撐一天，就更難承認前面那些天都不該撐。',effect:s=>s.flags.learnedJiahaoHidPainTwoWeeks=true,next:'clinic32'},
 fearposition32:{speaker:'陳宇軒',text:'「你怕的不是受傷，是位置被別人拿走。」\n\n家豪猛地抬頭，沒有否認。\n\n「我等了一年才輪到。」他說。「如果我一休息，教練就會發現沒有我也可以。」',effect:s=>s.flags.namedJiahaoFearOfReplacement=true,next:'clinic32'},
 clinic32:{date:'1990年3月31日｜星期六',location:'學校保健室',bg:'linear-gradient(155deg,#747771,#545f5a 58%,#344141)',text:'保健室老師替他的手腕固定，要求星期一去照 X 光。\n\n「至少休息三週。」\n\n家豪盯著白色繃帶，像看見有人在他的春天上畫了一條停止線。',next:'father32'},
 father32:{speaker:'家豪的父親',text:'父親來接他時，沒有像大家預想的那樣生氣。\n\n他站在保健室門口，看兒子的右手很久。\n\n「工作受傷還硬撐，不叫負責，叫給別人添麻煩。」\n\n家豪小聲說打球不是工作。\n\n「那就更不值得拿一隻手去換。」',next:'rest32'},
 rest32:{date:'1990年4月6日｜星期五',location:'老地方',bg:'linear-gradient(150deg,#78705d,#51584f 58%,#303a38)',text:'下一個星期五，家豪右手纏著護具出現。\n\n他不能練球，也不能替早餐店搬貨，只能用左手慢慢剝花生。三顆裡有兩顆掉到地上。\n\n雨婷撿起來放到空杯裡，佳穎把功課推到他面前，叫他練左手寫字。',choices:[['陪他去看隊友練習','watchteam32'],['帶他離開球場，去做別的事','leavefield32']]},
 watchteam32:{text:'放學後，宇軒陪家豪坐在鐵網外。\n\n這一次，他連替補席都不能坐。可是當右外野手站錯位置時，家豪仍忍不住隔著網子指出來。教練聽見，朝他點了一下頭。',effect:s=>s.flags.helpedJiahaoStayWithTeamWhileResting=true,next:'ch32end'},
 leavefield32:{text:'他們沒有去球場，改去唱片行聽完整張新到的專輯。\n\n家豪起初每隔幾分鐘便看一次學校方向，後來終於開始嫌主唱唱得太用力。\n\n休息不必每一秒都用來證明自己仍然是球員。',effect:s=>s.flags.helpedJiahaoRestBeyondBaseball=true,next:'ch32end'},
 ch32end:{chapter:'第三十二章・完',date:'1990年4月6日｜星期五',location:'島北市・傍晚',bg:'linear-gradient(160deg,#716a59,#4e5650 58%,#2d3938)',text:'回家前，家豪用左手在宇軒的課本上寫下自己的名字。\n\n四個字歪得像要倒下，他看了很久，最後沒有撕掉。\n\n夢想第一次逼他停下來。\n\n而停下來以後，他才發現，朋友不是只在他能上場時才認得十七號。',next:'ch33title'},

 ch33title:{chapter:'第三十三章',date:'1990年4月21日｜星期六',location:'島北高中・音樂教室',bg:'linear-gradient(150deg,#6a6761,#4b555a 56%,#2d3940)',text:'沒有觀眾的琴房\n\n距離島南甄選剩二十八天。\n\n佳穎把每個星期六都留給音樂教室。窗戶關著，節拍器的聲音在空教室裡顯得比平常更硬，像有人不斷提醒時間正在減少。\n\n宇軒到的時候，她沒有彈琴，只坐在琴凳上看著自己的手。',next:'hands33'},
 hands33:{speaker:'張佳穎',text:'「老師說我太小心。」\n\n她把手掌翻過來，掌紋因練習後的熱氣微微泛紅。\n\n「我沒有彈錯，可是她說聽不見我想說什麼。」\n\n佳穎笑了一下。「不彈錯還不夠，這件事很不公平吧？」',choices:[['問她想讓人聽見什麼','whathear33'],['問她最近一次只為自己彈是什麼時候','forherself33']]},
 whathear33:{speaker:'陳宇軒',text:'「那妳想說什麼？」\n\n佳穎看向琴鍵。\n\n「我不知道。大家一直問我技巧、速度、將來要去哪裡。問久了，我好像只剩下『準備考試的人』。」',effect:s=>s.flags.knowsJiayingFeelsReducedToAudition=true,next:'lockdoor33'},
 forherself33:{speaker:'張佳穎',text:'她想了很久。「去年雨夜，在家裡。」\n\n「那時候我一直彈錯，可是沒有人要評分。」她合上譜。「原來被聽見和被評分，不是同一件事。」',effect:s=>s.flags.askedJiayingAboutPlayingForHerself=true,next:'lockdoor33'},
 lockdoor33:{speaker:'陳宇軒',text:'宇軒走到門邊，把「音樂社練習中」的牌子翻成背面。\n\n「那今天沒有觀眾。」\n\n佳穎指了指最後一排。「你不是人嗎？」\n\n「我是幫忙鎖門的。」',next:'freeplay33'},
 freeplay33:{text:'她沒有拿甄選曲。\n\n起初只是隨意按幾個音，接著彈起他們在電話裡聊過的老歌，又在副歌前忽然轉進去年那首練習曲。曲子沒有照樂譜走，錯音也沒有停下重來。\n\n午後的光落在琴鍵上，灰塵跟著每一次踏板升降。',next:'unresolved33'},
 unresolved33:{speaker:'張佳穎',text:'最後，她回到那個沒有解決的和弦。\n\n這一次，聲音停住很久以後，她才輕輕補上一個低音。它沒有把曲子關好，卻像替懸著的話找到可以暫時放下的位置。\n\n「這樣呢？」她問。',choices:[['「像還沒說完，但不著急了。」','notrushed33'],['「像知道有人會等下一句。」','waitnext33']]},
 notrushed33:{speaker:'張佳穎',text:'「還沒說完，但不著急。」\n\n佳穎把這句話重複一次，寫在譜的空白處。\n\n「這個可以帶去島南。」她說。不是指宇軒的答案，而是指剛才那個終於屬於她自己的停頓。',effect:s=>s.flags.describedUnresolvedChordAsUnhurried=true,next:'mother33'},
 waitnext33:{speaker:'張佳穎',text:'「有人會等下一句……」\n\n佳穎沒有把這句寫在譜上。她只是蓋上琴蓋，倒影裡兩個人隔著整間教室坐著。\n\n「那你五月也要來。」',effect:s=>s.flags.promisedToHearJiayingNextPhrase=true,next:'mother33'},
 mother33:{speaker:'佳穎的母親',text:'傍晚，佳穎的母親來接她。她站在門口聽完最後一遍，沒有進來糾正。\n\n收譜時，她對宇軒說：「她緊張的時候，會把每件事準備得像沒有意外才安全。」\n\n佳穎在後面抗議：「媽。」\n\n母親笑了。「可是音樂不是這樣。」',effect:s=>s.flags.heardJiayingMotherOnControl=true,next:'walkgate33'},
 walkgate33:{date:'1990年4月21日｜星期六',location:'島北高中・校門',bg:'linear-gradient(160deg,#726a5d,#4e5655 58%,#2d3a3b)',speaker:'張佳穎',text:'走到校門，佳穎忽然說：「我媽不是在暗示你要管我。」\n\n宇軒說他知道。\n\n「她只是覺得全世界都該知道我很麻煩。」\n\n「我也知道。」\n\n佳穎瞪了他兩秒，終於笑出聲。',next:'ch33end'},
 ch33end:{chapter:'第三十三章・完',date:'1990年4月21日｜星期六',location:'島北市・暮色',bg:'linear-gradient(155deg,#6b655c,#495356 58%,#2b383c)',text:'那天沒有掌聲，也沒有評審。\n\n佳穎卻第一次把甄選曲完整彈完，沒有在錯音後回頭。\n\n回家的公車上，宇軒發現自己已經能分辨她在緊張時的琴聲，和真正想說話時的琴聲。\n\n這項能力不會出現在任何成績單上，卻成了他最不願忘記的事之一。',next:'ch34title'},

 ch34title:{chapter:'第三十四章',date:'1990年5月19日｜星期六',location:'島北車站',bg:'linear-gradient(160deg,#74706a,#525a5d 56%,#313d42)',text:'南下的月台\n\n清晨六點四十分，月台上的日光燈還沒有熄。\n\n佳穎和母親已先上車。宇軒拿著四張月台票，家豪右手的護具剛拆，雨婷則從早餐店直接趕來，制服外還套著沾到麵粉的外套。\n\n火車進站前，他們誰也沒有說自己其實比要考試的人更緊張。',next:'train34'},
 train34:{date:'1990年5月19日｜星期六',location:'往島南的列車',bg:'linear-gradient(150deg,#77746b,#566166 58%,#33434a)',text:'車廂沿著海岸向南。窗外一會是灰藍的海，一會是貼近鐵軌的民房。\n\n佳穎坐在前排，耳機沒有播放音樂，只用來隔開聊天聲。母親在旁邊看報紙，整整二十分鐘沒有翻頁。',choices:[['把寫著「慢一點」的紙條遞給她','note34'],['不打擾，等她主動回頭','waitturn34']]},
 note34:{speaker:'陳宇軒',text:'宇軒在車票背面寫：「最後那個和弦，慢一點也沒關係。」\n\n紙條經過家豪和雨婷，最後落到佳穎手裡。她看完沒有回頭，只把車票夾進樂譜最常翻開的那一頁。',effect:s=>s.flags.gaveJiayingTrainTicketNote=true,next:'southhall34'},
 waitturn34:{text:'列車經過一段隧道。窗戶變成鏡子，佳穎終於從倒影裡看向他們。\n\n家豪舉起還不能完全彎曲的右手，雨婷比了個加油。宇軒只點了一下頭。\n\n她也點頭，像確認所有人都還在。',effect:s=>s.flags.waitedForJiayingOnTrain=true,next:'southhall34'},
 southhall34:{date:'1990年5月19日｜星期六',location:'島南藝術學院・候考走廊',bg:'linear-gradient(155deg,#7b766c,#5a6261 58%,#374244)',text:'候考走廊滿是琴譜翻頁、皮鞋踱步和壓低的家長聲音。\n\n輪到佳穎前，工作人員只允許考生進入。她把外套交給母親，往門裡走了兩步，又折回來。\n\n「我如果彈壞了，你們也不准假裝沒聽見。」',choices:[['「會記得，包括彈壞的地方。」','rememberbad34'],['「先彈完，再一起評斷。」','judgeafter34']]},
 rememberbad34:{speaker:'陳宇軒',text:'「會記得。彈好的、彈壞的，都算妳今天來過。」\n\n佳穎深吸一口氣。「你有時候真的很會讓人沒辦法逃跑。」\n\n她說完便轉身進門。',effect:s=>s.flags.promisedRememberWholeAudition=true,next:'listenoutside34'},
 judgeafter34:{speaker:'陳宇軒',text:'「先把整首彈完。出來以後，再由妳自己評斷，不先替評審猜。」\n\n佳穎把手放到門把上，低聲說：「好。」',effect:s=>s.flags.toldJiayingJudgeAfterPlaying=true,next:'listenoutside34'},
 listenoutside34:{text:'門關上後，只剩模糊的琴聲。\n\n走廊聽不清細節，宇軒仍認出開頭。他在心裡數到那個熟悉的小節，等著沒有解決的和弦。\n\n停頓比練習時更長。接著，一個低音安靜地落下。',next:'exit34'},
 exit34:{speaker:'張佳穎',text:'二十分鐘後，佳穎走出來。\n\n「第二頁彈錯一個音，最後踏板也太早放。」她一口氣說完。\n\n沒有人立刻安慰。雨婷先問：「妳有彈完嗎？」\n\n佳穎點頭。家豪便把藏在外套裡、已經壓扁的紅豆麵包遞給她。',next:'seaside34'},
 seaside34:{date:'1990年5月19日｜星期六',location:'島南海堤',bg:'linear-gradient(150deg,#77858a,#596e72 58%,#354a50)',text:'成績要一星期後才寄到。\n\n回程以前，四個人繞去海堤。風把雨婷的外套吹得鼓起，家豪用左手丟石頭，佳穎脫掉正式皮鞋，赤腳踩在溫熱的水泥上。\n\n一整天第一次，沒有人談甄選。',choices:[['問佳穎現在還喜不喜歡那首曲子','stilllike34'],['提議替四個人再拍一張照片','photo34']]},
 stilllike34:{speaker:'張佳穎',text:'「喜歡。」\n\n她望著遠處的海面。「今天以前，我以為考完就會只剩下結果。可是剛才彈到最後，我還是想知道下一個音會去哪裡。」\n\n她笑了。「這樣應該就夠了吧。」',effect:s=>s.flags.knowsJiayingStillLovesMusicAfterAudition=true,next:'returntrain34'},
 photo34:{text:'宇軒把相機放在海堤欄杆，用書包墊高。\n\n快門倒數時，風突然吹走家豪的帽子。照片拍下的不是四個人整齊看鏡頭，而是所有人同時轉身追那頂帽子的瞬間。',effect:s=>{s.flags.tookIslandSouthPhoto=true;s.items.push('島南海堤合照底片')},next:'returntrain34'},
 returntrain34:{date:'1990年5月19日｜星期六',location:'北上的列車',bg:'linear-gradient(165deg,#686f73,#4a595f 58%,#2c3c43)',speaker:'張佳穎',text:'回程時，家豪和雨婷先睡著。佳穎靠著車窗，手裡仍握著那張候考證。\n\n「如果沒有考上，我可能還是會再試別的學校。」\n\n宇軒說：「嗯。」\n\n「如果考上，可能就真的要離開。」\n\n這一次，他過了很久才說：「嗯。」',next:'ch34end'},
 ch34end:{chapter:'第三十四章・完',date:'1990年5月19日｜星期六',location:'北上的列車',bg:'linear-gradient(160deg,#616a70,#43535b 58%,#293a42)',text:'列車進隧道，窗外的海忽然消失。\n\n玻璃上映出佳穎和宇軒並排的臉，也映出後座睡著的兩個朋友。\n\n他沒有說希望她留下，也沒有說一定要走。\n\n喜歡一個人的未來，也許就是不能只挑那個讓自己不必失去她的版本。',next:'ch35title'},

 ch35title:{chapter:'第三十五章',date:'1990年6月15日｜星期五',location:'島北高中・公告欄',bg:'linear-gradient(160deg,#7b7665,#596158 56%,#35403d)',text:'夏天以前的名單\n\n期末考前兩週，升高三的暑期輔導分組貼在公告欄。\n\n宇軒留在第五班，佳穎因音樂術科被排進特別課程；雨婷要準備文組聯考，家豪則必須在球隊晨練和暑期課之間選一邊。\n\n四個名字再次散在不同的紙上。',next:'results35'},
 results35:{speaker:'張佳穎',text:'佳穎的島南甄選成績也在那天寄到。\n\n正取。\n\n那不是正式入學，只是一張能參加暑期培訓的資格。她把通知單折了三次，放進口袋，直到老地方才拿出來。',choices:[['第一個向她道賀','congrats35'],['先問她想不想去','wantgo35']]},
 congrats35:{speaker:'陳宇軒',text:'「恭喜。」\n\n佳穎笑了，笑意卻只停在嘴角。「謝謝。」\n\n宇軒這才明白，道賀回答的是結果，沒有回答她接下來要離開一整個暑假的事。',effect:s=>s.flags.congratulatedJiayingFirst=true,next:'summerchoices35'},
 wantgo35:{speaker:'陳宇軒',text:'「妳想去嗎？」\n\n佳穎低頭摸著通知單摺痕。「想。也不想。」\n\n「那兩個都是真的。」\n\n她抬頭看他，像終於有人允許矛盾不必立刻被整理成答案。',effect:s=>s.flags.allowedJiayingMixedFeelings=true,next:'summerchoices35'},
 summerchoices35:{speaker:'陳家豪',text:'家豪把自己的晨練表攤開。右手已能正常傳球，教練卻只准他隔天練一次。\n\n雨婷暑假仍要打工，還報了圖書館志工。\n\n「所以，」家豪數著四張完全對不上的表格，「我們下次四個人同時有空，是什麼時候？」',next:'calendar35'},
 calendar35:{text:'他們用鉛筆在日曆上找。\n\n七月沒有。八月只有最後一個星期天下午，而且佳穎回程列車若誤點，也可能趕不上。\n\n去年還能隨口說「星期六老地方」，如今見面需要四份時間表共同同意。',choices:[['把那個星期日圈起來','circle35'],['約定不必每次都等四個人','partial35']]},
 circle35:{text:'宇軒用紅筆把八月二十六日圈起來。\n\n「先留著。到時候真的不行，再說。」\n\n那個紅圈看起來很孤單，卻是他們第一次認真替尚未到來的一天保留位置。',effect:s=>s.flags.reservedAugustReunion=true,next:'teacher35'},
 partial35:{speaker:'黃雨婷',text:'「不要因為湊不齊，就誰也不見。」\n\n雨婷說，可以兩個人、三個人，有空的人先來，再把其他人的近況帶回去。\n\n四個人的友情不必每一次都排成完整合照，才算沒有走散。',effect:s=>s.flags.acceptedIncompleteSummerMeetings=true,next:'teacher35'},
 teacher35:{date:'1990年6月15日｜星期五',location:'一年三班舊教室',bg:'linear-gradient(155deg,#756e5e,#515851 58%,#303b39)',speaker:'黃子芸',text:'放學後，他們去找黃子芸老師。舊教室已換了一批學生，窗邊的桌面多了新的刻痕。\n\n黃老師看完四份安排，只說：「時間變少，不表示感情變淡。但時間少了以後，不說的事會更容易被誤會。」',next:'corridor35'},
 corridor35:{speaker:'陳宇軒',text:'離開教室，佳穎在樓梯口問：「那你有什麼事一直沒說？」\n\n宇軒停住。家豪和雨婷已走到下一層，腳步聲正慢慢遠去。\n\n他知道這問題可以有很多答案，也知道現在說出任何一個，都可能讓暑假變成另一種等待。',choices:[['說會想念四個人一起的星期六','missfour35'],['說希望她在島南仍然喜歡彈琴','keepmusic35']]},
 missfour35:{speaker:'陳宇軒',text:'「我會想念大家都在的星期六。」\n\n佳穎靠著扶手，點了一下頭。「我也是。」\n\n那是最安全的真話。它沒有說謊，只把更私人的部分留在句子裡沒有指名。',effect:s=>s.flags.saidWouldMissFourSaturdays=true,next:'ch35end'},
 keepmusic35:{speaker:'陳宇軒',text:'「我希望妳去島南以後，還是會有只為自己彈的時候。」\n\n佳穎看著他，好一會才說：「我會寫信告訴你。」\n\n不是告訴大家。那一個字的差別很小，卻足以讓宇軒一路記到校門口。',effect:s=>s.flags.jiayingPromisedPrivateMusicLetters=true,next:'ch35end'},
 ch35end:{chapter:'第三十五章・完',date:'1990年6月15日｜星期五',location:'島北高中・樓梯間',bg:'linear-gradient(160deg,#70695b,#4d5651 58%,#2d3938)',text:'午後的樓梯間很亮，窗格把四個人的影子切成不同長度。\n\n他們仍朝同一個校門走去，卻已經各自握著下一段路的時間表。\n\n高二快要結束。\n\n第一次，結束不像放假，更像有人在故事中間翻了一頁，而他們都還沒看清下一頁會留下誰。',next:'ch36title'},

 ch36title:{chapter:'第三十六章',date:'1990年6月29日｜星期五',location:'島北高中・二年級最後一天',bg:'linear-gradient(155deg,#807967,#5b6258 56%,#36413e)',text:'高二最後一頁\n\n期末典禮結束後，校舍充滿搬書和撕考卷的聲音。\n\n五班黑板寫著「升高三加油」，粉筆末落在板溝，像一層提前積下的灰。\n\n宇軒把抽屜清空，找到一張去年分班時佳穎傳來的紙條：星期五，老地方。',next:'lastday36'},
 lastday36:{text:'他們約在舊教室收拾完後見面。\n\n雨婷帶來裝著四封信的餅乾鐵盒——佳穎要去島南，鋼琴椅不能再保管。家豪的右手恢復了，卻仍習慣用左手拎重物。\n\n一年留下的改變，都藏在不起眼的動作裡。',next:'openbox36'},
 openbox36:{speaker:'陳家豪',text:'「不是說年底才拆？」\n\n雨婷說只是換保管人，不是偷看。\n\n佳穎把鐵盒放到桌上，四封信因長時間壓在一起，信封邊緣已有淡淡鐵鏽色。\n\n「放宇軒家吧。」她說。「他最會記得不該忘的東西。」',choices:[['接過鐵盒，承諾保管到年底','keepbox36'],['提議大家輪流保管','rotatebox36']]},
 keepbox36:{speaker:'陳宇軒',text:'「十二月三十日，帶回老地方。」\n\n宇軒把日期再說一次。鐵盒比想像中重，裡面明明只有四封信，拿在手裡卻像接過一整年的證明。',effect:s=>{s.flags.yuxuanKeepsLetterBox=true;s.items.push('四人的一九八九信盒')},next:'cleanboard36'},
 rotatebox36:{speaker:'黃雨婷',text:'「一個月換一個人。誰保管，就在盒底寫一件那個月發生的事。」\n\n大家同意。第一個月由宇軒開始。那只鐵盒不再只是等待年底，也會帶著四個人各自度過的夏天。',effect:s=>{s.flags.friendsRotateLetterBox=true;s.items.push('輪流保管的一九八九信盒')},next:'cleanboard36'},
 cleanboard36:{text:'離開前，佳穎拿起板擦，把黑板上剩下的字慢慢擦掉。\n\n「升高三加油」先失去一個字，再失去另一個，最後只留下大片不均勻的白痕。\n\n家豪開窗，雨婷把撿到的粉筆放回盒裡，宇軒扶正最後一張桌子。',next:'oldplace36'},
 oldplace36:{date:'1990年6月29日｜星期五',location:'老地方',bg:'linear-gradient(150deg,#827661,#5a6156 58%,#35413d)',text:'水泥桌旁的樹比去年更茂密。福利社換了新的紅色招牌，後牆卻仍有雨季留下的深色水痕。\n\n四個人把成績單壓在汽水瓶下，誰也沒有急著比較。\n\n高二最後一個下午，沒有特別事件等待發生。',choices:[['拿出相機拍下現在的老地方','placephoto36'],['不拍照，只把眼前慢慢記住','memorize36']]},
 placephoto36:{text:'宇軒把鏡頭對準水泥桌。\n\n佳穎故意把四瓶汽水排成一列，家豪把十七號球帽放在旁邊，雨婷則將一本舊小說壓在成績單上。\n\n照片裡沒有人，卻每一樣東西都指向他們。',effect:s=>{s.flags.photographedOldPlaceEndYearTwo=true;s.items.push('高二最後一天的底片')},next:'futuretalk36'},
 memorize36:{text:'宇軒沒有拿相機。\n\n他記住蟬聲最密的方向、瓶底在桌上留下的四個圓、佳穎短髮被風吹起時露出的耳朵、家豪右腕尚未曬回來的膚色，以及雨婷翻書時停在同一頁很久。',effect:s=>s.flags.memorizedOldPlaceEndYearTwo=true,next:'futuretalk36'},
 futuretalk36:{speaker:'黃雨婷',text:'「明年這個時候，我們就要畢業了。」\n\n家豪立刻叫她不要在放假第一天講這種話。佳穎卻問：「那畢業以後，老地方還算老地方嗎？」\n\n沒有人回答。遠處福利社拉下鐵門，金屬聲沿著空校舍傳了很遠。',next:'jiayingleave36'},
 jiayingleave36:{speaker:'張佳穎',text:'佳穎的公車先來。她要回家整理行李，三天後去島南。\n\n上車前，她把一卷空白錄音帶交給宇軒。標籤上只寫了日期：一九九〇年夏天。\n\n「你幫我錄島北的聲音。」\n\n「什麼聲音？」\n\n「你覺得我會想念的。」',choices:[['答應替她錄下整個夏天','recordsummer36'],['請她也錄島南寄回來','exchangeaudio36']]},
 recordsummer36:{speaker:'陳宇軒',text:'「好。」\n\n他沒有問一卷四十五分鐘的帶子，怎麼裝得下一座城市和三個留下來的人。\n\n佳穎像相信他會找到方法，把錄音帶放進他掌心。',effect:s=>{s.flags.promisedRecordIslandNorthSummer=true;s.items.push('「一九九〇年夏天」空白錄音帶')},next:'busaway36'},
 exchangeaudio36:{speaker:'陳宇軒',text:'「那妳也錄島南。不是鋼琴，錄妳覺得我們會想念的。」\n\n佳穎點頭。「交換。」\n\n他們沒有握手，只各自用一根手指勾住錄音帶的兩端，停了一秒才放開。',effect:s=>{s.flags.promisedSummerTapeExchange=true;s.items.push('等待交換的夏日錄音帶')},next:'busaway36'},
 busaway36:{text:'公車開走後，雨婷和家豪仍站在旁邊。\n\n沒有人取笑宇軒手裡那卷帶子。家豪只問第一面要錄什麼，雨婷說市場清晨的聲音應該很好。\n\n於是佳穎離開後的夏天，也沒有立刻變成只屬於兩個人的故事。',next:'ch36end'},
 ch36end:{chapter:'第三十六章・完',date:'1990年6月29日｜星期五',location:'島北市・夏日將近',bg:'linear-gradient(165deg,#716b5c,#4c5853 58%,#2c3b3b)',text:'高二結束了。\n\n這一年，他們被分到不同班級，錯過彼此的午餐，坐過替補席，也在醫院、琴房和南下列車上重新找到對方。\n\n佳穎沒有說出那封信裡的句子，宇軒也仍沒有替自己的期待取名。\n\n可有些感情並不是因為說出口才開始。它們先藏在走廊的三分鐘、沒有觀眾的和弦，以及一卷等待被錄滿的夏日卡帶裡。\n\n公車消失在街角後，宇軒低頭看著空白標籤。\n\n他知道下一段故事，會從一個少了佳穎的島北夏天開始。\n\n——高二・完\n\n第三十七章，待續。',end:true}
};

let state={scene:'intro',items:['零錢 42 元','學生證','家門鑰匙'],memories:[],flags:{},history:[],dialogueLog:[]};
let sessionSave=null;
const $=s=>document.querySelector(s),title=$('#title-screen'),game=$('#game-screen'),story=$('#story'),overlay=$('#overlay'),peopleOverlay=$('#people-overlay'),logOverlay=$('#log-overlay'),bgm=$('#title-bgm'),bgmToggle=$('#bgm-toggle');
let bgmWanted=true,bgmStarted=false,bgmFade=0,bgmToken=0;
function fadeBgm(target,pauseAfter=false){cancelAnimationFrame(bgmFade);const start=bgm.volume,begin=performance.now(),duration=750;function step(now){const p=Math.min(1,(now-begin)/duration);bgm.volume=start+(target-start)*p;if(p<1)bgmFade=requestAnimationFrame(step);else if(pauseAfter)bgm.pause()}bgmFade=requestAnimationFrame(step)}
function startBgm(){if(!bgmWanted)return;const token=++bgmToken;bgmStarted=true;bgm.volume=0;const attempt=bgm.play();if(attempt)attempt.then(()=>{if(token!==bgmToken||!title.classList.contains('active')||!bgmWanted){bgm.pause();bgm.volume=0;return}fadeBgm(.28)}).catch(()=>{if(token===bgmToken)bgmStarted=false})}
function stopBgm(){bgmToken++;if(!bgm.paused)fadeBgm(0,true);else bgm.volume=0}
function updateBgmButton(){bgmToggle.classList.toggle('muted',!bgmWanted);bgmToggle.setAttribute('aria-pressed',String(bgmWanted));bgmToggle.title=bgmWanted?'暫停背景音樂':'播放背景音樂'}
function readSave(){try{return localStorage.getItem(SAVE_KEY)}catch(e){return sessionSave}}
function writeSave(value){try{localStorage.setItem(SAVE_KEY,value)}catch(e){sessionSave=value}}
function hasSave(){return !!readSave()}
function updateContinue(){ $('#continue-game').disabled=!hasSave() }
function showGame(){stopBgm();title.classList.remove('active');game.classList.add('active');render()}
function newGame(){state={scene:'intro',items:['零錢 42 元','學生證','家門鑰匙'],memories:[],flags:{},history:[],dialogueLog:[]};showGame()}
function save(show=true){writeSave(JSON.stringify(state));updateContinue();if(show)toast('已儲存')}
function load(){try{const raw=readSave();if(!raw)throw new Error('no save');state=JSON.parse(raw);state.items=state.items||[];state.memories=state.memories||[];state.flags=state.flags||{};state.history=state.history||[];state.dialogueLog=state.dialogueLog||[];showGame()}catch(e){newGame()}}
function recordCurrent(){const s=scenes[state.scene];if(!s)return;state.dialogueLog=state.dialogueLog||[];state.dialogueLog.push({chapter:s.chapter||'',speaker:s.speaker||'',text:s.text||'',date:s.date||$('#date').textContent,location:s.location||$('#location').textContent});state.dialogueLog=state.dialogueLog.slice(-2)}
function go(id){const current=scenes[state.scene];recordCurrent();state.history.push(state.scene);state.scene=id;const s=scenes[id];if(s.effect&&!state.flags['effect_'+id]){s.effect(state);state.flags['effect_'+id]=true}save(false);render()}
function render(){const s=scenes[state.scene];$('#chapter').textContent=s.chapter||'';$('#speaker').textContent=s.speaker||'';$('#text').textContent=s.text;$('#date').textContent=s.date||nearest('date');$('#location').textContent=s.location||nearest('location');if(s.bg)$('#app').style.setProperty('--scene-bg',s.bg);const c=$('#choices');c.innerHTML='';if(s.choices){s.choices.forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span>${String.fromCharCode(65+i)}</span>${x[0]}`;b.onclick=()=>go(x[1]);c.appendChild(b)})}else if(s.next){const b=document.createElement('button');b.className='continue';b.textContent='繼續 ›';b.onclick=()=>go(s.next);c.appendChild(b)}else if(s.end){const b=document.createElement('button');b.className='continue';b.textContent='回到標題';b.onclick=toTitle;c.appendChild(b)}story.scrollTop=0}
function nearest(key){const current=scenes[state.scene];if(current&&current[key])return current[key];for(let i=state.history.length-1;i>=0;i--){const previous=scenes[state.history[i]];if(previous&&previous[key])return previous[key]}return key==='date'?'1988年9月1日｜星期四':'島北市'}
function toTitle(){game.classList.remove('active');title.classList.add('active');updateContinue();if(bgmWanted){if(bgm.paused)startBgm();else fadeBgm(.28)}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1300)}
function visited(...ids){return ids.some(id=>state.scene===id||state.history.includes(id))}
function personLine(label,value,known=true){return `<div class="person-line"><div class="person-label">${label}</div><div class="person-value ${known?'':'unknown'}">${known?value:'還不知道'}</div></div>`}
function person(name,role,lines){return `<section class="person"><div class="person-head"><div class="person-name">${name}</div><div class="person-role">${role}</div></div>${lines.join('')}</section>`}

function renderLog(){const logs=(state.dialogueLog||[]).slice().reverse();$('#log-list').innerHTML=logs.length?logs.map((x,i)=>`<section class="log-entry"><div class="log-meta">${i===0?'上一頁':'前兩頁'}　${x.date||''}${x.location?'｜'+x.location:''}</div>${x.speaker?`<div class="log-speaker">${x.speaker}</div>`:''}<div class="log-text">${x.text}</div></section>`).join(''):'<div class="person-value unknown">目前還沒有可以回看的內容。</div>'}
