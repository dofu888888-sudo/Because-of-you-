<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#10282d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>因你快樂，浮現笑容</title>
  <style>
    :root{--ink:#e8dfcf;--muted:#aaa394;--accent:#c29b6c;--deep:#20282a;--panel:rgba(37,43,43,.88);--line:rgba(221,207,184,.16)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:#1d2526;color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;-webkit-tap-highlight-color:transparent}
    button{font:inherit}
    #app{height:100%;min-height:100dvh;position:relative;isolation:isolate;background:linear-gradient(180deg,rgba(31,37,37,.12),rgba(25,30,31,.58)),var(--scene-bg,linear-gradient(145deg,#6f7771,#424c4d 55%,#252e30));transition:background 1.7s ease}
    #app::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.3;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(247,232,205,.018) 4px),radial-gradient(circle at 72% 22%,rgba(208,181,139,.14),transparent 30%),linear-gradient(105deg,rgba(119,91,65,.06),transparent 45%);pointer-events:none}
    #app::after{content:"";position:absolute;inset:0;z-index:-1;box-shadow:inset 0 0 140px rgba(20,24,25,.66);pointer-events:none}
    .screen{display:none;height:100%;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
    .screen.active{display:flex}
    #title-screen{align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(46,52,51,.18),rgba(27,32,33,.76))}
    .title-wrap{width:min(620px,100%);animation:fade 1.6s both}
    .year-mark{letter-spacing:.34em;color:var(--accent);font:12px/1.5 ui-monospace,monospace;margin-bottom:25px}
    h1{font-weight:500;letter-spacing:.12em;font-size:clamp(31px,7vw,58px);margin:0;line-height:1.45;text-shadow:0 3px 30px rgba(18,22,23,.8);color:#eee4d3}
    .subtitle{color:var(--muted);font-size:14px;letter-spacing:.16em;margin:16px 0 55px}
    .menu{display:grid;gap:12px;width:min(300px,90%);margin:auto}
    .menu button,.choice{border:1px solid var(--line);background:rgba(45,51,50,.68);color:var(--ink);padding:14px 18px;cursor:pointer;transition:.3s;border-radius:2px}
    .menu button:hover,.choice:hover,.choice:focus-visible{border-color:rgba(194,155,108,.58);background:rgba(65,69,65,.86);transform:translateY(-1px);outline:none}
    .menu button:disabled{opacity:.35;cursor:default;transform:none}
    .version{position:absolute;bottom:max(9px,env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));color:#748286;font:10px ui-monospace,monospace}
    .bgm-credit{position:absolute;bottom:max(9px,env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));border:0;background:transparent;color:#8f9690;padding:4px 0;cursor:pointer;font:10px ui-monospace,monospace;letter-spacing:.04em;transition:color .3s,opacity .3s}
    .bgm-credit:hover,.bgm-credit:focus-visible{color:#c5b99f;outline:none}.bgm-credit.muted{opacity:.48}
    #game-screen{flex-direction:column;max-width:900px;margin:auto}
    .topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding:3px 2px 13px;color:var(--muted);font:12px/1.5 ui-monospace,monospace;letter-spacing:.08em}
    .location{text-align:right;color:#cfc1a9}
    .story{width:min(720px,100%);margin:auto;overflow-y:auto;padding:clamp(28px,7vh,68px) 2px 25px;scrollbar-width:none;mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 100%)}
    .story::-webkit-scrollbar{display:none}
    .chapter{color:var(--accent);font-size:12px;letter-spacing:.24em;margin-bottom:20px;text-transform:uppercase}
    .speaker{font-size:14px;color:#e6be7e;letter-spacing:.12em;margin:0 0 10px;min-height:1em}
    .text{font-size:clamp(17px,4.15vw,21px);line-height:2.05;letter-spacing:.045em;text-shadow:0 2px 14px rgba(17,21,22,.85);white-space:pre-line;margin:0;animation:rise .7s both}
    .choices{display:grid;gap:10px;margin-top:31px;padding-bottom:4px;animation:fade .45s both}
    .choice{text-align:left;line-height:1.55;position:relative;padding-left:44px}
    .choice span{position:absolute;left:17px;color:var(--accent);font:12px ui-monospace,monospace;top:17px}
    .continue{margin-top:31px;background:none;border:0;border-bottom:1px solid rgba(194,155,108,.5);color:#dac8aa;padding:8px 0;cursor:pointer;letter-spacing:.12em}
    .utility{display:flex;gap:10px;justify-content:flex-end;padding-top:11px;border-top:1px solid var(--line)}
    .icon-btn{border:0;background:transparent;color:#9aa8a7;padding:6px 5px;cursor:pointer;font:12px ui-monospace,monospace}
    .icon-btn:hover{color:var(--ink)}
    .overlay{position:absolute;inset:0;background:rgba(3,10,11,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:28px;z-index:10}
    .overlay.show{display:flex}
    .card{background:#303938;border:1px solid var(--line);width:min(470px,100%);padding:28px;box-shadow:0 25px 80px rgba(10,13,14,.72)}
    .card h2{margin:0 0 19px;font-size:20px;font-weight:500;letter-spacing:.12em}
    .card p{color:var(--muted);line-height:1.8;font-size:14px}
    .card dl{display:grid;grid-template-columns:90px 1fr;gap:11px;margin:24px 0;color:#d7cdb5;font-size:14px}.card dt{color:#87999a}.card dd{margin:0}
    .card button{width:100%;margin-top:10px}
    .people-card{max-height:min(78dvh,720px);overflow-y:auto;scrollbar-width:none}.people-card::-webkit-scrollbar{display:none}
    .people-intro{margin-bottom:22px!important}
    .person{padding:18px 0;border-top:1px solid var(--line)}.person:first-of-type{border-top:0}
    .person-head{display:flex;align-items:baseline;justify-content:space-between;gap:15px;margin-bottom:11px}
    .person-name{font-size:18px;letter-spacing:.1em;color:#e7dbc6}.person-role{font:11px ui-monospace,monospace;color:#9c988d;text-align:right}
    .person-line{display:grid;grid-template-columns:66px 1fr;gap:12px;font-size:13px;line-height:1.75;margin-top:7px}.person-label{color:#938e83}.person-value{color:#cbc2b2}
    .unknown{color:#7f817b;font-style:italic}
    .log-entry{padding:18px 0;border-top:1px solid var(--line)}.log-entry:first-child{border-top:0}
    .log-meta{color:#8f948e;font:11px/1.6 ui-monospace,monospace;letter-spacing:.06em;margin-bottom:8px}
    .log-speaker{color:#d1aa76;font-size:13px;letter-spacing:.08em;margin-bottom:7px}.log-text{color:#d7cfc0;font-size:14px;line-height:1.8;white-space:pre-line}
    .toast{position:absolute;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 60px));transform:translate(-50%,10px);opacity:0;background:#e5d3ac;color:#17282a;padding:8px 14px;font-size:12px;transition:.3s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @media(max-height:650px){.story{padding-top:22px}.text{line-height:1.8}.choices{margin-top:18px}.subtitle{margin-bottom:28px}}
  </style>
</head>
<body>
<main id="app">
  <section id="title-screen" class="screen active">
    <div class="title-wrap">
      <div class="year-mark">ISLAND NORTH · 1988</div>
      <h1>因你快樂，<br>浮現笑容</h1>
      <div class="subtitle">一段關於相遇、錯過，與長大的故事</div>
      <div class="menu">
        <button id="new-game">開始故事</button>
        <button id="continue-game" disabled>繼續</button>
        <button id="more-games">更多 LeoTsai 製作</button>
      </div>
    </div>
    <button class="bgm-credit" id="bgm-toggle" type="button" aria-label="播放或暫停背景音樂" aria-pressed="true">BGM－未解決的和弦</button>
    <div class="version">CHAPTER 36 · 0.9</div>
  </section>

  <section id="game-screen" class="screen">
    <header class="topbar"><div id="date">1988年8月31日｜星期三</div><div class="location" id="location">島北市・陳家</div></header>
    <article class="story" id="story">
      <div class="chapter" id="chapter"></div><div class="speaker" id="speaker"></div><p class="text" id="text"></p><div class="choices" id="choices"></div>
    </article>
    <footer class="utility"><button class="icon-btn" id="log-btn">紀錄</button><button class="icon-btn" id="people-btn">人物手札</button><button class="icon-btn" id="status-btn">隨身物品</button><button class="icon-btn" id="save-btn">儲存</button><button class="icon-btn" id="title-btn">回到標題</button></footer>
  </section>

  <div class="overlay" id="overlay"><div class="card"><h2>宇軒的口袋</h2><p>這裡只會顯示宇軒自己知道的事。人的心情，沒有數字可以確認。</p><dl id="status-list"></dl><div class="menu"><button id="close-overlay">關閉</button></div></div></div>
  <div class="overlay" id="people-overlay"><div class="card people-card"><h2>人物手札</h2><p class="people-intro">宇軒對身邊人們的認識。沒有親耳聽見、親眼看見的事情，不會記錄在這裡。</p><div id="people-list"></div><div class="menu"><button id="close-people">闔上手札</button></div></div></div>
  <div class="overlay" id="log-overlay"><div class="card people-card"><h2>對話紀錄</h2><p class="people-intro">最近經過的兩頁內容。</p><div id="log-list"></div><div class="menu"><button id="close-log">返回故事</button></div></div></div>
  <div class="toast" id="toast">已儲存</div>
  <audio id="title-bgm" src="bgm.mp3" preload="metadata" loop playsinline></audio>
</main>
<script>
const SAVE_KEY='smile-novel-save-v1';
const scenes={
 intro:{chapter:'序章｜夏末',date:'1988年8月31日｜星期三',location:'島北市・陳家',bg:'linear-gradient(145deg,#727873,#485150 52%,#293132)',text:'在手機還不是每個人都擁有的東西以前，想見一個人，得先約好時間與地點。\n\n如果對方沒有出現，你唯一能做的，往往只有等待。',next:'radio'},
 radio:{speaker:'收音機',text:'「……明日島北地區仍為多雲午後陣雨。提醒各位聽眾，出門別忘了攜帶雨具。」\n\n主持人的聲音被一陣沙沙雜訊吞掉。陳宇軒伸手拍了拍收音機，音樂才重新浮出來。',next:'room'},
 room:{text:'錄音帶轉到盡頭，喀一聲停了。\n\n書桌上壓著島北高中的新生通知，旁邊是讀到一半的小說。明天開學；母親已經第三次提醒他早點睡。',choices:[['繼續把小說讀完','novel'],['把錄音帶翻面，再聽一次','music'],['關掉檯燈，早點睡','sleep']]},
 novel:{text:'他把通知單推遠了一點，翻回夾著公車票的那頁。\n\n故事裡的人總知道自己要去哪裡。宇軒不知道。他只希望時間走快一點，最好一眨眼就已經是個不必被管的大人。',effect:s=>{s.flags.restless=true;s.items.push('讀到一半的小說')},next:'mother'},
 music:{text:'鉛筆插進卡帶的齒輪，鬆掉的帶子被慢慢捲緊。按下播放鍵後，歌聲有些失真，卻仍填滿整個房間。\n\n宇軒想，也許長大以後，他會買一整面牆的唱片。',effect:s=>{s.flags.music=true;s.items.push('混音錄音帶')},next:'mother'},
 sleep:{text:'宇軒把鬧鐘轉到六點半。黑暗中，客廳的電視聲、妹妹削鉛筆的聲音，以及父親還沒回家的空位，都比平常清楚。\n\n他閉上眼睛，卻很久沒有睡著。',effect:s=>{s.flags.rested=true},next:'mother'},
 mother:{speaker:'媽媽',text:'「宇軒，明天第一天，不要遲到。還有，高中開始不能再像國中那樣混，聽到沒有？」\n\n她沒等回答，便替他把房門帶上。門縫的光越來越窄。',choices:[['「知道啦。」','reply'],['假裝已經睡著','silent']]},
 reply:{speaker:'陳宇軒',text:'「知道啦。」\n\n聲音比他原本想的更不耐煩。門外安靜了一會兒，腳步才離開。',effect:s=>s.flags.spoke=true,next:'morning'},
 silent:{text:'宇軒沒有出聲。\n\n門外的人似乎又站了一會兒，最後什麼也沒說。',effect:s=>s.flags.silent=true,next:'morning'},
 morning:{chapter:'第一章｜開學日',date:'1988年9月1日｜星期四',location:'島北市・清晨',bg:'linear-gradient(155deg,#9b8267,#667472 47%,#38474a)',text:'六點三十七分。\n\n窗外傳來送報機車的聲音。夏天還沒真正離開，陽光已經爬上對面公寓的水塔。',next:'sister'},
 sister:{speaker:'陳以晴',text:'「哥，你再不下來，媽要把你的早餐拿去餵狗了。」\n\n妹妹從門外探進半張臉。她的制服袖口沾著一小點沒洗掉的藍色顏料。',choices:[['問她昨晚又畫了什麼','askart'],['叫她不要亂碰房門','brush'],['抓起書包衝下樓','rush']]},
 askart:{speaker:'陳宇軒',text:'「妳昨晚又在畫什麼？」\n\n以晴愣了一下，把袖口藏到背後。\n\n「沒有啦……就隨便畫。」\n\n她笑得很輕。宇軒第一次發現，妹妹被問到畫畫時，眼睛會變得不太一樣。',effect:s=>{s.flags.sisterArt=true;s.memories.push('以晴藏在袖口的藍色顏料')},next:'street'},
 brush:{speaker:'陳宇軒',text:'「不要每次都直接開門啦。」\n\n「誰叫你都不起床。」以晴吐了吐舌頭，跑下樓。',next:'street'},
 rush:{text:'宇軒看了一眼鬧鐘，抓起書包衝出去。以晴在樓梯口笑他連制服領子都沒翻好。',effect:s=>s.flags.rushed=true,next:'street'},
 street:{location:'島北市・民生東路',bg:'linear-gradient(145deg,#a58c6d,#667675 50%,#354345)',text:'街角早餐店冒著白煙，郵差把信塞進一排鐵皮信箱。公車站前擠滿穿著不同制服的學生。\n\n宇軒走到巷口時，一顆籃球從背後輕輕撞上他的書包。',next:'jiahao'},
 jiahao:{speaker:'李家豪',text:'「陳宇軒！第一天就走這麼快，是怕我跟你同班喔？」\n\n家豪把籃球夾在腰間，笑得像暑假根本沒有結束。',choices:[['「最好別再跟你同班。」','tease'],['「你怎麼知道我走這條？」','wonder'],['把球搶過來先跑','play']]},
 tease:{speaker:'李家豪',text:'「來不及了，我昨天去看分班表——一年三班。你這輩子甩不掉我了。」\n\n他說得理直氣壯，好像「這輩子」真的能一眼看完。',effect:s=>s.flags.jiahaoTease=true,next:'dream'},
 wonder:{speaker:'李家豪',text:'「你家到學校就這條最快啊。認識你幾年了，這還要猜？」\n\n有些人出現在身邊太久，久到會忘記那也是一種被記得。',effect:s=>s.memories.push('家豪記得自己上學的路'),next:'dream'},
 play:{text:'宇軒一把抄走籃球往前跑。\n\n「喂！那顆很貴欸！」\n\n兩人的鞋底踏過昨夜留下的水窪，驚得早餐店門口的麻雀一齊飛起。',effect:s=>s.flags.playful=true,next:'dream'},
 dream:{speaker:'李家豪',text:'「欸，宇軒。」\n\n等紅燈時，家豪忽然盯著對街運動用品店裡的棒球手套。\n\n「你覺得……真的有人可以靠打球過一輩子嗎？」',choices:[['「你不是說要當國手？」','national'],['「不知道，但你可以試試看。」','support'],['「先想辦法別被當掉吧。」','deflect']]},
 national:{speaker:'陳宇軒',text:'「你不是整天說要當國手？」\n\n「講講而已啦。」家豪笑了，視線卻還留在玻璃後的手套上。',effect:s=>s.flags.heardDream=true,next:'schoolgate'},
 support:{speaker:'陳宇軒',text:'「不知道。但你真的想，就試試看啊。」\n\n家豪沒有馬上接話。綠燈亮了幾秒，他才用肩膀撞了宇軒一下。\n\n「走啦，快遲到了。」',effect:s=>{s.flags.supportedDream=true;s.memories.push('清晨路口，家豪沒有說出口的夢')},next:'schoolgate'},
 deflect:{speaker:'陳宇軒',text:'「你先想辦法不要被當掉吧。」\n\n「靠，第一天就在觸我霉頭。」家豪笑罵著往前走。那個問題也就被留在紅燈的另一邊。',effect:s=>s.flags.deflectedDream=true,next:'schoolgate'},
 schoolgate:{location:'島北高中・校門',bg:'linear-gradient(145deg,#7f8b7d,#566a67 48%,#314245)',text:'七點四十九分。\n\n島北高中的校門比國中大得多。穿制服的人潮向裡湧去，教官的哨音、腳踏車鈴與樹上的蟬聲混在一起。\n\n宇軒跨進校門。那時的他還不知道，接下來遇見的人，會在往後許多年裡，一次又一次回到他的生命。',next:'classroom'},
 classroom:{location:'島北高中・一年三班',text:'黑板上寫著座位表。家豪果然在最後一排，正隔著半間教室對他揮手。\n\n靠窗的位置，一個綁著馬尾的女生正幫老師把作業簿分成幾疊；另一個女生坐在她桌沿，笑著說了些什麼，害她慌張地差點把整疊簿子弄掉。',choices:[['先去找家豪','toJiahao'],['幫忙撿起掉落的簿子','toGirls'],['安靜找到自己的座位','toSeat']]},
 toJiahao:{text:'宇軒穿過教室走向最後一排。家豪已經在打聽班上誰會打棒球。\n\n窗邊傳來一陣笑聲。他回頭時，只看見那個外向的女生把掉落的簿子抱回桌上。',effect:s=>s.flags.firstJiahao=true,next:'teacher'},
 toGirls:{text:'一本簿子滑到宇軒鞋邊。他彎腰撿起來，放回最上面。\n\n綁馬尾的女生小聲說：「謝謝。」\n\n她旁邊的人則大方地看著他。',next:'meetGirls'},
 meetGirls:{speaker:'張佳穎',text:'「你也是三班的？我叫張佳穎。她是黃雨婷，我們國中就認識了。」\n\n雨婷像是對這種介紹方式有些無奈，只好又對宇軒點了一次頭。',choices:[['自我介紹','introduce'],['指向後排：「我朋友在叫我。」','escape']]},
 introduce:{speaker:'陳宇軒',text:'「陳宇軒。」\n\n「喔，陳宇軒。」佳穎跟著念了一次，隨即低頭繼續整理作業簿。\n\n那只是開學第一天再普通不過的一次自我介紹。兩個人都沒有特別放在心上。',effect:s=>{s.flags.metProperly=true;s.memories.push('開學第一天，窗邊散落的作業簿')},next:'teacher'},
 escape:{speaker:'陳宇軒',text:'「我朋友在叫我，謝啦。」\n\n「明明是我們跟你道謝吧？」佳穎在後面笑了一聲。',effect:s=>s.flags.metBriefly=true,next:'teacher'},
 toSeat:{text:'宇軒照著座位表坐下，把書包掛在椅背。周遭的人很快聊成一片，他翻開新課本，假裝自己很忙。\n\n過了一會兒，一本簿子被遞到他桌上。右上角工整寫著：黃雨婷。',effect:s=>s.flags.observer=true,next:'teacher'},
 teacher:{speaker:'黃子芸',text:'「各位早安，我姓黃，黃子芸。接下來三年，我是你們的班導師。」\n\n講台上的年輕老師沒有立刻翻點名簿，而是拿起粉筆，在自己的名字旁寫下一句話：\n\n——你想成為什麼樣的人？',next:'question'},
 question:{speaker:'黃子芸',text:'「不用現在回答我。老實說，十五、六歲就知道答案的人才奇怪。」\n\n班上有人笑了。\n\n「但我希望畢業以前，你們至少有勇氣替自己想一次。」',choices:[['把這句話抄進課本空白處','write'],['覺得只是老師漂亮話','dismiss'],['望向窗外，沒有答案','noanswer']]},
 write:{text:'宇軒把那句話抄在國文課本的第一頁。字寫得有些歪。\n\n多年以後，他會再次翻到這一頁。',effect:s=>{s.flags.keptQuestion=true;s.items.push('寫著一句問題的國文課本');s.memories.push('黃子芸老師的第一個問題')},next:'ending'},
 dismiss:{text:'宇軒沒有動筆。大人總喜歡說一些好聽的話，最後還不是只看考試成績。\n\n他那時真心這麼相信。',effect:s=>s.flags.dismissedTeacher=true,next:'ending'},
 noanswer:{text:'窗外的雲移得很慢。宇軒想了半天，腦中仍是一片空白。\n\n他只知道，自己想快點長大。',effect:s=>s.flags.noFuture=true,next:'ending'},
 ending:{chapter:'序章・完',date:'1988年9月1日｜星期四',location:'島北高中・一年三班',bg:'linear-gradient(160deg,#99836a,#586b68 48%,#303e41)',text:'風從走廊吹進教室，翻動桌上的課本。\n\n李家豪、張佳穎、黃雨婷、黃子芸。\n\n四個名字，在這一天以前，還沒有同時出現在陳宇軒的人生裡。\n\n而他們誰也不知道，這個看似普通的早晨，會被記得那麼久。',next:'ch1title'},
 ch1title:{chapter:'第一章｜放學以後',date:'1988年9月9日｜星期五',location:'島北高中・一年三班',bg:'linear-gradient(155deg,#907861,#5d6b68 48%,#354245)',text:'開學後的第九天。\n\n新課本的油墨味淡了，座位不再陌生，班上的人也漸漸有了各自固定的位置。\n\n有些關係，就是從這種誰也沒注意的日常裡開始的。',next:'lateclass'},
 lateclass:{speaker:'國文老師',text:'「今天的作文，下星期一早自習以前交。張佳穎，麻煩妳收齊之後送到辦公室。」\n\n下課鐘一響，教室立刻被椅子拖動與說話聲填滿。佳穎抱著點名簿站上講台。',next:'collect'},
 collect:{speaker:'張佳穎',text:'「第三排還有四個沒交！不要以為裝忙我就看不到喔。」\n\n她嘴上很有精神，桌上的作文本卻已經堆得搖搖欲墜。雨婷今天輪值，早一步去了導師辦公室。',choices:[['留下來幫她收另一排','helpcollect'],['提醒家豪交完再走','jiahaowork'],['收好書包，先去福利社','canteen']]},
 helpcollect:{speaker:'陳宇軒',text:'「我幫妳收靠窗那排。」\n\n佳穎抬頭看了他一眼。\n\n「咦？你今天吃錯藥喔？」',choices:[['「怕妳抱到辦公室前就全掉了。」','jokehelp'],['「快一點，家豪還在等我。」','plainhelp']]},
 jokehelp:{speaker:'張佳穎',text:'「你很煩欸！」\n\n她笑著拿一本作業本作勢要丟，最後仍輕輕放進宇軒手上的那疊。',effect:s=>s.flags.teasedJiaying=true,next:'sunmoment'},
 plainhelp:{speaker:'張佳穎',text:'「喔……好。那邊五個，謝啦。」\n\n宇軒沿著窗邊一桌桌收過去。佳穎則低頭核對座號。',effect:s=>s.flags.helpedPlainly=true,next:'sunmoment'},
 jiahaowork:{text:'家豪的作文本果然還是一片空白。宇軒用筆敲了敲他的桌面。\n\n「至少寫個名字。」\n\n「名字可以算三百字裡面嗎？」家豪一臉認真。',effect:s=>s.flags.checkedJiahao=true,next:'sunmomentAlt'},
 canteen:{text:'福利社的冰櫃只剩最後一瓶麥香奶茶。宇軒付了十二元，隔著玻璃看見同學陸續走出校門。\n\n回到教室時，佳穎仍在跟那疊作業奮戰。',effect:s=>{s.flags.boughtDrink=true;s.items.push('麥香奶茶');},next:'offerdrink'},
 offerdrink:{text:'塑膠瓶外凝著一層細小水珠，冰涼的觸感留在掌心。教室裡只剩翻動作業本的聲音，和窗外球場偶爾傳來的哨聲。\n\n佳穎還沒發現宇軒已經回來。',choices:[['把奶茶放到佳穎桌上，幫她繼續收','drinkhelp'],['坐回位子慢慢喝','watchcollect']]},
 drinkhelp:{speaker:'張佳穎',text:'「幹嘛？賄賂作業股長也沒用喔。」\n\n「福利社最後一瓶。妳要不要隨便。」\n\n佳穎盯著奶茶，又看了看宇軒，笑著把它推回兩人中間。\n\n「一人一半啦。」',effect:s=>{s.flags.sharedDrink=true;s.memories.push('兩個人分掉的最後一瓶麥香奶茶')},next:'sunmoment'},
 watchcollect:{text:'宇軒坐在自己的位置喝奶茶。幾分鐘後，佳穎終於抱起高得擋住視線的作業，搖搖晃晃地走出教室。\n\n她走到門口時回頭瞪了他一眼。\n\n「看什麼看，也不知道幫忙。」',effect:s=>s.flags.didNotHelp=true,next:'corridor'},
 sunmomentAlt:{text:'家豪最後只擠出兩行字，便嚷著要去球場。宇軒替他把作文本送到講台，順手接住佳穎懷裡快滑下來的幾本。',next:'sunmoment'},
 sunmoment:{text:'午後四點十七分。\n\n宇軒低頭按著座號，把最後一本作業放整齊。西斜的陽光穿過老舊百葉窗，在他的制服與側臉留下細長的亮痕。\n\n佳穎本來正在說話，聲音卻忽然停了。',next:'heartbeat'},
 heartbeat:{speaker:'陳宇軒',text:'「怎麼了？漏了誰的嗎？」\n\n「……沒有。」\n\n佳穎立刻低頭翻點名簿。紙上的座號突然變得很難看懂。',effect:s=>{s.flags.jiayingNoticed=true;s.memories.push('放學後灑進教室的夕陽')},next:'carry'},
 carry:{speaker:'張佳穎',text:'「那個……你可以順便幫我搬去辦公室嗎？」\n\n她說完又補了一句：\n\n「反正你都幫一半了。」',choices:[['陪她送去辦公室','officewalk'],['把作業交給她，去找家豪','leaveforjiahao']]},
 officewalk:{location:'島北高中・西側走廊',text:'放學後的走廊安靜許多。遠處的管樂社反覆練著同一小節，操場上偶爾傳來球棒擊中球的聲音。\n\n兩人並肩走著，一時找不到話題。',choices:[['問她為什麼願意當幹部','askcadre'],['問她平常放學都做什麼','askafter'],['什麼都不說','quietwalk']]},
 askcadre:{speaker:'張佳穎',text:'「不是我願意，是黃老師點我的好不好。」\n\n她壓低聲音。\n\n「不過也還好啦。至少可以光明正大叫別人交作業，滿爽的。」',effect:s=>s.flags.askedCadre=true,next:'officeend'},
 askafter:{speaker:'張佳穎',text:'「有時候去雨婷家，有時候練琴。我媽最近還說要帶我去看一台新的。」\n\n「鋼琴？」\n\n「不然咧，電冰箱喔？」她笑出聲。',effect:s=>s.flags.knowsPiano=true,next:'officeend'},
 quietwalk:{text:'兩個人的腳步聲在走廊裡一前一後。快到辦公室時，佳穎突然哼起剛才管樂社練的旋律。\n\n她哼錯了一個音，自己先笑了。',effect:s=>s.flags.heardHum=true,next:'officeend'},
 officeend:{location:'島北高中・教師辦公室外',speaker:'張佳穎',text:'「謝啦，陳宇軒。」\n\n她第一次連名帶姓叫他，語氣卻不像開學那天那麼陌生。',next:'corridor'},
 leaveforjiahao:{text:'宇軒把那疊作業穩穩放回佳穎懷裡。\n\n「家豪在等我，妳自己可以吧？」\n\n「當然可以啊。」她回答得很快。\n\n宇軒跑遠後，佳穎才小聲對著空走廊說：「……本來還想跟你聊一下的。」',effect:s=>s.flags.missedWalk=true,next:'ballfield'},
 corridor:{location:'島北高中・穿堂',bg:'linear-gradient(150deg,#8b7865,#536461 52%,#303d40)',text:'宇軒走下樓時，天色已經比剛才暗了一些。穿堂前，雨婷一個人蹲在地上，把散落的講義塞回牛皮紙袋。',choices:[['蹲下來幫她撿','helpyuting'],['叫住前面的佳穎來幫忙','calljiaying'],['問她怎麼還沒回家','asklate']]},
 helpyuting:{speaker:'黃雨婷',text:'「謝、謝謝……我自己可以。」\n\n她越急，紙張反而越塞不進去。宇軒沒有催她，只把講義按頁碼排好。',effect:s=>{s.flags.helpedYuting=true;s.memories.push('雨婷裝滿講義的舊牛皮紙袋')},next:'booktalk'},
 calljiaying:{speaker:'張佳穎',text:'「班長，妳怎麼每次都拿那麼多東西回去？」\n\n佳穎熟練地接過半疊，顯然不是第一次。雨婷只是笑笑。',effect:s=>s.flags.sawFriendship=true,next:'booktalk'},
 asklate:{speaker:'黃雨婷',text:'「老師要我幫忙整理成績……」\n\n她把紙袋抱緊了一些，看起來很怕錯過公車。',effect:s=>s.flags.noticedYutingRush=true,next:'booktalk'},
 booktalk:{text:'一冊小說從紙袋底下露出書角。宇軒認得封面，是他上個月在書店看了很久、最後沒有買的那本。',choices:[['問她好不好看','askbook'],['假裝沒有注意到','ignorebook']]},
 askbook:{speaker:'陳宇軒',text:'「這本好看嗎？」\n\n雨婷原本緊張的神情鬆了一點。\n\n「很好看。你也喜歡這個作者？」\n\n他們第一次發現，彼此讀過許多相同的故事。',effect:s=>{s.flags.bookBond=true;s.memories.push('和雨婷第一次談起小說')},next:'busmoney'},
 ignorebook:{text:'宇軒沒有問。雨婷把小說往紙袋裡又推了一點，向他點頭道謝後便準備離開。',effect:s=>s.flags.ignoredBook=true,next:'busmoney'},
 busmoney:{text:'雨婷走到校門口，摸遍制服口袋後忽然停下來。公車已經在路口轉彎。\n\n她低頭看著手裡僅有的幾枚硬幣。',choices:[['借她公車錢','lendmoney'],['陪她走到下一站看看','walkbus'],['認為她應該自己能處理','letgo']]},
 lendmoney:{speaker:'陳宇軒',text:'「差多少？」\n\n「不用，我走回去就好。」\n\n「明天再還我。」宇軒把十元硬幣放進她手裡，沒讓她繼續拒絕。',effect:s=>{s.flags.lentYuting=true;s.memories.push('借給雨婷的十元硬幣')},next:'ballfield'},
 walkbus:{text:'「下一站公車也會停吧，走過去看看。」\n\n他們沿著圍牆走。雨婷始終不肯說自己住得多遠，只在公車出現時第一次露出放心的表情。',effect:s=>{s.flags.walkedYuting=true;s.memories.push('和雨婷趕上的末班公車')},next:'ballfield'},
 letgo:{text:'「那我先走了。」\n\n宇軒轉身後，雨婷仍站在站牌下。公車從她面前駛過，沒有停。',effect:s=>s.flags.leftYuting=true,next:'ballfield'},
 ballfield:{location:'島北高中・操場',bg:'linear-gradient(155deg,#806e5c,#4c5c59 48%,#2a383b)',text:'操場邊只剩幾個運動社團。家豪站在棒球隊練習區外，隔著鐵網看學長打擊。\n\n他手裡還抱著早上那顆籃球，卻看得一動也不動。',next:'coach'},
 coach:{speaker:'棒球隊學長',text:'「同學，你看好幾天了。想加入就去拿報名表啊。」\n\n家豪像被抓到做壞事，立刻搖頭。\n\n「沒有啦，我等朋友而已。」',choices:[['當場拆穿他','expose'],['陪他繼續看，不說破','staywatch'],['拉他去拿報名表','getform']]},
 expose:{speaker:'陳宇軒',text:'「他從國中就說想當國手。」\n\n「靠，陳宇軒！」\n\n學長笑著把一張報名表塞進家豪懷裡。家豪嘴上罵個不停，手卻沒有把紙丟掉。',effect:s=>s.flags.exposedDream=true,next:'rain'},
 staywatch:{text:'宇軒站到他旁邊。兩人隔著鐵網看了很久。\n\n「要不要去報名？」\n\n「……再看看啦。」\n\n有些夢想在能被說出口以前，需要先有人陪著沉默。',effect:s=>{s.flags.silentSupport=true;s.memories.push('和家豪隔著鐵網看的練習')},next:'rain'},
 getform:{speaker:'陳宇軒',text:'「走啦，拿一張又不會死。」\n\n宇軒推著家豪走向球場。家豪掙扎得很大聲，真正走到學長面前時，卻忽然安靜了。',effect:s=>{s.flags.gotBaseballForm=true;s.items.push('替家豪保管的棒球隊報名表')},next:'rain'},
 rain:{location:'島北高中・校門',bg:'linear-gradient(160deg,#6d716c,#455250 48%,#283436)',text:'五點二十三分，雨毫無預兆地落下。\n\n屋簷很快站滿沒帶傘的學生。那個年代，沒有人能傳訊息叫家人來接，也查不到雨什麼時候會停。',choices:[['和家豪冒雨跑去車站','runrain'],['留在屋簷下等雨變小','waitrain'],['去警衛室借公共電話','phonehome']]},
 runrain:{text:'「三、二、一——跑！」\n\n兩個人衝進雨裡。制服很快濕透，家豪卻笑得像剛贏了一場比賽。',effect:s=>s.memories.push('開學後第一場淋透制服的雨'),next:'afterrain'},
 waitrain:{text:'雨打在鐵皮遮雨棚上，聲音大得不必勉強聊天。\n\n宇軒看見佳穎和雨婷共撐一把傘走過校門。佳穎回頭時似乎看見了他，舉起手揮了兩下。',effect:s=>s.flags.sawUmbrella=true,next:'afterrain'},
 phonehome:{location:'島北高中・警衛室',text:'公共電話旁排了五個人。輪到宇軒時，他投進硬幣，熟練地撥出家裡號碼。\n\n電話響了很久，沒有人接。硬幣掉進退幣口，發出清脆的一聲。',effect:s=>s.memories.push('那通沒有人接的電話'),next:'afterrain'},
 afterrain:{location:'島北市・傍晚',bg:'linear-gradient(155deg,#70675f,#495654 50%,#2b3638)',text:'雨後的島北市像蒙上一層灰藍色的薄膜。公車駛過積水，唱片行櫥窗裡的燈剛剛亮起。\n\n宇軒還不知道，今天那些微不足道的選擇，有些人會記得很久。',next:'jiayinghome'},
 jiayinghome:{location:'張家・客廳',speaker:'張佳穎',text:'雨沿著落地窗緩慢滑下，把窗外的路燈暈成一團模糊的淡黃色。客廳沒有開大燈，只有鋼琴旁那盞罩著米白燈罩的立燈，靜靜照著琴鍵。\n\n佳穎坐在琴前，彈的是早已背熟的曲子。母親還沒下班，哥哥的房門關著；偌大的屋子裡，只剩節拍器規律擺動，和雨水敲在遮雨棚上的細碎聲音。\n\n彈到第二段，她的手指忽然慢了半拍。午後教室的景象毫無預兆地浮現——堆疊的作業本、百葉窗間斜斜落下的陽光，還有那張被照亮的側臉。\n\n琴音落錯了。\n\n她停下來，讓最後一個不和諧的音在客廳裡慢慢消失。黑色琴蓋映出她自己愣愣的表情。\n\n「……陳宇軒。」\n\n那個名字輕得幾乎被雨聲蓋過。佳穎盯著自己的手指，耳根一點點熱起來。\n\n「我在幹嘛啊……」\n\n她低下頭重新起拍，卻連續三次，都在同一個地方彈錯。',next:'ch1end'},
 ch1end:{chapter:'第一章・完',date:'1988年9月9日｜星期五',location:'島北市・雨夜',bg:'linear-gradient(155deg,#625f5a,#3f4b4a 52%,#252f31)',text:'窗外又開始下雨。\n\n那一晚，有人把棒球隊報名表壓在課本最下面；有人在昏黃的燈下讀著借來的小說；也有人第一次因為想起一張側臉，彈錯了熟悉的琴譜。\n\n至於陳宇軒，他對這一切仍然一無所知。',next:'ch2title'},
 ch2title:{chapter:'第二章｜星期六，老地方',date:'1988年9月10日｜星期六',location:'島北市・陳家',bg:'linear-gradient(150deg,#887664,#596864 50%,#354244)',text:'星期六的上午，時間總比平日走得慢。\n\n不用趕著擠七點四十分的公車，也沒有鐘聲提醒下一堂課。電風扇在天花板上緩慢轉動，把廚房裡煎蛋和醬油的氣味一陣陣送進客廳。',next:'satmorning'},
 satmorning:{speaker:'媽媽',text:'「下午又要出去？」\n\n母親站在餐桌旁，把剛曬乾的制服一件件摺好。收音機播著週末點歌節目，主持人念完一封聽眾來信，接著放起一首宇軒沒有聽過的慢歌。\n\n「才剛開學，不要整天只知道玩。功課寫完了嗎？」',choices:[['「跟家豪約好了，晚餐前回來。」','promisehome'],['「去書店買參考書。」','liebook'],['先把桌上的碗洗掉再說','washfirst']]},
 promisehome:{speaker:'陳宇軒',text:'「跟家豪約好了，晚餐前就回來。」\n\n母親看了牆上的時鐘一眼。\n\n「六點。超過六點就自己在門口站到你爸回來。」\n\n這句話不像玩笑。宇軒點點頭，把時間牢牢記在心裡。',effect:s=>s.flags.promisedSix=true,next:'sistersat'},
 liebook:{speaker:'陳宇軒',text:'「去書店買參考書啦。」\n\n母親停下摺衣服的手，看了他幾秒。\n\n「那收據帶回來。」\n\n宇軒低頭喝完豆漿，忽然覺得這個謊比想像中麻煩。',effect:s=>s.flags.liedBook=true,next:'sistersat'},
 washfirst:{text:'宇軒沒有立刻回答。他把早餐的碗收進水槽，開水時先是一陣管線的低鳴，接著冰涼的水才從水龍頭流下。\n\n母親在身後安靜了一會兒。\n\n「六點以前回來。」她最後只說。',effect:s=>s.flags.washedDishes=true,next:'sistersat'},
 sistersat:{speaker:'陳以晴',text:'「哥，你要去老地方喔？」\n\n以晴趴在客廳地板上畫圖，身旁散著削短的色鉛筆。圖畫紙上是一排被雨淋濕的房子，屋頂卻塗著很亮的橘色。',choices:[['蹲下來看她畫完','watchart'],['提醒她別跟媽媽告密','secrecy'],['拿外套準備出門','leavequick']]},
 watchart:{speaker:'陳宇軒',text:'「為什麼下雨，屋頂還是橘色的？」\n\n「因為裡面有人啊。」以晴沒有抬頭，繼續把最後一扇窗塗亮。\n\n宇軒似懂非懂地看了一會兒。玄關外傳來鄰居拖動鐵門的聲音，陽光從紗窗落在紙上，顏色像是舊糖紙一樣透明。',effect:s=>{s.flags.sawSisterPainting=true;s.memories.push('以晴畫裡雨天仍然明亮的屋頂')},next:'setout'},
 secrecy:{speaker:'陳宇軒',text:'「不要跟媽說我可能會去電動間。」\n\n以晴終於抬頭，伸出沾著橘色顏料的小指。\n\n「回來幫我買汽水。」\n\n兩個人用最不可靠的方式完成了一筆交易。',effect:s=>s.flags.promisedSoda=true,next:'setout'},
 leavequick:{text:'宇軒套上鞋，把門輕輕帶上。門鎖闔起的喀噠聲，將母親的叮嚀和收音機裡的慢歌一起關在屋內。',next:'setout'},
 setout:{location:'島北市・午後',bg:'linear-gradient(145deg,#9a846b,#68736c 50%,#3d4a4a)',text:'昨夜的雨在騎樓邊留下幾攤尚未乾透的水。修鞋攤的老闆坐在矮凳上看報紙，五金行門口吊著的塑膠水桶被風吹得互相碰撞。\n\n宇軒口袋裡有四十二元。沒有隨身聽，也沒有任何東西能在路上替他消磨時間。他只好一邊走，一邊讀遍每根電線桿上的補習班廣告。',next:'oldplace'},
 oldplace:{location:'榕樹公園・籃球場旁',text:'所謂「老地方」，其實只是榕樹公園角落一張掉漆的綠色長椅。\n\n國中三年裡，宇軒和家豪曾在這裡分過一袋三十元的薯條、躲過午後雷雨，也曾什麼都不做，只看著球場上的大人打到天黑。\n\n長椅上方的時鐘指著一點五十三分。家豪還沒到。',next:'waitone'},
 waitone:{text:'兩點整。\n\n一輛公車在路口停下，車門吐出幾名乘客，又帶著柴油味駛遠。宇軒望著每一個從轉角出現的人，沒有一個是家豪。\n\n他用鞋尖把地上的小石子踢進排水溝。',next:'waittwo'},
 waittwo:{text:'兩點十二分。\n\n球場上的一場三對三結束了。賣叭噗的老人推著車慢慢經過，銅鈴聲從近處晃到遠處。\n\n宇軒開始懷疑，是不是自己記錯了時間。可昨天放學前，家豪明明說的是「星期六下午兩點，老地方」。',choices:[['繼續坐在原位等','keepwaiting'],['去雜貨店借電話打到家豪家','calljiahao'],['到附近繞一圈找他','searchjiahao']]},
 keepwaiting:{text:'宇軒往長椅深處挪了一點，決定再等十分鐘。\n\n沒有訊息可以確認，也沒有地圖能顯示一個人現在走到哪裡。等待不是什麼浪漫的事，只是一次又一次抬頭，然後一次又一次失望。\n\n兩點二十八分，榕樹葉影已經從他的左腳移到了右腳。',effect:s=>s.flags.waitedJiahao=true,next:'latearrival'},
 calljiahao:{location:'榕樹公園旁・雜貨店',text:'雜貨店裡比外面暗。玻璃櫃放著一排糖果、橡皮擦和小包裝的科學麵，冰箱壓縮機發出持續的低鳴。\n\n老闆娘指了指櫃台上的米色電話。\n\n「市內一通兩塊，自己撥。」',next:'phonecall'},
 phonecall:{text:'宇軒撥出早已背熟的號碼。轉盤每次回彈都發出細碎的喀啦聲。\n\n電話響了六次，終於有人接起。',next:'jiahaofather'},
 jiahaofather:{speaker:'李家豪的父親',text:'「喂，李公館。」\n\n電話另一頭的聲音低沉而陌生。宇軒握緊聽筒。\n\n「叔叔您好，我找家豪。」\n\n沉默了兩秒。\n\n「他出去了。」\n\n電話隨即被掛斷，只留下短促的忙音。',effect:s=>{s.flags.calledJiahaoHome=true;s.memories.push('家豪父親在電話裡冷淡的聲音')},next:'latearrival'},
 searchjiahao:{text:'宇軒沿著公園外圍走了一圈。漫畫店裡擠滿翻書的人，撞球間的布簾後傳出球碰撞的清脆聲音。\n\n他在每一間店門口停一下，仍然沒看到家豪。\n\n等他繞回長椅，已經兩點半。',effect:s=>s.flags.searchedJiahao=true,next:'latearrival'},
 latearrival:{location:'榕樹公園・籃球場旁',speaker:'李家豪',text:'「宇軒！」\n\n聲音從馬路對面傳來。家豪跑過斑馬線，制服以外的他看起來有些陌生：褪色的運動短褲、洗得發白的球鞋，額前的頭髮全被汗黏在一起。\n\n他彎著腰喘了很久，直到紅燈重新亮起才終於說：\n\n「抱歉啦……臨時有點事。」',choices:[['問他到底發生什麼事','asklatewhy'],['抱怨自己等了快四十分鐘','complainlate'],['把長椅上的位置讓給他','giveseat']]},
 asklatewhy:{speaker:'陳宇軒',text:'「什麼事？你家離這裡又沒有多遠。」\n\n家豪拿衣領搧著風，視線落在球場另一側。\n\n「就……我爸突然叫我整理房間。」\n\n他回答得太快，像是一路上已經練習過。',effect:s=>s.flags.suspectsJiahao=true,next:'formreveal'},
 complainlate:{speaker:'陳宇軒',text:'「我等你快四十分鐘欸。」\n\n「對不起啦，請你喝飲料。」\n\n家豪摸遍口袋，最後只掏出三枚一元硬幣。兩個人看著那三塊錢，一起笑了出來，剛才的火氣也散掉一半。',effect:s=>s.flags.complainedLate=true,next:'formreveal'},
 giveseat:{text:'宇軒沒有追問，只往旁邊挪出位置。家豪坐下後，兩個人安靜地看了一會兒球場。\n\n風吹過高處的榕樹葉。家豪的呼吸慢慢平穩，手卻一直壓著褲子口袋裡某張被揉皺的紙。',effect:s=>s.flags.gaveQuietSpace=true,next:'formreveal'},
 formreveal:{text:'家豪最後還是把紙拿了出來。\n\n那是棒球隊入隊報名表。原本平整的紙被揉成許多軟皺，右下角「家長簽章」的位置仍是一片空白。',next:'familyfight'},
 familyfight:{speaker:'李家豪',text:'「我爸看到了。」\n\n他用拇指反覆摳著紙張邊緣。\n\n「他說，花那麼多錢讓我念高中，不是要我去操場曬太陽。還說我們家沒有人可以養我一輩子。」\n\n家豪笑了一下。那個笑容和平常很像，卻沒有看宇軒。\n\n「算了啦。他講得也沒錯。」',choices:[['「他講得對不代表你就得放棄。」','pushdream'],['「至少先去參加入隊測驗。」','tryoutfirst'],['陪他坐著，不急著勸','sitwithhim']]},
 pushdream:{speaker:'陳宇軒',text:'「他講得對，不代表你就得放棄啊。」\n\n「你說得很簡單欸。」家豪皺起眉，語氣第一次有些尖。\n\n風把報名表的一角吹得不停顫動。過了很久，他才小聲補了一句：\n\n「……可是謝啦。」',effect:s=>{s.flags.knowsJiahaoFamilyPressure=true;s.flags.pushedDream=true},next:'girlsarrive'},
 tryoutfirst:{speaker:'陳宇軒',text:'「你都還沒進球隊，現在放棄不是很奇怪嗎？至少先去測驗。」\n\n家豪把表格翻過來又翻回去。\n\n「如果沒選上，不是更丟臉？」\n\n「那也比你以後一直想自己到底選不選得上好吧。」\n\n這次家豪沒有反駁。',effect:s=>{s.flags.knowsJiahaoFamilyPressure=true;s.flags.encouragedTryout=true},next:'girlsarrive'},
 sitwithhim:{text:'宇軒沒有立刻說那些「夢想比較重要」的話。\n\n球場傳來鞋底摩擦地面的聲音，一群小孩追著滾出界外的籃球跑過兩人面前。家豪一直低著頭，直到報名表不再被他的手揉出新的皺痕。\n\n「我其實很想去。」他終於說。',effect:s=>{s.flags.knowsJiahaoFamilyPressure=true;s.flags.heardTrueDream=true;s.memories.push('家豪說「我其實很想去」時的聲音')},next:'girlsarrive'},
 girlsarrive:{speaker:'張佳穎',text:'「你們兩個坐在這裡開追悼會喔？」\n\n熟悉的聲音從長椅後方冒出來。佳穎手裡拿著一支快融化的紅豆冰棒，另一隻手提著唱片行的紙袋。雨婷站在她旁邊，抱著兩本用牛皮紙包好的書。',next:'chance'},
 chance:{text:'在沒有社群動態、沒有定位分享的年代，遇見同學通常不是誰精心安排的事。\n\n只是同一個午後，走上同一條街，然後恰好在榕樹下認出了彼此。\n\n也正因為如此，一次偶遇才顯得像真正的驚喜。',choices:[['問她們怎麼會在這裡','askgirls'],['先把家豪的報名表收起來','hideform'],['指著正在滴的冰棒提醒佳穎','meltingice']]},
 askgirls:{speaker:'張佳穎',text:'「前面唱片行有進新的琴譜，我來看啊。雨婷去舊書攤，我們就一起走。」\n\n她晃了晃手裡的紙袋。\n\n「你們咧？兩個大男生約會？」',effect:s=>s.flags.knowsPiano=true,next:'groupinvite'},
 hideform:{text:'宇軒下意識替家豪把報名表摺起來。佳穎注意到了，卻沒有追問，只把目光移向球場。\n\n雨婷則像是看懂了什麼，安靜地站在一旁。',effect:s=>s.flags.protectedJiahaoSecret=true,next:'groupinvite'},
 meltingice:{speaker:'陳宇軒',text:'「妳的冰棒快滴到鞋子了。」\n\n「啊！」\n\n佳穎慌忙低頭，紅豆糖水仍在白襪上留下了一小點。家豪終於笑出聲，剛才沉重的空氣也被這場小災難沖淡。',effect:s=>s.flags.warnedIce=true,next:'groupinvite'},
 groupinvite:{speaker:'張佳穎',text:'「我們要去前面的美而冰果室。你們要不要一起？」\n\n家豪看向宇軒，似乎還沒從剛才的談話裡完全走出來。雨婷則低頭看了看手錶。',choices:[['四個人一起去','joinice'],['說自己沒帶多少錢','mentionmoney'],['陪家豪留在球場','staycourt']]},
 joinice:{speaker:'李家豪',text:'「走啊，反正有人遲到說要請客。」宇軒說。\n\n「等一下，我什麼時候說請四個？」\n\n佳穎走在前面笑得很大聲。雨婷也偷偷笑了，只是立刻用書擋住嘴。',effect:s=>s.flags.groupOuting=true,next:'icestore'},
 mentionmoney:{speaker:'陳宇軒',text:'「我身上沒多少錢。」\n\n「我們也不是要去吃滿漢全席。」佳穎說。\n\n雨婷抬起頭，小聲補了一句：「坐著聊天也可以，不一定要點東西。」\n\n她像是早已替自己想過這個答案。',effect:s=>s.flags.noticedYutingMoney=true,next:'icestore'},
 staycourt:{speaker:'陳宇軒',text:'「妳們先去吧，我們還有點事。」\n\n「神神祕祕的。」佳穎拖長聲音，從紙袋裡撕下一小角，飛快寫了幾個字。\n\n「如果改變主意，我們大概待到四點。」\n\n紙上是冰果室的地址。她把紙塞進宇軒手裡，轉身追上雨婷。',effect:s=>s.flags.stayedWithJiahao=true,next:'courtquiet'},
 courtquiet:{text:'兩個人又坐了一會兒。球場上的人換了一批，陽光也越過鐵網，把長椅切成明暗兩半。\n\n家豪把報名表重新攤在膝上，用手掌一點一點壓平。\n\n「去吧。」他忽然說，「不然她們真的會以為我們在約會。」',next:'icestore'},
 icestore:{location:'美而冰果室',bg:'linear-gradient(150deg,#9b8067,#6d7064 52%,#414a48)',text:'冰果室的玻璃門上貼著褪色的汽水廣告。推門時，一串小銅鈴清脆地響了兩下。\n\n店裡有股刨冰糖水、舊木頭與冷氣機灰塵混在一起的味道。牆上的電視正在重播綜藝節目，畫面偶爾從中間往上跳，老闆便隔著櫃台拍一下機殼。\n\n四個人擠進靠窗的小桌。這是他們第一次在學校以外坐在一起。',next:'orderice'},
 orderice:{text:'菜單被透明塑膠墊壓在桌面下。紅豆牛奶冰二十五元，木瓜牛奶三十元，最便宜的冬瓜茶也要八元。\n\n佳穎很快點了四果冰。家豪盯著價目表假裝研究。雨婷則把菜單推回桌子中央。',choices:[['提議四個人合點一盤冰','shareice'],['替雨婷點一杯冬瓜茶','orderforher'],['只點自己的飲料','ownorder']]},
 shareice:{speaker:'陳宇軒',text:'「不然點一盤大的，四個人吃。」\n\n「一盤哪夠家豪吃？」佳穎嘴上嫌棄，還是把剛點的四果冰改成了特大盤。\n\n冰送上來時，四支不同顏色的塑膠湯匙插在同一座碎冰上，糖水沿著盤緣慢慢積成淡淡的琥珀色。',effect:s=>{s.flags.sharedIce=true;s.memories.push('四支湯匙分食的一盤四果冰')},next:'tabletalk'},
 orderforher:{speaker:'陳宇軒',text:'「再一杯冬瓜茶。」\n\n雨婷立刻搖頭。\n\n「不用，我不渴。」\n\n「都點了。」\n\n她看著送來的玻璃杯，雙手握住杯壁，小聲說了句謝謝。那杯茶她喝得很慢，一滴也沒有剩下。',effect:s=>{s.flags.boughtYutingTea=true;s.memories.push('雨婷沒有剩下一滴的冬瓜茶')},next:'tabletalk'},
 ownorder:{text:'每個人各自點了東西。雨婷說自己不渴，只向老闆要了一杯白開水。\n\n佳穎把自己碗裡的蜜豆舀給她。\n\n「我不喜歡這個，妳幫我吃。」\n\n雨婷看了她一眼，沒有拆穿這個顯然臨時想出的理由。',effect:s=>s.flags.sawJiayingCare=true,next:'tabletalk'},
 tabletalk:{text:'一開始，話題只在老師和功課之間打轉。誰上課最容易睡著、數學老師一堂課能說幾次「所以」、教官的假髮究竟是不是真的。\n\n笑聲漸漸變得自然。窗外的公車一輛輛經過，桌上的冰也從小山融成一盤帶著水果顏色的水。\n\n沒有人注意時間。',next:'pianotalk'},
 pianotalk:{speaker:'李家豪',text:'「所以張佳穎，妳真的會彈鋼琴？」\n\n「什麼叫真的？我五歲就在學了好不好。」\n\n佳穎用湯匙在玻璃杯邊敲出一小段節奏。',choices:[['問她為什麼喜歡鋼琴','whypiano'],['開玩笑叫她下次表演','performpiano'],['說自己比較喜歡聽唱片','recordmusic']]},
 whypiano:{speaker:'張佳穎',text:'「一開始是我媽叫我學的。」\n\n她想了一會兒。\n\n「可是心情很亂的時候，坐下來彈完一首，會覺得那些事情好像被整理好了。雖然有時候越彈越亂啦。」\n\n她說到最後一句時，視線短暫地落在宇軒身上，又很快轉開。',effect:s=>{s.flags.knowsWhyPiano=true;s.memories.push('佳穎說琴聲能整理混亂的心情')},next:'familytable'},
 performpiano:{speaker:'陳宇軒',text:'「那妳下次在班上表演啊。」\n\n「可以啊，你先上去唱歌。」\n\n「為什麼是我？」\n\n「因為你看起來就很會唱走音。」\n\n佳穎笑得差點被冰嗆到。',effect:s=>s.flags.pianoTeasing=true,next:'familytable'},
 recordmusic:{speaker:'陳宇軒',text:'「我比較喜歡聽唱片。彈琴感覺很累。」\n\n「所以你喜歡什麼？」佳穎立刻問。\n\n宇軒第一次發現，她不是隨口找話題；他說出的歌手和歌曲，她都會認真記住。',effect:s=>{s.flags.talkedMusic=true;s.memories.push('第一次和佳穎交換喜歡的音樂')},next:'familytable'},
 familytable:{speaker:'張佳穎',text:'「我媽今天加班，我哥又待在研究室，所以我才可以在外面混這麼久。」\n\n她說得很自然，像家人忙碌只是生活中一件普通的小事。\n\n「妳哥念研究所？」宇軒問。\n\n「對啊，他最會念書了。但我媽沒有要我跟他一樣，她說我不要犯法就好。」\n\n家豪睜大眼睛。宇軒一時不知道，原來真的有父母會這樣說。',effect:s=>{s.flags.knowsJiayingFamilyOpen=true;s.memories.push('第一次知道不是所有父母都替孩子決定未來')},next:'yutingclock'},
 yutingclock:{text:'牆上的鐘走到四點二十分。雨婷看了第三次手錶，把書重新抱進懷裡。\n\n「我差不多要回去了。」\n\n佳穎問她要不要一起去唱片行，她仍然搖頭。\n\n「我爸今天會早點回家。我得先去買晚餐的菜。」',choices:[['問她爸爸從事什麼工作','askfatherjob'],['不追問，只問要不要陪她去車站','walkstation'],['提醒大家自己六點前也得回家','remembercurfew']]},
 askfatherjob:{speaker:'黃雨婷',text:'「在工地。」\n\n雨婷把牛皮紙袋的提繩纏在手指上。\n\n「他最近都在島南區那邊，很早出門，有時候很晚才回來。今天難得不用加班。」\n\n她說到父親時，聲音雖小，神情卻比平常安定。',effect:s=>{s.flags.knowsYutingFather=true;s.memories.push('雨婷提到父親難得不加班時的表情')},next:'leavestore'},
 walkstation:{speaker:'陳宇軒',text:'「我們也走了。一起到車站吧。」\n\n雨婷原本像是想說不用，佳穎已經站起來替她拿走一本書。\n\n「四個人走比較慢，妳的公車才會等妳。」\n\n這個道理完全說不通，雨婷卻笑了。',effect:s=>s.flags.walkedGroupToBus=true,next:'leavestore'},
 remembercurfew:{speaker:'陳宇軒',text:'「糟，我六點前也要到家。」\n\n「現在才四點多欸，媽寶。」佳穎說。\n\n「妳不懂。我家六點零一分跟半夜一樣嚴重。」\n\n家豪深有同感地點頭。只有雨婷笑得很小聲。',effect:s=>s.flags.talkedCurfew=true,next:'leavestore'},
 leavestore:{location:'島北市・榕樹商圈',bg:'linear-gradient(150deg,#937962,#646d68 50%,#3a4647)',text:'離開冰果室時，外面的陽光已經不再刺眼。商店騎樓被拉成一段一段的長影，唱片行開始把音樂放到門外，塑膠喇叭讓歌聲帶著輕微的破音。\n\n四個人走得很慢。不是因為路遠，而是星期六下午似乎沒有誰真正急著結束。',next:'bookreturn'},
 bookreturn:{speaker:'黃雨婷',text:'「宇軒。」\n\n到公車站前，雨婷從紙袋裡拿出一本書。\n\n「你昨天不是問這本好不好看嗎？我已經看完了，可以先借你。」\n\n牛皮紙書套被她包得很整齊，書脊上用鉛筆寫著作者名字。',choices:[['鄭重收下，答應看完還她','takebook'],['問她家裡是不是有很多書','asklibrary']]},
 takebook:{speaker:'陳宇軒',text:'「我會小心看。」\n\n「不用那麼緊張啦。」雨婷笑了一下，「書就是要翻才有用。」\n\n公車進站時掀起一陣熱風。她上車後仍站在窗邊，直到車子轉過街角才坐下。',effect:s=>{s.flags.borrowedYutingBook=true;s.items.push('雨婷借的小說');s.memories.push('雨婷包著牛皮紙書套的小說')},next:'numbernote'},
 asklibrary:{speaker:'黃雨婷',text:'「沒有很多。大部分是舊書攤買的，看完再換下一本。」\n\n她輕輕摸了摸書套。\n\n「這樣花一點點錢，就可以去很多沒去過的地方。」\n\n宇軒收下書，第一次覺得她所說的「很多地方」，也許和佳穎想像的不太一樣。',effect:s=>{s.flags.knowsYutingUsedBooks=true;s.items.push('雨婷借的小說');s.memories.push('雨婷說書能帶她去很多地方')},next:'numbernote'},
 numbernote:{location:'島北市・公車站',speaker:'張佳穎',text:'雨婷的公車開走後，佳穎忽然在紙袋裡翻找。她撕下唱片行收據的空白背面，借宇軒的筆寫下一串數字。\n\n「這我家電話。」\n\n她把紙遞過來時故意裝得很隨便。\n\n「下次家豪再遲到，你可以打來問我有沒有在路上看到他的屍體。」',choices:[['收進皮夾最裡層','keepnumber'],['笑她家的電話又找不到家豪','jokenumber'],['問她為什麼突然給自己電話','asknumber']]},
 keepnumber:{text:'宇軒把紙條對摺，收進皮夾透明夾層的最裡面。\n\n「幹嘛收那麼好？」\n\n「不然丟掉喔？」\n\n佳穎別開臉，假裝在看遠處的公車號碼。',effect:s=>{s.flags.hasJiayingPhone=true;s.items.push('寫著佳穎家電話的收據');s.memories.push('佳穎寫在唱片行收據背面的電話')},next:'walkapart'},
 jokenumber:{speaker:'陳宇軒',text:'「可是打妳家又找不到家豪。」\n\n「你真的很不會抓重點欸。」佳穎一把想搶回紙條。宇軒笑著舉高手，她踮起腳也搆不到。\n\n家豪站在旁邊看了半天。\n\n「所以到底關我什麼事？」',effect:s=>{s.flags.hasJiayingPhone=true;s.items.push('被佳穎揉皺的電話紙條');s.memories.push('佳穎第一次給自己的家裡電話')},next:'walkapart'},
 asknumber:{speaker:'陳宇軒',text:'「妳為什麼突然給我電話？」\n\n佳穎握著筆愣了一下。\n\n「同學之間有電話很正常吧？雨婷也有啊。」\n\n她把紙硬塞進宇軒手裡，語速忽然變快。\n\n「不要就還我。」\n\n宇軒還沒回答，她已經轉身往前走了。',effect:s=>{s.flags.hasJiayingPhone=true;s.flags.askedWhyNumber=true;s.items.push('寫著佳穎家電話的收據')},next:'walkapart'},
 walkapart:{location:'島北市・黃昏',bg:'linear-gradient(155deg,#8b715d,#5b6461 48%,#354043)',text:'下一班公車來以前，三個人沿著騎樓繼續走。\n\n到了十字路口，佳穎往東，家豪往西，宇軒則要搭車回北邊。沒有群組可以在回家後延續剛才的話題，也不會有人傳來「到家了」的訊息。\n\n他們只是在綠燈亮起時揮揮手，約好星期一學校見，然後各自走進不同方向的人群。',next:'bushome'},
 bushome:{location:'島北市公車・末排座位',text:'公車裡播放著司機自己的錄音帶。午後在冰果室聽過的旋律恰好再次出現，只是被引擎聲蓋去了一半。\n\n宇軒靠著微微震動的車窗，看商店招牌與路燈一盞盞向後退。口袋裡多了一本借來的小說、一張寫著電話的紙，還有許多他暫時不知道該怎麼命名的感覺。',next:'homeclock'},
 homeclock:{location:'島北市・陳家門口',text:'五點五十七分。\n\n宇軒在最後三分鐘趕回家。廚房傳來鍋鏟碰到鐵鍋的聲音，父親的皮鞋卻還沒有出現在玄關。\n\n他站在門外喘勻呼吸，才拿出鑰匙。',next:'nightbook'},
 nightbook:{location:'陳宇軒的房間・夜',bg:'linear-gradient(155deg,#5f5b54,#414947 52%,#272f31)',text:'洗完澡後，宇軒趴在床上翻開雨婷借他的小說。牛皮紙書套內側寫著一行很淡的名字：黃雨婷。\n\n讀到第三頁時，唱片行收據從皮夾裡滑了出來。佳穎的字比他想像中潦草，最後一個號碼還被她重描了兩次。\n\n桌上的電話就在客廳。現在打過去，好像太奇怪；完全不打，又不知道她為什麼特地給他。',choices:[['走到客廳，拿起電話','calljiayingnight'],['把紙條夾進小說，繼續讀','keepreading'],['先問妹妹女生給電話是什麼意思','asksistermeaning']]},
 calljiayingnight:{location:'陳家・客廳',text:'宇軒走到電話旁。父親還沒回來，母親在浴室洗衣服，水聲隔著門傳來。\n\n他把手指放進轉盤，先撥了第一個號碼，卻在轉盤回彈以前鬆手。\n\n最後，他只是拿著沒有聲音的聽筒站了一會兒，再輕輕掛回去。',effect:s=>{s.flags.almostCalledJiaying=true;s.memories.push('第一次想打給佳穎，卻沒有撥完的電話')},next:'ch2end'},
 keepreading:{text:'宇軒把紙條夾進小說第四頁。\n\n窗外偶爾有機車經過，燈光從窗簾縫隙掃過天花板。他努力把注意力放回故事，卻同一段讀了三次，還是不記得主角究竟說了什麼。',effect:s=>s.flags.numberInBook=true,next:'ch2end'},
 asksistermeaning:{speaker:'陳以晴',text:'「女生給你電話？」\n\n以晴放下色鉛筆，用一種難得看見哥哥出糗的表情盯著他。\n\n「可能是要跟你借作業吧。」\n\n她說完就低頭繼續畫，肩膀卻一直抖。\n\n宇軒過了幾秒才發現她在偷笑。',effect:s=>s.flags.askedSisterAboutNumber=true,next:'ch2end'},
 ch2end:{chapter:'第二章・完',date:'1988年9月10日｜星期六',location:'島北市・深夜',bg:'linear-gradient(155deg,#575651,#3d4645 52%,#252d2f)',text:'那一天沒有發生任何足以登上報紙的大事。\n\n只是四個剛認識不久的高中生，在一間普通的冰果室裡，共度了一個逐漸變暗的午後。\n\n許多年後，宇軒已經記不起四果冰究竟是什麼味道，也忘了回家那班公車的號碼。\n\n但他仍然記得，佳穎把電話寫在收據背面時，窗外剛好有一輛載滿學生的公車經過。\n\n那一瞬間的風，把她額前的頭髮吹得很亂。',next:'ch3title'},
 ch3title:{chapter:'第三章｜一通沒有準備好的電話',date:'1988年9月11日｜星期日',location:'島北市・陳家',bg:'linear-gradient(155deg,#6b6258,#46504d 52%,#2a3335)',text:'星期日傍晚，天空從陽台鐵窗的縫隙裡慢慢暗下來。\n\n巷口有人叫賣烤香腸，遠處寺廟的鐘聲混著電視新聞片頭，一起飄進沒有關緊的窗戶。\n\n客廳那支米白色電話整整一下午都沒有響過。宇軒卻已經從它旁邊經過了七次。',next:'phonepaper'},
 phonepaper:{text:'寫著佳穎家電話的收據被攤在國文課本裡。紙張折過兩次，中央留下淡白色的痕。\n\n宇軒早已把那串號碼背了起來，卻仍一次次拿出來確認，彷彿只要多看幾遍，就能順便知道電話接通後第一句該說什麼。',choices:[['現在就打，不要再想','callnow'],['先寫好要說的話','scriptcall'],['等晚一點再打','delaycall']]},
 callnow:{location:'陳家・客廳',text:'宇軒趁母親在廚房切菜，拿起聽筒。\n\n轉盤一格一格彈回原位，機械聲在安靜的客廳裡顯得格外清楚。最後一個號碼撥完後，他忽然希望對面沒有人接。',effect:s=>s.flags.calledWithoutPlan=true,next:'ringing'},
 scriptcall:{text:'宇軒撕下一張便條紙，認真寫下：\n\n一、問國文作文。\n二、問星期一要不要帶美術用品。\n三、不要讓她覺得很奇怪。\n\n寫到第三點時，他才發現那根本不是一句可以說出口的話。',effect:s=>{s.flags.wroteCallScript=true;s.items.push('寫著電話話題的便條紙')},next:'callfromroom'},
 callfromroom:{location:'陳家・客廳',text:'他把便條紙壓在電話旁，照著收據撥號。等待接通時，紙上的字像忽然全部失去意義。',next:'ringing'},
 delaycall:{text:'宇軒把紙條放回課本，告訴自己吃完晚飯再說。\n\n六點新聞結束，父親仍沒有回來。母親把最後一道菜端上桌；電話依舊安靜。\n\n七點十二分，他終於承認，再等下去只會更不敢打。',effect:s=>s.flags.delayedCall=true,next:'ringing'},
 ringing:{text:'第一聲。\n\n第二聲。\n\n第三聲。\n\n每一聲之間都隔得太久，久到宇軒足以想像十種掛斷電話的理由。\n\n第四聲還沒響完，聽筒另一端傳來一名成熟女性的聲音。',next:'zhangmother'},
 zhangmother:{speaker:'佳穎的母親',text:'「喂，張公館。」\n\n背景很安靜，隱約有杯盤輕碰的聲音。\n\n宇軒原本準備好的稱呼忽然全擠在喉嚨裡。',choices:[['「阿姨您好，請問佳穎在嗎？」','politecall'],['「呃……我找張佳穎。」','awkwardcall'],['一時緊張，沒有出聲','silentphone']]},
 politecall:{speaker:'陳宇軒',text:'「阿姨您好，請問佳穎在嗎？我是她同學，陳宇軒。」\n\n「宇軒啊，等一下喔。」\n\n對方語氣自然得像早就聽過這個名字。宇軒還來不及細想，聽筒已被輕輕擱在桌上。',effect:s=>s.flags.impressedMother=true,next:'waitingline'},
 awkwardcall:{speaker:'陳宇軒',text:'「呃……我找張佳穎。」\n\n「你是她同學嗎？」\n\n「對，我姓陳。」\n\n「好，稍等一下。」\n\n宇軒聽見自己的聲音乾得不像自己。',effect:s=>s.flags.awkwardWithMother=true,next:'waitingline'},
 silentphone:{speaker:'佳穎的母親',text:'「喂？哪位？」\n\n宇軒握著聽筒，差點真的掛掉。\n\n「阿姨您好……我找佳穎。」\n\n說出口後，他像跑完一段很長的樓梯，悄悄吐了一口氣。',effect:s=>s.flags.frozeOnPhone=true,next:'waitingline'},
 waitingline:{text:'遠處傳來女人喊「佳穎，妳同學」，接著是一陣由遠而近的腳步聲。\n\n等待的十幾秒裡，宇軒只能聽見張家客廳的時鐘、有人關上房門，以及聽筒被拿起前衣袖摩擦話筒的細響。',next:'jiayinghello'},
 jiayinghello:{speaker:'張佳穎',text:'「喂？」\n\n和平常隔著一張課桌聽見的聲音不同。電話裡的佳穎近得像就在耳邊，卻又看不見她的表情。\n\n「陳宇軒？」',choices:[['「妳怎麼知道是我？」','howknow'],['照便條紙問國文作業','askhomework'],['「沒事，只是試試看號碼對不對。」','numbertest']]},
 howknow:{speaker:'陳宇軒',text:'「妳怎麼知道是我？」\n\n「因為我媽剛剛說，一個講話很緊張、姓陳的男生找我。」\n\n「我哪有緊張？」\n\n佳穎的笑聲隔著電話線傳來，帶著一點細小的電流雜音。',effect:s=>s.flags.phoneLaugh=true,next:'firstsilence'},
 askhomework:{speaker:'陳宇軒',text:'「國文作文是星期一早自習前交，對吧？」\n\n「對啊。」\n\n「喔。」\n\n「……你打電話來，就問這個？」\n\n宇軒低頭看便條紙，第一個話題已經用完了。',effect:s=>s.flags.usedHomeworkExcuse=true,next:'firstsilence'},
 numbertest:{speaker:'陳宇軒',text:'「沒事，只是試試看妳有沒有寫錯號碼。」\n\n「那現在證明沒寫錯了，你可以掛了。」\n\n「喔，好。」\n\n「欸！你真的要掛喔？」\n\n佳穎自己先笑了出來。',effect:s=>s.flags.teasedOnPhone=true,next:'firstsilence'},
 firstsilence:{text:'笑聲停下後，兩端同時安靜。\n\n電話讓人不必面對面，卻也拿走了所有可以用來掩飾尷尬的東西。沒有窗外可以指，沒有同學經過，也不能假裝整理桌上的課本。\n\n只剩彼此的呼吸，和不知道該由誰接下去的空白。',next:'topicchoice'},
 topicchoice:{text:'客廳的時鐘又走了一格。電話線從桌邊垂下，輕輕碰著宇軒的膝蓋。\n\n他必須說點什麼，才不會讓這通好不容易撥出去的電話，就這樣停在沉默裡。',choices:[['問她新買的琴譜','talkscore'],['聊昨天冰果室的事','talkice'],['問雨婷是不是安全到家','talkyuting']]},
 talkscore:{speaker:'陳宇軒',text:'「妳昨天買的琴譜，是什麼歌？」\n\n佳穎的聲音立刻有了精神。她說起一首最近在廣播裡常播的曲子，還抱怨其中一段左手和弦很難。\n\n宇軒其實聽不懂，卻沒有打斷。她說話時，偶爾會用手指在電話旁的桌面敲出節拍。',effect:s=>{s.flags.heardPianoDetails=true;s.memories.push('電話裡佳穎用手指敲出的節拍')},next:'musicpause'},
 talkice:{speaker:'陳宇軒',text:'「昨天那盤冰，家豪吃掉一半吧。」\n\n「明明是你。而且你還把最後一顆櫻桃搶走。」\n\n兩個人為了一顆其實沒人記得歸誰的糖漬櫻桃爭了好幾分鐘。\n\n話題很無聊，卻讓剛才的沉默慢慢變得不再可怕。',effect:s=>s.flags.rememberedIceCall=true,next:'musicpause'},
 talkyuting:{speaker:'陳宇軒',text:'「雨婷昨天有趕上公車吧？」\n\n「有，她到家有打給我。」\n\n佳穎停了一下。\n\n「她不太喜歡麻煩別人。你如果發現她沒點東西，也不要直接問她是不是沒錢，她會很難堪。」\n\n宇軒輕聲答應。',effect:s=>{s.flags.jiayingProtectsYuting=true;s.memories.push('佳穎在電話裡保護雨婷的自尊')},next:'musicpause'},
 musicpause:{speaker:'張佳穎',text:'「你昨天說喜歡聽音樂，那你最喜歡哪一首？」\n\n宇軒靠著電話桌坐到地板上。這個問題沒有標準答案，他卻想了很久。\n\n兩人從一首歌聊到另一張錄音帶，又從歌詞聊到唱片封面。客廳時鐘的分針不知不覺走過半圈。',next:'whyphone'},
 whyphone:{speaker:'陳宇軒',text:'「佳穎。」\n\n「嗯？」\n\n「妳昨天為什麼只給我電話？」\n\n聽筒另一邊忽然傳來椅腳輕輕刮過地面的聲音。',choices:[['等她回答，不急著補話','waitanswer'],['馬上說自己只是隨便問問','retreatquestion']]},
 waitanswer:{speaker:'張佳穎',text:'「因為……」\n\n佳穎拖長了聲音。\n\n「家豪一定會把電話紙條弄丟，雨婷本來就知道我家號碼。剩下不就是你了？」\n\n答案很合理。她說完卻把話題轉得太快。',effect:s=>s.flags.askedPhoneReason=true,next:'motherinterrupt'},
 retreatquestion:{speaker:'陳宇軒',text:'「算了，我只是隨便問問。」\n\n「什麼叫隨便問問？」\n\n「就……同學之間有電話很正常啊。」\n\n他借用了她昨天說過的話。佳穎安靜了一瞬，低低笑了一聲。\n\n「對啊，很正常。」',effect:s=>s.flags.retreatedPhoneQuestion=true,next:'motherinterrupt'},
 motherinterrupt:{speaker:'媽媽',text:'「宇軒，電話講多久了？」\n\n母親的聲音從廚房傳來。宇軒連忙用手掌遮住話筒，卻知道佳穎一定已經聽見。\n\n「同學問功課啦！」\n\n電話那頭立刻傳來壓不住的笑聲。',next:'goodnightcall'},
 goodnightcall:{speaker:'張佳穎',text:'「那陳同學，謝謝你教我功課喔。」\n\n「明明是我打去問妳。」\n\n「星期一見啦。」\n\n掛斷以前，兩個人又同時說了一次「拜拜」，接著同時停住，誰也沒有先把聽筒放下。\n\n最後是一聲很輕的喀噠。線路回到漫長的空白音。',effect:s=>{s.flags.firstCallComplete=true;s.memories.push('第一次與佳穎講了很久的電話')},next:'aftercall'},
 aftercall:{text:'宇軒仍坐在電話桌旁。話筒已經掛好，耳朵裡卻像還留著她的聲音。\n\n便條紙上的三個話題，只用到第一個。第二、第三點被他的手汗暈開了一點。\n\n他回房躺下後才想到，電話裡可以靠沉默躲過去的事，明天到了教室，還是得面對面說早安。',next:'mondaybus'},
 mondaybus:{chapter:'第三章｜星期一',date:'1988年9月12日｜星期一',location:'島北市公車・上學途中',bg:'linear-gradient(150deg,#7a7669,#586963 50%,#354344)',text:'星期一早晨的公車比平常更擠。宇軒一手拉著吊環，一手護著書包，車窗上映出一張沒睡飽的臉。\n\n每停一站，他都在心裡演練一次見到佳穎時的樣子。說「早」太普通；提昨晚的電話又太刻意；什麼都不說，反而更像心虛。\n\n公車駛過學校圍牆時，他仍沒有想好。',next:'mondayclassroom'},
 mondayclassroom:{location:'島北高中・一年三班',text:'早自習前的教室充滿椅腳摩擦與抄作業的聲音。佳穎已經坐在位置上，低頭把一卷錄音帶放進透明塑膠盒。雨婷在她旁邊核對值日生表。\n\n宇軒走到自己的座位，把書包塞進桌肚。隔著兩排課桌，他們同時抬頭，又幾乎同時移開視線。\n\n昨晚隔著電話線聊到忘記時間的人，到了白天忽然又只是同班同學。',choices:[['主動走過去說早安','normalhello'],['先坐下整理課本','avoidhello'],['看向她手裡的錄音帶','waithello']]},
 normalhello:{speaker:'陳宇軒',text:'「早。」\n\n「早啊。」佳穎答得很快，接著把那卷錄音帶往桌面中央推了一點。\n\n「你昨天說想聽的那首歌，我剛好有錄到。可是前面有一小段被廣播主持人講話蓋住，你不准嫌。」\n\n她的語氣和平常一樣。宇軒心裡排練了一路的句子，忽然都用不上了。',effect:s=>s.flags.normalAfterCall=true,next:'tapegift'},
 avoidhello:{text:'宇軒先坐下，把國文、英文、數學課本依序疊好，連自己都覺得整理得太久。\n\n一本英文習作忽然落到他桌上。\n\n「陳宇軒，」佳穎站在旁邊，手裡還拿著錄音帶，「你打算假裝很忙到第幾節？」\n\n她沒有生氣，反而像在替兩人把那點莫名其妙的彆扭先笑掉。',effect:s=>s.flags.avoidedAfterCall=true,next:'tapegift'},
 waithello:{speaker:'陳宇軒',text:'「那是昨天說的歌？」\n\n佳穎低頭看了看錄音帶，像是等了好一會兒才等到這句。\n\n「對啊，我昨晚掛電話以後翻了半天。你不是說一直找不到？」\n\n她說著從鉛筆盒抽出一張小紙條，寫下歌名和歌手，字跡和收據背面的電話號碼一樣潦草。',effect:s=>s.flags.jiayingCalledFirst=true,next:'tapegift'},
 tapegift:{speaker:'張佳穎',text:'「先借你一個禮拜。B 面最後一首就是。」\n\n宇軒接過錄音帶。透明盒的一角有一道裂痕，裡面的標籤用藍筆寫滿曲名，最下面還多了一句：記得倒帶。\n\n「妳真的去找喔？」\n\n「不然咧？昨天是誰一直說想聽？」\n\n電話裡隨口說過的話，被她記到了第二天。這讓宇軒比接電話時更不知道該怎麼回答。',effect:s=>{s.flags.borrowedJiayingTape=true;s.items.push('佳穎借的錄音帶');s.memories.push('佳穎記得電話裡提過的那首歌')},next:'yutingarrives'},
 yutingarrives:{speaker:'黃雨婷',text:'「佳穎，值日生表要交了。」\n\n雨婷抱著點名簿走來，看見宇軒手裡的錄音帶，只停了一瞬。\n\n「妳昨天不是說找不到空白帶？」\n\n「這卷還能錄啦。」佳穎立刻把話接得很快，「而且只是借他。」\n\n雨婷點點頭，沒有追問；嘴角卻像知道什麼似的，輕輕彎了一下。',next:'jiahaoentry'},
 jiahaoentry:{speaker:'李家豪',text:'「借誰什麼？」\n\n家豪咬著飯糰從後門進來，制服襯衫有一邊還露在褲子外面。\n\n他伸手想拿錄音帶，佳穎先一步把他的手拍開。\n\n「不關你的事。你作文寫完了嗎？」\n\n「一大早就問這麼傷感情的問題幹嘛？」\n\n教室裡那點只屬於昨晚的尷尬，就這樣被飯糰的油蔥味和家豪的抱怨沖淡了。',next:'careerclass'},
 careerclass:{location:'島北高中・一年三班',speaker:'黃子芸',text:'第四節班會，黃子芸老師在黑板寫下「家庭與未來」。\n\n她沒有發志願調查表，只請每個人寫下父母從事的工作，以及自己是否想走同一條路。\n\n教室裡很快只剩原子筆劃過紙面的沙沙聲。',choices:[['照實寫父親是金融主管','writefather'],['只寫「公司職員」','hidefather'],['空著第二題，不寫未來','blankfuture']]},
 writefather:{text:'宇軒寫下「金融業主管」。那幾個字看起來體面、穩定，也像一條早已替他鋪好的路。\n\n第二題，他停了很久，最後寫下「不知道」。',effect:s=>s.flags.wroteFatherJob=true,next:'teachercollect'},
 hidefather:{text:'宇軒只寫了「公司職員」。\n\n父親每天穿西裝出門，很晚回家；至於他真正做什麼、為什麼總有忙不完的工作，宇軒其實沒有自己想像中了解。',effect:s=>s.flags.realizedFatherDistant=true,next:'teachercollect'},
 blankfuture:{text:'父親的職業很容易填。真正困難的是下面那一格。\n\n宇軒讓它保持空白。窗外的體育課哨音響了幾次，仍沒有任何答案從腦中出現。',effect:s=>s.flags.leftFutureBlank=true,next:'teachercollect'},
 teachercollect:{speaker:'黃子芸',text:'「我不是要替你們安排未來。」\n\n黃老師收起紙張。\n\n「我只是希望你們知道，父母的人生可以是參考，但不該是唯一答案。」\n\n教室後排，家豪低頭看著自己壓在課本下的棒球隊報名表。',effect:s=>s.flags.heardTeacherFuture=true,next:'afterclassphone'},
 afterclassphone:{location:'島北高中・放學後',speaker:'張佳穎',text:'「你昨天掛電話以後，有沒有被你媽罵？」\n\n放學鐘響後，佳穎一邊擦黑板一邊問。粉筆灰在夕陽裡慢慢飄落。',choices:[['承認母親一直追問是誰','admitquestions'],['說只是普通同學，沒什麼','ordinaryfriend'],['反問她媽媽有沒有問','askhermother']]},
 admitquestions:{speaker:'陳宇軒',text:'「她問了三次是哪個同學。」\n\n「那你怎麼說？」\n\n「作業股長。」\n\n佳穎轉過頭瞪他，臉上卻沾著一道自己沒發現的粉筆灰。',effect:s=>s.flags.toldMotherCadre=true,next:'chalkface'},
 ordinaryfriend:{speaker:'陳宇軒',text:'「我就說普通同學啊。」\n\n佳穎擦黑板的手停了一下。\n\n「喔，普通同學。」\n\n她把這四個字說得很輕，接著用力拍了兩下板擦。',effect:s=>s.flags.calledOrdinary=true,next:'chalkface'},
 askhermother:{speaker:'張佳穎',text:'「她只問你是不是上次幫我搬作業的人。」\n\n「妳有跟她提過我？」\n\n「就……聊天剛好講到啊。」\n\n佳穎背對他繼續擦黑板，耳朵卻慢慢紅了。',effect:s=>s.flags.mentionedAtJiayingHome=true,next:'chalkface'},
 chalkface:{speaker:'陳宇軒',text:'「妳臉上有粉筆灰。」\n\n「哪裡？」\n\n佳穎用手背亂擦，反而把灰抹得更開。宇軒指了指自己的左臉，她卻擦了右邊。\n\n最後雨婷看不下去，拿手帕替她擦掉。',effect:s=>s.memories.push('夕陽裡佳穎臉上的粉筆灰'),next:'returncall'},
 returncall:{location:'陳家・夜',text:'晚上八點零五分，家裡電話突然響了。\n\n母親接起後，只說了兩句便朝房間喊：\n\n「宇軒，女同學找你。」\n\n父親剛好坐在沙發上看報紙。報紙上緣緩慢降下來一點。',next:'jiayingcalls'},
 jiayingcalls:{speaker:'張佳穎',text:'「喂，普通同學。」\n\n佳穎的聲音帶著一點惡作劇得逞的笑意。\n\n「我只是要告訴你，明天第一節數學小考。免得你又說沒人通知。」\n\n這通電話只有三分鐘。宇軒掛斷後，卻第一次意識到——那串號碼不只讓他能找到她，她也能穿過整座城市找到他。',effect:s=>{s.flags.jiayingCalledHome=true;s.memories.push('佳穎第一次主動打來家裡')},next:'ch3end'},
 ch3end:{chapter:'第三章・完',date:'1988年9月12日｜星期一',location:'島北市・夜',bg:'linear-gradient(155deg,#5d5952,#404846 52%,#272f31)',text:'父親重新舉起報紙。母親在廚房關掉瓦斯。屋外有人騎著腳踏車經過，鈴聲在巷子裡留下一小段回音。\n\n宇軒回到房間，把佳穎的電話紙條從小說裡取出來。\n\n昨天以前，那只是一串數字。\n\n現在，它像是城市裡一扇剛剛被打開的門。',next:'ch4title'},
 ch4title:{chapter:'第四章｜照片裡的星期六',date:'1988年9月17日｜星期六',location:'島北高中・清晨',bg:'linear-gradient(150deg,#7e7666,#586861 50%,#344242)',text:'星期六早上七點二十分，島北高中比平日安靜。\n\n沒有升旗音樂，也沒有成排的腳踏車。操場草地覆著一層薄薄的露水，遠處司令台的影子還很長。\n\n今天是棒球隊的新生測驗。',next:'tryoutgate'},
 tryoutgate:{location:'島北高中・側門',text:'宇軒到側門時，家豪已經站在警衛室旁。\n\n他穿著國中留下的運動服，鞋帶重新綁過兩次，手裡那張報名表被仔細壓平，唯獨家長簽章仍舊空白。',choices:[['問他父親最後怎麼說','askfatherfinal'],['不提簽名，只陪他往球場走','walktryout'],['告訴他佳穎和雨婷也會來','tellfriendscome']]},
 askfatherfinal:{speaker:'李家豪',text:'「沒怎麼說。」\n\n家豪把表格摺回去。\n\n「他把筆放在桌上，叫我自己想清楚。可是沒簽跟不准有什麼不一樣？」\n\n清晨的風吹動警衛室前的旗繩，金屬扣一下下敲著旗桿。',effect:s=>s.flags.knowsUnsignedForm=true,next:'teacherarrives'},
 walktryout:{text:'宇軒沒有看那個空白的位置，只和家豪並肩往操場走。\n\n兩人的腳步踩過尚未乾透的跑道。家豪平常總有話說，今天卻一路沉默，只偶爾把手伸進口袋確認表格還在。',effect:s=>s.flags.silentWalkTryout=true,next:'teacherarrives'},
 tellfriendscome:{speaker:'陳宇軒',text:'「佳穎跟雨婷說等一下會來。」\n\n「她們來幹嘛？」\n\n「佳穎說要看你丟臉。」\n\n家豪笑了一聲。肩膀終於不像剛才繃得那麼緊。',effect:s=>s.flags.toldSupporters=true,next:'teacherarrives'},
 teacherarrives:{speaker:'黃子芸',text:'「你們兩個來得很早嘛。」\n\n黃老師從行政大樓方向走來，手裡拿著保溫杯和一疊資料。她不是棒球隊老師，今天也不需要值班。\n\n家豪看著她，一時說不出話。',next:'teacherknows'},
 teacherknows:{speaker:'黃子芸',text:'「報名表的事，我知道。」\n\n她沒有伸手拿表格。\n\n「我跟教練談過了。今天可以先參加測驗，但正式入隊以前，還是必須有家長同意。」\n\n「老師，妳為什麼要幫我？」家豪問。',choices:[['站在旁邊聽老師回答','listenTeacher'],['替家豪說因為他真的想打球','speakDream']]},
 listenTeacher:{speaker:'黃子芸',text:'「因為大人可以提醒你夢想有多困難，但不該連試一次的機會都拿走。」\n\n她說得很平靜，像這只是身為老師理所當然要做的事。\n\n家豪低頭把報名表交給她，手指微微發抖。',effect:s=>{s.flags.teacherHelpedTryout=true;s.memories.push('黃老師說不該拿走試一次的機會')},next:'fieldmorning'},
 speakDream:{speaker:'陳宇軒',text:'「因為他是真的想打球。」\n\n家豪轉頭看他。黃老師笑了笑。\n\n「那就不要只讓朋友替你說。」\n\n家豪沉默片刻，終於自己開口：\n\n「老師，我想參加。」',effect:s=>{s.flags.jiahaoSaidDream=true;s.memories.push('家豪第一次在老師面前說想打球')},next:'fieldmorning'},
 fieldmorning:{location:'島北高中・棒球場',bg:'linear-gradient(150deg,#8b8068,#637369 52%,#394847)',text:'球場的紅土剛灑過水，空氣裡有濕泥、青草和舊皮革混在一起的味道。\n\n十幾名新生沿著右外野線熱身。球落進手套的聲音一下一下散在空曠的校園裡。\n\n家豪領到一個褪色的號碼布：十七。',next:'girlsatfield'},
 girlsatfield:{speaker:'張佳穎',text:'「十七號！」\n\n佳穎的聲音從鐵網外傳來。她穿著淡色便服，脖子上掛著一台銀色傻瓜相機。雨婷站在旁邊，替兩人提著早餐店的紙袋。\n\n家豪回頭看了一眼，立刻假裝不認識她們。',choices:[['走過去叫佳穎小聲一點','quietJiaying'],['接過雨婷手裡的早餐','takeBreakfast'],['留在鐵網旁看家豪熱身','watchWarmup']]},
 quietJiaying:{speaker:'陳宇軒',text:'「妳小聲一點，他已經夠緊張了。」\n\n「我是在幫他加油欸。」\n\n佳穎把相機舉到眼前。快門喀嚓一聲，正好拍下家豪被滾地球穿過兩腿的瞬間。\n\n「這張一定要洗兩份。」',effect:s=>s.flags.jiayingEmbarrassingPhoto=true,next:'throwtest'},
 takeBreakfast:{speaker:'黃雨婷',text:'「佳穎怕你們沒吃，買了四個飯糰。」\n\n紙袋底部還溫熱，淡淡的油條和胡椒味滲出來。\n\n「是妳提醒她的吧？」宇軒問。\n\n雨婷沒有回答，只把其中一個塞到他手裡。',effect:s=>{s.flags.yutingBroughtBreakfast=true;s.memories.push('鐵網旁仍溫熱的飯糰')},next:'throwtest'},
 watchWarmup:{text:'宇軒站在鐵網旁。家豪做了幾次深呼吸，才把第一球傳出去。球路偏高，學長舉高手套才接住。\n\n第二球低了一點。第三球終於筆直鑽進胸前的手套。\n\n家豪沒有笑，只重新排回隊伍最後。',effect:s=>s.flags.watchedEveryThrow=true,next:'throwtest'},
 throwtest:{text:'第一項是傳球。\n\n家豪平常在公園隨手丟球時看起來毫不費力，真正站上測驗線後，動作卻像被許多看不見的繩子綁住。\n\n第一球偏右，第二球彈地。教練在名冊上寫了什麼。',choices:[['隔著鐵網喊他平常說的口頭禪','callCatchphrase'],['不出聲，只在他看來時點頭','nodSupport']]},
 callCatchphrase:{speaker:'陳宇軒',text:'「李家豪，不是說要當國手？」\n\n幾名新生回頭笑。家豪瞪了宇軒一眼，第三球卻終於放鬆地揮出手臂。\n\n白球筆直飛過紅土，被對面的手套牢牢接住。',effect:s=>s.flags.calledNationalDream=true,next:'battingtest'},
 nodSupport:{text:'家豪回頭看向鐵網外。宇軒沒有喊話，只朝他點了一下頭。\n\n那是國中三年裡兩人早已熟悉的訊號：別想太多，做你會做的事。\n\n第三球乾淨地落進手套。',effect:s=>s.flags.quietTryoutSupport=true,next:'battingtest'},
 battingtest:{text:'最後一項是打擊。\n\n家豪戴上尺寸稍大的頭盔，站進右打擊區。球棒在他手裡繞了一圈，鞋尖把紅土踩出兩道淺痕。\n\n教練拋出的第一球從外角進來。揮空。\n\n第二球，他又早了一點，只擦到球的下緣。',next:'beforethird'},
 beforethird:{text:'鐵網外忽然安靜。\n\n佳穎放下相機，雨婷雙手抓著紙袋提把。宇軒看見家豪重新握緊球棒，又慢慢鬆開。\n\n教練手腕往前一送，第三顆球朝本壘飛來。',next:'thirdswing'},
 thirdswing:{text:'球棒與白球相遇的聲音並不巨大，卻乾淨得讓人立刻知道打中了。\n\n球越過二壘手頭頂，在右外野草地彈了一次，又一路滾到牆邊。\n\n家豪跑過一壘後才想起這只是測驗。他停下腳步，回頭時終於笑了。',effect:s=>{s.flags.jiahaoGoodHit=true;s.memories.push('家豪第三次揮棒後滾向外野的白球')},next:'coachdecision'},
 coachdecision:{speaker:'棒球隊教練',text:'「李家豪。」\n\n測驗結束後，教練把他單獨叫到本壘後方。\n\n「動作很粗，沒受過正式訓練。但腳程、肩膀都不錯。」\n\n家豪站得筆直，連呼吸都放得很輕。',next:'conditionalplace'},
 conditionalplace:{speaker:'棒球隊教練',text:'「我可以先留你的位置。」\n\n教練把報名表還給他。\n\n「九月底以前，把家長簽名帶來。沒有簽名，我不能讓你正式練。」\n\n希望與那個空白欄位，同時被交回家豪手中。',effect:s=>s.flags.jiahaoConditionalPlace=true,next:'aftertryout'},
 aftertryout:{location:'島北高中・看台後方',text:'接近中午，太陽把水泥看台曬出乾燥的味道。四個人躲進看台後方的陰影，分掉已經冷掉的飯糰。\n\n家豪把號碼布放在膝上，反覆看著十七兩個字。\n\n「如果他還是不簽呢？」他問。',choices:[['說可以請黃老師陪他回家談','teacherVisit'],['告訴他至少現在知道自己選得上','heBelongs'],['不給答案，把最後一個飯糰遞給他','giveRiceball']]},
 teacherVisit:{speaker:'陳宇軒',text:'「黃老師不是願意幫你嗎？請她跟你爸談看看。」\n\n家豪搖頭。\n\n「我不想每次都靠別人。」\n\n雨婷輕聲說：「讓別人陪你，不一定代表你沒有自己面對。」',effect:s=>s.flags.suggestedTeacherVisit=true,next:'cameraidea'},
 heBelongs:{speaker:'陳宇軒',text:'「至少你現在知道，不是只有你自己覺得你可以。」\n\n家豪看向球場。學長們正在收拾球具，剛才那顆被他打到外野的球已混回整袋白球裡，再也分不出來。\n\n「嗯。」他說。這次沒有用笑聲帶過去。',effect:s=>{s.flags.toldJiahaoBelongs=true;s.memories.push('家豪知道自己真的能站上球場的中午')},next:'cameraidea'},
 giveRiceball:{text:'宇軒沒有回答。誰都知道一句「一定有辦法」不能讓空白處自己出現簽名。\n\n他把最後一個飯糰遞過去。家豪接下，拆開紙包，四個人一起聽著包裝紙在安靜看台下發出的聲音。',effect:s=>s.flags.sharedQuietAfterTryout=true,next:'cameraidea'},
 cameraidea:{speaker:'張佳穎',text:'「好啦，先拍一張。」\n\n佳穎站起來拍掉裙子上的灰，把銀色相機舉起。\n\n「今天至少有一件值得留下來的事。」\n\n家豪指著自己滿身紅土的運動服。\n\n「一定要現在？」',choices:[['請路過的學長替四人合照','groupPhoto'],['先替家豪單獨拍一張','jiahaoPortrait'],['說改天穿制服再拍','postponePhoto']]},
 groupPhoto:{text:'宇軒叫住一名正要離開的學長。佳穎把相機交給對方，再小跑步回到三人身邊。\n\n四個人站得有些生疏。家豪手裡拿著十七號碼布，雨婷仍抱著那兩本書。快門按下前一秒，佳穎忽然把手伸到宇軒頭頂，比出一個「YA」手勢。\n\n喀嚓。\n\n宇軒正要回頭，她已經笑著把手收了回去。於是他們的第一張合照，沒有任何人好好看著鏡頭。',effect:s=>{s.flags.firstGroupPhoto=true;s.memories.push('四個人沒有好好看鏡頭的第一張合照')},next:'walkfromschool'},
 jiahaoPortrait:{text:'佳穎讓家豪站到鐵網前，把號碼布舉在胸口。\n\n「不要笑得那麼假。」\n\n「我哪有？」\n\n就在家豪轉頭抱怨時，佳穎按下快門。照片裡留下的不是準備好的笑容，而是他剛剛真正打進球隊的那個上午。',effect:s=>{s.flags.jiahaoTryoutPhoto=true;s.memories.push('家豪拿著十七號碼布的照片')},next:'groupPhoto'},
 postponePhoto:{speaker:'陳宇軒',text:'「改天穿制服再拍啦。」\n\n「改天是哪一天？」佳穎問。\n\n宇軒答不出來。雨婷看看逐漸收空的球場，小聲說：「今天只有一次。」\n\n最後他們還是請路過的學長按下快門。',effect:s=>s.flags.yutingSaidTodayOnce=true,next:'groupPhoto'},
 walkfromschool:{location:'島北高中・校外坡道',bg:'linear-gradient(150deg,#95836a,#67736b 50%,#3c4948)',text:'離開學校時已過中午。陽光從行道樹葉間落下，在四人的衣服上忽明忽暗。\n\n家豪走在最前面，不時把手伸進口袋確認號碼布還在。佳穎跟著他，警告照片洗出來以前不准偷看。\n\n宇軒與雨婷落在後面半步。',next:'yutingbookmark'},
 yutingbookmark:{speaker:'黃雨婷',text:'「宇軒，書看到哪裡了？」\n\n「快一半。」\n\n雨婷從手裡那本書抽出一張自己做的書籤。厚紙板上用藍色原子筆畫著一扇窗。\n\n「這張先給你，不然你一直把佳穎的電話紙條夾在裡面，會掉。」',choices:[['收下書籤','takebookmark'],['問她怎麼知道電話紙條','howknowsnote']]},
 takebookmark:{speaker:'陳宇軒',text:'「謝謝。」\n\n宇軒把書籤夾進讀到的位置。窗戶畫得很小，裡面卻有一盞黃色的燈。\n\n「妳也會畫畫？」\n\n「不會。只是有時候讀完一本書，會想留一個記號。」',effect:s=>{s.flags.hasYutingBookmark=true;s.items.push('雨婷畫著窗戶的書籤');s.memories.push('雨婷送的窗戶書籤')},next:'oneweeklater'},
 howknowsnote:{speaker:'黃雨婷',text:'「上次在公車站，我有看到佳穎寫給你。」\n\n「她有跟妳說什麼嗎？」\n\n雨婷想了一下，只把書籤遞過來。\n\n「她如果希望我說，就不會只寫給你了。」\n\n她的語氣仍然很輕，卻讓宇軒沒有再追問。',effect:s=>{s.flags.yutingKeepsSecrets=true;s.items.push('雨婷畫著窗戶的書籤')},next:'oneweeklater'},
 oneweeklater:{date:'1988年9月23日｜星期五',location:'島北高中・一年三班',bg:'linear-gradient(150deg,#837565,#5d6964 52%,#384444)',text:'六天後，佳穎帶著洗好的照片來學校。\n\n底片沖洗店的紙袋被她藏在書包最底下，直到午休才神神祕祕地拿出來。照片帶著淡淡的藥水味，邊緣潔白而平整。',next:'photoresult'},
 photoresult:{speaker:'張佳穎',text:'「先說，不准笑攝影師。」\n\n第一張是家豪接漏滾地球；第二張只有半顆棒球；第三張被手指遮住一角。\n\n最後一張才是四人的合照。學長按下快門時似乎手抖了一下，畫面有些模糊；佳穎笑得最得意，手還停在宇軒頭頂，比著一個歪歪的「YA」。',choices:[['說這張很好看','goodphoto'],['抱怨自己根本沒看鏡頭','badpose'],['注意到雨婷笑得比平常明顯','noticeYutingSmile']]},
 goodphoto:{speaker:'陳宇軒',text:'「這張很好看啊。」\n\n「哪裡好看？都糊掉了。」\n\n「看得出來是我們就好。」\n\n佳穎低頭看著照片，沒有再嫌棄。',effect:s=>s.flags.likesImperfectPhoto=true,next:'photoCopies'},
 badpose:{speaker:'陳宇軒',text:'「我根本沒看鏡頭。」\n\n「誰叫你反應那麼慢。」\n\n佳穎指著自己比出的角笑了很久。多年以後，宇軒反而最常看照片裡那個沒有看鏡頭的自己。',effect:s=>s.flags.complainedPhoto=true,next:'photoCopies'},
 noticeYutingSmile:{text:'照片裡的雨婷沒有像平常那樣躲在別人身後。快門按下時，她正看著鬧成一團的三個人，笑得比鏡頭前任何一次都自然。\n\n宇軒第一次發現，有些人的快樂不是看著相機時才會出現。',effect:s=>{s.flags.noticedYutingSmile=true;s.memories.push('合照裡望著大家微笑的雨婷')},next:'photoCopies'},
 photoCopies:{speaker:'張佳穎',text:'「我只洗了一張合照。」\n\n佳穎把照片放在四張桌子中間。\n\n「先放誰那裡？」\n\n四個人互相看了一會兒。家豪說自己一定會弄丟，雨婷說家裡沒有相簿。最後，照片被推到宇軒面前。',next:'keepphoto'},
 keepphoto:{text:'宇軒把照片收進國文課本第一頁，正好壓在黃子芸老師開學時寫下的那句話旁邊：\n\n——你想成為什麼樣的人？\n\n照片裡的四個人都還不知道答案。\n\n甚至不知道，多年以後，彼此會走到多遠的地方。',effect:s=>{s.flags.keepsGroupPhoto=true;s.items.push('四人的第一張合照');s.memories.push('被收進國文課本的第一張合照')},next:'ch4end'},
 ch4end:{chapter:'第四章・完',date:'1988年9月23日｜星期五',location:'島北高中・午後',bg:'linear-gradient(155deg,#686159,#48514e 52%,#2b3435)',text:'午後上課鐘響起，四個人各自回到座位。\n\n窗外的風翻動國文課本，照片從書頁間露出一小角。宇軒伸手把它重新夾好。\n\n他以為自己只是在保管一張普通的照片。\n\n那時候的他還不知道，有一天，照片上的白色邊緣會變黃，家豪胸前的十七號會慢慢褪色，而其中一個人的笑容，會讓他在很多年後仍然不敢看得太久。',next:'ch5title'},

 ch5title:{chapter:'第五章｜家長簽章',date:'1988年9月24日｜星期六',location:'島北市・陳家',bg:'linear-gradient(155deg,#756b5e,#4d5853 52%,#2d3839)',text:'星期六上午十點四十分，家裡電話響了。\n\n母親正在陽台曬衣服，以晴趴在地板上畫圖。宇軒才剛拿起聽筒，家豪的聲音便從另一端撞了過來。\n\n和平常不同，他沒有先講一句廢話。',next:'jiahaocall'},
 jiahaocall:{speaker:'李家豪',text:'「你下午有沒有空？」\n\n「幹嘛？」\n\n電話那頭停了一會兒，只剩巷口車輛經過的聲音。\n\n「我爸說，今天晚上以前，要我自己跟他講清楚到底為什麼想進球隊。」\n\n家豪吸了一口氣。\n\n「你先陪我去老地方丟球，好不好？」',choices:[['立刻答應','agreepark'],['問他是不是想逃避','askescape'],['先問母親能不能出門','askpermission5']]},
 agreepark:{speaker:'陳宇軒',text:'「兩點，老地方。」\n\n「你不要遲到。」\n\n「每次遲到的明明是你。」\n\n家豪終於笑了一聲。那聲音很短，卻讓這通電話稍微像回了原來的樣子。',effect:s=>s.flags.agreedJiahaoImmediately=true,next:'preparepark'},
 askescape:{speaker:'陳宇軒',text:'「你是要練習怎麼講，還是根本不想回家？」\n\n「……都有吧。」\n\n家豪沒有像平常一樣反駁。\n\n「我怕我一看到他，就只會說『算了』。」\n\n宇軒看著纏在電話線上的手指，答應兩點去找他。',effect:s=>s.flags.jiahaoAdmittedFear=true,next:'preparepark'},
 askpermission5:{speaker:'媽媽',text:'「功課寫完了嗎？」\n\n宇軒用手掌遮住話筒，說家豪有重要的事。母親看了他幾秒，像是在判斷「重要」究竟有多重要。\n\n「六點以前回來。不要又讓我打電話找人。」\n\n宇軒對聽筒說：「兩點，老地方。」',effect:s=>s.flags.askedToHelpJiahao=true,next:'preparepark'},
 preparepark:{location:'陳宇軒的房間',text:'掛斷電話後，宇軒從衣櫃最上層翻出國中用過的手套。皮面乾得發白，掌心還留著某次接球磨出的刮痕。\n\n以晴蹲在門邊看他拍掉灰塵。\n\n「哥，你要去打球喔？」\n\n「陪一個很囉嗦的人想事情。」\n\n「那你帶手套幹嘛？」\n\n宇軒答不出來，只把球塞進口袋。',next:'oldpark'},
 oldpark:{location:'島北市・河堤公園',bg:'linear-gradient(150deg,#91816a,#68756c 50%,#3a4948)',text:'所謂的老地方，是國中旁那座河堤公園。\n\n籃框沒有網子，紅土空地的本壘是兩塊被踩平的紙板。以前放學後，他們總在這裡待到路燈亮起，才想起回家會被罵。\n\n家豪已經站在那裡，一顆舊棒球不斷從手套拋起、落下。',next:'firstcatch5'},
 firstcatch5:{text:'兩人隔著十幾公尺傳球。\n\n一開始誰也沒提簽名。球從宇軒手裡飛出去，落進家豪手套；再從家豪那裡飛回來。乾燥的皮革聲規律地填滿午後。\n\n家豪越丟越用力，像是只要球夠快，腦子裡那些話就追不上他。',choices:[['叫他先停下來','stopthrowing'],['繼續陪他丟到他開口','keepcatching'],['問他最怕父親說什麼','askworst']]},
 stopthrowing:{speaker:'陳宇軒',text:'「夠了，再丟下去我手要斷了。」\n\n家豪接住最後一球，站在原地喘氣。\n\n「我不是怕他罵。」他低頭看著手套，「我怕他說的其實是對的。」',effect:s=>s.flags.stoppedJiahaoSpiraling=true,next:'fearfuture'},
 keepcatching:{text:'宇軒沒有催他。\n\n直到家豪連續三球都偏到同一側，才自己垂下手。\n\n「如果我最後真的打不出來，」他說，「他是不是一輩子都可以說，你看吧，我早就知道？」',effect:s=>s.flags.waitedForJiahao=true,next:'fearfuture'},
 askworst:{speaker:'陳宇軒',text:'「你最怕你爸說什麼？」\n\n家豪把球握在掌心，很久沒有丟回來。\n\n「不是怕他說什麼。」\n\n他抬頭看向河堤外一排灰色屋頂。\n\n「我是怕有一天，我也會覺得自己當初很蠢。」',effect:s=>s.flags.askedJiahaoFear=true,next:'fearfuture'},
 fearfuture:{speaker:'李家豪',text:'「大家都說念書比較穩。可是我一坐在書桌前，就只會一直看時鐘。」\n\n「打球的時候不一樣。我知道下一球要做什麼。就算打不好，也知道要練哪裡。」\n\n他看著手裡那顆磨舊的球。\n\n「這是我第一次覺得，自己可能真的有一件做得到的事。」',effect:s=>{s.flags.heardJiahaoReason=true;s.memories.push('家豪說打球時知道下一球要做什麼')},next:'walkjiahaohome'},
 walkjiahaohome:{location:'島北市・家豪家巷口',bg:'linear-gradient(155deg,#7b7061,#535b56 52%,#303a3a)',text:'傍晚五點，兩人沿著河堤走回住宅區。\n\n雜貨店正在收門口的汽水箱，樓上住戶把洗好的衣服一件件夾上竹竿。家豪家的窗戶就在巷子深處，鐵窗後亮著日光燈。\n\n到了樓梯口，他停下來，鞋尖磨著水泥地。',choices:[['陪他上樓','goupstairs'],['告訴他自己在樓下等','waitdownstairs'],['再問一次他確定嗎','confirmtalk']]},
 goupstairs:{speaker:'陳宇軒',text:'「我陪你上去，但話你自己講。」\n\n家豪看了他一眼，點點頭。\n\n樓梯間有晚飯油煙和線香混在一起的味道。每往上一階，家豪的腳步就慢一點。',effect:s=>s.flags.wentInsideJiahaoHome=true,next:'jiahaolivingroom'},
 waitdownstairs:{speaker:'陳宇軒',text:'「我在樓下。你講完再下來。」\n\n家豪走上兩階，又回頭。\n\n「如果我半小時沒下來？」\n\n「我就去雜貨店買汽水，不會救你。」\n\n家豪罵了一句，卻笑了。他轉身上樓，幾分鐘後又探頭叫宇軒上去——他父親想見見這個陪他測驗的同學。',effect:s=>s.flags.waitedOutsideJiahaoHome=true,next:'jiahaolivingroom'},
 confirmtalk:{speaker:'陳宇軒',text:'「你確定今天要講？」\n\n家豪看著三樓那扇亮著的窗。\n\n「不確定。」\n\n他把棒球塞回手套。\n\n「可是月底不會因為我還沒準備好就晚一點來。」\n\n說完，他先踏上樓梯。',effect:s=>s.flags.jiahaoChoseToTalk=true,next:'jiahaolivingroom'},
 jiahaolivingroom:{location:'李家・客廳',text:'家豪的父親坐在矮桌旁，面前放著那張棒球隊報名表。電視播著晚間新聞，音量被轉得很小。\n\n他沒有宇軒想像中那麼生氣，只是顯得很累。工作服袖口捲到手肘，手背上有幾道洗不掉的黑色油痕。\n\n「你就是陳同學？」他問。',next:'fatherquestion'},
 fatherquestion:{speaker:'家豪的父親',text:'「聽說你也陪他去測驗。」\n\n宇軒點頭。\n\n「那你告訴我，他是認真的，還是跟以前一樣，想到什麼就做兩天？」\n\n家豪立刻抬起頭。\n\n「爸，這是我要講的，不是問他。」',choices:[['如實說家豪也會害怕','honestfather'],['說教練認為他有能力','coachproof'],['讓家豪自己回答','letjiahaoanswer']]},
 honestfather:{speaker:'陳宇軒',text:'「他是認真的。」\n\n宇軒停了一下。\n\n「可是他也很怕。怕自己打不好，也怕您說的是對的。要是只是玩玩，他應該不會怕成這樣。」\n\n家豪沒有看他，只把兩手緊緊壓在膝上。',effect:s=>s.flags.toldFatherJiahaoFear=true,next:'jiahaospeaks'},
 coachproof:{speaker:'陳宇軒',text:'「教練說他沒受過訓練，可是腳程和肩膀都很好，願意先留位置。」\n\n家豪的父親看向兒子。\n\n「所以有人說你可以，你就覺得一定可以？」\n\n家豪搖頭。\n\n「不是一定可以。是我想知道自己可以走到哪裡。」',effect:s=>s.flags.gaveCoachEvidence=true,next:'jiahaospeaks'},
 letjiahaoanswer:{text:'宇軒沒有替他回答，只看向家豪。\n\n客廳裡安靜得能聽見新聞主播翻稿的聲音。\n\n家豪起初皺了皺眉，像在怪宇軒不幫忙。過了一會兒，他才把視線轉回父親。\n\n「我是認真的。」',effect:s=>s.flags.letJiahaoSpeakForSelf=true,next:'jiahaospeaks'},
 jiahaospeaks:{speaker:'李家豪',text:'「我知道打球不一定有出路，也知道我可能連正式比賽都上不了。」\n\n他的聲音沒有在公園裡說夢想時那麼大。\n\n「可是我不想連失敗都只是聽你說。我想自己試過，再決定是不是不行。」\n\n父親望著他，很久沒有說話。',next:'fatherpast'},
 fatherpast:{speaker:'家豪的父親',text:'「我不是看不起打球。」\n\n他把報名表轉了半圈，指尖停在空白的簽章欄。\n\n「我是怕你把喜歡當成容易。喜歡一件事，沒有比較輕鬆。別人在念書的時候你要練，別人在休息的時候你也要練；最後還可能什麼都沒有。」\n\n「這些你想過沒有？」',choices:[['看向家豪，等他回答','lookjiahao'],['想起黃老師說過的話','rememberteacher']]},
 lookjiahao:{speaker:'李家豪',text:'「沒有全部想過。」\n\n家豪老實地說。\n\n「可是我可以一邊做、一邊想。我不會因為你簽了，就把以後都怪你。」\n\n那句話說得不漂亮，卻是他今天最像自己的回答。',effect:s=>s.flags.jiahaoOwnedChoice=true,next:'signaturemoment'},
 rememberteacher:{text:'宇軒想起黃老師說過：大人可以提醒夢想有多困難，但不該連試一次的機會都拿走。\n\n家豪似乎也想到了同一句話。\n\n「我不敢保證會成功，」他說，「但我可以保證，不會假裝這條路是你替我選的。」',effect:s=>s.flags.teacherWordsReturned=true,next:'signaturemoment'},
 signaturemoment:{text:'家豪的父親拿起桌上的原子筆。\n\n筆尖在紙面停了幾秒，才慢慢寫下姓名。最後一筆劃得很重，薄薄的報名表在桌上留下凹痕。\n\n他沒有把紙立刻交出去，只用手掌壓著。',next:'conditionsign'},
 conditionsign:{speaker:'家豪的父親',text:'「先一學期。」\n\n「功課不能全部丟掉，該做的家事照做。真撐不下去，要自己去跟教練說，不能一句沒興趣了就躲起來。」\n\n家豪盯著簽名，好像那幾個字比測驗時飛向外野的球更不真實。\n\n「好。」他說。',effect:s=>{s.flags.jiahaoFormSigned=true;s.memories.push('家豪父親終於落在報名表上的簽名')},next:'leavejiahao'},
 leavejiahao:{location:'李家・樓梯間',text:'走出客廳時，天色已經全暗。\n\n家豪把報名表收進透明資料夾，又隔著塑膠摸了一次簽名。直到走下最後一階，他才突然用肩膀撞了宇軒一下。\n\n「你剛剛講我很怕是什麼意思？」',choices:[['笑他本來就怕得要死','teasefear'],['說至少他還是講完了','praisetalk'],['提醒他請客吃麵','asktreat']]},
 teasefear:{speaker:'陳宇軒',text:'「你本來就怕得要死。」\n\n「我那是尊重長輩。」\n\n「你在公園差點把我手套打穿也是尊重？」\n\n兩人的聲音在樓梯間反彈。樓上傳來父親咳了一聲，他們立刻壓低笑聲跑出門。',effect:s=>s.flags.teasedAfterSignature=true,next:'noodleshop5'},
 praisetalk:{speaker:'陳宇軒',text:'「可是你還是講完了。」\n\n家豪沉默兩步，把資料夾抱得更緊。\n\n「嗯。」\n\n他沒有說謝謝。從國中到現在，真正重要的話，他們很少直接說。',effect:s=>s.flags.praisedJiahaoCourage=true,next:'noodleshop5'},
 asktreat:{speaker:'陳宇軒',text:'「所以你是不是該請我吃麵？」\n\n「憑什麼？」\n\n「精神損失。」\n\n「我只有三十五塊，你不要太過分。」\n\n最後兩人把口袋裡的零錢全倒出來，剛好夠點兩碗最便宜的陽春麵。',effect:s=>s.flags.sharedNoodleMoney=true,next:'noodleshop5'},
 noodleshop5:{location:'島北市・巷口麵攤',bg:'linear-gradient(155deg,#806d58,#4f5550 54%,#2e3637)',text:'麵攤的燈泡招來幾隻小飛蟲。老闆把兩碗麵放下，熱氣在兩人中間升起，把對面的臉弄得一陣模糊。\n\n家豪把報名表平放在旁邊空椅上，避開醬油和湯汁。\n\n「星期一交出去以後，我就真的要每天練了。」\n\n他語氣裡第一次同時有高興和害怕。',next:'tellfriends5'},
 tellfriends5:{speaker:'李家豪',text:'「佳穎她們知道了，應該會笑得很吵吧。」\n\n「你可以星期一自己講。」\n\n「不要。太肉麻了。」\n\n「那我講。」\n\n「也不要！」\n\n家豪伸手要搶宇軒筷子。報名表在旁邊輕輕滑了一下，兩個人同時停住，連忙把它扶好。',next:'ch5end'},
 ch5end:{chapter:'第五章・完',date:'1988年9月24日｜星期六',location:'島北市・夜',bg:'linear-gradient(155deg,#645a50,#414a47 54%,#273031)',text:'回家以前，宇軒陪家豪走到公車站。\n\n末班車還沒來，整條街只有麵攤收碗的聲音。透明資料夾裡，墨水早已乾了；家豪卻仍小心地用兩隻手拿著。\n\n他們那時還不明白，一個簽名並不能保證夢想會實現。\n\n它只是讓一個十六歲的少年，終於得到親自失敗、也親自成功的資格。',next:'ch6title'},

 ch6title:{chapter:'第六章｜雨聲裡的琴',date:'1988年10月8日｜星期六',location:'島北市・張家',bg:'linear-gradient(150deg,#6f7068,#53615d 50%,#303c3e)',text:'十月的第一場長雨，從星期六中午開始。\n\n雨水沿著公寓遮雨棚一層層落下，把巷子裡的機車、招牌與行人都洗成模糊的顏色。\n\n宇軒站在張家門外，手裡提著從學校借來的壁報紙。這是他第一次到佳穎家。',next:'zhangdoor'},
 zhangdoor:{text:'門鈴按下後，屋裡先傳來一小段鋼琴聲。旋律停在半句，接著是拖鞋急急踩過地板的聲音。\n\n門一打開，佳穎穿著寬鬆的淺色上衣，頭髮隨便綁在腦後，和學校裡總是整整齊齊的樣子有些不同。\n\n「你真的準時欸。」',choices:[['把壁報紙交給她','handpaper'],['問雨婷和家豪到了沒','askfriends6'],['說剛才在門外聽見琴聲','mentionpiano6']]},
 handpaper:{speaker:'陳宇軒',text:'「黃老師叫我帶這個。」\n\n佳穎接過捲筒，雨傘上的水正好滴在她腳邊。\n\n「先進來啦，你要把走廊淹掉喔？」\n\n她拿來一條乾毛巾，動作自然得讓宇軒反而站得更僵。',effect:s=>s.flags.firstAtJiayingHome=true,next:'zhanghome'},
 askfriends6:{speaker:'張佳穎',text:'「雨婷在裡面。家豪練球，說結束再來。」\n\n她看了一眼屋外越下越密的雨。\n\n「如果他沒被沖走的話。」\n\n宇軒收起雨傘，跟著她走進玄關。',effect:s=>s.flags.askedForFriendsAtZhang=true,next:'zhanghome'},
 mentionpiano6:{speaker:'陳宇軒',text:'「妳剛才在彈琴？」\n\n「你有聽到？」\n\n佳穎下意識回頭看向客廳，像是被撞見一件不該讓人知道的小事。\n\n「只是等你們的時候亂彈。先進來啦。」',effect:s=>s.flags.heardPianoOutside=true,next:'zhanghome'},
 zhanghome:{location:'張家・客廳',text:'張家的客廳比宇軒家明亮。米色沙發旁擺著一盆葉子很大的植物，牆上的木櫃收著唱片、旅遊照片和幾本外文雜誌。\n\n靠近窗邊的位置放著一架深褐色直立鋼琴。琴蓋沒有闔上，譜架上的紙被風翻起一角。\n\n雨婷坐在餐桌旁剪標題字，看見宇軒，只朝他輕輕揮手。',next:'jiayingmother6'},
 jiayingmother6:{speaker:'佳穎的母親',text:'「你就是宇軒吧？」\n\n那個曾在電話裡說「張公館」的聲音從走廊傳來。佳穎的母親穿著整齊的套裝，手裡還拿著公事包。\n\n「你們慢慢做。冰箱有飲料，餓了叫佳穎負責。」\n\n「媽，為什麼是我？」\n\n「因為是妳邀同學來的呀。」',choices:[['禮貌打招呼','greetmother6'],['想起電話裡緊張的自己','remembercall6']]},
 greetmother6:{speaker:'陳宇軒',text:'「阿姨好。」\n\n「不用那麼緊張，上次電話裡已經很有禮貌了。」\n\n佳穎在旁邊立刻笑出聲。宇軒這才知道，那次短短幾句話顯然被記到了今天。',effect:s=>s.flags.metJiayingMother=true,next:'motherleaves6'},
 remembercall6:{text:'宇軒立刻認出那個聲音，也想起自己第一次打來時，差點握著聽筒一句話都說不出來。\n\n佳穎像看懂了他的表情，湊近小聲說：「放心，我媽沒有把你列進可疑人物。」',effect:s=>s.flags.rememberedFirstCallAtHome=true,next:'motherleaves6'},
 motherleaves6:{speaker:'佳穎的母親',text:'「公司臨時有事，我晚餐前回來。」\n\n她對佳穎說完，又停下來補了一句：\n\n「壁報做不完沒關係，別因為招待同學，把自己弄得更忙。」\n\n門闔上後，宇軒忍不住看向佳穎。\n\n「妳媽不會先問功課做完沒喔？」',next:'familydifference6'},
 familydifference6:{speaker:'張佳穎',text:'「她會問啊，可是不會每件事都替我排好。」\n\n佳穎把公事包留下的椅子推回桌下。\n\n「我說想學琴，她就讓我學；哪天不想學，也可以自己跟老師講。她只說，選了以後要知道自己為什麼選。」\n\n宇軒第一次清楚感覺到，原來別人的家裡，連『關心』都可以有完全不同的樣子。',effect:s=>{s.flags.knowsJiayingFamilyOpen=true;s.memories.push('張家不替佳穎決定每一步的家庭氣氛')},next:'brother6'},
 brother6:{speaker:'佳穎的哥哥',text:'「妳最好不要把媽講得太完美，她昨天還管我論文寫到第幾頁。」\n\n一名戴眼鏡的年輕人從房間走出來，懷裡夾著厚厚一疊資料。\n\n「我是她哥。你們繼續，我只是出來找咖啡。」\n\n佳穎毫不客氣地指著廚房：「研究生自己泡。」',effect:s=>{s.flags.metJiayingBrother=true;s.flags.knowsJiayingFamilyOpen=true},next:'posterwork6'},
 posterwork6:{location:'張家・餐桌',text:'下午兩點半，壁報紙攤滿整張餐桌。\n\n雨婷負責把訪談內容謄成整齊的字；宇軒裁照片，剪刀沿著白邊慢慢前進；佳穎跪坐在椅子上排版，每隔幾分鐘便推翻自己剛才的安排。\n\n收音機播完一面錄音帶，喀地停住。屋裡突然只剩雨聲。',choices:[['起身替錄音帶翻面','flipradio6'],['專心把照片剪齊','cutphotos6'],['看向窗邊的鋼琴','lookpiano6']]},
 flipradio6:{text:'宇軒走去按下退帶鍵。錄音帶從機器裡彈出時，他才發現正是佳穎前陣子借給自己的那卷。\n\n「妳又把它錄過了？」\n\n「沒有，後面多加一首而已。」她頭也沒抬，「你上次說喜歡。」',effect:s=>s.flags.jiayingAddedSong=true,next:'workpause6'},
 cutphotos6:{text:'宇軒把最後一張照片的白邊剪齊。照片裡是教室窗邊幾張空桌，沒有任何人，卻因午後斜進來的光顯得很好看。\n\n「這張誰拍的？」\n\n「佳穎。」雨婷說。\n\n「她很常拍一些別人覺得沒什麼的東西。」',effect:s=>s.flags.noticedJiayingPhotos=true,next:'workpause6'},
 lookpiano6:{text:'鋼琴表面映著窗外灰白的天空。琴鍵上方擺著一只節拍器，細長的擺桿停在正中央。\n\n琴譜邊緣密密麻麻寫著指法，幾個總是彈錯的地方被鉛筆圈了又圈。\n\n這不像佳穎平常給人的輕鬆。那上面全是她不肯讓別人看見的反覆練習。',effect:s=>s.flags.sawJiayingPracticeMarks=true,next:'workpause6'},
 workpause6:{speaker:'黃雨婷',text:'「剩下標題，星期一再貼也來得及。」\n\n雨婷放下原子筆，揉了揉寫得發紅的手指。佳穎立刻把桌上的紙往旁邊一推。\n\n「休息。誰再碰壁報誰請客。」\n\n屋外一陣更大的雨打在遮雨棚上，琴譜被穿堂風翻過一頁。',next:'askpiano6'},
 askpiano6:{speaker:'張佳穎',text:'「你一直看琴幹嘛？」\n\n「沒有啊。」\n\n「明明就有。」\n\n佳穎走到鋼琴前，把被風吹亂的譜重新壓好。手指搭上琴蓋，卻沒有立刻掀開。',choices:[['請她彈電話裡提過的那首歌','requestphonesong6'],['說想聽她最喜歡的曲子','requestfavorite6'],['不勉強，等她自己決定','dontpush6']]},
 requestphonesong6:{speaker:'陳宇軒',text:'「電話裡妳說左手很難的那首，可以彈嗎？」\n\n佳穎看了他一眼。\n\n「你居然記得。」\n\n她嘴上像在嫌棄，手卻已經把琴椅往後拉了一點。',effect:s=>s.flags.rememberedPianoSong=true,next:'pianoseat6'},
 requestfavorite6:{speaker:'陳宇軒',text:'「彈妳自己最喜歡的。」\n\n「這個問題很難欸。」\n\n佳穎翻了幾頁琴譜，最後又翻回最前面。\n\n「那就彈我最近最想把它彈好的。」',effect:s=>s.flags.askedJiayingFavorite=true,next:'pianoseat6'},
 dontpush6:{speaker:'陳宇軒',text:'「不想彈也沒關係。」\n\n「誰說我不想？」\n\n佳穎瞪了他一眼，像是反而被這句話激到。\n\n「只是你們等一下不准講話，也不准笑我彈錯。」',effect:s=>s.flags.didNotPressurePiano=true,next:'pianoseat6'},
 pianoseat6:{text:'佳穎在琴椅坐下，把鬆掉的頭髮重新束好。\n\n她先沒有彈，只調整椅子的距離，又把裙擺壓平。平常說話時總停不下來的手，此刻安靜地懸在黑白琴鍵上。\n\n雨婷把收音機的停止鍵按下。連冰箱運轉的低鳴都像退到了很遠的地方。',next:'firstnotes6'},
 firstnotes6:{text:'第一個音落下時很輕，幾乎被窗外的雨吞掉。\n\n接著第二個、第三個音慢慢跟上。右手的旋律像雨水沿玻璃留下的細線，左手的和弦則沉在下面，一次次托住差點散開的聲音。\n\n延音踏板被踩下，琴弦在木頭深處微微震動。整間客廳像忽然有了比牆壁更遠的地方。',next:'pianomiddle6'},
 pianomiddle6:{text:'佳穎沒有看任何人。\n\n她跟著節拍輕輕呼吸，肩膀不再像剛坐下時那麼緊。幾個音從指縫間滑過，有一處比譜上慢了半拍，她皺了一下眉，卻沒有停。\n\n那首曲子並不炫技。它只是反覆回到同一段旋律，每次回來，都像多帶了一點說不出口的遺憾。',choices:[['閉上眼睛聽','closeeyes6'],['看著她彈琴時的側臉','watchjiaying6'],['注意雨婷的反應','watchyuting6']]},
 closeeyes6:{text:'宇軒閉上眼睛。\n\n雨聲、琴聲和遠處偶爾經過的車聲混在一起。他想起電話裡佳穎用手指敲桌面的節拍，原來那些斷斷續續的聲音，真正連起來是這個樣子。\n\n他第一次覺得，一個人的興趣也許不是資料欄裡的一行字，而是一個只有靠近以後才進得去的房間。',effect:s=>{s.flags.feltJiayingPiano=true;s.memories.push('雨聲與琴聲混在一起的張家午後')},next:'pianoending6'},
 watchjiaying6:{text:'午後的灰光落在佳穎側臉。她低頭看譜時，額前幾縷沒綁好的頭髮跟著動作輕晃。\n\n宇軒從沒看過她這麼安靜。不是上課被老師點名時的安靜，也不是電話裡不知道接什麼話的沉默。\n\n那是一種知道自己正在做什麼，所以不需要向任何人解釋的專注。',effect:s=>{s.flags.watchedJiayingPlay=true;s.memories.push('佳穎在灰色午後彈琴的側臉')},next:'pianoending6'},
 watchyuting6:{text:'雨婷坐在餐桌旁，兩手安靜地放在膝上。她沒有盯著琴鍵，而是望著窗外。\n\n旋律走到較慢的一段時，她眼裡短暫浮起一點水光，又很快眨掉。\n\n宇軒沒有問她想起了什麼。有些感受被音樂碰到時，並不一定需要名字。',effect:s=>{s.flags.sawYutingMovedByPiano=true;s.memories.push('雨婷聽琴時沒有被問出口的心事')},next:'pianoending6'},
 pianoending6:{text:'最後一個和弦落下後，佳穎的手仍停在琴鍵上。\n\n延音沒有立刻消失。它在客廳裡慢慢變淡，直到只剩窗簷滴水，一聲一聲落進樓下的鐵桶。\n\n沒有人馬上說話。佳穎轉過頭，原本認真的神情先鬆了一點，接著才恢復成平常那個像什麼都不在乎的笑。',next:'afterpiano6'},
 afterpiano6:{speaker:'張佳穎',text:'「怎樣？很普通吧。」\n\n她說得太快，像是先替所有可能的評價留好退路。',choices:[['說自己聽見了電話裡的節拍','heardrhythm6'],['說中間有一段讓人捨不得結束','dontend6'],['坦白自己不懂琴但很喜歡','honestmusic6']]},
 heardrhythm6:{speaker:'陳宇軒',text:'「我有聽到妳那天在電話裡敲的節拍。」\n\n佳穎愣了一下，低頭看著自己的手。\n\n「原來電話那麼小聲，你還真的有在聽喔。」\n\n她沒有再說普通，只用食指輕輕按下一個單音。',effect:s=>s.flags.toldJiayingHeListened=true,next:'whypiano6'},
 dontend6:{speaker:'陳宇軒',text:'「中間有一段，我希望它不要那麼快彈完。」\n\n佳穎看著他，像是在確認這句話是不是玩笑。\n\n「那一段我最常彈錯。」她最後說。\n\n「可是剛才沒有停。」\n\n佳穎笑了一下，比平常安靜。',effect:s=>s.flags.praisedPianoEmotion=true,next:'whypiano6'},
 honestmusic6:{speaker:'陳宇軒',text:'「我不懂哪裡難，也不知道妳有沒有彈錯。」\n\n宇軒把話說完。\n\n「可是我很喜歡。」\n\n佳穎盯著他兩秒，忽然轉回琴譜。\n\n「你這種評論最狡猾，害我沒辦法反駁。」',effect:s=>s.flags.honestAboutPiano=true,next:'whypiano6'},
 whypiano6:{speaker:'陳宇軒',text:'「妳為什麼喜歡彈琴？」\n\n佳穎把琴蓋半闔，手指沿著木頭邊緣慢慢滑過。\n\n「因為有些時候腦子很吵，可是彈琴的時候，每一秒要做什麼都很清楚。」\n\n她想了想，又補了一句：\n\n「而且同一首歌，長大一點再彈，會變得不太一樣。好像它也有記得以前的你。」',effect:s=>{s.flags.knowsWhyPiano=true;s.memories.push('佳穎說曲子會記得以前的自己')},next:'futurepiano6'},
 futurepiano6:{speaker:'黃雨婷',text:'「那妳以後想念音樂嗎？」\n\n「不知道。」佳穎很乾脆地回答。\n\n「我喜歡彈，不代表一定要靠它工作。可是就算以後做別的事，我也不想因為太忙就把琴忘掉。」\n\n她回頭敲了兩個不成曲的音。\n\n「至少現在是這樣想啦。」',effect:s=>s.flags.jiayingWantsKeepPiano=true,next:'yutingleaves6'},
 yutingleaves6:{speaker:'黃雨婷',text:'「我得先走了。」\n\n牆上的鐘剛過五點。雨婷收起筆袋，把剩下的壁報材料一樣樣排整齊。\n\n「我爸今天可能早一點回家，我想先把飯煮好。」\n\n佳穎看向窗外。雨勢沒有變小，天色卻已經暗了一層。',choices:[['陪雨婷走到公車站','walkyuting6'],['把自己的傘借給她','lendumbrella6'],['幫她把材料收完','helpcleanup6']]},
 walkyuting6:{speaker:'陳宇軒',text:'「我陪妳到站牌。」\n\n雨婷本來想說不用，佳穎已經把兩把傘都塞過來。\n\n三人走到樓下時，積水淹過人行道邊緣。雨婷一路小心提著書包，像裡面裝著比課本更怕濕的東西。',effect:s=>s.flags.walkedYutingInRain=true,next:'busstop6'},
 lendumbrella6:{speaker:'陳宇軒',text:'「妳拿我的傘。我等雨小一點再走。」\n\n雨婷看著傘柄，沒有立刻接。\n\n「那你怎麼回家？」\n\n「佳穎家還有傘啦。」佳穎把傘推進她手裡，「下星期再還，不准在這裡客氣十分鐘。」',effect:s=>{s.flags.lentYutingUmbrella=true;s.items.push('借給雨婷的折傘')},next:'busstop6'},
 helpcleanup6:{text:'宇軒替雨婷把散落的色紙裝回袋子。佳穎從鞋櫃拿出家裡的長傘，堅持讓她帶走。\n\n「我下星期還妳。」\n\n「不急。傘又不會算利息。」\n\n雨婷握著傘，終於沒有再推辭。',effect:s=>s.flags.jiayingLentYutingUmbrella=true,next:'busstop6'},
 busstop6:{location:'張家附近・公車站',text:'公車站的日光燈在雨幕裡泛著白。\n\n雨婷上車前回頭揮了揮手。車門闔上後，她的身影隔著起霧的玻璃慢慢往後退，最後和一車陌生乘客一起消失在街角。\n\n佳穎與宇軒站在屋簷下，誰也沒有立刻轉身。',next:'walkback6'},
 walkback6:{speaker:'張佳穎',text:'「雨婷很少讓別人幫她。」\n\n「我知道。」\n\n「不是不相信我們。她只是怕欠人。」\n\n佳穎用鞋尖輕輕撥開排水孔旁的落葉。\n\n「所以有時候不要講得太明白。假裝只是剛好，對她比較容易。」\n\n宇軒點頭，把這句話記了下來。',effect:s=>{s.flags.understandsYutingPride=true;s.memories.push('佳穎說幫雨婷時有時要假裝只是剛好')},next:'backzhang6'},
 backzhang6:{location:'張家・客廳',text:'回到張家時，屋裡比剛才更暗。佳穎沒有開大燈，只點亮鋼琴旁那盞黃罩檯燈。\n\n壁報紙還攤在桌上，兩杯沒喝完的汽水已經沒有氣泡。\n\n宇軒拿起書包，窗外忽然傳來一聲悶雷。雨立刻又密了起來。',next:'waitrain6'},
 waitrain6:{speaker:'張佳穎',text:'「再等一下吧。現在出去，傘也沒有用。」\n\n佳穎坐回琴椅，沒有翻譜，只隨手彈起方才那首曲子的前幾個音。\n\n這一次沒有完整的旋律。幾個音斷斷續續，像兩個人都知道還有話，卻不知道從哪裡開始。',choices:[['問她會不會把今天記得很久','rememberday6'],['問她為什麼邀自己來','whyinvite6'],['安靜聽她繼續彈','listenquiet6']]},
 rememberday6:{speaker:'陳宇軒',text:'「妳會記得今天嗎？」\n\n佳穎手指停在琴鍵上。\n\n「看你們的壁報做得有多醜。」\n\n她笑完，望向桌上那片狼藉。\n\n「應該會吧。下雨、雨婷第一次來我家，還有人把照片剪歪。」\n\n「那張不是我剪的。」\n\n「喔，那就沒有你了。」',effect:s=>s.flags.askedIfJiayingRemembers=true,next:'jiahaoarrives6'},
 whyinvite6:{speaker:'陳宇軒',text:'「班上那麼多人，妳怎麼找我們來？」\n\n「因為雨婷字最好看，家豪可以搬東西。」\n\n「那我呢？」\n\n佳穎按下一個低音，故意想了很久。\n\n「你喔……比較好使喚。」\n\n門外正好傳來急促的門鈴，讓宇軒沒機會追問。',effect:s=>s.flags.askedWhyInvited=true,next:'jiahaoarrives6'},
 listenquiet6:{text:'宇軒沒有問。\n\n佳穎也沒有把曲子彈完，只在幾個熟悉的和弦之間來回。窗上的雨水把城市的燈拉成一條條模糊的線。\n\n那段沉默不再像第一次通電話時那樣需要有人趕快填滿。',effect:s=>{s.flags.sharedComfortableSilence=true;s.memories.push('第一次與佳穎共享不必填滿的沉默')},next:'jiahaoarrives6'},
 jiahaoarrives6:{speaker:'李家豪',text:'「快開門！我要淹死了！」\n\n家豪站在門外，頭髮和球隊外套全濕透了，褲腳還沾著紅土。\n\n佳穎抱著手臂看他。\n\n「你不是說五點到？」\n\n「教練加練啊！而且雨這麼大——」\n\n「所以你就不會找公共電話？」\n\n客廳裡剛才安靜的氣氛，被他連鞋襪都在滴水的狼狽徹底沖散。',effect:s=>s.flags.jiahaoArrivedSoaked=true,next:'latenoodles6'},
 latenoodles6:{location:'張家・餐桌',text:'晚上六點半，四人少了一個，只剩三碗泡麵排在餐桌上。\n\n家豪披著佳穎哥哥借他的毛巾，狼吞虎嚥地吃；佳穎一邊嫌他把地板弄髒，一邊把自己碗裡的滷蛋夾給他。\n\n宇軒看著窗邊的鋼琴。琴蓋已經闔上，方才的旋律卻像仍留在雨裡。',next:'motherreturns6'},
 motherreturns6:{speaker:'佳穎的母親',text:'「看來你們今天很熱鬧。」\n\n佳穎的母親回家時，三人正為壁報標題貼歪了幾公分爭論。她沒有責怪滿桌紙屑，只把帶回來的蛋糕放到桌上。\n\n「做不完就下次再做。朋友不是來家裡加班的。」\n\n宇軒聽見『下次』兩個字，忽然覺得這個下午並沒有真正結束。',next:'ch6end'},
 ch6end:{chapter:'第六章・完',date:'1988年10月8日｜星期六',location:'島北市・雨夜',bg:'linear-gradient(155deg,#555a56,#394643 55%,#242d2f)',text:'回家的公車駛過積水，街燈在水面碎成一片一片。\n\n宇軒把額頭靠在冰涼的車窗上。家豪已經在末排睡著，懷裡還抱著棒球手套。\n\n他想起雨婷上車前揮動的手，也想起佳穎彈完最後一個和弦後，那段誰都沒有急著說話的時間。\n\n有些人走進生命裡，並不會發出很大的聲音。\n\n也許只是一通電話、一張合照，或一首在雨天沒有完全彈完的曲子。\n\n等你回過神時，他們已經成了那段日子本身。',next:'ch7title'},

 ch7title:{chapter:'第七章｜站上台以前',date:'1988年10月14日｜星期五',location:'島北高中・禮堂',bg:'linear-gradient(150deg,#746b5f,#505c58 52%,#2e393a)',text:'校慶前一天，禮堂裡到處是沒有收完的電線、木板與油漆桶。\n\n一年三班的壁報被掛在右側走廊，紙角還留著那場雨留下的微小皺痕。\n\n佳穎坐在舞台中央的鋼琴前，已經把同一段前奏彈錯第四次。',next:'rehearsalstop7'},
 rehearsalstop7:{speaker:'音樂老師',text:'「先休息五分鐘。」\n\n音樂老師走到台下調整節目單。佳穎沒有離開琴椅，只把兩手壓在膝上。空禮堂裡，每一聲咳嗽都帶著回音。\n\n她原本只答應替合唱團伴奏；真正坐上舞台後，才發現兩百張空椅子比張家客廳安靜得可怕。',next:'friendswatch7'},
 friendswatch7:{location:'島北高中・禮堂後排',text:'宇軒、雨婷和家豪坐在最後一排。\n\n家豪練球結束才趕來，球襪上還沾著紅土；雨婷抱著全班的節目單，一張張檢查有沒有漏印。\n\n佳穎朝後排看了一眼，很快又低下頭。',choices:[['走到舞台邊陪她','walkstage7'],['留在座位，用口形叫她慢慢來','mouthslow7'],['請家豪別一直抖腳','stopleg7']]},
 walkstage7:{speaker:'陳宇軒',text:'「妳在家不是彈得很好嗎？」\n\n宇軒站在舞台下，只露出半個頭。\n\n「家裡的沙發不會盯著我看。」佳穎小聲說。\n\n「我們也沒有盯。」\n\n「你現在就在盯。」\n\n她嘴上嫌棄，肩膀卻不像剛才那麼僵了。',effect:s=>s.flags.comfortedBeforeStage=true,next:'stagefear7'},
 mouthslow7:{text:'佳穎再次抬頭時，宇軒用口形說：「慢、慢、來。」\n\n她皺著眉看了兩遍才懂，接著無聲地回了一句不知道是「白痴」還是「知道」。\n\n雨婷在旁邊看懂了，忍不住笑。',effect:s=>s.flags.silentlyEncouragedStage=true,next:'stagefear7'},
 stopleg7:{speaker:'陳宇軒',text:'「你不要一直抖腳，整排椅子都在動。」\n\n「我替她緊張啊。」\n\n家豪用兩手按住膝蓋，撐不到十秒又開始敲節拍。舞台上的佳穎看見，隔著整座禮堂笑了出來。',effect:s=>s.flags.madeJiayingLaughAtRehearsal=true,next:'stagefear7'},
 stagefear7:{speaker:'張佳穎',text:'休息時間結束前，佳穎走到後排。\n\n「我明天如果彈錯，你們就假裝沒聽見。」\n\n「那妳如果彈對呢？」家豪問。\n\n「也假裝沒聽見。」\n\n她說得像玩笑，手裡的節目單卻已被捏出好幾道折痕。',choices:[['把節目單抽走攤平','flattenpaper7'],['告訴她彈錯也不會怎樣','mistakesokay7'],['問她要不要放棄演出','offerquit7']]},
 flattenpaper7:{text:'宇軒把節目單抽走，沿著折痕慢慢壓平。\n\n「明天結束再還妳。」\n\n「你拿這個幹嘛？」\n\n「免得妳先把它撕爛。」\n\n佳穎伸手想搶，最後卻任由他把紙收進課本。',effect:s=>{s.flags.keptJiayingProgram=true;s.items.push('被佳穎捏皺的校慶節目單')},next:'teacheradvice7'},
 mistakesokay7:{speaker:'陳宇軒',text:'「彈錯就彈錯。台下大部分的人根本不知道譜長怎樣。」\n\n「所以你是在說我緊張得很沒道理？」\n\n「我是說，只有妳自己知道哪裡不是妳想要的。」\n\n佳穎安靜了一下，把節目單折回原來的大小。',effect:s=>s.flags.toldJiayingMistakesOkay=true,next:'teacheradvice7'},
 offerquit7:{speaker:'陳宇軒',text:'「現在不想上台，也還可以跟老師說吧。」\n\n佳穎看向舞台。工作人員正把麥克風架搬到鋼琴旁。\n\n「我不是不想。」\n\n她把節目單放回宇軒手裡。\n\n「我只是希望明天的我，不要比現在的我膽小。」',effect:s=>{s.flags.jiayingChoseStage=true;s.memories.push('佳穎說不想讓明天的自己更膽小')},next:'teacheradvice7'},
 teacheradvice7:{speaker:'黃子芸',text:'「緊張不是叫妳離開的訊號。」\n\n黃老師抱著一箱班級作品從走廊經過，聽見最後一句便停下。\n\n「有時候它只是提醒妳：這件事對妳很重要。」\n\n佳穎看了看她，重新走向鋼琴。第五次前奏沒有完全正確，卻一路彈到了最後。',next:'festivalmorning7'},
 festivalmorning7:{date:'1988年10月15日｜星期六',location:'島北高中・校慶日',bg:'linear-gradient(150deg,#8b7964,#627169 50%,#394746)',text:'隔天早上，校門掛起彩色布條。操場邊的攤位冒著烤香腸與爆米花的味道，廣播不時被尖銳的麥克風雜音切斷。\n\n宇軒第一次看見平常只屬於學生的校園擠滿家長與陌生人。\n\n佳穎的演出在下午兩點。離上台還有六個小時，她已經失蹤了。',next:'findjiaying7'},
 findjiaying7:{text:'雨婷說佳穎剛才還在教室；家豪說自己在球隊攤位看過她；音樂老師則以為她在後台。\n\n沒有手機，也沒有任何方法能同時通知所有人。三個人只能約好十分鐘後回到壁報前，各自去找。',choices:[['去空教室找','searchclass7'],['去音樂教室找','searchmusic7'],['到福利社和操場找','searchyard7']]},
 searchclass7:{location:'島北高中・一年三班',text:'教室裡只剩幾張歪斜的椅子。黑板上畫著校慶圖案，佳穎的書包還掛在座位旁。\n\n宇軒翻遍走廊與樓梯，最後在最靠邊的洗手台發現一只喝到一半的紙杯。她來過，卻又走了。',effect:s=>s.flags.searchedClassForJiaying=true,next:'meetback7'},
 searchmusic7:{location:'島北高中・音樂教室',text:'音樂教室沒有開燈。幾架譜架疊在牆邊，窗簾被風吸起又落下。\n\n鋼琴上放著佳穎的譜，最難的那一頁被另外抄了一份。紙邊寫著一行很小的字：不要停。',effect:s=>{s.flags.foundJiayingNote=true;s.memories.push('琴譜邊寫著「不要停」')},next:'meetback7'},
 searchyard7:{location:'島北高中・操場',text:'宇軒穿過每一排攤位。有人猜拳、有人叫賣，廣播正播放和校園完全不搭的流行歌。\n\n棒球隊攤位後方，教練說佳穎問過屋頂能不能上去，接著便往行政大樓走了。',effect:s=>s.flags.learnedJiayingWentRoof=true,next:'meetback7'},
 meetback7:{location:'一年三班壁報前',speaker:'黃雨婷',text:'十分鐘後，三人重新碰面。\n\n「她可能在行政大樓頂樓。」雨婷說。\n\n家豪指了指球隊攤位：「我不能走，學長會殺了我。」\n\n雨婷還要替班上顧壁報。最後，宇軒拿著佳穎的節目單，一個人跑上樓梯。',next:'rooftop7'},
 rooftop7:{location:'島北高中・行政大樓頂樓',bg:'linear-gradient(150deg,#7f8278,#596965 52%,#344244)',text:'頂樓鐵門沒有鎖。\n\n佳穎坐在水塔旁的矮牆上，從這裡可以看見整座操場。彩色棚頂像許多方塊，喧鬧聲被風帶上來，只剩模糊的一層。\n\n她看見宇軒，第一句是：「你怎麼找到的？」',choices:[['說大家都在找她','everyonelooking7'],['把節目單還給她','returnprogram7'],['在旁邊坐下，不先問','sitroof7']]},
 everyonelooking7:{speaker:'陳宇軒',text:'「雨婷、家豪、老師都在找妳。」\n\n「我又不是逃跑。」\n\n「那妳躲這麼高幹嘛？」\n\n佳穎看著操場，過了一會兒才說：「下面每個人都在問我準備好了沒。」',effect:s=>s.flags.toldJiayingEveryoneCared=true,next:'rooftruth7'},
 returnprogram7:{text:'宇軒把被壓平的節目單遞給她。\n\n佳穎看著上面自己的名字：鋼琴伴奏，張佳穎。\n\n「印出來以後，好像就不能假裝沒這回事了。」\n\n她用拇指慢慢摸過那四個字。',effect:s=>s.flags.returnedProgramOnRoof=true,next:'rooftruth7'},
 sitroof7:{text:'宇軒在離她一個手掌的位置坐下。\n\n兩人看著操場，誰也沒有先提演出。風吹過水塔，發出低沉的嗡聲。\n\n最後佳穎自己開口：「我不是怕彈錯。我是怕彈完以後，大家發現其實也沒什麼。」',effect:s=>s.flags.waitedOnRoof=true,next:'rooftruth7'},
 rooftruth7:{speaker:'陳宇軒',text:'「那妳在家彈給我們聽的時候，有沒有想過有沒有什麼？」\n\n「沒有。」\n\n「那就把台下的人當成家具。」\n\n佳穎轉頭看他。\n\n「你是哪一種家具？」\n\n「最後一排那張很醜的椅子。」\n\n她笑得低下頭，緊握的手終於鬆開。',effect:s=>{s.flags.rooftopBeforePerformance=true;s.memories.push('校慶上台前，和佳穎在水塔旁坐了一會兒')},next:'performance7'},
 performance7:{location:'島北高中・禮堂',text:'下午兩點零七分，禮堂燈光暗下。\n\n合唱團站成三排。佳穎走到鋼琴前，拉開琴椅，坐下時沒有看觀眾。\n\n第一個和弦比排練時更輕。到了曾彈錯四次的前奏，她的左手短暫慢了半拍。宇軒坐在最後一排，沒有移開目光。',next:'performend7'},
 performend7:{text:'她沒有停。\n\n合唱聲從琴音上方展開，禮堂裡兩百多人的呼吸慢慢變得一致。最後一段，她的手指比預定的速度稍快，音樂卻穩穩落在終點。\n\n掌聲響起時，佳穎先看向指揮，接著才朝最後一排望去。家豪把兩手舉得最高，雨婷用力拍到掌心發紅；宇軒只朝她點了一下頭。\n\n她看見了。',effect:s=>{s.flags.sawJiayingPerformance=true;s.memories.push('佳穎在掌聲裡先望向最後一排')},next:'afterstage7'},
 afterstage7:{location:'島北高中・禮堂側門',speaker:'張佳穎',text:'「我中間有一個和弦按錯。」\n\n演出結束後，她抱著琴譜跑出來，第一句仍是這個。\n\n「沒聽見。」家豪說。\n\n「你根本聽不懂。」\n\n「那不是更好？全場至少一半都跟我一樣。」\n\n雨婷把預留的果汁遞給她。佳穎接過時，手還在微微發抖。',choices:[['說她真的沒有停','didntstop7'],['把捏皺的節目單送給她','giveprogram7'],['跟著家豪笑她太在意','teaseperfect7']]},
 didntstop7:{speaker:'陳宇軒',text:'「可是妳沒有停。」\n\n佳穎看著他，想起琴譜旁自己寫的那三個字。\n\n「嗯。」\n\n她低頭喝了一口果汁，笑容藏在紙杯後面。',effect:s=>s.flags.toldJiayingDidNotStop=true,next:'ch7end'},
 giveprogram7:{text:'宇軒把節目單遞給她。紙上的折痕仍在，只是不再皺成一團。\n\n「留著啊，以後可以證明妳真的上去過。」\n\n佳穎把它收進琴譜最裡面。\n\n「那你不准再拿回去。」',effect:s=>{s.flags.gaveJiayingProgram=true;s.memories.push('被佳穎收進琴譜的校慶節目單')},next:'ch7end'},
 teaseperfect7:{speaker:'陳宇軒',text:'「只有妳自己一直記得哪裡錯。」\n\n「你們這些外行人真的很討厭。」\n\n佳穎嘴上抱怨，卻把四個人的紙杯碰在一起。杯緣發出很輕的一聲，像一個只有他們知道的慶功。',effect:s=>s.flags.celebratedPerformance=true,next:'ch7end'},
 ch7end:{chapter:'第七章・完',date:'1988年10月15日｜星期六',location:'島北高中・黃昏',bg:'linear-gradient(155deg,#756554,#4b5551 54%,#2b3536)',text:'校慶散場後，工友一盞盞關掉走廊的燈。\n\n壁報、彩帶與節目單都會在下星期被拆下，像這一天從沒發生過。\n\n佳穎卻把那張皺過又被壓平的紙帶回了家。\n\n很多年後，她也許記不起那首合唱曲的名字；但她仍會記得，站上台以前，有人在整座校園找她，最後只是坐到旁邊，陪她把害怕的時間過完。',next:'ch8title'},

 ch8title:{chapter:'第八章｜六十三分',date:'1988年10月27日｜星期四',location:'島北高中・一年三班',bg:'linear-gradient(150deg,#777269,#56625e 52%,#323d3e)',text:'期中考成績公布的早晨，教室比考試當天更安靜。\n\n黃老師把成績單倒扣在講桌上，沒有念排名。可當一張張薄紙傳到手裡，每個人的眼睛仍本能地去找最上面那個數字。\n\n宇軒的平均：六十三。',next:'scorelook8'},
 scorelook8:{text:'國文七十二，英文六十五，數學四十八。\n\n這不是他考過最差的一次，卻足以讓母親把整個週末變成一場審判。\n\n前排有人小聲比較分數。家豪把自己的成績單折成紙飛機，又在黃老師看過來以前趕緊攤平。',choices:[['先問家豪考幾分','askjiahaoscore8'],['把成績單塞進課本','hidescore8'],['看向雨婷的成績','lookyutingscore8']]},
 askjiahaoscore8:{speaker:'李家豪',text:'「不要問。問就是傷感情。」\n\n家豪用手臂遮住成績單，宇軒仍看見數學欄鮮紅的三十二。\n\n「教練說兩科不及格就停練一週。」他壓低聲音，「我現在有四科。」',effect:s=>s.flags.knowsJiahaoFailing=true,next:'scoretalk8'},
 hidescore8:{text:'宇軒把成績單夾進國文課本，正好蓋住四人的合照。\n\n照片邊緣從紙下露出一點。前幾個星期，他還覺得高中生活終於開始像自己的；一張成績單卻又把父母的聲音全帶了回來。',effect:s=>s.flags.hidMidtermScore=true,next:'scoretalk8'},
 lookyutingscore8:{text:'雨婷的平均九十二，班上第一。\n\n她沒有露出高興的樣子，只反覆確認每一科分數，像在檢查一筆不能出錯的帳。\n\n佳穎湊過去替她開心，她才勉強笑了笑。',effect:s=>s.flags.sawYutingTopScore=true,next:'scoretalk8'},
 scoretalk8:{speaker:'張佳穎',text:'「六十三也沒有很差吧。」\n\n佳穎把自己的七十九分放到宇軒旁邊。\n\n「至少你數學比家豪高。」\n\n「拿我當標準也太過分了吧？」家豪抗議。\n\n雨婷沒有笑，只問：「你回家會被罵嗎？」',choices:[['說已經習慣了','usedto8'],['承認不想回家','dontgohome8'],['假裝母親不會在意','pretendfine8']]},
 usedto8:{speaker:'陳宇軒',text:'「就禁足、沒收錄音帶，差不多那幾樣。」\n\n他說得像在報告天氣。\n\n雨婷低頭看著自己的九十二分，小聲說：「習慣不代表不會難受。」',effect:s=>s.flags.saidUsedToPressure=true,next:'teacherclass8'},
 dontgohome8:{speaker:'陳宇軒',text:'「我今天有點不想回去。」\n\n話出口後，連宇軒自己都愣了一下。\n\n佳穎沒有開玩笑，只把成績單折好還給他。\n\n「那就放學先不要那麼早走。」',effect:s=>{s.flags.admittedAvoidingHome=true;s.memories.push('第一次對朋友承認不想回家')},next:'teacherclass8'},
 pretendfine8:{speaker:'陳宇軒',text:'「還好啦，她不一定會看。」\n\n這句話沒有人相信。佳穎認識他才兩個月，已經知道他提到母親時會下意識把語氣放得很輕。\n\n她沒有拆穿，只說放學等他一起走。',effect:s=>s.flags.pretendedScoreFine=true,next:'teacherclass8'},
 teacherclass8:{speaker:'黃子芸',text:'「分數能告訴你哪裡不熟，但不能替你決定你值不值得被喜歡。」\n\n黃老師站在講台上，沒有看任何一個人。\n\n「考得好的人可以高興；考不好的人也要負責。可是負責不是羞辱自己，更不是拿一張紙去評斷別人的人生。」\n\n窗外傳來其他班公布排名的歡呼聲。',next:'afterclass8'},
 afterclass8:{location:'島北高中・放學後',text:'放學後，四人留在教室。\n\n家豪坐在講桌旁接受雨婷的數學急救；佳穎趴在宇軒桌前，把他的錯題一本本翻開。夕陽從窗戶照進來，紅筆字跡像比白天更刺眼。\n\n「你這題不是不會，」佳穎說，「你是做到一半就懶得算。」',choices:[['反駁題目本來就很煩','arguemath8'],['承認考試時一直分心','admitdistracted8'],['問她為什麼留下來','askwhystay8']]},
 arguemath8:{speaker:'陳宇軒',text:'「這種題目以後又用不到。」\n\n佳穎拿鉛筆敲了一下他的課本。\n\n「那你就為了以後可以理直氣壯地說用不到，先把它學會。」\n\n這個邏輯很奇怪，宇軒卻找不到地方反駁。',effect:s=>s.flags.arguedAboutMath=true,next:'studyroom8'},
 admitdistracted8:{speaker:'陳宇軒',text:'「考到一半一直想到別的事。」\n\n「什麼事？」\n\n宇軒看向窗外。球隊練習的哨音從操場傳來，家豪也短暫停下筆。\n\n「就……不知道以後要幹嘛。」\n\n佳穎沒有說別想太多，只把下一題推到他面前。',effect:s=>s.flags.admittedFutureAnxiety=true,next:'studyroom8'},
 askwhystay8:{speaker:'陳宇軒',text:'「妳幹嘛陪我訂正？」\n\n「怕你被禁足以後沒人借我小說。」\n\n「我根本沒借過妳。」\n\n「那就當作投資未來。」\n\n佳穎低頭畫出題目重點，沒有讓他看見自己笑了一下。',effect:s=>s.flags.askedJiayingWhyHelp=true,next:'studyroom8'},
 studyroom8:{speaker:'黃雨婷',text:'「家豪，三十二除以四是多少？」\n\n「八啊。」\n\n「那為什麼你考卷寫六？」\n\n「考場壓力。」\n\n雨婷深吸一口氣，第一次露出想拿課本敲人的表情。佳穎趴在桌上笑，連宇軒也暫時忘了成績單還在口袋。',next:'walkhome8'},
 walkhome8:{location:'島北市・傍晚',bg:'linear-gradient(155deg,#7b6c5c,#515b56 53%,#30393a)',text:'天色暗下來後，四人才離開學校。\n\n家豪要趕回球場向教練報告成績；雨婷去搭公車。佳穎陪宇軒多走了一站，直到陳家巷口的招牌出現在前方。\n\n「要不要我等你進去？」她問完，又立刻補一句，「我是怕你逃家。」',choices:[['請她陪到門口','walkdoor8'],['說自己可以面對','facealone8'],['開玩笑問能不能住她家','jokemove8']]},
 walkdoor8:{text:'佳穎真的陪他走到公寓樓下。\n\n樓上的客廳已亮起燈。宇軒把成績單拿在手裡，走兩階又回頭。\n\n佳穎仍站在原地，朝他揮了揮手，直到樓梯轉角把彼此擋住。',effect:s=>{s.flags.jiayingWaitedAtHome=true;s.memories.push('拿著六十三分回家時，佳穎站在樓下等了一會兒')},next:'homeconfront8'},
 facealone8:{speaker:'陳宇軒',text:'「不用。我總不能每次都有人陪。」\n\n佳穎點頭。\n\n「那你明天如果沒出現，我會叫家豪來按門鈴。」\n\n她說完轉身走向站牌。宇軒等她走遠，才踏進巷子。',effect:s=>s.flags.facedScoreAlone=true,next:'homeconfront8'},
