 jokemove8:{speaker:'陳宇軒',text:'「不然我今天住妳家。」\n\n「可以啊，鋼琴下面借你。」\n\n「至少比我房間安靜。」\n\n兩人笑完，巷口已經到了。真正要進門的仍只有宇軒一個人。',effect:s=>s.flags.jokedBeforeScoreTalk=true,next:'homeconfront8'},
 homeconfront8:{location:'陳家・餐桌',speaker:'媽媽',text:'「六十三？」\n\n成績單平放在餐桌中央。母親沒有提高音量，反而讓每個字更清楚。\n\n「我每天叫你讀書，你就拿這個回來？李家豪帶你去打球，還是那個女同學一直打電話，哪一個比較重要？」\n\n父親坐在旁邊吃飯，始終沒有抬頭。',choices:[['說是自己沒有考好','ownscore8'],['請她不要怪朋友','defendfriends8'],['保持沉默','silentscore8']]},
 ownscore8:{speaker:'陳宇軒',text:'「是我自己沒考好，跟他們沒有關係。」\n\n母親看著他。\n\n「那就證明給我看。下次八十分以前，星期六、日都不准出去。」\n\n宇軒想說這根本不是證明，最後仍把話吞了回去。',effect:s=>s.flags.ownedBadScore=true,next:'fatherafter8'},
 defendfriends8:{speaker:'陳宇軒',text:'「佳穎今天還留下來教我訂正。家豪也沒有害我。」\n\n「你現在還替他們說話？」\n\n母親的聲音終於高了。以晴在房間門口探出頭，又立刻縮回去。\n\n宇軒第一次沒有因為那個音量改口。',effect:s=>{s.flags.defendedFriendsAtHome=true;s.memories.push('第一次在母親面前替朋友說話')},next:'fatherafter8'},
 silentscore8:{text:'宇軒盯著桌面，不回答。\n\n母親一條條宣布規定：週末禁足、錄音帶收走、每天寫完練習題才能看小說。\n\n父親吃完最後一口飯，把碗放進水槽。那聲輕響比任何一句責備都讓宇軒難受。',effect:s=>s.flags.silentDuringScoreFight=true,next:'fatherafter8'},
 fatherafter8:{location:'陳家・陽台',speaker:'爸爸',text:'夜裡，父親到陽台抽菸。宇軒經過時，他忽然說：「你媽是擔心你。」\n\n「你呢？」\n\n父親愣了一下，像沒想過會被反問。\n\n客廳電視播著財經新聞，藍白光落在他疲倦的臉上。',next:'fatheranswer8'},
 fatheranswer8:{speaker:'爸爸',text:'「我每天工作，就是希望你們以後不用像我這麼辛苦。」\n\n「可是你從來沒問過我想要什麼。」\n\n話出口後，兩個人都沉默了。\n\n父親把菸按熄，最後只說：「先把書念好。其他的，以後再想。」\n\n宇軒望著巷子。他忽然害怕，那個『以後』會一直被推到再也來不及。',effect:s=>{s.flags.questionedFatherFuture=true;s.memories.push('父親說其他的以後再想')},next:'nightcall8'},
 nightcall8:{location:'陳宇軒的房間・夜',text:'十點二十分，母親把錄音帶全部收走。\n\n宇軒躺在床上，房門外忽然傳來以晴很輕的敲門聲。她從睡衣口袋拿出一卷卡帶——佳穎借他的那一卷。\n\n「我只藏到這個。」',choices:[['收下並謝謝妹妹','thanksister8'],['叫她拿回去免得被罵','returntape8']]},
 thanksister8:{speaker:'陳宇軒',text:'「謝啦。」\n\n以晴把錄音帶塞進他手裡。\n\n「小聲一點聽。媽剛才真的很生氣。」\n\n她走到門口，又回頭說：「可是六十三也沒有笨到不能救吧。」',effect:s=>{s.flags.sisterSavedTape=true;s.memories.push('以晴偷偷替自己留下佳穎的錄音帶')},next:'ch8end'},
 returntape8:{speaker:'陳宇軒',text:'「妳拿回去，別被一起罵。」\n\n以晴皺眉。\n\n「我又不是幫你作弊。」\n\n她把卡帶放到桌上就跑。宇軒沒有再追出去。',effect:s=>s.flags.sisterInsistedTape=true,next:'ch8end'},
 ch8end:{chapter:'第八章・完',date:'1988年10月27日｜星期四',location:'島北市・深夜',bg:'linear-gradient(155deg,#5d5953,#3f4846 54%,#272f31)',text:'耳機裡的歌壓得很小，小到每一個音都像從很遠的地方傳來。\n\n錄音帶 B 面最後，多出了一首佳穎後來錄進去的曲子。開頭仍被廣播主持人的聲音蓋住一小段。\n\n宇軒不知道下一次會考幾分，也不知道自己想成為什麼。\n\n但至少這一晚，有人替他藏住一首歌；有人在回家以前陪他多走了一站。\n\n六十三分沒有因此變高。\n\n只是它暫時不再像整個世界。',next:'ch9title'},

 ch9title:{chapter:'第九章｜舊書攤的燈',date:'1988年11月5日｜星期六',location:'島北市・南門市場',bg:'linear-gradient(150deg,#806f5c,#59625b 52%,#343f3f)',text:'被禁足一個星期後，宇軒得到的第一個外出理由，是替母親到南門市場買醬油。\n\n市場後方有一條堆滿舊家具與二手書的窄巷。雨婷借他的小說已經看完，他想順路找一本同作者的舊作。\n\n下午四點，天色卻像快要入夜。',next:'bookstall9'},
 bookstall9:{location:'島北市・舊書攤',text:'舊書攤沒有招牌，只在鐵門旁掛著一顆黃色燈泡。書從地面堆到半個人高，紙張受潮的氣味和隔壁中藥行飄來的藥材味混在一起。\n\n宇軒彎腰翻到第三排時，聽見熟悉的聲音在裡面說：「這一箱小說放左邊。」\n\n雨婷抱著一疊書，從布簾後走出來。',next:'meetbookstall9'},
 meetbookstall9:{speaker:'黃雨婷',text:'「宇軒？」\n\n她像被撞見秘密，手裡的書差點滑下來。\n\n「你怎麼在這裡？」\n\n「買醬油。」\n\n兩人同時看了看周圍。這裡顯然沒有醬油。',choices:[['問她是不是在這裡打工','askwork9'],['先幫她接過書','takebooks9'],['說自己來找小說','admitbook9']]},
 askwork9:{speaker:'黃雨婷',text:'「不算打工。」\n\n雨婷把書放上木架。\n\n「老闆讓我幫忙整理，換一些書回去看。有時候也會算一點錢。」\n\n她說得很快，像怕宇軒把這件事說成辛苦。',effect:s=>s.flags.knowsYutingBookWork=true,next:'owner9'},
 takebooks9:{text:'宇軒接過最上面那一半。書比看起來更重，封面邊角磨得刺手。\n\n「放哪裡？」\n\n雨婷愣了一下，指向最裡面的矮櫃。\n\n兩人側著身穿過窄得只能一人走的書堆。',effect:s=>s.flags.helpedYutingBooks=true,next:'owner9'},
 admitbook9:{speaker:'陳宇軒',text:'「我想找妳上次借我的那個作者。」\n\n雨婷眼神立刻亮了一點。\n\n「你喜歡結尾嗎？」\n\n「很討厭。」\n\n「我也是。」\n\n她笑了，剛才被撞見時的緊張終於淡下去。',effect:s=>s.flags.sharedBookEnding=true,next:'owner9'},
 owner9:{speaker:'舊書攤老闆',text:'「班長，妳同學喔？」\n\n一位頭髮花白的老人從櫃檯後抬起頭。\n\n「她每個星期都來，書看得比我收得快。你要找哪一本，問她比問我有用。」\n\n雨婷低頭整理書脊，耳朵慢慢紅了。',next:'browse9'},
 browse9:{text:'雨婷帶宇軒走到小說區。\n\n她不用看分類標籤，便能從三層書堆裡抽出正確的一本。書封褪成灰藍色，內頁有前一位讀者留下的鉛筆線。\n\n定價十五元。宇軒口袋裡只有母親給的醬油錢和自己剩下的八元。',choices:[['把書放回去','putback9'],['問老闆能不能先欠著','askcredit9'],['只記住書名，下次再來','remembertitle9']]},
 putback9:{text:'宇軒把書放回原處。\n\n雨婷看見了，沒有問他錢夠不夠，只把書往書堆內側推了一點。\n\n「這本很少有人買，應該會放很久。」\n\n她替他保留得像只是隨手整理。',effect:s=>s.flags.yutingQuietlyHeldBook=true,next:'fatherarrives9'},
 askcredit9:{speaker:'舊書攤老闆',text:'「班長的同學，可以。」\n\n宇軒正要答應，雨婷卻搖頭。\n\n「下次再買就好。看書不需要為了早幾天欠錢。」\n\n她說這句話時很平靜，像是早已替自己做過很多次同樣的決定。',effect:s=>s.flags.learnedYutingMoneyRule=true,next:'fatherarrives9'},
 remembertitle9:{text:'宇軒把書名念了兩次，準備下次再找。\n\n雨婷從抽屜拿出一小張廢紙，替他抄下作者、書名和出版社。\n\n「只記名字容易找錯版本。」\n\n她的字仍像成績單上的印刷體一樣整齊。',effect:s=>{s.flags.hasYutingBookNote=true;s.items.push('雨婷抄的舊書資料')},next:'fatherarrives9'},
 fatherarrives9:{speaker:'雨婷的父親',text:'「雨婷。」\n\n一名穿著褪色工作服的男人站在攤外，肩上還沾著乾掉的水泥粉。手裡提著兩個便當，一大一小。\n\n雨婷立刻走過去。\n\n「爸，你不是要加班？」\n\n「工地停電，提早收。」',next:'introducefather9'},
 introducefather9:{speaker:'黃雨婷',text:'「這是我同學，陳宇軒。」\n\n她的父親把大便當換到另一隻手，朝宇軒點頭。\n\n「謝謝你們平常照顧她。她回家有提過班上交到朋友。」\n\n雨婷小聲說：「我沒有那樣講。」\n\n父親笑了笑，眼角的紋路陷得很深。',effect:s=>{s.flags.metYutingFather=true;s.flags.knowsYutingFather=true;s.memories.push('雨婷父親說她回家提過朋友')},next:'dinnerinvite9'},
 dinnerinvite9:{speaker:'雨婷的父親',text:'「吃過了嗎？一起吃便當吧。」\n\n攤外只有兩張矮凳，便當也只有兩個。雨婷立刻說宇軒還要替家裡買東西。\n\n她說得自然，宇軒卻看見父親把大便當往三人中間挪了一點。',choices:[['留下來分著吃','sharemeal9'],['婉拒並幫忙收完最後一箱','declinemeal9'],['說下次帶朋友一起來','nexttime9']]},
 sharemeal9:{text:'三人把大便當分成三份。滷排骨被父親夾給雨婷，雨婷又悄悄分了一半到宇軒碗裡。\n\n飯不夠多，話也不多。市場收攤的鐵門聲一扇扇落下，那顆黃燈泡把三個人的影子照在書堆上。',effect:s=>{s.flags.sharedYutingFamilyMeal=true;s.memories.push('舊書攤黃燈下分成三份的便當')},next:'fatherstory9'},
 declinemeal9:{speaker:'陳宇軒',text:'「我回家要吃飯。我幫忙搬完這箱就走。」\n\n雨婷看了他一眼，知道這不是客氣。\n\n兩人把最後一箱書抬進布簾後。宇軒離開時，父女剛好把兩個便當打開，熱氣在黃燈下升起。',effect:s=>s.flags.protectedYutingMeal=true,next:'fatherstory9'},
 nexttime9:{speaker:'陳宇軒',text:'「下次我叫佳穎跟家豪也來。家豪最會搬東西。」\n\n「他不會把書摔壞嗎？」雨婷問。\n\n「那就讓他只搬不值錢的。」\n\n父親聽著兩人說話，笑著把便當放到櫃檯。',effect:s=>s.flags.promisedBookstallVisit=true,next:'fatherstory9'},
 fatherstory9:{speaker:'雨婷的父親',text:'「她媽媽以前也喜歡看書。」\n\n父親替雨婷擦掉書封上的灰，語氣很平常。\n\n「家裡以前留下幾本，她小時候看不懂也一直翻。後來書看完了，就自己找到這裡。」\n\n雨婷沒有接話，只把那本灰藍色小說重新放好。宇軒第一次知道，她喜歡小說的時間，比認識自己早了很久。',effect:s=>{s.flags.knowsYutingMotherLovedBooks=true;s.memories.push('雨婷從母親留下的舊書開始閱讀')},next:'leavebookstall9'},
 leavebookstall9:{location:'島北市・市場外',text:'離開市場時，宇軒終於想起醬油。\n\n雨婷陪他走到雜貨店。街燈剛亮，攤販收起遮雨棚，水珠一排排落到地上。\n\n「今天的事，」雨婷說，「不用特別跟佳穎他們講。」',choices:[['答應替她保留','keepsecret9'],['問她是不是怕被同情','askpity9'],['說下次大家只是去看書','justbooks9']]},
 keepsecret9:{speaker:'陳宇軒',text:'「妳不想講，我就不講。」\n\n雨婷點頭。\n\n「不是什麼秘密。我只是……不想每次見面，大家都先想到我家裡怎麼樣。」\n\n宇軒忽然明白，認識一個人的背景，不代表那會取代她原本的樣子。',effect:s=>{s.flags.keptYutingBookstallPrivate=true;s.memories.push('答應不讓雨婷只剩下家庭背景')},next:'bookgift9'},
 askpity9:{speaker:'黃雨婷',text:'「我不喜歡別人因為覺得我可憐，就對我比較好。」\n\n她停在紅綠燈前。\n\n「如果本來就會對我好，那沒有關係。」\n\n綠燈亮起後，她先往前走。宇軒花了一會兒才真正聽懂兩句話的差別。',effect:s=>{s.flags.understandsYutingNoPity=true;s.memories.push('雨婷說不想用可憐換來別人的好')},next:'bookgift9'},
 justbooks9:{speaker:'陳宇軒',text:'「下次他們來，也只是來找書。」\n\n「家豪會看書？」\n\n「漫畫算吧。」\n\n雨婷笑了一下。那笑不是因為事情被隱瞞，而是宇軒沒有把它說成需要被拯救。',effect:s=>s.flags.normalizedBookstall=true,next:'bookgift9'},
 bookgift9:{speaker:'黃雨婷',text:'公車進站前，雨婷忽然把那本灰藍色小說塞進宇軒手裡。\n\n「老闆說這本書封壞了，算我今天整理書的工錢。」\n\n「可是妳不是也想看？」\n\n「我看過了。」\n\n書的第一頁多了一行她剛寫的字：看完再跟我吵結尾。',effect:s=>{s.flags.receivedYutingBook=true;s.items.push('雨婷從舊書攤換來的小說');s.memories.push('「看完再跟我吵結尾」的舊小說')},next:'ch9end'},
 ch9end:{chapter:'第九章・完',date:'1988年11月5日｜星期六',location:'島北市公車・夜',bg:'linear-gradient(155deg,#63594e,#424946 55%,#283132)',text:'公車離開市場，舊書攤那顆黃色燈泡很快被夜色吞沒。\n\n宇軒把小說放在腿上。書頁有潮濕的氣味、陌生人的鉛筆線，以及雨婷剛留下的字。\n\n他以前以為了解一個人，就是知道她喜歡什麼、家住哪裡、父親做什麼。\n\n後來才明白，真正困難的是知道以後，仍然讓她完整地做她自己。',next:'ch10title'},

 ch10title:{chapter:'第十章｜寫給未來的人',date:'1988年11月18日｜星期五',location:'島北高中・一年三班',bg:'linear-gradient(150deg,#756d62,#535f5b 52%,#303b3c)',text:'班會課最後二十分鐘，黃老師發給每人一張沒有格線的信紙和一只牛皮紙信封。\n\n黑板上只有一行字：\n\n——寫給三年後的自己。\n\n「畢業那天，我會把信還給你們。」',next:'letterrule10'},
 letterrule10:{speaker:'黃子芸',text:'「不用寫志願，也不用保證會成為多厲害的人。」\n\n「寫一件你現在害怕忘記的事，或問未來的自己一個問題。信封封起來以後，只有三年後的你能打開。」\n\n教室很快安靜下來。紙張潔白得讓第一個字顯得特別困難。',next:'blankletter10'},
 blankletter10:{text:'宇軒握著筆。\n\n三年後，他十九歲。可能正在準備大學，也可能根本考不上；父母大概仍會告訴他哪條路比較安全。\n\n他忽然發現，自己連想像未來的畫面都借用了別人的答案。',choices:[['寫下「你自由了嗎？」','writefree10'],['寫下現在四個人的名字','writenames10'],['讓信紙維持空白','blankfutureletter10']]},
 writefree10:{text:'宇軒在第一行寫：\n\n「十九歲的陳宇軒，你自由了嗎？」\n\n寫完以後，他又覺得這個問題太幼稚。可筆跡已留在紙上，像一句不能假裝沒想過的話。',effect:s=>{s.flags.letterAskedFreedom=true;s.memories.push('寫給十九歲自己的問題：你自由了嗎？')},next:'lookaround10'},
 writenames10:{text:'宇軒沒有寫問題，只依序寫下：\n\n李家豪、張佳穎、黃雨婷、黃子芸。\n\n他在名字下面補了一句：「如果你忘記了，就想想一九八八年的秋天。」\n\n那時的他還不相信，真的會有需要這句提醒的一天。',effect:s=>{s.flags.letterWroteNames=true;s.memories.push('寫進三年後信裡的四個名字')},next:'lookaround10'},
 blankfutureletter10:{text:'宇軒在信紙右下角寫下日期，除此以外什麼都沒有。\n\n他想，也許三年後的自己看到空白，會知道十六歲時真的沒有答案。\n\n這份不知道，本身或許就是最誠實的內容。',effect:s=>{s.flags.letterLeftBlank=true;s.memories.push('留給三年後自己的一張空白信紙')},next:'lookaround10'},
 lookaround10:{text:'家豪寫得飛快，寫完還用手臂遮住；雨婷每一行都先在草稿紙排過，像怕浪費信紙。\n\n佳穎卻遲遲沒有動筆。她用筆尾輕敲桌面，紙上只有開頭的「給三年後的我」。',choices:[['問她是不是沒話寫','askjiayingletter10'],['不打擾她','leaveletter10'],['偷看家豪寫了什麼','peekjiahao10']]},
 askjiayingletter10:{speaker:'陳宇軒',text:'「妳不是最會講話？怎麼現在寫不出來？」\n\n佳穎用信紙蓋住他的視線。\n\n「因為講錯可以假裝沒講過，寫下來三年後還看得到。」\n\n她想了一會兒，終於落下第二行。',effect:s=>s.flags.askedJiayingFutureLetter=true,next:'jiahaoletter10'},
 leaveletter10:{text:'宇軒沒有催她，低頭把自己的信折好。\n\n過了一會兒，身後傳來筆尖快速劃過紙面的聲音。佳穎像終於決定不再修改，一口氣寫滿半頁。',effect:s=>s.flags.gaveJiayingLetterSpace=true,next:'jiahaoletter10'},
 peekjiahao10:{text:'宇軒往家豪那邊靠了一點，只看見最上面一行：「你有沒有進一軍？」\n\n家豪立刻把信紙壓住。\n\n「看什麼看！這是國家機密。」\n\n「高中球隊哪來的一軍？」\n\n「三年後就有了啦。」',effect:s=>s.flags.sawJiahaoLetterDream=true,next:'jiahaoletter10'},
 jiahaoletter10:{speaker:'李家豪',text:'「你們覺得三年很久嗎？」\n\n「國中三年一下就過了。」雨婷說。\n\n「可是國一的事我都快忘光了。」\n\n家豪看著信封，第一次對時間露出不太放心的表情。',next:'yutingletter10'},
 yutingletter10:{speaker:'黃雨婷',text:'雨婷把信放進信封，卻一直沒有封口。\n\n「如果三年後，有些問題還是沒有變呢？」\n\n佳穎問：「比如什麼？」\n\n雨婷搖頭。\n\n「那就代表，未來的我還要繼續想。」\n\n她最後用膠水仔細封住邊緣。',effect:s=>s.flags.heardYutingFutureUncertain=true,next:'jiayingslip10'},
 jiayingslip10:{text:'一陣風吹進教室，佳穎桌上的信紙被掀起。\n\n宇軒只來得及看見其中一句：\n\n「希望到那時候，我還願意……」\n\n她立刻按住紙張。後面的字被手掌遮住。',choices:[['裝作沒有看見','pretendnotsee10'],['問她還願意做什麼','askwilling10'],['說自己的信也很丟臉','shareembarrass10']]},
 pretendnotsee10:{text:'宇軒移開視線，替她把窗戶關小。\n\n佳穎看了他一眼，沒有問他看見多少。她把信折成三折，收進信封。\n\n有些界線沒有被說明，卻因為沒有人跨過而變得清楚。',effect:s=>s.flags.respectedJiayingLetter=true,next:'sealletters10'},
 askwilling10:{speaker:'陳宇軒',text:'「還願意什麼？」\n\n「願意跟你講話。」\n\n佳穎答得太快，接著自己先笑。\n\n「不告訴你。三年後你如果還在，再自己問。」\n\n那句『如果還在』讓玩笑忽然有了很輕的重量。',effect:s=>s.flags.askedJiayingLetterLine=true,next:'sealletters10'},
 shareembarrass10:{speaker:'陳宇軒',text:'「我的更丟臉，妳不用藏。」\n\n「那你先給我看。」\n\n「不要。」\n\n「你看，大家都一樣。」\n\n佳穎把信折好，表情終於輕鬆了一點。',effect:s=>s.flags.sharedLetterEmbarrassment=true,next:'sealletters10'},
 sealletters10:{speaker:'黃子芸',text:'黃老師拿著紙箱走過每一排。\n\n信封一封封落進箱底。有人在封面畫花，有人只寫姓名座號。\n\n「三年後收到時，別笑現在的自己。」她說。\n\n「他能想到的路比你少，不代表他不夠努力。」',next:'afterletters10'},
 afterletters10:{location:'島北高中・走廊',text:'下課後，四人靠在走廊欄杆。天空是冬天才有的淡灰色，操場上的樹被風吹得不斷翻面。\n\n信已經收走，每個人卻還在猜另外三人寫了什麼。',choices:[['猜家豪只寫棒球','guessbaseball10'],['問雨婷三年後想去哪','askyutingfuture10'],['問佳穎會不會真的忘記大家','askforget10']]},
 guessbaseball10:{speaker:'李家豪',text:'「我才不只寫棒球。」\n\n「那還有什麼？」\n\n「秘密。」\n\n家豪停了一下，又小聲補充：「我有問他，還有沒有跟你們聯絡。」\n\n說完，他立刻假裝研究操場上的打擊動作。',effect:s=>s.flags.jiahaoWantsKeepFriends=true,next:'futuretalk10'},
 askyutingfuture10:{speaker:'黃雨婷',text:'「如果考得到，我想念文學或教育。」\n\n「妳爸會同意嗎？」\n\n「他說，只要我考得上，學費他會想辦法。」\n\n她望著遠處的教學大樓。那個『想辦法』裡有多少重量，她沒有繼續說。',effect:s=>{s.flags.knowsYutingFutureStudy=true;s.memories.push('雨婷想念文學或教育')},next:'futuretalk10'},
 askforget10:{speaker:'張佳穎',text:'「三年而已，怎麼可能忘記。」\n\n「家豪連上星期借誰鉛筆都忘了。」\n\n「那是家豪。」\n\n佳穎轉頭看宇軒。\n\n「反正我不會。」\n\n她說得很快，像這件事根本不值得懷疑。',effect:s=>{s.flags.jiayingPromisedRemember=true;s.memories.push('佳穎說三年後不會忘記')},next:'futuretalk10'},
 futuretalk10:{speaker:'張佳穎',text:'「那三年後，我們一起拆信啊。」\n\n「黃老師不是要在畢業典禮還？」雨婷問。\n\n「所以畢業那天不要先跑掉。」\n\n家豪伸出手：「說好了。」\n\n四個人沒有真的擊掌，只互相看著笑。對十六歲的他們而言，三年後近得像一個確定會抵達的星期六。',next:'teacherbox10'},
 teacherbox10:{location:'島北高中・辦公室',text:'放學前，宇軒替黃老師搬紙箱到辦公室。\n\n箱子不重，裡面卻裝著全班三十多種尚未發生的人生。黃老師在封口貼上日期：1991年6月。\n\n「老師，妳真的不會偷看？」\n\n「我連自己的未來都忙不完了。」她笑著回答。',effect:s=>s.flags.helpedStoreFutureLetters=true,next:'ch10end'},
 ch10end:{chapter:'第十章・完',date:'1988年11月18日｜星期五',location:'島北高中・黃昏',bg:'linear-gradient(155deg,#686058,#454e4b 54%,#293233)',text:'紙箱被推進櫃子最深處，門闔上後，那些話暫時離開了所有人的生活。\n\n三年後，他們真的會收到信。\n\n只是十六歲的宇軒還不知道，未來從來不是沿著信紙直直走去的地方。\n\n有些問題會找到答案；有些名字會逐漸失去消息；還有一些當時沒寫完的句子，要過很多年，才終於有人敢問。',next:'ch11title'},

 ch11title:{chapter:'第十一章｜兩座大鐘',date:'1988年12月10日｜星期六',location:'島北車站・東側大廳',bg:'linear-gradient(150deg,#73736d,#505e5b 52%,#2f3b3d)',text:'十二月第二個星期六，四人約好去港南區的冬季書展。\n\n集合地點是島北車站大鐘下，上午九點。\n\n八點五十五分，宇軒抵達。雨婷已經在長椅上看書，佳穎提著相機和一袋早餐。\n\n九點整，家豪沒有出現。',next:'waitingjiahao11'},
 waitingjiahao11:{text:'九點十分。\n\n九點二十分。\n\n廣播重複著列車進站消息，人群一批批從驗票口湧出。佳穎把家豪的飯糰從紙袋拿出來，又放回去。\n\n前往港南的車九點四十分發車。',choices:[['繼續在原地等','keepwaiting11'],['去公共電話打到家豪家','calljiahaohome11'],['分頭在車站找','splitsearch11']]},
 keepwaiting11:{speaker:'陳宇軒',text:'「他知道大鐘，不會找不到。」\n\n三人繼續等。九點二十五，雨婷忽然看向大廳導覽圖。\n\n「車站西側，好像也有一座鐘。」\n\n佳穎慢慢轉頭。\n\n「他不會笨到站在另一座下面吧？」',effect:s=>s.flags.waitedAtEastClock=true,next:'twoclocks11'},
 calljiahaohome11:{location:'島北車站・公共電話',speaker:'家豪的父親',text:'電話響了六聲才有人接。\n\n「家豪？他八點就出門了，說跟同學去書展。」\n\n宇軒掛斷後，看著電話旁的車站平面圖。圖上東、西兩側各畫著一個時鐘符號。',effect:s=>s.flags.calledJiahaoHomeFromStation=true,next:'twoclocks11'},
 splitsearch11:{text:'宇軒去月台入口，雨婷往售票口，佳穎留在原地。\n\n十分鐘後三人再次碰面，誰也沒有找到。\n\n佳穎指著導覽圖上另一個時鐘：「如果他說的『大鐘』跟我們不是同一座呢？」',effect:s=>s.flags.searchedStationForJiahao=true,next:'twoclocks11'},
 twoclocks11:{text:'島北車站整修後保留了舊西站大廳，新東站也掛上一座幾乎相同的大鐘。\n\n從東側走到西側至少要十二分鐘。距離發車剩十五分鐘。\n\n沒有人能傳訊息叫家豪別亂跑。',choices:[['宇軒跑去西側找','runwest11'],['請站務員廣播','pagejiahao11'],['三人一起過去，放棄這班車','alltogether11']]},
 runwest11:{text:'宇軒把車票交給雨婷，沿著地下通道往西側跑。\n\n人群、行李箱和柱子不斷擋在前面。到最後一段樓梯時，他已經喘得喉嚨發乾。\n\n西站大鐘下，家豪抱著棒球外套，正一臉不耐煩地看時間。',effect:s=>s.flags.ranAcrossStation=true,next:'foundjiahao11'},
 pagejiahao11:{speaker:'車站廣播',text:'「請李家豪同學聽到廣播後，至東側服務台。你的三位同學正在等你。」\n\n廣播連續播了兩次。周圍幾名旅客忍不住笑。\n\n七分鐘後，家豪從地下通道跑上來，遠遠便喊：「這車站為什麼有兩個大鐘！」',effect:s=>{s.flags.pagedJiahao=true;s.memories.push('響遍車站的尋人廣播')},next:'foundjiahao11'},
 alltogether11:{text:'三人決定一起走去西站。\n\n下一班車要再等一小時，但沒有人想把另一個人單獨留在不知道哪裡的鐘下。\n\n走出地下通道時，家豪正準備離開原地找他們。四個人差點又一次錯身。',effect:s=>s.flags.missedTrainTogether=true,next:'foundjiahao11'},
 foundjiahao11:{speaker:'李家豪',text:'「你們遲到半小時欸！」\n\n「我們八點五十五就到了！」佳穎把冷掉的飯糰丟給他。\n\n四個人同時指向自己認定的集合方向，又同時停住。\n\n宇軒看著兩座隔了十二分鐘路程的鐘，突然不知道該先怪誰。',choices:[['笑出來','laughlost11'],['先跑去月台','runtrain11'],['約定以後一定講清楚東西側','clarifyfuture11']]},
 laughlost11:{text:'宇軒先笑了。\n\n佳穎忍了幾秒也跟著笑，連雨婷都彎下腰。家豪還想生氣，嘴裡卻塞著飯糰，只能含糊地抗議。\n\n他們笑到九點四十分的車在遠處關門。',effect:s=>s.flags.laughedAndMissedTrain=true,next:'nexttrain11'},
 runtrain11:{text:'四人一起衝向月台。\n\n驗票員在最後一刻拉上柵欄，列車就在他們面前慢慢滑出去。家豪雙手撐著膝蓋喘氣。\n\n「至少……大家都趕到了。」\n\n佳穎拿紙袋敲了他一下。',effect:s=>s.flags.triedCatchTrain=true,next:'nexttrain11'},
 clarifyfuture11:{speaker:'黃雨婷',text:'「下次要說東側、服務台前、面對售票口右邊的大鐘。」\n\n「還要說站在哪一格地磚嗎？」家豪問。\n\n「對你可能需要。」\n\n列車在他們爭論時開走，四人只好一起目送。',effect:s=>s.flags.madeMeetingRule=true,next:'nexttrain11'},
 nexttrain11:{location:'島北車站・候車室',text:'下一班車十點四十分。\n\n四人坐在候車室吃完冷飯糰。暖氣不強，玻璃門每次打開都灌進一陣風。\n\n原本精心安排的行程少了一小時，卻因為沒有人能臨時改口，反而只能一起接受。',next:'trainride11'},
 trainride11:{location:'島北往港南列車',bg:'linear-gradient(150deg,#7d7a6f,#586762 52%,#344143)',text:'列車離開市區後，窗外的樓房漸漸變矮。\n\n家豪靠著窗睡著；雨婷翻開書，又因車身搖晃很快闔上。佳穎拿相機拍窗外，按下快門時玻璃正好映出宇軒的臉。\n\n「妳拍到我了。」\n\n「是你自己跑進去的。」',choices:[['請她別洗那張','dontdevelop11'],['也替她拍一張','photographjiaying11'],['看著窗上的四人倒影','reflection11']]},
 dontdevelop11:{speaker:'陳宇軒',text:'「那張不要洗，很醜。」\n\n「照片洗出來以前，攝影師有最終決定權。」\n\n佳穎把相機護在胸前。很多年後，那張玻璃反光的照片仍會留在她的相簿裡。',effect:s=>s.flags.windowReflectionPhoto=true,next:'bookfair11'},
 photographjiaying11:{text:'宇軒接過相機，對著佳穎按下快門。\n\n她來不及擺表情，只驚訝地睜大眼睛。窗外冬日的田野在她身後拖成淡色線條。\n\n「陳宇軒！我還沒準備好。」\n\n「妳不是都拍別人沒準備好的？」',effect:s=>{s.flags.tookJiayingTrainPhoto=true;s.memories.push('第一次替佳穎按下相機快門')},next:'bookfair11'},
 reflection11:{text:'車窗映著四個人：睡著的家豪、抱著書的雨婷、舉著相機的佳穎，和坐在最外側的自己。\n\n倒影隨沿途光線忽明忽暗，偶爾被外面的景色完全蓋過。\n\n宇軒忽然希望這班車可以再慢一點。',effect:s=>{s.flags.watchedTrainReflection=true;s.memories.push('冬季列車車窗上的四人倒影')},next:'bookfair11'},
 bookfair11:{location:'港南區・冬季書展',text:'書展設在舊倉庫改成的展覽館。高窗透進蒼白日光，攤位間飄著新書油墨與咖啡味。\n\n雨婷一進門便忘了寒冷；家豪直奔漫畫區；佳穎被唱片與樂譜攤吸走。四個人約好四點在入口紅柱旁集合。\n\n這次每個人都把「紅柱」重複了兩遍。',next:'splitfair11'},
 splitfair11:{text:'入口上方的老鐘指向十一點二十。人群一進展場便分向不同走道，紅柱很快被冬衣與紙袋遮住。\n\n距離四點還很久。宇軒站在岔開的三條走道前，看著三個熟悉的背影各自慢慢走遠。',choices:[['陪雨婷逛小說攤','withyuting11'],['跟佳穎去找琴譜','withjiaying11'],['把家豪從漫畫區拖回來','withjiahao11']]},
 withyuting11:{text:'雨婷在每一本書前都停很久，先看封底、版權頁，最後才翻價格。\n\n宇軒沒有問她買不買，只替她記住想找的書位。臨走前，她用舊書攤老闆給的工錢買下一本薄薄的詩集。',effect:s=>s.flags.browsedWithYuting=true,next:'fairmeet11'},
 withjiaying11:{text:'佳穎在樂譜攤找到校慶彈過的曲子。正式印刷的譜比她手抄的整齊，價格卻要一百二十元。\n\n她翻了很久，最後仍放回去。\n\n「我已經會彈了，買它只是想證明那天真的發生過。」',effect:s=>s.flags.sawJiayingLeaveScore=true,next:'fairmeet11'},
 withjiahao11:{text:'家豪蹲在漫畫區，身旁已堆了七本。\n\n「你買得起嗎？」\n\n「我在做選秀。」\n\n最後他只挑一本，剩下的逐冊送回原位，表情比教練刪名單還痛苦。',effect:s=>s.flags.helpedJiahaoChooseComic=true,next:'fairmeet11'},
 fairmeet11:{location:'港南區・展覽館入口',text:'下午四點，四個人真的在紅柱旁碰面。\n\n沒有人遲到，也沒有人站在另一根柱子下面。家豪舉起漫畫，像贏得某種冠軍；雨婷抱著詩集；佳穎兩手空空，卻把每張免費樂譜目錄都帶走了。',next:'seawall11'},
 seawall11:{location:'港南區・海堤',bg:'linear-gradient(150deg,#727b77,#516460 52%,#304043)',text:'回程列車還有四十分鐘。四人沿著展覽館後方走到海堤。\n\n冬天的海是灰藍色，風把衣角吹得貼在身上。遠處貨輪只剩黑色輪廓，浪撞上消波塊後化成細白的霧。\n\n佳穎提議拍一張新的合照。',choices:[['請路人替四人拍','seaphoto11'],['用定時器把相機放在石牆上','timerphoto11'],['說第一張合照已經夠好了','keepfirst11']]},
 seaphoto11:{text:'一名牽著小孩的婦人替他們按下快門。\n\n這次四個人都看著鏡頭。家豪的頭髮被風吹得豎起，雨婷抱緊詩集，佳穎站在宇軒旁邊，兩人的袖子被風吹到一起。',effect:s=>{s.flags.tookSeaGroupPhoto=true;s.memories.push('港南海風吹亂的第二張合照')},next:'returnstation11'},
 timerphoto11:{text:'佳穎把相機放在石牆上，設定十秒。\n\n快門倒數時，四個人一起跑向海堤。家豪差點滑倒，宇軒伸手拉他；照片拍下的瞬間，所有人都在笑他。\n\n這張依然沒有人好好站著。',effect:s=>{s.flags.tookTimerGroupPhoto=true;s.memories.push('海堤上再次沒站好的合照')},next:'returnstation11'},
 keepfirst11:{speaker:'陳宇軒',text:'「第一張不是很好嗎？」\n\n「照片又不是只能有一張。」佳穎說。\n\n她最後只拍下三個人望向海面的背影，自己沒有入鏡。宇軒回頭時，快門聲剛好被海風吹散。',effect:s=>s.flags.jiayingPhotographedBacks=true,next:'returnstation11'},
 returnstation11:{location:'港南車站・月台',text:'傍晚五點二十五分，四人提早站上正確的月台。\n\n回程車燈從彎道出現時，家豪忽然說：「今天如果我們沒找到彼此，會怎樣？」\n\n「各自回家啊。」佳穎說。\n\n「那下星期到學校再吵。」雨婷補充。',next:'ch11end'},
 ch11end:{chapter:'第十一章・完',date:'1988年12月10日｜星期六',location:'島北車站・夜',bg:'linear-gradient(155deg,#595c58,#3c4947 55%,#263032)',text:'晚上七點，他們回到島北車站。東側大鐘仍和早上一樣走著，彷彿那場走散從未發生。\n\n沒有手機的年代，人一旦離開約好的地方，就可能真的找不到。\n\n所以等待不是浪費，說清楚地點也不是多餘。\n\n更重要的是，有時候你得相信那個沒有出現的人，也正在城市另一端，努力找你。',next:'ch12title'},

 ch12title:{chapter:'第十二章｜一九八八年的最後一晚',date:'1988年12月31日｜星期六',location:'島北市・陳家',bg:'linear-gradient(155deg,#68645d,#46524f 52%,#2a3537)',text:'一九八八年的最後一天，島北市沒有大型倒數煙火。\n\n電視節目照常播放，商店只在櫥窗貼上「迎接新年」的紅紙。對大多數人來說，十二月三十一日只是又一個寒冷的星期六。\n\n對宇軒他們而言，卻是約好要在老地方見面的晚上。',next:'permission12'},
 permission12:{speaker:'媽媽',text:'「十一點還要出去？」\n\n母親正在廚房準備宵夜，聽見集合時間便皺眉。\n\n「十二點半以前回來。不要跑去車站，也不准靠近河邊。」\n\n老地方就在河堤公園。宇軒和以晴同時看向彼此。',choices:[['老實說要去河堤','telltruth12'],['只說在家豪家附近','vagueplace12'],['答應後再想辦法','agreefirst12']]},
 telltruth12:{speaker:'陳宇軒',text:'「我們就在河堤公園，不會靠近水。」\n\n母親立刻說不行。父親從報紙後抬起頭，沉默片刻。\n\n「讓他去吧。十六歲了，約好的事要自己負責。」\n\n母親看了父親很久，最後把門邊的圍巾丟給宇軒，又把十二點半重複了一次。',effect:s=>s.flags.toldTruthNewYears=true,next:'sistergift12'},
 vagueplace12:{speaker:'陳宇軒',text:'「就在家豪家附近。」\n\n這不算完全說謊，河堤只隔了幾條街。母親仍叮囑了三次時間。\n\n宇軒穿鞋時，以晴蹲在旁邊小聲說：「你明明要去老地方。」\n\n「不要告密。」\n\n「看你拿什麼交換。」',effect:s=>s.flags.wasVagueNewYears=true,next:'sistergift12'},
 agreefirst12:{text:'宇軒先答應所有規定。\n\n母親轉身回廚房後，他才看鐘：十點二十五分。再不出門，自己就會變成站在另一座大鐘下的家豪。\n\n以晴從房門後招手，手裡拿著一個用報紙包起來的小東西。',effect:s=>s.flags.agreedNewYearRules=true,next:'sistergift12'},
 sistergift12:{speaker:'陳以晴',text:'「這個帶去。」\n\n報紙裡是一張她畫的小卡。四個穿制服的人站在橘色屋頂下，旁邊歪歪地寫著：新年快樂。\n\n「妳什麼時候看過他們？」\n\n「你照片放在課本裡，我有看到。」',choices:[['把卡片帶上','takecard12'],['笑她把家豪畫得太高','teaseart12']]},
 takecard12:{speaker:'陳宇軒',text:'「謝啦。」\n\n「是給大家的，不是只給你。」\n\n以晴把卡片塞進他外套內袋，又替他把圍巾拉好。\n\n「十二點半真的要回來，不然我也會被罵。」',effect:s=>{s.flags.tookSisterNewYearCard=true;s.items.push('以晴畫的新年卡片')},next:'walkoldplace12'},
 teaseart12:{speaker:'陳宇軒',text:'「妳把家豪畫太高了。」\n\n「那個是你。」\n\n「我哪有那麼高？」\n\n以晴把卡片搶回去改了兩筆，結果四個人都變得一樣矮。宇軒笑著把它收進口袋。',effect:s=>{s.flags.teasedSisterNewYearArt=true;s.items.push('以晴修改過的新年卡片')},next:'walkoldplace12'},
 walkoldplace12:{location:'島北市・冬夜',bg:'linear-gradient(155deg,#5b5d58,#3d4a48 54%,#263133)',text:'十一點以前，街上的風已經帶著刺骨的冷。\n\n麵店早已打烊，錄影帶出租店仍亮著燈。幾戶人家把電視聲開得很大，主持人正在回顧這一年的新聞。\n\n宇軒沿著熟悉的路走向河堤，口袋裡除了卡片，還有一本包好的小說。',next:'oldplacearrival12'},
 oldplacearrival12:{location:'島北市・河堤公園',text:'老地方的籃框仍沒有網子。紅土空地被夜露打濕，路燈把每一口呼吸照成白霧。\n\n雨婷最早到，手裡提著四罐玻璃瓶汽水；家豪帶來一台小收音機。\n\n佳穎最後出現，圍著一條深色圍巾，懷裡抱著四個用舊月曆紙包好的東西。',next:'giftidea12'},
 giftidea12:{speaker:'張佳穎',text:'「新年禮物。一人抽一個，不准挑。」\n\n「妳昨天電話裡沒說要準備禮物。」家豪說。\n\n「所以只有我準備啊。」\n\n她把四包東西放在長椅。大小幾乎一樣，只有其中一包角落畫著一個很小的音符。',choices:[['抽畫著音符的','picknote12'],['讓雨婷先選','letyutingpick12'],['閉眼隨便抽','randomgift12']]},
 picknote12:{text:'宇軒拿起畫著音符的那包。佳穎的手像想攔一下，最後又收回去。\n\n裡面是一卷空白錄音帶，標籤上只寫著：一九八八。\n\n「回家再聽。」她說。',effect:s=>{s.flags.gotJiayingYearTape=true;s.items.push('佳穎錄的「一九八八」卡帶')},next:'othergifts12'},
 letyutingpick12:{text:'雨婷先拿了一包，裡面是一本袖珍記事本。家豪抽到護腕，立刻戴在外套袖子上。\n\n剩下兩包，宇軒拿到畫著音符的錄音帶；佳穎則拿走自己留給自己的底片收納冊。',effect:s=>{s.flags.gotJiayingYearTape=true;s.items.push('佳穎錄的「一九八八」卡帶')},next:'othergifts12'},
 randomgift12:{text:'宇軒閉眼抽走最靠右的一包。拆開後仍是那卷寫著「一九八八」的錄音帶。\n\n「妳是不是故意放到我面前？」\n\n「你有證據嗎？」\n\n佳穎把剩下的禮物分給另外兩人，始終沒有正面回答。',effect:s=>{s.flags.gotJiayingYearTape=true;s.items.push('佳穎錄的「一九八八」卡帶')},next:'othergifts12'},
 othergifts12:{speaker:'李家豪',text:'「為什麼我的只有護腕？」\n\n「因為你最需要實用的。」佳穎說。\n\n雨婷翻開記事本，第一頁寫著四人的電話和生日。她停了幾秒，輕輕把本子闔上。\n\n宇軒摸著錄音帶透明盒。裡面的曲名被紙遮住，看不見。',next:'giveown12'},
 giveown12:{text:'宇軒也拿出自己準備的東西。\n\n那本小說是雨婷在舊書攤替他保留的同作者作品；他後來用零用錢買下，卻沒有寫收件人的名字。\n\n口袋裡還有以晴的新年卡。',choices:[['把小說送給佳穎','noveltojiaying12'],['把小說送給雨婷','noveltoyuting12'],['留作四人共同傳閱','sharednovel12']]},
 noveltojiaying12:{speaker:'陳宇軒',text:'「這本給妳。不是說想知道我最近在看什麼？」\n\n佳穎接過書，翻到扉頁。宇軒什麼也沒寫。\n\n「看完可以跟雨婷吵結尾。」\n\n「那你呢？」\n\n「我負責看你們吵。」',effect:s=>{s.flags.gaveNovelJiaying=true;s.memories.push('在一九八八年最後一晚送佳穎一本小說')},next:'sistercard12'},
 noveltoyuting12:{speaker:'陳宇軒',text:'「這本妳應該還沒看過。」\n\n雨婷看見作者，眼睛立刻亮起。\n\n「你不是找很久？」\n\n「看完再借我。」\n\n她把書抱在懷裡，答應不在上面畫線。',effect:s=>{s.flags.gaveNovelYuting=true;s.memories.push('在一九八八年最後一晚送雨婷一本小說')},next:'sistercard12'},
 sharednovel12:{speaker:'陳宇軒',text:'「這本放我這裡，大家輪流看。」\n\n「家豪也要？」佳穎問。\n\n「我為什麼不能看？」\n\n「因為沒有圖。」\n\n家豪立刻搶走，宣布自己第一個借。',effect:s=>{s.flags.sharedNewYearNovel=true;s.items.push('四人約好傳閱的小說')},next:'sistercard12'},
 sistercard12:{text:'宇軒拿出以晴的卡片。\n\n四個人湊到路燈下看。家豪花了很久分辨哪一個是自己，雨婷注意到每個人的制服顏色都畫對了；佳穎則一直看著橘色屋頂。\n\n「你妹妹很會畫欸。」她說。\n\n宇軒第一次沒有把以晴的畫稱作隨便畫畫。',effect:s=>{s.flags.sharedSisterArt=true;s.memories.push('四個人在路燈下看以晴的新年卡')},next:'yearreview12'},
 yearreview12:{speaker:'李家豪',text:'「今年最厲害的事，當然是我進棒球隊。」\n\n「你才練兩個月。」佳穎說。\n\n「兩個月也是進。」\n\n雨婷想了想，說是第一次有同學去她常去的舊書攤。佳穎說校慶沒有彈到一半逃走。\n\n三人一起看向宇軒。',choices:[['說是認識大家','bestfriends12'],['說是第一次打那通電話','bestcall12'],['說還沒想到','bestunknown12']]},
 bestfriends12:{speaker:'陳宇軒',text:'「大概是認識你們吧。」\n\n「什麼叫大概？」家豪立刻抗議。\n\n「認識你是很多年前的事，不算今年。」\n\n佳穎笑得彎下腰，雨婷則把汽水瓶輕輕碰上宇軒手裡那一罐。',effect:s=>{s.flags.saidMeetingThemBest=true;s.memories.push('把認識大家選作一九八八年最好的事')},next:'radiocount12'},
 bestcall12:{speaker:'陳宇軒',text:'「第一次打給一個人，結果講到被我媽催。」\n\n佳穎看著他。\n\n「哪一個人？」\n\n「普通同學。」\n\n她拿汽水瓶撞了他一下，玻璃發出清脆的一聲。',effect:s=>{s.flags.saidFirstCallBest=true;s.memories.push('承認第一次和佳穎通電話是今年最好的事')},next:'radiocount12'},
 bestunknown12:{speaker:'陳宇軒',text:'「還沒想到。可能要過幾年才知道。」\n\n雨婷點頭。\n\n「有些事情發生的時候，看不出來重不重要。」\n\n佳穎把手伸向收音機旋鈕。\n\n「那就先記著，以後再選。」',effect:s=>s.flags.leftBestYearOpen=true,next:'radiocount12'},
 radiocount12:{text:'午夜將近，收音機主持人開始替聽眾倒數。\n\n家豪把音量轉到最大，四個人一起跟著數：十、九、八……\n\n數到三時，訊號忽然被一陣雜音蓋住。四個人靠近收音機，誰也沒聽清楚新年究竟在哪一秒開始。',next:'newyearmoment12'},
 newyearmoment12:{text:'遠處寺廟敲起鐘，住宅區傳來零星鞭炮聲。\n\n「反正現在就是了。」佳穎說。\n\n四個玻璃瓶在路燈下碰在一起。汽水早已不冰，氣泡也少了大半。\n\n「新年快樂。」\n\n他們各自說了一次，聲音疊在風裡。',effect:s=>{s.flags.crossedInto1989Together=true;s.memories.push('在沒有聽清楚的那一秒一起走進一九八九年')},next:'futurepromise12'},
 futurepromise12:{speaker:'張佳穎',text:'「明年也來這裡吧。」\n\n「明年我可能要比賽。」家豪說。\n\n「那就比完再來。」\n\n雨婷問：「如果下雨呢？」\n\n「撐傘啊。」\n\n佳穎一個個回答，像所有阻礙都有簡單的解法。最後她看向宇軒。\n\n「你呢？」',choices:[['答應明年一定來','promise1989_12'],['說到時候再看','maybe1989_12'],['問她如果大家走散怎麼辦','askdrift12']]},
 promise1989_12:{speaker:'陳宇軒',text:'「我一定來。」\n\n「說好了。」\n\n佳穎伸出小指，伸到一半又覺得太幼稚，改成握拳。宇軒用拳頭輕輕碰了她一下。\n\n十六歲時說出的『一定』，總讓人以為時間也會遵守。',effect:s=>{s.flags.promisedNextNewYear=true;s.memories.push('答應下一個年末還要回老地方')},next:'walkhome12'},
 maybe1989_12:{speaker:'陳宇軒',text:'「到時候再看吧，誰知道會怎樣。」\n\n佳穎臉上的笑停了很短的一瞬。\n\n「也是。」她說。\n\n接著又像平常一樣，轉頭催家豪把垃圾收好。',effect:s=>s.flags.didNotPromiseNextYear=true,next:'walkhome12'},
 askdrift12:{speaker:'陳宇軒',text:'「如果到時候有人走散呢？」\n\n家豪立刻說：「去另一座大鐘找。」\n\n三個人一起笑。佳穎笑完才回答：\n\n「那就約清楚一點。真的找不到，就多等一下。」\n\n她說得像車站的事，也像更久以後的事。',effect:s=>{s.flags.askedAboutDriftingApart=true;s.memories.push('佳穎說真的找不到，就多等一下')},next:'walkhome12'},
 walkhome12:{location:'島北市・回家路上',text:'凌晨十二點十二分，四人開始往回走。\n\n先送雨婷到公車站，再陪佳穎走到大路口。家豪最後一個轉進巷子，離開前還提醒宇軒明天要把護腕帶去看。\n\n街上重新安靜，只剩宇軒一個人。新的一年看起來和半小時前沒有任何不同。',next:'tapehome12'},
 tapehome12:{location:'陳宇軒的房間・深夜',bg:'linear-gradient(155deg,#55534f,#394441 55%,#242e30)',text:'凌晨十二點二十九分，宇軒踩著母親規定的最後一分鐘進門。\n\n所有人睡下後，他把「一九八八」放進錄音機。\n\nA 面是這幾個月聊過的歌：冰果室播放過的、電話裡提過的、校慶彈過的。曲目之間保留著按鍵聲與沒有剪乾淨的廣播。',next:'tapemessage12'},
 tapemessage12:{speaker:'張佳穎・錄音',text:'最後一首歌結束後，磁帶沒有立刻停。\n\n沙沙聲持續了幾秒，佳穎的聲音忽然很近地出現：\n\n「陳宇軒，如果你有聽到這裡，代表你真的很閒。」\n\n她在錄音裡笑了一下。背景傳來張家那座時鐘的聲音。',next:'tapemessage2_12'},
 tapemessage2_12:{speaker:'張佳穎・錄音',text:'「這些歌我都沒有錄完整。有的前面少一點，有的後面被我媽叫去吃飯。」\n\n「可是……今年本來也就不是很完整嘛。」\n\n她停了很久。\n\n「剩下的，明年再錄。」\n\n喀一聲，錄音在這裡結束。',effect:s=>{s.flags.heardJiayingYearMessage=true;s.memories.push('佳穎在錄音帶裡說：剩下的，明年再錄')},next:'ch12end'},
 ch12end:{chapter:'第十二章・完',date:'1989年1月1日｜星期日',location:'島北市・凌晨',bg:'linear-gradient(155deg,#4f514e,#34413f 56%,#222c2e)',text:'錄音帶轉到盡頭，機器自動彈起。\n\n窗外沒有煙火，沒有歡呼。島北市在睡夢中跨進一九八九年，明天的公車仍會沿著相同的路線行駛。\n\n宇軒把卡帶翻到空白的 B 面，卻沒有按下錄音鍵。\n\n十六歲的他相信還有很多時間。\n\n還有下一通電話、下一張照片、下一次校慶，以及下一個一定會在老地方碰面的年末。\n\n他不知道，青春最讓人惋惜的，從來不是某一天結束了。\n\n而是身在其中時，沒有人知道那一天正在成為回憶。\n\n——第一學期・完',next:'ch13title'},

 ch13title:{chapter:'第十三章｜新學期的座位',date:'1989年2月13日｜星期一',location:'島北高中・一年三班',bg:'linear-gradient(150deg,#7a756a,#56635f 52%,#323e40)',text:'寒假結束後的第一個早晨，教室裡有一種久未使用的氣味。\n\n桌面覆著薄灰，黑板角落還留著年前沒有擦乾淨的粉筆字。每個人都穿得比上學期厚，說話時偶爾帶出一點白霧。\n\n宇軒走進一年三班，第一眼便看見黑板上的新座位表。',next:'seatmap13'},
 seatmap13:{text:'四個人的名字被分到教室四個方向。\n\n家豪在最後一排靠門；雨婷坐到講台正前方；佳穎在中間靠窗。宇軒的新位置，則在另一側牆邊。\n\n上學期形成的那些固定座位、回頭就能說話的距離，一夜之間全被粉筆重新安排。',choices:[['先去看佳穎的新位置','lookjiaying13'],['走到家豪旁邊抱怨','lookjiahao13'],['幫雨婷搬講義到前排','helpyuting13']]},
 lookjiaying13:{text:'佳穎正蹲在窗邊擦桌腳。她抬頭看到宇軒，先指了指兩人之間隔著的三排桌椅。\n\n「以後上課不能踢你椅子了。」\n\n語氣像是在開玩笑，眼神卻在座位表上多停了一秒。',effect:s=>s.flags.noticedSeatDistance=true,next:'cassetteback13'},
 lookjiahao13:{speaker:'李家豪',text:'「老師一定是故意的。」\n\n家豪把書包丟上最後一排，語氣悲壯得像被放逐。\n\n「她把全班最需要互相照顧的四個人拆開了。」\n\n「你是最需要別人照顧的那個吧。」佳穎隔著教室回他。',effect:s=>s.flags.complainedSeatsWithJiahao=true,next:'cassetteback13'},
 helpyuting13:{text:'雨婷的桌上已經堆了整疊新學期通知。宇軒替她把講義分成四份，搬到講台旁。\n\n「謝謝。其實坐前面也好，至少老師找班長的時候不用一直回頭。」\n\n她笑了一下，像早已習慣先替不方便找到理由。',effect:s=>s.flags.helpedNewTermPapers=true,next:'cassetteback13'},
 cassetteback13:{location:'島北高中・早自習前',text:'宇軒回到自己的新座位，抽屜裡放著一只透明錄音帶盒。\n\n盒內是那卷「一九八八」，外殼多了一張新的手寫曲目表。最後一行只有：B1——空白。\n\n他抬起頭。佳穎已經坐到窗邊，假裝很忙地整理鉛筆盒。',choices:[['隔著教室舉起錄音帶','raisetape13'],['下課再走過去還她','returnlater13'],['在曲目表背面寫一句話','writenote13']]},
 raisetape13:{text:'宇軒把錄音帶舉到肩膀高度。\n\n佳穎用眼角看見了，沒有轉頭，只把右手藏在課本後面，朝他比了一個很小的「噓」。\n\n黃老師正好踏進教室。兩人同時低下頭。',effect:s=>s.flags.secretTapeSignal=true,next:'teacherreturn13'},
 returnlater13:{location:'島北高中・下課',speaker:'張佳穎',text:'「你真的有聽到最後？」\n\n佳穎接過錄音帶，拇指按住盒子邊緣，沒有立刻收進書包。\n\n宇軒點頭。她「喔」了一聲，彷彿只是確認卡帶沒有壞掉。',effect:s=>s.flags.confirmedTapeEnding=true,next:'tapeanswer13'},
 writenote13:{text:'宇軒把曲目表抽出來，在「B1——空白」後面補了四個字：留給今年。\n\n下課後，他把錄音帶放到佳穎桌上。她讀完沒有說話，只把紙折好，收進鉛筆盒最裡面。',effect:s=>{s.flags.wroteTapeReply=true;s.memories.push('寫在錄音帶曲目表上的「留給今年」')},next:'teacherreturn13'},
 teacherreturn13:{speaker:'黃子芸',text:'「座位先坐兩個星期。如果真的看不到黑板，再跟我說。」\n\n黃老師把點名簿放下，教室裡立刻出現幾聲抗議。\n\n「但『離朋友太遠』不算視力問題。」\n\n全班笑起來。宇軒不知道為什麼，第一個看向了窗邊。',next:'newtermnotice13'},
 tapeanswer13:{text:'走廊上的人聲從兩人之間穿過。佳穎把錄音帶抱在課本後面，像是在等宇軒先替那段深夜錄音決定一個不會太尷尬的名字。',choices:[['「妳那句話害我重聽三次。」','threetimes13'],['「B 面真的要留給今年？」','askbside13'],['不問錄音，只說很好聽','saygood13']]},
 threetimes13:{speaker:'張佳穎',text:'「有什麼好重聽的？」\n\n「想確認是不是錄錯。」\n\n「那你確認到了嗎？」\n\n宇軒想了一會兒。「沒有。」\n\n佳穎笑了，這次沒有再追問。',effect:s=>s.flags.toldTapeReplay=true,next:'newtermnotice13'},
 askbside13:{speaker:'張佳穎',text:'「不然呢？你想把它拿去錄英文單字喔？」\n\n她把卡帶盒闔上。\n\n「等今年也有值得留下來的聲音再說。」\n\n這句話聽起來很普通，宇軒卻記了整個早上。',effect:s=>s.flags.promisedBside=true,next:'newtermnotice13'},
 saygood13:{speaker:'陳宇軒',text:'「很好聽。」\n\n佳穎愣了一下。「歌嗎？」\n\n「全部。」\n\n上課鐘在她回答以前響起。兩人各自穿過桌椅回到座位，那句沒有說清楚的話便留在教室中央。',effect:s=>s.flags.saidTapeAllGood=true,next:'newtermnotice13'},
 newtermnotice13:{speaker:'黃子芸',text:'「這學期五月有校外教學，六月底完成一年級課程。還有，升二年級以前要填第一次志願調查。」\n\n黑板上寫下「文組、理組」四個字。\n\n明明距離六月還很遠，教室裡卻像突然出現一扇必須選邊走的門。',next:'lunchfuture13'},
 lunchfuture13:{location:'島北高中・午休',text:'午餐後，四個人把椅子搬到窗邊。新座位讓這件事變得比以前麻煩，家豪還差點踢翻別人的便當盒。\n\n志願調查表攤在四人中間，誰都沒有先動筆。',choices:[['問大家想選哪一組','askgroup13'],['說現在決定太早了','tooearly13'],['先拿家豪的表亂勾','teaseform13']]},
 askgroup13:{speaker:'黃雨婷',text:'「我大概會選文組。」\n\n雨婷回答得最先，聲音卻很輕。佳穎說她還不知道；家豪則問哪一組比較少數學。\n\n三個答案都不像真正的答案。',effect:s=>s.flags.knowsYutingWantsArts=true,next:'yuxuanfuture13'},
 tooearly13:{speaker:'張佳穎',text:'「老師只是先調查，又不是明天就分班。」\n\n佳穎把表格折回去。\n\n「可是有些大人很喜歡問，好像十六歲如果不知道以後要做什麼，就會來不及。」',effect:s=>s.flags.jiayingResistsFutureQuestion=true,next:'yuxuanfuture13'},
 teaseform13:{speaker:'李家豪',text:'「欸！不要幫我填家政組！」\n\n「學校根本沒有家政組。」\n\n家豪把表搶回來，四個人笑成一團。笑聲停下以後，那張空白表格仍躺在桌上。',effect:s=>s.flags.jokedAboutTracks=true,next:'yuxuanfuture13'},
 yuxuanfuture13:{speaker:'張佳穎',text:'「那你呢？」\n\n她問的是宇軒。窗外風把她額前的短髮吹亂，也把桌上的調查表翻起一角。\n\n宇軒第一次發現，不知道答案和不想回答，是兩件不同的事。',choices:[['「我真的還不知道。」','honestfuture13'],['「家豪去哪我就去哪。」','followjiahao13'],['「先選不會被當掉的。」','safefuture13']]},
 honestfuture13:{speaker:'陳宇軒',text:'「我真的還不知道。」\n\n佳穎沒有替他想，也沒有說「慢慢來」。她只是點點頭。\n\n「那就先不知道。」\n\n那一刻，宇軒覺得不知道好像也沒有那麼可恥。',effect:s=>s.flags.admittedNoFuturePlan=true,next:'walknewseat13'},
 followjiahao13:{speaker:'李家豪',text:'「你不要害我壓力很大，我可能哪一組都進不去。」\n\n雨婷笑著把兩張表分開。佳穎看了宇軒一眼，似乎知道他只是拿玩笑避開答案，卻沒有拆穿。',effect:s=>s.flags.avoidedFutureWithJoke=true,next:'walknewseat13'},
 safefuture13:{speaker:'張佳穎',text:'「那不叫選，是逃。」\n\n她說完又覺得太直接，把鉛筆在指間轉了一圈。\n\n「不過我可能也會這樣。」\n\n兩個人對著空白表格沉默了一會兒。',effect:s=>s.flags.sharedFutureUncertainty=true,next:'walknewseat13'},
 walknewseat13:{location:'島北高中・放學走廊',text:'放學後，四個人從教室的四個角落收好書包，又在門口重新集合。\n\n座位變遠了，放學的路卻還是一樣。家豪跑去練球；雨婷趕五點十分的公車。最後只剩宇軒與佳穎沿著長廊慢慢走。',next:'stairpromise13'},
 stairpromise13:{speaker:'張佳穎',text:'「坐那麼遠，你上課不要睡著。」\n\n「妳又看不到。」\n\n「我看得到啊。」\n\n佳穎說完才發現這句話不太對，立刻改口：「我是說，老師看得到。」',choices:[['假裝沒有聽出差別','ignoremeaning13'],['笑她是不是一直看自己','teaselook13'],['答應下課會去找她','promisebreak13']]},
 ignoremeaning13:{speaker:'陳宇軒',text:'「那妳幫我注意老師有沒有走過來。」\n\n佳穎鬆了一口氣。「我才不要。」\n\n兩人走下樓梯，沒有再提她究竟看得到什麼。',effect:s=>s.flags.letJiayingHideLook=true,next:'ch13end'},
 teaselook13:{speaker:'陳宇軒',text:'「妳上課一直看我喔？」\n\n「誰看你！」\n\n佳穎快走兩階，把宇軒甩在後面。走到轉角時，她還是停下來等了。',effect:s=>s.flags.teasedJiayingLooking=true,next:'ch13end'},
 promisebreak13:{speaker:'陳宇軒',text:'「下課我會過去啦。」\n\n佳穎握著樓梯扶手，回頭看他。\n\n「我又沒有叫你來。」\n\n她嘴上這樣說，第二節下課卻在桌角替他留了一小塊可以靠著聊天的位置。',effect:s=>{s.flags.promisedBreakVisits=true;s.memories.push('新座位之間，每節下課走過的三排桌椅')},next:'ch13end'},
 ch13end:{chapter:'第十三章・完',date:'1989年2月13日｜星期一',location:'島北市・夜',bg:'linear-gradient(155deg,#615d56,#414b48 55%,#283234)',text:'晚上，宇軒把志願調查表壓在書桌玻璃下。\n\n錄音機裡沒有卡帶，轉軸仍在按下播放鍵後空轉了幾秒。\n\n新學期把他們的座位拆開，也把未來第一次放到眼前。可在那些還沒有答案的問題之外，仍有一些事情很簡單：\n\n下課鐘響了，就穿過三排桌子去找一個人。',next:'ch14title'},

 ch14title:{chapter:'第十四章｜十七號的第一場比賽',date:'1989年3月4日｜星期六',location:'島北高中・棒球場',bg:'linear-gradient(150deg,#8b8069,#627066 50%,#394746)',text:'三月第一個星期六，校隊與鄰校打練習賽。\n\n看台只有三排水泥座位，記分板得用手把數字牌一塊塊掛上去。風從外野吹進來，帶著紅土、青草和遠處工廠煙囪的味道。\n\n家豪穿著十七號球衣，第一次被排進先發名單。',next:'arrivegame14'},
 arrivegame14:{text:'宇軒到球場時，雨婷已經拿報紙墊好位置。佳穎抱著相機坐在最上排，身旁放著四瓶彈珠汽水。\n\n「你遲到三分鐘。」\n\n「比家豪第一次集合遲到四十分鐘好多了吧。」\n\n球場另一端，家豪正在做傳接球，完全沒有往看台看。',choices:[['大聲喊十七號加油','shout1714'],['先安靜看他熱身','watchwarm14'],['問佳穎是不是特地帶相機','askcamera14']]},
 shout1714:{speaker:'陳宇軒',text:'「十七號！不要漏球喔！」\n\n家豪肩膀明顯縮了一下，回頭朝看台比出一個很難看的手勢。隊友全笑了。\n\n「你害他更緊張了。」雨婷說。',effect:s=>s.flags.embarrassedJiahaoGame=true,next:'firstinning14'},
 watchwarm14:{text:'家豪接每一球都比平常用力。球進手套的聲音乾脆，傳出去以前，他總會下意識甩一下右手。\n\n宇軒認識他多年，第一次看見他把所有玩笑收起來。',effect:s=>s.flags.sawJiahaoSeriousWarmup=true,next:'firstinning14'},
 askcamera14:{speaker:'張佳穎',text:'「不然咧？拿來拍你吃汽水塞子的樣子嗎？」\n\n她低頭調整底片，語氣仍像平常。\n\n「他第一次先發，總要留一張吧。」\n\n雨婷把這句話聽進去，微微笑了一下。',effect:s=>s.flags.jiayingRecordsFriends=true,next:'firstinning14'},
 firstinning14:{text:'一局上，第一顆球就打向家豪守的二壘方向。\n\n白球擦過投手丘，在紅土上彈出不規則的高度。家豪往左跨了一步，手套卻慢了半拍。\n\n球從他身側穿過外野。',next:'error14'},
 error14:{speaker:'記錄員',text:'「安打。」\n\n場邊記錄員沒有判失誤。家豪卻站在原地，把手套往腿上拍了一下。\n\n接下來兩個打席，他的動作明顯變得僵硬。教練在休息區叫了他的名字。',choices:[['從看台叫他看下一球','nextball14'],['什麼都不喊，讓他自己調整','silentsupport14'],['請雨婷一起喊他的綽號','groupcheer14']]},
 nextball14:{speaker:'陳宇軒',text:'「家豪！下一球！」\n\n聲音穿過鐵網。家豪沒有回頭，只把手套重新拉緊。\n\n下一個滾地球再度往二壘去，他穩穩接住，踩壘後傳向一壘，完成雙殺。',effect:s=>s.flags.calledNextBall=true,next:'dugoutlook14'},
 silentsupport14:{text:'宇軒忍住沒有出聲。\n\n他知道家豪最討厭別人用安慰的語氣提醒他失敗。下一球來時，家豪自己往前一步，把彈跳封在胸前，再從容傳向一壘。',effect:s=>s.flags.trustedJiahaoAdjust=true,next:'dugoutlook14'},
 groupcheer14:{speaker:'三人',text:'「遲到王！不要發呆！」\n\n附近家長全轉過來。家豪瞪了看台一眼，嘴角卻終於鬆開。\n\n下一球，他向右撲下滾地球，雖然沒來得及傳殺，至少把球留在內野。',effect:s=>s.flags.cheeredJiahaoNickname=true,next:'dugoutlook14'},
 dugoutlook14:{text:'攻守交換時，家豪跑回休息區。經過看台下方，他迅速抬頭看了一眼。\n\n那一眼很短，短到像只是確認風向。\n\n宇軒卻知道，他是在確認三個人仍然坐在那裡。',next:'fathergate14'},
 fathergate14:{text:'三局下，宇軒在校門方向看見一個穿深色夾克的中年男人。\n\n男人沒有走上看台，只站在外野鐵網外，手裡提著工地用的黃色安全帽。雨婷也注意到了。\n\n「那是不是家豪的爸爸？」',choices:[['立刻告訴家豪','telljiahao14'],['先別讓家豪分心','keepfatherquiet14'],['走過去向他打招呼','greetfather14']]},
 telljiahao14:{text:'宇軒趁家豪走近休息區時指向外野。\n\n家豪只看了一眼，便立刻轉回球場。下一個打席，他揮空了兩顆明顯的壞球。\n\n第三球前，他深吸一口氣，才把球棒重新握穩。',effect:s=>s.flags.toldFatherPresent=true,next:'atbat14'},
 keepfatherquiet14:{speaker:'陳宇軒',text:'「先不要講。」\n\n三個人默契地沒有再看外野。男人始終站在鐵網外，像還沒有決定自己算不算這場比賽的觀眾。',effect:s=>s.flags.keptFatherPresenceQuiet=true,next:'atbat14'},
 greetfather14:{location:'島北高中・外野鐵網',speaker:'家豪的父親',text:'宇軒繞到外野。男人認出他，先看球場，又看手裡的安全帽。\n\n「我只是剛好經過。」\n\n星期六、穿著工作服、站了三局的剛好經過。宇軒沒有拆穿，只把看台還有空位告訴他。',effect:s=>s.flags.invitedJiahaoFatherSit=true,next:'atbat14'},
 atbat14:{location:'島北高中・本壘',text:'五局下，兩出局，二壘有人。家豪走進打擊區。\n\n比分一比二。投手第一球是外角直球，家豪沒有揮。第二球偏高，他仍忍住。\n\n看台安靜下來，只剩球衣被風吹動的聲音。',choices:[['相信他自己的選擇','trustswing14'],['提醒他不要急','dontchase14'],['握緊欄杆，不出聲','holdrail14']]},
 trustswing14:{text:'第三球進到內角。家豪轉動腰身，球棒擊中球心。\n\n白球飛過游擊手頭頂，在左外野落地。二壘跑者回到本壘，家豪站上一壘，第一次朝看台用力揮拳。',effect:s=>{s.flags.jiahaoFirstRBI=true;s.memories.push('家豪十七號球衣的第一支追平安打')},next:'gameend14'},
 dontchase14:{speaker:'陳宇軒',text:'「不要追壞球！」\n\n第三球幾乎貼著外角滑過，家豪收住棒。滿球數後，他把第六球打成右外野前安打，送回追平分。\n\n跑上一壘時，他對宇軒做了個閉嘴的手勢。',effect:s=>s.flags.jiahaoPatientRBI=true,next:'gameend14'},
 holdrail14:{text:'宇軒握著冰冷的鐵欄杆。\n\n家豪把第三球打向右半邊，二壘手撲到球卻傳不及。一壘安全，二壘跑者繞過三壘回來得分。\n\n記分板上的一，慢慢換成二。',effect:s=>s.flags.silentRBIWitness=true,next:'gameend14'},
 gameend14:{text:'比賽最後以三比三結束。沒有延長，也沒有誰被抬起來慶祝。\n\n球員排隊敬禮後，家豪抱著手套跑向看台，第一句話卻是：「第一局那顆算安打吧？」\n\n三個人同時回答：「算失誤。」',next:'fatherafter14'},
 fatherafter14:{location:'島北高中・球具室外',text:'家豪的父親已經不在外野。\n\n球具室門口卻放著一瓶運動飲料，瓶身下壓著一張工地便條紙：\n\n「站太直，下一球要往前。」\n\n沒有署名。家豪看了很久，把紙折進球衣口袋。',choices:[['說他爸爸其實看完全場','sayfullgame14'],['只問他下場還會不會先發','asknextstart14'],['拍拍他的十七號背號','pat1714']]},
 sayfullgame14:{speaker:'陳宇軒',text:'「他從第三局以前就在了。」\n\n家豪低頭擰開飲料，氣泡一下湧出瓶口。\n\n「喔。」\n\n他只說一個字，卻把那張便條紙又折得更整齊。',effect:s=>s.flags.jiahaoKnowsFatherWatched=true,next:'walkball14'},
 asknextstart14:{speaker:'李家豪',text:'「當然會。就算不是先發，我也會把位置搶回來。」\n\n他把便條紙藏進口袋，像還不準備讓任何人談論它。宇軒便順著他的意思，開始爭論第一局究竟是不是失誤。',effect:s=>s.flags.respectedJiahaoFatherSilence=true,next:'walkball14'},
 pat1714:{text:'宇軒拍了拍十七號背後沾著的紅土。\n\n家豪沒有說謝謝，只把喝過的運動飲料遞來。\n\n「你們三個下次不准喊遲到王。」\n\n「那你先不要遲到。」',effect:s=>s.flags.pattedJiahao17=true,next:'walkball14'},
 walkball14:{location:'島北高中・黃昏',text:'四人離開球場時，夕陽把鐵網的影子拉得很長。佳穎在路邊替家豪拍了一張單人照。\n\n他故意把球棒扛在肩上，擺出職業選手的表情；按下快門前一秒，雨婷在旁邊叫了他的綽號。\n\n照片裡的十七號因此笑得完全不像英雄。',effect:s=>s.flags.jiahaoFirstGamePhoto=true,next:'ch14end'},
 ch14end:{chapter:'第十四章・完',date:'1989年3月4日｜星期六',location:'島北市・夜',bg:'linear-gradient(155deg,#655b4f,#424a46 55%,#283132)',text:'那場練習賽沒有勝負，也不會被校史記住。\n\n家豪回家後把球衣洗了兩次，紅土仍留在膝蓋。父親沒有問比分，只在吃飯時說：「第一局腳步太慢。」\n\n家豪低頭扒飯，過了一會兒才回：\n\n「下一場不會了。」\n\n這是父子第一次用同一種方式，承認那個夢真的存在。',next:'ch15title'},

 ch15title:{chapter:'第十五章｜沒有署名的舊書',date:'1989年3月18日｜星期六',location:'島北市・南門市場',bg:'linear-gradient(150deg,#81715f,#5b645d 52%,#354141)',text:'春天到了，南門市場的風仍帶著冬天留下的涼意。\n\n宇軒照母親交代來買醬油，經過舊書巷時，看見雨婷蹲在攤位後整理紙箱。她身旁放著一只從未見過的鐵皮餅乾盒。\n\n老闆不在，黃色燈泡白天也亮著。',next:'yutingbox15'},
 yutingbox15:{speaker:'黃雨婷',text:'「老闆說這箱書是昨天收來的。」\n\n她從鐵盒裡拿出一本封面脫落的散文集。扉頁寫著一個名字，墨水已經褪成淡褐色。\n\n黃淑芬。\n\n雨婷母親的名字。',next:'recognizebook15'},
 recognizebook15:{text:'雨婷用指腹摸過那三個字。書頁間夾著乾掉的九重葛花瓣，還有一張二十年前的公車月票。\n\n「我爸說，她以前會把看完的書送人。可是我不知道怎麼又回到這裡。」\n\n她說得很平靜，手卻一直沒有翻到下一頁。',choices:[['陪她把書慢慢看完','readwithher15'],['問她要不要立刻帶回家','takehome15'],['先替她把餅乾盒闔上','closebox15']]},
 readwithher15:{text:'宇軒在旁邊坐下。兩人從第一頁開始翻，頁邊有細小鉛筆線，偶爾寫著一兩個字：「喜歡」、「不懂」、「以後再看」。\n\n那些註記不像遺言，只像一個年輕女人普通的閱讀習慣。',effect:s=>s.flags.readMothersNotesWithYuting=true,next:'marginmessage15'},
 takehome15:{speaker:'黃雨婷',text:'「我不知道這是不是我的。」\n\n「名字是妳媽媽的。」\n\n「可是書已經被她送走了。」\n\n雨婷看著封面，像在分辨帶走一件失而復得的東西，究竟算不算拿走別人的物品。',effect:s=>s.flags.yutingHesitatedClaimBook=true,next:'ownerreturn15'},
 closebox15:{text:'宇軒先把鐵盒闔上，讓市場吹進來的風不再翻動書頁。\n\n「等老闆回來再決定。」\n\n雨婷點頭。她把雙手壓在盒蓋上，呼吸終於慢了一點。',effect:s=>s.flags.protectedMothersBooks=true,next:'ownerreturn15'},
 marginmessage15:{text:'書的最後三分之一，有一段被鉛筆框起來：\n\n「我們總以為離開的人帶走了一切，其實他們只是把能留下的，藏進我們還沒走到的地方。」\n\n旁邊沒有心得，只有一個很小的日期：民國六十六年三月。',next:'ownerreturn15'},
 ownerreturn15:{speaker:'舊書攤老闆',text:'「那箱喔，是一個搬家的老太太送來的。她說以前跟一個姓黃的女孩子交換過書。」\n\n老闆推了推眼鏡。\n\n「妳認識，就拿回去吧。書找得到認識它的人，比賣幾塊錢好。」',next:'yutingchoice15'},
 yutingchoice15:{speaker:'黃雨婷',text:'「我只拿這一本。」\n\n雨婷把其餘書逐本放回盒裡。\n\n「那些是她送給別人的，不是留給我的。我不能因為她是我媽媽，就把她以前的人生全部拿走。」',effect:s=>{s.flags.knowsYutingMotherName=true;s.flags.foundYutingMotherBook=true;s.memories.push('在南門舊書攤重新出現的黃淑芬舊書')},next:'fatherarrive15'},
 fatherarrive15:{text:'傍晚五點，雨婷的父親騎著舊機車來接她。看見那本書時，他把安全帽掛在車把上，很久沒有說話。\n\n「這是妳媽二十歲的字。」\n\n他翻到扉頁，笑了一下，笑容卻讓雨婷立刻低下頭。',choices:[['留在旁邊聽他說','staylisten15'],['去幫忙收攤，給父女空間','giveprivacy15'],['問照片裡的母親是什麼樣的人','askmother15']]},
 staylisten15:{speaker:'雨婷的父親',text:'「她看書很慢，還愛在旁邊跟作者吵架。」\n\n他一頁頁翻著，認出每一種鉛筆痕。雨婷第一次聽見父親談母親時，不只說她溫柔或生病，而是說她也固執、會生氣、會偷懶。',effect:s=>s.flags.heardYutingMotherAsPerson=true,next:'rideoffer15'},
 giveprivacy15:{text:'宇軒走去把外面的書箱搬進棚下。\n\n隔著幾排書，他聽不清父女說了什麼，只在回頭時看見雨婷的父親把手放在她頭上。雨婷沒有哭，卻一直用袖口擦那本書的封面。',effect:s=>s.flags.gaveYutingFamilyPrivacy=true,next:'rideoffer15'},
 askmother15:{speaker:'雨婷的父親',text:'「她啊，很麻煩。」\n\n男人笑了。\n\n「認定的事誰都勸不動。第一次約會還因為看書坐過站，害我在戲院門口等一個鐘頭。」\n\n雨婷抬頭，像第一次聽見母親也曾經遲到、犯錯，甚至讓人著急。',effect:s=>s.flags.heardYutingParentsDate=true,next:'rideoffer15'},
 rideoffer15:{speaker:'雨婷的父親',text:'「同學，要不要順路載你？」\n\n那台機車後座只能再坐一個人。宇軒搖頭，說自己搭公車。\n\n雨婷抱著書坐上後座，臨走前忽然叫住他。',next:'yutingthanks15'},
 yutingthanks15:{speaker:'黃雨婷',text:'「今天的事，可以跟佳穎和家豪說。」\n\n她停了一下。\n\n「不是因為我需要大家可憐。只是……我想讓他們也知道我媽媽以前會跟作者吵架。」\n\n宇軒點頭。這是雨婷第一次主動決定，一段關於自己的故事可以被誰知道。',effect:s=>s.flags.yutingChoseShareMotherStory=true,next:'busbook15'},
 busbook15:{location:'島北市公車・黃昏',text:'回程公車很空。宇軒坐在最後一排，醬油瓶放在腳邊。\n\n車窗外，雨婷父親的舊機車在下一個路口轉彎，父女的身影很快消失。\n\n他想起那本書在城市裡繞了十二年，才重新回到認識那個名字的人手中。',next:'mondaybook15'},
 mondaybook15:{date:'1989年3月20日｜星期一',location:'島北高中・一年三班',text:'星期一早自習以前，雨婷把舊書帶到教室。\n\n家豪翻了兩頁便說字太多；佳穎卻看每一條註記看得很仔細。她沒有說「好感人」，也沒有抱雨婷，只問能不能借回家讀。',choices:[['稱讚佳穎沒有多問','praisejiaying15'],['跟家豪解釋這本書的重要','explainjiahao15'],['安靜看三人傳閱','watchshare15']]},
 praisejiaying15:{speaker:'張佳穎',text:'「她想講的時候就會講啊。」\n\n佳穎把書闔上。\n\n「而且她媽媽不只是誰的媽媽。這些字是她還沒成為媽媽以前留下的。」\n\n宇軒想起雨婷昨天說過的話，發現佳穎也懂。',effect:s=>s.flags.jiayingUnderstandsMotherPast=true,next:'ch15end'},
 explainjiahao15:{speaker:'李家豪',text:'「我知道啦，我只是看不懂散文。」\n\n家豪把書還給雨婷，又補了一句：「可是妳媽字比妳漂亮。」\n\n雨婷瞪他，最後卻笑了。這大概就是家豪能給出的、不像安慰的安慰。',effect:s=>s.flags.jiahaoComfortedYutingAwkwardly=true,next:'ch15end'},
 watchshare15:{text:'書從雨婷手裡傳到佳穎，再傳給家豪，最後放到宇軒桌上。\n\n每個人看見的內容不同，卻都沒有要求雨婷解釋更多。\n\n上課鐘響時，她把書收回書包，動作比星期六在舊書攤時輕了許多。',effect:s=>s.flags.friendsSharedMothersBook=true,next:'ch15end'},
 ch15end:{chapter:'第十五章・完',date:'1989年3月20日｜星期一',location:'島北高中・午後',bg:'linear-gradient(155deg,#6a6257,#47504c 55%,#2a3435)',text:'午後陽光照進教室，舊書封面的裂痕變得很清楚。\n\n有些家庭故事不是秘密，只是一直沒有適合的時間、適合的地方，以及可以放心說給他聽的人。\n\n雨婷把母親二十歲時讀過的書夾進課本。\n\n這一次，那本書不再只是失去一個人的證明，也成了她重新認識一個人的開始。',next:'ch16title'},

 ch16title:{chapter:'第十六章｜沒有約好的星期日',date:'1989年4月2日｜星期日',location:'島北市・中央商圈',bg:'linear-gradient(150deg,#8a7b68,#60706a 52%,#384748)',text:'星期日午後，宇軒被母親叫去替以晴買圖畫紙。\n\n中央商圈擠滿放假的人。唱片行把新海報貼到門口，冰果室換上春季菜單，公共電話前排著三個等著打回家的人。\n\n這不是約好的日子，所以他沒有預期會遇見任何人。',next:'spotjiaying16'},
 spotjiaying16:{text:'經過唱片行時，他隔著玻璃看見佳穎。\n\n她一個人戴著試聽耳機，手裡拿著一張進口唱片，另一隻手在空中輕輕打拍子。\n\n宇軒站在門外幾秒。沒有學校、沒有家豪和雨婷，他忽然不知道該不該走進去。',choices:[['推門進去叫她','enterstore16'],['在門外等她自己看見','waitoutside16'],['先去買圖畫紙，回來再看','buyfirst16']]},
 enterstore16:{speaker:'張佳穎',text:'「你跟蹤我喔？」\n\n她摘下一邊耳機，嘴上先開玩笑，眼睛卻亮了一下。\n\n「我來幫以晴買圖畫紙。」\n\n「圖畫紙在唱片行裡？」',effect:s=>s.flags.metJiayingUnplanned=true,next:'headphones16'},
 waitoutside16:{text:'宇軒站在櫥窗旁看海報。玻璃裡的佳穎轉身時，兩人的倒影先碰在一起。\n\n她敲了敲玻璃，指著門口要他進去。\n\n宇軒忽然覺得，被一個人從人群裡認出來，是很小卻很確定的事。',effect:s=>s.flags.jiayingSpottedYuxuan=true,next:'headphones16'},
 buyfirst16:{text:'宇軒先走到文具店。買完圖畫紙回來，試聽架前已經沒有人。\n\n他站在門口感到一陣沒有理由的失望，正準備離開，佳穎從隔壁麵包店探出頭。\n\n「你剛才是不是有看到我？」',effect:s=>s.flags.almostMissedJiaying=true,next:'headphones16'},
 headphones16:{text:'佳穎把另一邊耳機遞給宇軒。塑膠耳罩還留著她的溫度。\n\n兩人站在同一台試聽機前，一人戴一邊。店裡明明播放著別的音樂，那首歌卻像只在他們之間響起。',choices:[['閉上眼睛把歌聽完','listenwhole16'],['問她為什麼一個人來','askalone16'],['說這首可以錄進 B 面','suggestbside16']]},
 listenwhole16:{text:'宇軒沒有說話。歌曲中段有一小段鋼琴，佳穎的手指在唱片架邊緣跟著移動。\n\n歌結束後，兩人同時摘下耳機，外面的車聲一下湧回來。',effect:s=>{s.flags.sharedHeadphones=true;s.memories.push('星期日唱片行裡共用的一副耳機')},next:'unplannedwalk16'},
 askalone16:{speaker:'張佳穎',text:'「我哥去約會，我媽加班。待在家也沒事。」\n\n她把唱片翻到背面。\n\n「以前覺得一個人逛街很自在，今天不知道為什麼有點無聊。」\n\n她沒有說遇見宇軒以後就不無聊了。',effect:s=>s.flags.jiayingAdmittedLonelySunday=true,next:'unplannedwalk16'},
 suggestbside16:{speaker:'張佳穎',text:'「你還記得 B 面喔？」\n\n「不是妳說要等值得留下的聲音？」\n\n佳穎低頭看唱片封面，過了一會兒才說：「這首可以候選。」',effect:s=>s.flags.firstBsideCandidate=true,next:'unplannedwalk16'},
 unplannedwalk16:{location:'島北市・中央商圈',text:'走出唱片行後，兩人都沒有立刻道別。\n\n宇軒還得買以晴的水彩；佳穎說她只是隨便走走。於是他們沿騎樓往前，經過照相館、鐘錶店與正在拆招牌的舊戲院。\n\n沒有約好的同行，反而不知道應該在哪裡結束。',next:'photooutside16'},
 photooutside16:{text:'照相館櫥窗裡擺著一排畢業照。陌生學生穿著相同制服，表情都被攝影師要求得很端正。\n\n佳穎停下來。\n\n「三年後，我們也會被擺在這種相簿裡嗎？」',choices:[['說三年很久','threeyearslong16'],['說到時候四人還會一起','fourstill16'],['問她最怕誰先不見','whogone16']]},
 threeyearslong16:{speaker:'陳宇軒',text:'「三年很久欸。」\n\n佳穎看著玻璃裡的畢業照。\n\n「去年九月到現在也才七個月，可是好像已經很久了。」\n\n時間有時不是用日曆算，而是用記得多少事情來算。',effect:s=>s.flags.discussedTimePassing=true,next:'stationrain16'},
 fourstill16:{speaker:'陳宇軒',text:'「到時候我們四個還是會一起吧。」\n\n「你怎麼知道？」\n\n「不知道啊。」\n\n佳穎笑了一下。「那你還講得那麼肯定。」\n\n她沒有說自己希望他是對的。',effect:s=>s.flags.promisedFourTogetherAtGraduation=true,next:'stationrain16'},
 whogone16:{speaker:'張佳穎',text:'「幹嘛一定要有人不見？」\n\n她回答得太快，隨即把視線轉回櫥窗。\n\n「如果真的要說……家豪吧。他最容易跑錯集合地點。」\n\n兩人都笑了，卻沒有再問真正的答案。',effect:s=>s.flags.askedJiayingFearOfLosingFriend=true,next:'stationrain16'},
 stationrain16:{location:'島北市・百貨騎樓',text:'四點多，毫無預警地下起春雨。\n\n騎樓瞬間擠滿躲雨的人。宇軒把圖畫紙抱進外套裡，佳穎則用唱片行紙袋護著頭髮。\n\n公車站就在街對面，但號誌還有九十秒。',choices:[['兩個人一起衝過去','runrain16'],['留在騎樓等雨小','waitrain16'],['把外套借她護住頭','coatpaper16']]},
 runrain16:{text:'綠燈亮起，兩人跟著人群衝過馬路。雨水從鞋口灌進去，圖畫紙還是濕了一角。\n\n跑到站牌下時，佳穎笑得彎下腰。\n\n「沒有約好還可以一起淋雨，很划算。」',effect:s=>{s.flags.ranSpringRainWithJiaying=true;s.memories.push('沒有約好的星期日，一起衝過春雨的路口')},next:'busarrive16'},
 waitrain16:{text:'他們留在騎樓。雨落在鐵皮招牌上，讓沉默也變得有聲音。\n\n佳穎靠著柱子，忽然說：「如果今天沒有遇到你，我大概已經回家了。」\n\n宇軒問這有什麼差。她只說：「不知道。」',effect:s=>s.flags.jiayingSaidDayChanged=true,next:'busarrive16'},
 coatpaper16:{text:'宇軒脫下外套，先罩住她手裡的唱片和自己的圖畫紙。\n\n「你是怕紙濕掉吧？」\n\n「不然咧？」\n\n兩人一起躲進不夠大的外套下穿過馬路，肩膀一路碰在一起。',effect:s=>s.flags.sharedCoatInRain=true,next:'busarrive16'},
 busarrive16:{location:'島北市・公車站',text:'佳穎的公車先到。車門打開，她踏上第一階，又回頭。\n\n「今天不算我們約出去喔。」\n\n「本來就沒有約。」\n\n「那下次可以真的約。」\n\n車門在宇軒回答以前闔上。',next:'homepaper16'},
 homepaper16:{location:'陳家・傍晚',speaker:'陳以晴',text:'「哥，圖畫紙怎麼濕掉了？」\n\n以晴捧著皺起一角的紙，一臉心痛。\n\n宇軒說路上下雨。妹妹看了看他同樣濕透的肩膀，像是想問更多，最後只說：「你今天買很久。」',choices:[['承認遇到佳穎','tellssister16'],['說唱片行人太多','excusesister16'],['拿一張紙問她最近畫什麼','askartagain16']]},
 tellssister16:{speaker:'陳以晴',text:'「喔——張佳穎。」\n\n妹妹把名字拖得很長。宇軒伸手搶她的水彩，她立刻抱著紙跑回房間。\n\n「我要畫你淋雨！」',effect:s=>s.flags.sisterKnowsJiayingMeeting=true,next:'ch16end'},
 excusesister16:{speaker:'陳以晴',text:'「你去買圖畫紙，為什麼會去唱片行？」\n\n宇軒一時答不出來。以晴露出勝利的表情，沒有再逼問，只把最皺的那張紙塞回他手裡。',effect:s=>s.flags.sisterCaughtExcuse=true,next:'ch16end'},
 askartagain16:{speaker:'陳以晴',text:'「學校要辦學生畫展。我想畫我們家停電的樣子。」\n\n「我們家又還沒停電。」\n\n「那就等啊。」\n\n以晴說得理所當然，像靈感也能先和未來約好。',effect:s=>s.flags.knowsSisterWantsExhibit=true,next:'ch16end'},
 ch16end:{chapter:'第十六章・完',date:'1989年4月2日｜星期日',location:'島北市・雨夜',bg:'linear-gradient(155deg,#5b5d58,#3d4947 56%,#263032)',text:'那個星期日沒有任何人事先約定。\n\n沒有寫在便條紙上的時間，沒有反覆確認的地點，也沒有一通打到家裡的電話。\n\n只是兩個人在一座很大的城市裡，剛好走到同一扇唱片行櫥窗前。\n\n年輕時總會把這種事叫作巧合。很多年後再想起，才明白真正珍貴的不是遇見，而是遇見以後，兩個人都沒有急著離開。',next:'ch17title'},

 ch17title:{chapter:'第十七章｜停電的房子',date:'1989年4月22日｜星期六',location:'島北市・陳家',bg:'linear-gradient(155deg,#65635d,#454f4c 53%,#293436)',text:'星期六晚上七點十二分，整條巷子的燈同時熄滅。\n\n電視畫面縮成一個白點，電風扇慢慢停下。隔壁公寓傳來小孩的驚呼，接著是大人打開窗戶、彼此詢問是不是只有自己家的聲音。\n\n陳家陷進一種平常不曾有過的黑暗。',next:'candles17'},
 candles17:{speaker:'媽媽',text:'「宇軒，去廚房找蠟燭。以晴不要亂跑，樓梯口很黑。」\n\n宇軒摸著牆走進廚房。抽屜裡只有半盒火柴、去年拜拜剩下的紅蠟燭，還有一支不知道有沒有電的手電筒。',choices:[['先點蠟燭照亮客廳','lightcandle17'],['把手電筒拿給以晴','flashsister17'],['到樓下看看整條巷子的情況','checkstreet17']]},
 lightcandle17:{text:'火柴劃了兩次才點著。紅蠟燭立在醬油碟裡，把客廳每個人的影子拉到牆上。\n\n父親放下報紙。沒有電視以後，他忽然不知道雙手該放在哪裡。',effect:s=>s.flags.litFamilyCandle=true,next:'fathernews17'},
 flashsister17:{text:'手電筒只剩微弱黃光。以晴拿著它照向天花板，光圈像一顆緩慢移動的月亮。\n\n「這樣比較好看。」她說。\n\n母親叫她省電，她才把光關掉。',effect:s=>s.flags.gaveSisterFlashlight=true,next:'fathernews17'},
 checkstreet17:{location:'陳家・巷口',text:'整條巷子都黑了。住戶把椅子搬到騎樓，幾支手電筒在夜裡晃動。\n\n遠處大馬路仍有車燈，這一小片住宅區卻像突然被城市忘記。宇軒回家時，父親已經提早從房間拿出一只牛皮紙袋。',effect:s=>s.flags.checkedBlackoutStreet=true,next:'fathernews17'},
 fathernews17:{speaker:'爸爸',text:'「公司可能要調我去港南廠。」\n\n父親在燭光裡說得很平，好像只是宣布明天下雨。\n\n「還沒確定。真的調過去，平日會住員工宿舍，週末再回來。」\n\n母親沒有驚訝，顯然早就知道。',next:'familyreaction17'},
 familyreaction17:{text:'以晴先問：「那爸爸是不住這裡了嗎？」\n\n父親說只是工作。母親說薪水會多一點。兩個大人輪流解釋，卻沒有任何一句真正回答妹妹的問題。\n\n宇軒盯著蠟油沿碟子邊緣慢慢凝固。',choices:[['問父親自己想不想去','askfatherwant17'],['先安慰以晴週末仍會回來','comfortsister17'],['不說話，聽大人繼續談','listenparents17']]},
 askfatherwant17:{speaker:'爸爸',text:'「工作哪有什麼想不想。」\n\n父親回答得很快。過了一會兒，他又補一句：「有機會多賺就去，家裡用得到。」\n\n宇軒第一次覺得，大人所謂的選擇，有時只是把不能選的事情說得體面。',effect:s=>s.flags.askedFatherAboutTransfer=true,next:'doorbell17'},
 comfortsister17:{speaker:'陳宇軒',text:'「週末還是會回來啊。」\n\n以晴低頭看手電筒。\n\n「可是週一到週五也算家裡。」\n\n宇軒找不到可以反駁她的話，只把蠟燭移得離她近一點。',effect:s=>s.flags.heardSisterDefineHome=true,next:'doorbell17'},
 listenparents17:{text:'母親開始計算交通費、宿舍費和多出的津貼。父親一項項回答。\n\n兩人都很冷靜，冷靜得像只要把數字算對，家裡少一個人的晚餐就不需要被討論。',effect:s=>s.flags.heardParentsTransferCosts=true,next:'doorbell17'},
 doorbell17:{text:'七點四十五分，門外傳來敲門聲。停電後電鈴也失去作用。\n\n宇軒打開門，佳穎站在樓梯間，手裡抱著壁報資料和一盞張家的煤油燈。她身後還有氣喘吁吁的家豪。\n\n「你們家電話打不通，我們來拿校外教學回條。」',next:'friendsenter17'},
 friendsenter17:{speaker:'李家豪',text:'「整區都停電，超酷。」\n\n他一進門就被母親叫去搬椅子。佳穎把煤油燈放到桌上，暖黃色的光比紅蠟燭穩定許多。\n\n雨婷因父親加班不能來，已先把回條交給佳穎。',choices:[['把父親調職的事告訴他們','telltransfer17'],['暫時不提，先一起填回條','hidefornow17'],['請佳穎陪以晴畫畫','askjiayingart17']]},
 telltransfer17:{speaker:'陳宇軒',text:'「我爸可能要去港南工作。」\n\n家豪正想問是不是要搬家，佳穎先看見宇軒的表情，伸手碰了碰家豪的手臂。\n\n「還沒確定吧？」她只問。',effect:s=>s.flags.toldFriendsFatherTransfer=true,next:'tabletalk17'},
 hidefornow17:{text:'宇軒把牛皮紙袋推到報紙下面。\n\n三個人圍著煤油燈填校外教學回條，家豪把「緊急聯絡人」寫成棒球隊教練，被母親當場要求重寫。\n\n笑聲暫時讓客廳恢復平常。',effect:s=>s.flags.hidFatherTransferFromFriends=true,next:'tabletalk17'},
 askjiayingart17:{text:'以晴拿出那張被春雨淋皺的圖畫紙。佳穎坐到她旁邊，聽她解釋想畫「停電以後才看得到的家」。\n\n「那不是應該全黑嗎？」家豪問。\n\n「笨蛋，黑裡面才有很多顏色。」以晴回答。',effect:s=>s.flags.jiayingSawSisterBlackoutArt=true,next:'tabletalk17'},
 tabletalk17:{location:'陳家・客廳',text:'四盞不同來源的光落在桌上：紅蠟燭、煤油燈、手電筒，以及窗外偶爾經過的車燈。\n\n沒有電視可以看，大家只能說話。家豪講球隊裡的事，以晴說畫展，母親切了一盤芭樂。父親偶爾插一句，語氣比平常鬆。',next:'jiayingkitchen17'},
 jiayingkitchen17:{location:'陳家・廚房',text:'宇軒進廚房拿鹽巴時，佳穎跟了進來。\n\n外面的談笑隔著門簾變得模糊。她靠著流理台，小聲問：「你剛才是不是有事？」\n\n停電讓她看不清宇軒的表情，卻好像更容易注意到他沒有說出的部分。',choices:[['坦白父親可能調職','confidefather17'],['說只是怕校外教學回條忘了交','deflecttrip17'],['反問她怎麼看得出來','asknoticed17']]},
 confidefather17:{speaker:'陳宇軒',text:'「我爸可能平日不住家裡。」\n\n佳穎沒有說「這樣很好」或「好可憐」。她只是問：「你不希望他去？」\n\n宇軒發現自己從來沒有被問過這個問題。',effect:s=>s.flags.confidedTransferToJiaying=true,next:'answerfatherfeeling17'},
 deflecttrip17:{speaker:'張佳穎',text:'「你說謊的時候會一直摳指甲。」\n\n宇軒立刻把手收進口袋。\n\n佳穎沒有逼他，只把鹽巴罐遞過去。「不想講也可以。」',effect:s=>s.flags.jiayingKnowsYuxuanTell=true,next:'powerreturn17'},
 asknoticed17:{speaker:'張佳穎',text:'「因為你平常不會那麼安靜。」\n\n「我本來就沒有很吵。」\n\n「跟家豪比誰都很安靜。」\n\n她笑了一下，接著認真說：「可是我看得出來。」',effect:s=>s.flags.jiayingSaidCanTell=true,next:'answerfatherfeeling17'},
 answerfatherfeeling17:{text:'煤油燈的火焰在玻璃罩裡晃了一下。客廳有人笑出聲，廚房卻安靜得只剩水龍頭沒有關緊的滴水聲。\n\n宇軒知道佳穎問的不是家裡應該怎麼做，而是他自己怎麼想。',choices:[['承認自己不知道希望什麼','dontknowfather17'],['說多賺錢對家裡比較好','moneybetter17'],['說以晴大概會很難過','sisterhurt17']]},
 dontknowfather17:{speaker:'陳宇軒',text:'「我不知道。」\n\n佳穎點點頭。\n\n「那就先不知道。」\n\n和新學期那天一樣。宇軒忽然明白，她不是沒有答案，而是願意陪他待在沒有答案的地方。',effect:s=>{s.flags.jiayingAcceptedTransferUncertainty=true;s.memories.push('停電廚房裡，佳穎說「那就先不知道」')},next:'powerreturn17'},
 moneybetter17:{speaker:'張佳穎',text:'「這是你覺得，還是大人說的？」\n\n宇軒沒有回答。佳穎轉著煤油燈的提把。\n\n「兩個都可能是真的。可是你不高興也不代表你不懂事。」',effect:s=>s.flags.jiayingSeparatedDutyAndFeeling=true,next:'powerreturn17'},
 sisterhurt17:{speaker:'張佳穎',text:'「那你呢？」\n\n「我還好。」\n\n佳穎看著他，沒有相信，也沒有拆穿。她只是說：「以晴難過的時候，你也可以一起難過，不一定要先當哥哥。」',effect:s=>s.flags.jiayingAskedYuxuanOwnFeeling=true,next:'powerreturn17'},
 powerreturn17:{text:'八點二十六分，電突然回來。\n\n日光燈閃了兩次，電視自動恢復聲音，電風扇重新轉動。所有人同時瞇起眼睛。\n\n剛才在黑暗裡顯得重要的話，一下被明亮客廳照得無處可藏。',next:'afterpower17'},
 afterpower17:{speaker:'陳以晴',text:'「可以再關掉嗎？」\n\n母親叫她別亂說。家豪打開電視找球賽，父親重新拿起報紙。\n\n佳穎收好煤油燈。離開前，她把校外教學回條塞進宇軒書包，提醒他星期一一定要交。',next:'sisterdrawing17'},
 sisterdrawing17:{location:'陳以晴的房間・深夜',text:'朋友離開後，以晴仍趴在地板上畫畫。\n\n畫裡的房子沒有牆，客廳中央是一張桌子，所有人圍在幾盞不同顏色的光旁。父親被畫得離門最近，腳邊放著一只牛皮紙袋。\n\n「妳什麼時候看到的？」宇軒問。',choices:[['稱讚她把大家都畫進去了','praiseall17'],['問她是不是不希望爸爸走','asksisterfather17'],['幫她替畫取名字','namethepicture17']]},
 praiseall17:{speaker:'陳以晴',text:'「因為停電的時候，大家終於都坐在一起啊。」\n\n她說得很自然。宇軒回頭看客廳，電視已經重新佔據所有人的視線。',effect:s=>s.flags.sawSisterReasonForBlackoutArt=true,next:'ch17end'},
 asksisterfather17:{speaker:'陳以晴',text:'「我不想，可是他一定會去吧。」\n\n「還沒確定。」\n\n「大人說還沒確定的時候，通常就是已經決定了。」\n\n宇軒不知道妹妹從哪裡學會這句話。',effect:s=>s.flags.sisterUnderstandsTransfer=true,next:'ch17end'},
 namethepicture17:{speaker:'陳宇軒',text:'「叫《停電的房子》。」\n\n以晴念了一次，把名字寫在圖畫紙背面。\n\n很多年後，宇軒已經忘記那晚停電多久，卻仍記得妹妹用藍色蠟筆畫出的黑暗。',effect:s=>{s.flags.namedBlackoutPainting=true;s.memories.push('以晴的畫《停電的房子》')},next:'ch17end'},
 ch17end:{chapter:'第十七章・完',date:'1989年4月22日｜星期六',location:'島北市・深夜',bg:'linear-gradient(155deg,#53534f,#35413f 56%,#222c2e)',text:'電力恢復後，巷子很快變回原來的樣子。\n\n住戶收起椅子，窗戶一扇扇關上，沒有人再站在黑暗裡彼此說話。\n\n父親的調職仍沒有答案；以晴的畫卻已經完成。\n\n有時候，必須等習以為常的光熄滅，人才會看清一個家裡，誰正慢慢走遠，誰一直努力把所有人留在畫面中央。',next:'ch18title'},

 ch18title:{chapter:'第十八章｜五月的海',date:'1989年5月13日｜星期六',location:'島北高中・校門口',bg:'linear-gradient(150deg,#8b8b7d,#60736e 50%,#394a4b)',text:'校外教學那天，六輛遊覽車在清晨六點停滿校門。\n\n車窗掛著米色窗簾，座椅套有洗衣粉和暈車藥的味道。學生把零食、相機、撲克牌和整個星期的期待一起塞進車廂。\n\n目的地是島東海岸，一座大多數人從未去過的海灣。',next:'busseats18'},
 busseats18:{text:'一年三班的座位由抽籤決定。\n\n家豪抽到最後排，立刻邀人打牌；雨婷坐在黃老師旁邊幫忙點名。宇軒的號碼是十七，靠走道。\n\n靠窗的十八號還沒有人坐。',choices:[['替佳穎留著靠窗位','savewindow18'],['讓暈車的同學先坐','givewindow18'],['直接去最後排找家豪','backrow18']]},
 savewindow18:{text:'宇軒把書包放到靠窗座位。佳穎上車看見後，先挑眉。\n\n「誰說我要坐這裡？」\n\n她嘴上這樣問，還是把相機放到窗邊，坐了下來。',effect:s=>s.flags.savedJiayingBusWindow=true,next:'busdepart18'},
 givewindow18:{text:'宇軒把靠窗位讓給一個會暈車的同學，自己往後移。佳穎上車後沒有說什麼，只坐到他隔著走道的位置。\n\n車開動不久，她把一顆酸梅丟到他腿上。',effect:s=>s.flags.gaveWindowToSickClassmate=true,next:'busdepart18'},
 backrow18:{speaker:'李家豪',text:'「這才叫校外教學！」\n\n宇軒坐到最後排。佳穎上車後在前面找了一圈，最後與雨婷並肩坐下。\n\n經過第一個休息站時，她回頭看了最後排三次。',effect:s=>s.flags.satBackWithJiahao=true,next:'busdepart18'},
 busdepart18:{location:'前往島東的遊覽車',text:'七點整，遊覽車駛出島北市。\n\n導遊拿起麥克風唱歌，車上很快從禮貌鼓掌變成全班亂唱。城市的樓房逐漸退到身後，窗外換成稻田、低矮工廠與剛插秧的水面。',next:'tunnel18'},
 tunnel18:{text:'車子進入沿海道路前的長隧道。窗外忽然全黑，車內的倒影浮到玻璃上。\n\n有人開始倒數。出口的亮光越來越近，整車學生在衝出隧道的瞬間一起喊了起來。\n\n海第一次鋪滿右側車窗。',next:'firstsea18'},
 firstsea18:{speaker:'張佳穎',text:'「陳宇軒，快看。」\n\n她說得像海只會出現幾秒。陽光在水面上碎成無數白點，遠處漁船小得像停在玻璃上的灰塵。\n\n宇軒轉頭時，先看到的卻是佳穎映著海光的側臉。',choices:[['立刻看向窗外','looksea18'],['拿相機替她拍一張','takephoto18'],['笑她比導遊還興奮','teasesea18']]},
 looksea18:{text:'宇軒把額頭靠近玻璃。海岸跟著車子彎曲，時而被山壁遮住，又在下一個轉角重新出現。\n\n佳穎沒有再叫他，只和他一起看了很久。',effect:s=>s.flags.watchedFirstSeaTogether=true,next:'beacharrival18'},
 takephoto18:{text:'宇軒接過相機，趁她還看著窗外按下快門。\n\n「欸！你又偷拍！」\n\n底片把那一刻留住：海很亮，車窗有反光，佳穎的表情介於驚訝和笑之間。',effect:s=>{s.flags.tookJiayingSeaBusPhoto=true;s.memories.push('遊覽車第一次看見海時，佳穎回頭的照片')},next:'beacharrival18'},
 teasesea18:{speaker:'張佳穎',text:'「你不覺得很漂亮嗎？」\n\n「漂亮啊。」\n\n「那你幹嘛看我？」\n\n宇軒一時答不出來。佳穎也沒有再問，只把臉轉回窗外，耳朵被陽光照得有些紅。',effect:s=>s.flags.jiayingCaughtYuxuanLookingAtSea=true,next:'beacharrival18'},
 beacharrival18:{location:'島東・月牙灣',bg:'linear-gradient(150deg,#9a9885,#657b76 48%,#3b5153)',text:'十點二十分，六班學生擠進月牙灣。\n\n沙灘比照片裡粗，海風也比想像中大。老師反覆提醒不能下水、不能離開視線、十二點前回到木造涼亭集合。\n\n家豪已經脫鞋往浪邊跑。',next:'groupbeach18'},
 groupbeach18:{text:'四個人沿著濕沙往北走。雨婷撿貝殼，家豪拿漂流木假裝球棒，佳穎不斷替大家拍照。\n\n輪到宇軒拿相機時，佳穎跑到家豪與雨婷中間，在宇軒頭頂比了一個清楚的 YA 手勢。\n\n快門正好記下四個人被海風吹亂的樣子。',effect:s=>{s.flags.tookFourBeachPhoto=true;s.memories.push('五月海邊，佳穎在宇軒頭頂比出的 YA 手勢')},next:'tidepool18'},
 tidepool18:{location:'月牙灣・礁岩區',text:'退潮留下的水窪裡有小魚和海膽。雨婷蹲下觀察，家豪則試圖跨到另一塊岩石。\n\n一陣較大的浪拍來，四人的鞋襪全被濺濕。家豪差點滑倒，抓住宇軒書包才站穩。',choices:[['先拉住家豪','pulljiahao18'],['護住佳穎的相機','protectcamera18'],['扶雨婷離開濕滑礁岩','helpyutingrock18']]},
 pulljiahao18:{speaker:'李家豪',text:'「我自己站得住！」\n\n他嘴硬地甩開手，下一步又差點滑倒。四個人笑到無法走路。\n\n宇軒最後還是一路抓著他的球衣後領。',effect:s=>s.flags.savedJiahaoFromTide=true,next:'losttime18'},
 protectcamera18:{text:'宇軒伸手擋住浪，自己半邊制服全濕。佳穎把相機抱在胸前，先確認鏡頭，再看他的袖子。\n\n「相機壞了可以修，你感冒很麻煩欸。」\n\n她說著，卻用手帕替他擦掉手臂上的海水。',effect:s=>s.flags.protectedJiayingCamera=true,next:'losttime18'},
 helpyutingrock18:{text:'雨婷踩到長著青苔的石面，宇軒拉住她手腕。\n\n她站穩後立刻道謝，沒有像以前那樣急著抽回手或說自己不需要幫忙。\n\n有些改變很小，小到只有熟悉她的人才看得出來。',effect:s=>s.flags.yutingAcceptedHelpNaturally=true,next:'losttime18'},
 losttime18:{text:'等四人離開礁岩，已經十一點五十二分。涼亭在沙灘另一端，集合哨聲被海風吹得忽遠忽近。\n\n家豪說跑回去只要五分鐘；雨婷說在沙地上不可能。佳穎低頭確認相機和撿來的貝殼。',choices:[['沿浪打濕的硬沙跑','runhardSand18'],['走木棧道但距離較遠','takeboardwalk18'],['先喊老師讓對方知道位置','callteacher18']]},
 runhardSand18:{text:'四人沿潮線奔跑。鞋底濺起細小水花，家豪一開始衝最快，最後卻回頭替雨婷拿書包。\n\n他們在十二點零一分抵達，被黃老師一人敲了一下額頭。',effect:s=>s.flags.ranBeachTogether=true,next:'lunchbeach18'},
 takeboardwalk18:{text:'木棧道不滑，卻繞過整片防風林。四人一路快走，從樹縫看見老師站在涼亭前數人頭。\n\n十二點零三分，他們排成一列道歉。黃老師只問：「有沒有人受傷？」',effect:s=>s.flags.choseSafeBeachReturn=true,next:'lunchbeach18'},
 callteacher18:{speaker:'四人',text:'「老師——我們在這裡！」\n\n聲音被風切碎。黃老師終於看見他們，遠遠指向木棧道。\n\n回到涼亭後，她沒有罵人，只讓四個人負責把全班便當空盒分類。',effect:s=>s.flags.signaledTeacherAtBeach=true,next:'lunchbeach18'},
 lunchbeach18:{location:'月牙灣・木造涼亭',text:'午餐是冷掉的排骨便當。海風把塑膠袋吹得到處跑，每個人得用飲料罐壓住便當蓋。\n\n家豪把不吃的青椒全夾給宇軒；雨婷把早上做的飯糰分給大家；佳穎從口袋拿出四顆已經有些融化的水果糖。',next:'quietshore18'},
 quietshore18:{location:'月牙灣・午後',text:'自由活動最後半小時，家豪去和隊友丟球，雨婷陪黃老師清點學生。\n\n宇軒與佳穎走到較安靜的防波堤。海面被午後陽光照得很白，兩人必須瞇著眼睛才能看遠。',next:'jiayingfuturesea18'},
 jiayingfuturesea18:{speaker:'張佳穎',text:'「我以前想過去外地念音樂。」\n\n佳穎把鞋尖抵著水泥縫。\n\n「不是因為一定要當鋼琴家。只是想知道，如果沒有人認識我，我還會不會喜歡彈琴。」\n\n這是她第一次把未來說得這麼具體。',choices:[['說她一定做得到','youcando18'],['問她會去哪座城市','wherego18'],['問她現在還想不想去','stillwant18']]},
 youcando18:{speaker:'張佳穎',text:'「你怎麼知道？」\n\n「不知道，但妳彈得很好。」\n\n佳穎搖頭。「彈得好跟敢不敢去，不是同一件事。」\n\n她沒有否定，只是把那句鼓勵放到更遠的地方。',effect:s=>s.flags.encouragedJiayingMusicAway=true,next:'yuxuansea18'},
 wherego18:{speaker:'張佳穎',text:'「可能島南，也可能更遠。」\n\n她看向海的另一端。\n\n「我媽說先不要替地圖上的距離害怕。真的考得上，再決定要不要走。」',effect:s=>s.flags.knowsJiayingMayStudyAway=true,next:'yuxuansea18'},
 stillwant18:{speaker:'張佳穎',text:'「有時候想，有時候又不想。」\n\n「不想離開家？」\n\n她停了一下。「不只家。」\n\n浪聲正好蓋過後面的話。宇軒沒有要求她重說。',effect:s=>s.flags.jiayingMayNotWantLeaveFriends=true,next:'yuxuansea18'},
 yuxuansea18:{speaker:'張佳穎',text:'「如果是你，你會離開島北市嗎？」\n\n遠處傳來集合哨。宇軒望著海，第一次認真想像這座城市以外的自己。',choices:[['「如果有理由，可能會。」','mayleave18'],['「我應該會一直留在這裡。」','stayisland18'],['「有人一起的話就敢。」','togetherleave18']]},
 mayleave18:{speaker:'陳宇軒',text:'「如果有非去不可的理由，可能會。」\n\n佳穎點頭，像把這個答案記在某個不讓他看見的地方。\n\n「那走以前要講。」',effect:s=>s.flags.promisedTellBeforeLeaving=true,next:'returnbus18'},
 stayisland18:{speaker:'張佳穎',text:'「你現在才十六歲，不要那麼早決定。」\n\n「妳剛才不是也在決定？」\n\n「所以我才知道不能太早。」\n\n她笑了，卻仍望著遠處。',effect:s=>s.flags.saidWouldStayIslandNorth=true,next:'returnbus18'},
 togetherleave18:{speaker:'陳宇軒',text:'「有人一起的話，應該就敢。」\n\n佳穎低頭踢開一小塊石子。\n\n「那你要先問人家願不願意。」\n\n集合哨再次響起，誰都沒有把這句話再往下說。',effect:s=>s.flags.saidCouldLeaveTogether=true,next:'returnbus18'},
 returnbus18:{location:'返回島北的遊覽車・黃昏',text:'回程時，全車比早上安靜。家豪靠著椅背睡到張著嘴，雨婷抱著裝有貝殼的紙袋，佳穎把相機放在腿上。\n\n遊覽車再次進入長隧道。黑暗裡，宇軒感覺有人把一顆水果糖放進他手心。',next:'ch18end'},
 ch18end:{chapter:'第十八章・完',date:'1989年5月13日｜星期六',location:'島北市・夜',bg:'linear-gradient(155deg,#5f615d,#3d4a48 56%,#263133)',text:'晚上九點，六輛遊覽車一一駛回校門。\n\n海被留在很遠的另一側，制服口袋裡卻還有沙，鞋襪仍帶著鹽味，相機裡裝著尚未沖洗的畫面。\n\n大家以為照片會替他們記得一切。\n\n那時沒有人知道，底片也會曝光、褪色、遺失；真正留得最久的，往往是快門以外沒有被拍下來的那句話。',next:'ch19title'},

 ch19title:{chapter:'第十九章｜沒有洗好的照片',date:'1989年6月9日｜星期五',location:'島北市・中央照相館',bg:'linear-gradient(150deg,#776f64,#535f5b 52%,#303b3d)',text:'校外教學後第四個星期，佳穎終於把底片送去沖洗。\n\n星期五放學，四個人一起到中央照相館取照片。櫥窗裡的畢業照仍擺在原處，玻璃上多了夏季促銷的紅字。\n\n老闆把紙袋交出來時，表情有些為難。',next:'badfilm19'},
 badfilm19:{speaker:'照相館老闆',text:'「中間有幾張進光，可能是相機背蓋沒扣緊。」\n\n三十六張底片，只洗出二十七張。其餘照片有的整片發白，有的只剩半邊影子。\n\n佳穎一張張翻，臉上的期待慢慢收起來。',next:'missingphotos19'},
 missingphotos19:{text:'家豪的打擊照洗成功了；雨婷拿著貝殼的側影也在。\n\n四人合照少了右下角，佳穎的 YA 手勢仍清楚，宇軒的臉卻被一道白光吞掉一半。\n\n遊覽車上，佳穎回頭看海的那張完全沒有洗出來。',choices:[['說剩下的照片已經很好','comfortphotos19'],['陪她確認每一格底片','checknegative19'],['開玩笑說自己被海風吹消失','jokefaded19']]},
 comfortphotos19:{speaker:'陳宇軒',text:'「二十七張也很多啊。」\n\n佳穎點頭，卻仍盯著那幾格透明底片。\n\n「我知道。只是沒洗出來的剛好都是我最想看的。」',effect:s=>s.flags.triedComfortBadFilm=true,next:'owneradvice19'},
 checknegative19:{text:'老闆把底片舉到燈箱前。宇軒陪佳穎逐格確認。\n\n有些影像只剩輪廓，仍看得出海平線、車窗與一個轉過來的人。佳穎用鉛筆把那些格數記在紙袋上。',effect:s=>s.flags.checkedEveryNegativeWithJiaying=true,next:'owneradvice19'},
 jokefaded19:{speaker:'陳宇軒',text:'「可能我不適合出現在海邊。」\n\n「那你以後不要去了。」\n\n佳穎回答得太認真，家豪與雨婷同時安靜。她才勉強笑了一下：「開玩笑的。」',effect:s=>s.flags.jokedAboutMissingFromPhoto=true,next:'owneradvice19'},
 owneradvice19:{speaker:'照相館老闆',text:'「底片留好，過幾年技術不一樣，也許還能洗出一點。」\n\n老闆把透明片裝回紙套。\n\n一九八九年的他們不知道，未來確實會有更好的方法；只是很多東西，並不會因為技術進步就回到當時。',next:'splitphotos19'},
 splitphotos19:{location:'中央商圈・冰果室',text:'四人到老冰果室分照片。桌上放著四杯飲料和二十七張帶白邊的相紙。\n\n家豪把每張有自己的都先抽走；雨婷負責在背面寫日期；佳穎始終把那張缺角的四人照放在手邊。',choices:[['要那張缺角的四人照','askdamagedfour19'],['挑家豪笑場的照片','pickjiahao19'],['把雨婷的側影留給她','giveyutingphoto19']]},
 askdamagedfour19:{speaker:'張佳穎',text:'「這張我想留。」\n\n兩人同時碰到照片邊緣。佳穎沒有放手。\n\n「相機是我的。」\n\n宇軒只好答應以後再洗一張。',effect:s=>s.flags.jiayingKeptDamagedFourPhoto=true,next:'photoquestions19'},
 pickjiahao19:{speaker:'李家豪',text:'「這張不准拿！」\n\n照片裡的家豪被雨婷叫到綽號，笑得眼睛只剩一條線。宇軒把照片舉高，兩人在冰果室裡繞桌追了兩圈。',effect:s=>s.flags.keptJiahaoLaughPhoto=true,next:'photoquestions19'},
 giveyutingphoto19:{speaker:'黃雨婷',text:'「這張是什麼時候拍的？」\n\n照片裡她一個人蹲在潮池旁，陽光落在肩上，完全不知道鏡頭存在。\n\n佳穎說：「你那時候看起來很自在。」',effect:s=>s.flags.gaveYutingQuietSeaPhoto=true,next:'photoquestions19'},
 photoquestions19:{speaker:'李家豪',text:'「如果只能留一張，你們會選哪張？」\n\n他嘴裡還咬著吸管。雨婷選母親的舊書；佳穎說照片已經洗壞，不能重選。\n\n家豪最後看向宇軒。',choices:[['選四人的第一張合照','firstfourphoto19'],['選佳穎在車窗前的照片','jiayingwindow19'],['說真正重要的都沒拍到','unphotographed19']]},
 firstfourphoto19:{speaker:'陳宇軒',text:'「棒球測驗那天的四人照。」\n\n家豪滿意地點頭，因為那張有他的十七號。佳穎卻問：「只是因為最早嗎？」\n\n宇軒說，也許因為那時候還不知道以後會有這麼多張。',effect:s=>s.flags.choseFirstFourPhoto=true,next:'jiayingoutside19'},
 jiayingwindow19:{speaker:'陳宇軒',text:'「如果洗得出來，我會選車上那張。」\n\n佳穎低頭撥動冰塊。\n\n「你根本沒看到成品，怎麼知道好不好？」\n\n「我記得拍下去的時候。」\n\n她沒有再問。',effect:s=>s.flags.choseMissingJiayingSeaPhoto=true,next:'jiayingoutside19'},
 unphotographed19:{speaker:'陳宇軒',text:'「可能最重要的都沒有拍到。」\n\n雨婷問例如什麼。宇軒想起電話裡的呼吸、停電廚房的煤油味、隧道裡落進掌心的水果糖。\n\n「不知道，就是沒拍到才講不出來。」',effect:s=>s.flags.valuesUnphotographedMemories=true,next:'jiayingoutside19'},
 jiayingoutside19:{location:'島北市・冰果室外',text:'離開前，佳穎叫住宇軒。家豪與雨婷先去公車站。\n\n她從照片紙袋裡抽出一小條底片，裡面是那張沒有洗成功的車窗照。\n\n「這格你要不要？」',choices:[['收下底片','takefilm19'],['請她替自己保管','askkeepfilm19'],['說兩人可以一起留著','sharefilm19']]},
 takefilm19:{text:'宇軒把底片夾進皮夾透明層。迎著路燈看，只看得見淡淡的海和一個人的輪廓。\n\n「不要弄丟。」佳穎說。\n\n那語氣不像在交代一格底片。',effect:s=>{s.flags.hasFailedSeaNegative=true;s.items.push('沒有洗成功的海邊底片');s.memories.push('佳穎交給宇軒的一格未洗成功底片')},next:'tracknotice19'},
 askkeepfilm19:{speaker:'陳宇軒',text:'「妳先留著。妳比較不會弄丟。」\n\n佳穎把底片放回紙袋。\n\n「那你以後要記得來拿。」\n\n「多久以後？」\n\n「等洗得出來的時候。」',effect:s=>s.flags.jiayingKeepsFailedSeaNegative=true,next:'tracknotice19'},
 sharefilm19:{speaker:'張佳穎',text:'「一格底片要怎麼兩個人一起留？」\n\n「放在錄音帶盒裡。」\n\n佳穎想了想，把底片夾進「一九八八」的曲目表。照片與聲音被收進同一個盒子，等待以後。',effect:s=>s.flags.failedNegativeInTapeCase=true,next:'tracknotice19'},
 tracknotice19:{date:'1989年6月12日｜星期一',location:'島北高中・一年三班',speaker:'黃子芸',text:'星期一，正式志願調查表發下來。\n\n「這不是評斷你比較適合成為哪一種人，只是決定明年把較多時間花在哪些科目。」\n\n黃老師提醒，一星期後繳交，必須有家長簽名。',next:'formsagain19'},
 formsagain19:{text:'半年前那張預調查表還可以空著，這一次卻一定得勾選。\n\n雨婷已決定文組；家豪為了留在校隊，只求哪一邊都不要被當；佳穎的表格仍然乾淨。\n\n宇軒握著筆，紙上的兩個方框比上次更像真正的岔路。',choices:[['傾向文組','choosearts19'],['傾向理組','choosescience19'],['先問佳穎怎麼選','askjiayingtrack19']]},
 choosearts19:{text:'宇軒在文組旁輕輕點下一個鉛筆記號，還沒有畫成完整的勾。\n\n他喜歡故事與音樂，卻不確定喜歡能不能成為理由。',effect:s=>s.flags.yuxuanLeansArts=true,next:'jiayingtrack19'},
 choosescience19:{text:'宇軒在理組旁做了記號。父親曾說理工比較有出路；這句話在他真正思考以前，就已經住進腦中。\n\n他盯著那個小點，無法判斷那是不是自己的答案。',effect:s=>s.flags.yuxuanLeansScience=true,next:'jiayingtrack19'},
 askjiayingtrack19:{speaker:'張佳穎',text:'「我媽說選自己願意花兩年讀的，不是選聽起來最厲害的。」\n\n「那妳呢？」\n\n「可能文組。可是如果要考音樂，分組也不是最重要的。」',effect:s=>s.flags.askedJiayingTrackFirst=true,next:'jiayingtrack19'},
 jiayingtrack19:{speaker:'張佳穎',text:'「如果我們選不同組，明年就不同班了。」\n\n她說得像只是補充規則。\n\n教室裡到處是同樣的討論，沒有人注意兩人突然一起安靜。',choices:[['說下課還是可以見面','breaksStill19'],['問她希望自己怎麼選','whatwant19'],['說不能為了同班亂選','notforclass19']]},
 breaksStill19:{speaker:'陳宇軒',text:'「不同班又不是不能見面。」\n\n「我知道。」\n\n佳穎低頭把表格折起來。\n\n知道一件事不會消失，和不害怕它改變，原來是兩回事。',effect:s=>s.flags.promisedMeetAcrossClasses=true,next:'ch19end'},
 whatwant19:{speaker:'陳宇軒',text:'「那妳希望我選哪個？」\n\n佳穎沉默很久。\n\n「我希望你不要以後怪任何人。」\n\n這不是宇軒想聽的答案，卻可能是她能給的最誠實回答。',effect:s=>s.flags.jiayingRefusedChooseForYuxuan=true,next:'ch19end'},
 notforclass19:{speaker:'張佳穎',text:'「當然不能。」\n\n她回答得很快。\n\n「可是覺得可惜也可以吧？」\n\n宇軒點頭。兩人都把表格收進課本，沒有在那天完成。',effect:s=>s.flags.sharedSadnessAboutDifferentClass=true,next:'ch19end'},
 ch19end:{chapter:'第十九章・完',date:'1989年6月12日｜星期一',location:'島北高中・黃昏',bg:'linear-gradient(155deg,#64605a,#434d4a 55%,#293335)',text:'放學後，桌上留下幾張被擦掉又重畫的志願表。\n\n照片洗不出來，可以把底片留到以後；座位被拆開，可以等下課再穿過教室。\n\n但有些選擇一旦交出去，下一個學期就會把人帶進不同的門。\n\n十六歲的他們第一次明白，長大不只是在得到自由，也是在還沒準備好的時候，開始替每一次分開簽名。',next:'ch20title'},

 ch20title:{chapter:'第二十章｜一年級的最後一天',date:'1989年6月30日｜星期五',location:'島北高中・一年三班',bg:'linear-gradient(150deg,#8a806d,#5f7069 50%,#374747)',text:'一年級最後一天，島北市熱得像盛夏已經提前抵達。\n\n天花板電風扇把熱空氣反覆攪動，黑板上寫著暑假注意事項。每張桌面都堆著要帶回家的課本、成績單，以及明年可能用不到的筆記。\n\n新座位坐了四個半月，今天之後也會成為舊座位。',next:'reportcards20'},
 reportcards20:{speaker:'黃子芸',text:'「成績單先不要互相比。補考名單我已經個別通知。」\n\n黃老師把紙一張張發下。宇軒這次的平均比期中多了十一分。不是突然變得優秀，只是終於知道哪裡不熟，也沒有再把不熟當成自己不值得。',effect:s=>s.flags.yuxuanImprovedFinals=true,next:'friendsresults20'},
 friendsresults20:{text:'家豪低空飛過，保住暑假集訓資格；雨婷仍在前段，卻先算暑假打工能存多少學費；佳穎的成績足夠選任何一組。\n\n四張志願表已在上星期交出去。分班結果要到八月底才公布。',next:'cleanclass20'},
 cleanclass20:{text:'大掃除開始。大家把抽屜裡一整年的東西倒到桌上：乾掉的橡皮擦、忘記歸還的筆、糖果紙、傳過的紙條和早已過期的通知。\n\n宇軒在抽屜深處找到一顆水果糖，包裝已被壓得皺皺的。',choices:[['把糖留進口袋','keepthecandy20'],['拿去問佳穎是不是她放的','askcandy20'],['和其他垃圾一起丟掉','throwcandy20']]},
 keepthecandy20:{text:'宇軒把糖放進口袋。它也許不是隧道裡那一顆，甚至可能只是自己忘記吃。\n\n可有些東西一旦和記憶長得太像，就很難再只把它當成普通東西。',effect:s=>{s.flags.keptOldFruitCandy=true;s.items.push('抽屜深處的水果糖')},next:'deskmarks20'},
 askcandy20:{speaker:'張佳穎',text:'「我怎麼知道？你抽屜那麼髒。」\n\n佳穎看了一眼包裝，嘴角卻微微動了一下。\n\n「過期就不要吃。」\n\n她沒有回答是不是她放的。',effect:s=>s.flags.askedJiayingAboutCandy=true,next:'deskmarks20'},
 throwcandy20:{text:'宇軒把糖丟進垃圾袋。包裝碰到底部時發出很輕的一聲。\n\n幾秒後，他又彎腰把它撿回來。家豪看見了，問他是不是窮到連垃圾都要吃。',effect:s=>s.flags.couldNotThrowCandyAway=true,next:'deskmarks20'},
 deskmarks20:{text:'搬開桌子時，宇軒在牆邊看見鉛筆刻痕。有人寫了名字，有人畫日期，也有人只留下幾條沒有意義的線。\n\n上學期佳穎坐過的位置，桌腳內側有一個很小的音符。',choices:[['用手指摸過音符，不破壞它','leaveNoteMark20'],['叫佳穎來看','showjiayingmark20'],['在旁邊刻一個更小的記號','addmark20']]},
 leaveNoteMark20:{text:'宇軒用指腹摸過凹痕，沒有告訴任何人。\n\n桌子明年會被另一個學生使用，那個人可能永遠不知道音符是誰留下的。',effect:s=>s.flags.leftJiayingDeskNoteUntouched=true,next:'teacherfarewell20'},
 showjiayingmark20:{speaker:'張佳穎',text:'「不是我刻的。」\n\n她蹲下看了一會兒。\n\n「但我以前上課會一直摸到它。」\n\n原來他們記住的，是同一個痕跡，卻不是同一段故事。',effect:s=>s.flags.sharedDeskNoteMemory=true,next:'teacherfarewell20'},
 addmark20:{text:'宇軒拿鉛筆在音符旁點了一個幾乎看不見的小點。\n\n不是名字，也不是承諾，只是證明自己曾經發現它。\n\n刻完以後，他立刻覺得有點幼稚。',effect:s=>s.flags.addedTinyDeskMark=true,next:'teacherfarewell20'},
 teacherfarewell20:{speaker:'黃子芸',text:'「暑假後，你們不一定還在同一班。我也不一定繼續帶你們。」\n\n黃老師站在講台前，手裡拿著已經磨損的點名簿。\n\n「但離開一間教室，不等於裡面發生的事就作廢。請把別人交給你們的故事，好好帶走。」',next:'lastbell20'},
 lastbell20:{text:'中午十二點，最後一節鐘聲響起。\n\n沒有人立刻離開。有人在制服上簽名，有人交換暑假地址。家豪把黑板上的「一年三班」圈起來，雨婷在值日簿最後一頁寫下日期。\n\n佳穎把相機放到講台上，設定倒數。',next:'classphoto20'},
 classphoto20:{text:'全班擠到黑板前。黃老師坐在中央，家豪站上椅子，雨婷被推到第一排。宇軒原本在最右邊，快門倒數時，佳穎從人群裡伸手把他拉近一個位置。\n\n閃光亮起。\n\n沒有人知道這張照片裡，明年有多少人還會坐在一起。',effect:s=>{s.flags.tookFinalClassPhoto=true;s.memories.push('一年三班最後一天的全班合照')},next:'summerplans20'},
 summerplans20:{location:'島北高中・放學走廊',text:'走廊上，四人交換暑假計畫。\n\n家豪從下星期開始每天集訓；雨婷要到舊書攤和市場早餐店打工；佳穎七月會跟母親去島南外婆家三個星期。\n\n宇軒原本以為暑假代表每天都能見面，現在才發現四個人的時間第一次無法自然重疊。',choices:[['立刻約七月底在老地方見','setoldplace20'],['提議每星期輪流打電話','weeklycalls20'],['說有空再約就好','sometime20']]},
 setoldplace20:{speaker:'陳宇軒',text:'「七月三十，老地方，下午三點。」\n\n雨婷拿出小記事本寫下；家豪要求不要早上；佳穎重複了一次日期。\n\n沒有手機的年代，三十天後的見面要在今天就決定。',effect:s=>s.flags.setSummerOldPlaceMeeting=true,next:'jiayinglastwalk20'},
 weeklycalls20:{speaker:'李家豪',text:'「誰要每星期跟你講電話？」\n\n「又不是只打給你。」\n\n佳穎立刻問：「那你要先打給誰？」\n\n宇軒還沒回答，家豪已經開始替四人排值日表。',effect:s=>s.flags.plannedWeeklySummerCalls=true,next:'jiayinglastwalk20'},
 sometime20:{speaker:'黃雨婷',text:'「『有空再約』通常就不會約。」\n\n她說完，四個人一起安靜。最後佳穎從書包拿出筆，在課本最後一頁寫下七月三十、下午三點、老地方。\n\n「現在有約了。」',effect:s=>s.flags.jiayingMadeSummerAppointment=true,next:'jiayinglastwalk20'},
 jiayinglastwalk20:{location:'島北高中・校外坡道',text:'家豪先去球場，雨婷趕著到市場報到。\n\n宇軒與佳穎最後一次以一年級學生的身分走下校外坡道。蟬聲從行道樹裡落下，曬熱的柏油散出夏天特有的氣味。',next:'jiayingtrip20'},
 jiayingtrip20:{speaker:'張佳穎',text:'「我去島南的時候，家裡沒人接電話。」\n\n「我知道。」\n\n「如果有事，可以打我外婆家。」\n\n她從記事本撕下一角，寫下一串新的號碼。寫完後又在旁邊標註：晚上八點以後。',choices:[['把號碼收進皮夾','keepgrandma20'],['問什麼事才算有事','whatcounts20'],['說自己應該不會打','probablywont20']]},
 keepgrandma20:{text:'宇軒把紙條放進皮夾，和沒有洗成功的底片疊在一起。\n\n城市不同、號碼不同，只要知道那串數字，似乎就還能找到一個人。',effect:s=>{s.flags.hasJiayingGrandmaPhone=true;s.items.push('佳穎島南外婆家的電話')},next:'stationgoodbye20'},
 whatcounts20:{speaker:'張佳穎',text:'「不知道。」\n\n「那沒事可以打嗎？」\n\n佳穎看著他，笑意慢慢浮出來。\n\n「你以前第一次打給我，不也是沒事？」',effect:s=>s.flags.allowedNoReasonSummerCall=true,next:'stationgoodbye20'},
 probablywont20:{speaker:'張佳穎',text:'「喔，那還我。」\n\n她伸手要拿回紙條，宇軒立刻收進口袋。\n\n「我說應該，又不是一定。」\n\n「隨便你。」\n\n佳穎走快兩步，心情明顯好了起來。',effect:s=>s.flags.pretendedNotToCallSummer=true,next:'stationgoodbye20'},
 stationgoodbye20:{location:'島北市・公車站',text:'兩人的公車停在不同站牌。佳穎那班先到，車門打開時，放學人潮同時往前。\n\n她上車前回頭，把手裡的照片紙袋舉了一下。\n\n「底片我會帶去島南，看我外婆那邊的照相館能不能洗。」',next:'lastreply20'},
 lastreply20:{text:'車掌拉住門邊扶手，後面等車的人開始往前。宇軒只剩幾秒，能把暑假以前最後一句話交給她。',choices:[['「洗不出來也沒關係。」','noMatterFilm20'],['「記得七月三十。」','rememberJuly20'],['「到了要打電話回來。」','callBack20']]},
 noMatterFilm20:{speaker:'陳宇軒',text:'「洗不出來也沒關係。」\n\n佳穎站在車門階梯上看他。\n\n「可是我想看。」\n\n車掌催促，她才轉身進去。',effect:s=>s.flags.jiayingStillWantsMissingPhoto=true,next:'busleaves20'},
 rememberJuly20:{speaker:'張佳穎',text:'「七月三十，下午三點，老地方。」\n\n她一字不漏地重複。\n\n「你不要遲到。」\n\n「那是家豪。」\n\n「你也不准。」',effect:s=>s.flags.repeatedSummerAppointment=true,next:'busleaves20'},
 callBack20:{speaker:'張佳穎',text:'「不是有給你電話？」\n\n「妳也可以打啊。」\n\n她想了一秒。「那看誰先。」\n\n車門關上，這場沒有規則的比賽就這樣開始。',effect:s=>s.flags.summerCallChallenge=true,next:'busleaves20'},
 busleaves20:{text:'公車駛離站牌。佳穎站在後門旁，隔著玻璃朝他揮手。\n\n車子轉過街角以前，宇軒一直站在原地。\n\n他忽然想起開學第一天，四個名字還沒有同時出現在自己的人生裡。如今只是三個星期見不到其中一個人，城市竟像少了一部分。',next:'homeyear20'},
 homeyear20:{location:'陳宇軒的房間・傍晚',text:'回家後，宇軒把一年級課本一冊冊疊進紙箱。\n\n照片、電話紙條、錄音帶、報名表影本、舊書收據和過期水果糖散在桌上。每一樣看起來都很普通，放在一起卻像能拼出完整的一年。\n\n父親的調職通知壓在桌角：七月十日報到。',next:'tapeBside20'},
 tapeBside20:{text:'宇軒把「一九八八」放進錄音機，翻到仍然空白的 B 面。\n\n他按下錄音鍵。房間裡先錄進蟬聲、樓下母親洗碗的聲音，以及以晴削鉛筆的細響。\n\n接著，他靠近麥克風。',choices:[['說下這一年最想記得的事','recordmemory20'],['只報上日期與時間','recorddate20'],['沒有說話，讓房間自己被錄下來','recordsilence20']]},
 recordmemory20:{speaker:'陳宇軒・錄音',text:'「一九八九年六月三十日。」\n\n他停了很久。\n\n「一年級結束了。我本來以為我們會一直坐在同一間教室。」\n\n說到這裡，他不知道接下來該用什麼詞，只好按下停止鍵。',effect:s=>{s.flags.recordedFirstYearMemory=true;s.memories.push('B 面第一段：我本來以為我們會一直坐在同一間教室')},next:'ch20end'},
 recorddate20:{speaker:'陳宇軒・錄音',text:'「一九八九年六月三十日，下午六點四十三分。」\n\n日期說完後，他沒有補充。\n\n磁帶繼續轉了十幾秒，把沒有說出口的內容也一起留下。',effect:s=>s.flags.recordedFirstYearDate=true,next:'ch20end'},
 recordsilence20:{text:'宇軒沒有說話。\n\n窗外的蟬、碗盤碰撞、妹妹走過走廊，以及遠處公車煞車的聲音，一層層落進磁帶。\n\n也許生活本身，就是當時最容易被忽略的旁白。',effect:s=>s.flags.recordedHomeSilence=true,next:'ch20end'},
 ch20end:{chapter:'第二十章・完',date:'1989年6月30日｜星期五',location:'島北市・夏夜',bg:'linear-gradient(155deg,#55564f,#37433f 56%,#232d2f)',text:'錄音帶的 B 面終於不再空白。\n\n一年級結束了，卻沒有任何一個瞬間像故事裡的句點。父親仍會去港南報到；家豪明天照常練球；雨婷清晨要到早餐店；佳穎三天後搭車南下。\n\n他們只是暫時離開同一間教室，還相信七月三十日一定能在老地方碰面。\n\n十六歲的夏天正要開始。\n\n那時的宇軒還不知道，有些約定會準時實現，有些人會遲到，而有些等待，會比一個暑假長得多。\n\n——第一學年・完',next:'ch21title'},

 ch21title:{chapter:'第二十一章｜七月三十，老地方',date:'1989年7月30日｜星期日',location:'島北市・河堤公園',bg:'linear-gradient(150deg,#8e826b,#637269 50%,#3a4848)',text:'下午兩點四十七分，宇軒提早到了老地方。\n\n籃框依舊沒有網子，紅土被連日午後雷雨沖出淺溝。暑氣黏在皮膚上，公園旁的小販把收音機開得很大。\n\n三點以前，他相信所有人都會來。',next:'waitthree21'},
 waitthree21:{text:'三點整，雨婷從公車站跑來，制服以外的她看起來有些陌生。她帶著早餐店沒賣完的兩個三明治。\n\n三點十分，家豪還沒出現。三點二十分，佳穎也沒有。\n\n沒有電話可以帶在身上，等待又重新成為唯一能做的事。',choices:[['繼續留在原地等','staywait21'],['和雨婷去公共電話打家豪家','calljiahao21'],['先走到佳穎家附近看看','lookjiaying21']]},
 staywait21:{text:'宇軒與雨婷坐在沒有樹蔭的水泥椅上。三明治的美乃滋被熱氣逼到包裝邊緣。\n\n雨婷沒有催，只把打工時遇見的客人一個個說給他聽。三點三十八分，遠處終於出現一個扛著球袋奔跑的人影。',effect:s=>s.flags.waitedOldPlaceWithoutLeaving=true,next:'jiahaoarrive21'},
 calljiahao21:{location:'河堤公園・雜貨店',text:'家豪家電話響了很久，沒有人接。宇軒掛掉時，雨婷看見街角有人穿著球衣衝來。\n\n「我就知道你們會打電話！」家豪喘得說不出完整句子。\n\n原來臨時加練，他從球場一路跑來。',effect:s=>s.flags.calledForLateJiahaoSummer=true,next:'jiahaoarrive21'},
 lookjiaying21:{text:'宇軒走到張家附近，又在巷口停下。這不是約好的集合地點；如果佳穎正在往公園走，兩個人反而會錯過。\n\n他最後折返。回到公園時，家豪已經到了，雨婷替他留著半個三明治。',effect:s=>s.flags.almostLeftMeetingPlaceForJiaying=true,next:'jiahaoarrive21'},
 jiahaoarrive21:{speaker:'李家豪',text:'「教練臨時加練，我有先打去陳家，沒人接。」\n\n宇軒早已出門。消息在電話線另一端存在過，卻沒有追上他。\n\n三點四十五分，仍然只缺佳穎。',next:'waitjiaying21'},
 waitjiaying21:{text:'四點整，天空開始聚起深灰色的雲。\n\n家豪說佳穎可能記錯日期；雨婷拿出記事本，上面清楚寫著七月三十。宇軒記得她上車前還重複過一次。\n\n越確定她沒有忘記，等待就越讓人不安。',choices:[['再等到四點半','wait43021'],['請家豪留守，和雨婷去張家','splitsearch21'],['用雜貨店電話打島南外婆家','callislandsouth21']]},
 wait43021:{text:'四點二十七分，第一滴雨落在紅土上。三人把書包移到涼亭。\n\n四點二十九分，一輛計程車停在公園外。佳穎推門下車，懷裡抱著照片紙袋，頭髮被汗黏在額前。',effect:s=>s.flags.waitedUntilJiayingArrived=true,next:'jiayinglate21'},
 splitsearch21:{text:'宇軒與雨婷走到張家，鐵門緊閉。鄰居說張太太母女中午才從島南回來，後來又匆匆出門。\n\n兩人折返公園時，佳穎已坐在涼亭裡，家豪正把最後一口三明治讓給她。',effect:s=>s.flags.searchedJiayingHome=true,next:'jiayinglate21'},
 callislandsouth21:{speaker:'佳穎的外婆',text:'「佳穎早上的火車回島北啊。火車在半路故障，可能晚很多。」\n\n外婆的聲音隔著長途電話有些模糊。宇軒掛掉後，三個人終於知道該等的是什麼。\n\n四點二十九分，佳穎搭計程車趕到。',effect:s=>s.flags.calledJiayingGrandmaAboutDelay=true,next:'jiayinglate21'},
 jiayinglate21:{speaker:'張佳穎',text:'「火車壞在半路，車站公共電話又排很長。」\n\n她一口氣解釋，像怕慢一秒就會被當成忘記。\n\n「我沒有遲到兩個小時，是火車遲到。」\n\n家豪立刻說這句話不成立。',next:'failedphoto21'},
 failedphoto21:{text:'佳穎把紙袋打開。島南照相館重新處理過那格底片，只洗出一張顆粒粗糙、顏色偏藍的照片。\n\n車窗映著海，佳穎回過頭，宇軒的倒影淡淡落在她肩旁。畫面並不清楚，卻比任何人記得的都更接近那一刻。',choices:[['接過照片仔細看','studyphoto21'],['說它比清楚的照片更好','betterblur21'],['問她為何一定要洗出來','whydevelop21']]},
 studyphoto21:{text:'宇軒把照片迎著陰天的光。兩個人的臉都不完整，海卻橫跨整張相紙。\n\n佳穎站在旁邊，沒有催他還。最後她說：「一人保管一學期。」',effect:s=>s.flags.sharedRecoveredSeaPhoto=true,next:'summerstorm21'},
 betterblur21:{speaker:'張佳穎',text:'「你只是因為自己看起來比較帥才這樣說。」\n\n「根本看不清楚。」\n\n「那你怎麼知道比較好？」\n\n宇軒說不出理由。也許正因為模糊，它才更像記憶。',effect:s=>s.flags.prefersBlurredSeaPhoto=true,next:'summerstorm21'},
 whydevelop21:{speaker:'張佳穎',text:'「因為我記得那時候你在看我。」\n\n話一出口，四周只剩雨前的風聲。\n\n她立刻低頭整理其他照片。「我是說，相機鏡頭朝我。」\n\n宇軒沒有指出相機當時在自己手上。',effect:s=>s.flags.jiayingAdmittedRememberingHisLook=true,next:'summerstorm21'},
 summerstorm21:{text:'雷雨終於落下。四個人擠在小涼亭裡，雨水很快淹過紅土本壘。\n\n原本想打球、吃冰、去唱片行的計畫全部取消。他們只能坐著，把一個月裡沒能即時告訴彼此的事慢慢補回來。',next:'ch21end'},
 ch21end:{chapter:'第二十一章・完',date:'1989年7月30日｜星期日',location:'島北市・雷雨午後',bg:'linear-gradient(155deg,#64645c,#414d49 55%,#283234)',text:'那天四個人真正相處的時間不到兩小時，大部分午後都花在等待。\n\n但沒有人說浪費。\n\n沒有手機的年代，準時抵達是一種承諾；在不知道對方為何沒有出現時仍留在原地，則是另一種。\n\n很多年後，宇軒已忘記雷雨何時停，卻記得佳穎抱著那張模糊照片跑進公園時，第一句話是：「我沒有忘記。」',next:'ch22title'},

 ch22title:{chapter:'第二十二章｜島南來的電話',date:'1989年8月11日｜星期五',location:'島北市・陳家',bg:'linear-gradient(155deg,#766d60,#4f5a55 52%,#2e393a)',text:'父親到港南廠報到後，陳家的晚餐少了一副碗筷。\n\n母親說只是平日住外面；以晴卻每天仍會在玄關聽見機車聲時抬頭。宇軒開始負責倒垃圾、修鬆掉的門把，以及接起晚上所有打來的電話。\n\n八月十一日晚上八點零七分，電話響了。',next:'southcall22'},
 southcall22:{speaker:'張佳穎・電話',text:'「你輸了。」\n\n宇軒還沒說話，佳穎便先宣布。\n\n「不是說看誰先打？我先。」\n\n她已回島南陪外婆過最後一星期，聲音後面有陌生的蟬鳴。',choices:[['說她是先回島北又再南下作弊','cheatcall22'],['承認自己一直想打','admitwantedcall22'],['問她怎麼知道自己在家','askhomecall22']]},
 cheatcall22:{speaker:'張佳穎',text:'「規則又沒有說不能回去兩次。」\n\n兩人為一場根本沒有獎品的比賽爭了很久。等笑聲停下，電話兩端都沒有急著掛。',effect:s=>s.flags.arguedSummerCallRules=true,next:'nighttalk22'},
 admitwantedcall22:{speaker:'陳宇軒',text:'「我有幾次拿起電話，只是不知道要講什麼。」\n\n佳穎安靜兩秒。\n\n「沒東西講也可以打啊。電話又不是考試。」',effect:s=>s.flags.admittedWantedSummerCall=true,next:'nighttalk22'},
 askhomecall22:{speaker:'張佳穎',text:'「我先打你家，阿姨說你去倒垃圾，叫我五分鐘後再打。」\n\n宇軒第一次意識到，一通電話抵達自己以前，可能已經先和家人留下小小的交集。',effect:s=>s.flags.motherKnowsJiayingCalls=true,next:'nighttalk22'},
 nighttalk22:{text:'佳穎說島南午後總會下雨，外婆家牆上還掛著她小學時的照片。宇軒說父親平日不在家，以晴最近常把電視開得很大。\n\n話題沒有順序，卻一直沒有結束。電話費每分鐘都在累積。',next:'fatherweekend22'},
 fatherweekend22:{speaker:'張佳穎・電話',text:'「你爸週末會回來吧？」\n\n「會。」\n\n「那你還是很在意。」\n\n不是疑問。宇軒靠著電話桌坐到地板，第一次把父親離開後家裡的安靜說給同年齡的人聽。',choices:[['說自己應該快點習慣','getused22'],['承認其實會生氣','angryfather22'],['說以晴比自己更難過','sistermore22']]},
 getused22:{speaker:'張佳穎',text:'「習慣跟不在意不一樣。」\n\n她在遠方輕輕敲著電話旁的桌面，節奏像上次談琴時一樣。\n\n「你可以習慣，但還是想他。」',effect:s=>s.flags.jiayingDistinguishedHabitAndMissing=true,next:'photoagreement22'},
 angryfather22:{speaker:'陳宇軒',text:'「有時候會覺得他自己決定就走了。」\n\n「可是又知道他是為了家裡？」\n\n宇軒嗯了一聲。佳穎說，兩種感覺可以同時存在，不必選哪一個才算懂事。',effect:s=>s.flags.admittedAngerAtFather=true,next:'photoagreement22'},
 sistermore22:{speaker:'張佳穎',text:'「你每次都先講別人。」\n\n「因為以晴真的比較——」\n\n「我知道。可是現在電話是你接的。」\n\n宇軒沉默。佳穎沒有把問題收回。',effect:s=>s.flags.jiayingNoticedYuxuanDeflectsToOthers=true,next:'photoagreement22'},
 photoagreement22:{speaker:'張佳穎・電話',text:'「照片先放你那邊，開學再帶來。」\n\n「不是說一人一學期？」\n\n「所以你保管到寒假。」\n\n她在電話裡把一張照片分配成一段未來，好像已確定他們開學後仍會見面。',effect:s=>{s.flags.keepsRecoveredSeaPhotoTerm=true;s.items.push('重新洗出的海邊車窗照')},next:'phonebill22'},
 phonebill22:{text:'母親在客廳咳了一聲。牆上時鐘已經八點五十二分。\n\n佳穎也聽見，問是不是講太久。兩人同時說「那先這樣」，又同時沒有掛。',choices:[['先掛電話','hangfirst22'],['等她先掛','waithang22'],['約開學前再打一通','callagain22']]},
 hangfirst22:{speaker:'陳宇軒',text:'「晚安。」\n\n「晚安。」\n\n宇軒把聽筒放回去，手仍停在上面。客廳一下恢復只剩電視聲的夜晚。',effect:s=>s.flags.yuxuanHungUpSummerCall=true,next:'ch22end'},
 waithang22:{text:'兩邊都沒有出聲。最後遠處傳來外婆催佳穎洗澡，她才笑著說真的要掛了。\n\n喀一聲之後，空線的嘟聲持續了幾秒，宇軒才放下聽筒。',effect:s=>s.flags.waitedJiayingHangUp=true,next:'ch22end'},
 callagain22:{speaker:'張佳穎',text:'「不用約。想打就打。」\n\n她說得很輕。\n\n「反正沒事也可以。」\n\n這句話從六月留到八月，終於不再像玩笑。',effect:s=>s.flags.noReasonCallPermissionConfirmed=true,next:'ch22end'},
 ch22end:{chapter:'第二十二章・完',date:'1989年8月11日｜星期五',location:'陳家・深夜',bg:'linear-gradient(155deg,#5d5850,#3e4845 55%,#263032)',text:'月底電話帳單寄來時，母親圈起一通島南長途電話。\n\n宇軒已準備挨罵，母親卻只說下次不要講那麼久，又把帳單收進抽屜。\n\n那個夏天，距離第一次有了價錢。\n\n四十五分鐘的長途電話不便宜，可對十六歲的兩個人而言，能在兩座城市的夜裡確認彼此都還在，似乎比任何一件暑假新衣都值得。',next:'ch23title'},

 ch23title:{chapter:'第二十三章｜不同班的九月',date:'1989年9月1日｜星期五',location:'島北高中・二年級走廊',bg:'linear-gradient(150deg,#817a6c,#596964 50%,#344344)',text:'分班表貼在二樓走廊。\n\n陳宇軒——二年五班，文組。\n張佳穎——二年五班，文組。\n黃雨婷——二年二班，文組。\n李家豪——二年八班，理組。\n\n四個名字第一次不再同時出現在同一張名單上。',next:'findnames23'},
 findnames23:{text:'家豪先說這樣也好，二年八班離球場最近。雨婷說二班與五班只隔一層樓。佳穎沒有說話，只用手指確認宇軒的名字確實在自己上方三行。\n\n鐘聲響起，四個人必須朝三個方向走。',choices:[['先陪雨婷找到二班','walkyuting23'],['和家豪約午餐地點','lunchjiahao23'],['與佳穎一起進五班','enterfive23']]},
 walkyuting23:{speaker:'黃雨婷',text:'「我知道教室在哪裡。」\n\n她嘴上這樣說，仍讓宇軒陪到樓梯口。\n\n「中午如果我沒下來，可能是班長的事，不用等太久。」\n\n還沒進教室，她已先擔心別人等。',effect:s=>s.flags.walkedYutingToNewClass=true,next:'newclass23'},
 lunchjiahao23:{speaker:'李家豪',text:'「十二點十分，福利社後面。遲到的人請飲料。」\n\n「你自己最危險吧。」\n\n家豪背著球袋跑向另一棟。約定從自然發生的日常，變成必須刻意說清楚的時間地點。',effect:s=>s.flags.setNewClassLunchMeeting=true,next:'newclass23'},
 enterfive23:{text:'宇軒與佳穎並肩走進二年五班。教室裡都是一半熟悉、一半陌生的臉。\n\n兩人沒有坐在一起，卻在放書包前先交換了一個只有彼此看得懂的鬆口氣眼神。',effect:s=>s.flags.sameClassWithJiayingYearTwo=true,next:'newclass23'},
 newclass23:{location:'島北高中・二年五班',speaker:'新班導師',text:'「我是林文瑞，教國文。二年級不再有人每天提醒你們帶什麼、交什麼。」\n\n新老師的字比黃子芸端正，語氣也更快。黑板上的「二年五班」還沒有任何共同記憶。',next:'seatagain23'},
 seatagain23:{text:'座位按身高排。佳穎坐在第二排靠窗，宇軒在第四排中間。\n\n距離不算遠，卻不能像上學期那樣每節下課自然聚成四個人。雨婷與家豪的空位，散落在另外兩間教室。',next:'firstlunch23'},
 firstlunch23:{location:'福利社後方',text:'十二點十分，宇軒與佳穎先到。十二點十八分，家豪穿著被汗浸濕的球衣出現。\n\n十二點二十五分，雨婷仍沒有來。午休只剩二十五分鐘。',choices:[['再等五分鐘','waityuting23'],['去二班找她','findyuting23'],['先替她買一份麵包','buyyuting23']]},
 waityuting23:{text:'十二點二十九分，雨婷抱著點名簿跑下樓。新班導師臨時叫她當班長。\n\n她一路道歉，三個人卻早已把最不辣的麵包留在袋子裡。',effect:s=>s.flags.waitedFirstLunchYuting=true,next:'shortlunch23'},
 findyuting23:{location:'島北高中・二年二班',text:'宇軒走到二班，雨婷正站在講台核對午餐費。她看見他時先驚訝，再看牆上的時鐘。\n\n「我忘了時間。」\n\n這是雨婷極少說出口的句子。',effect:s=>s.flags.foundYutingWorkingAtLunch=true,next:'shortlunch23'},
 buyyuting23:{text:'佳穎挑了一個紅豆麵包，家豪說雨婷可能比較想吃鹹的。三人爭到最後各買一個。\n\n雨婷趕來時，看著兩個麵包，不知道該先拒絕哪一份。',effect:s=>s.flags.boughtTwoLunchesForYuting=true,next:'shortlunch23'},
 shortlunch23:{text:'四個人只一起坐了十一分鐘。\n\n家豪要提早回球場，雨婷得送點名簿。佳穎咬著吸管說：「以前午休怎麼那麼長？」\n\n時間沒有變，能交給彼此的部分卻變少了。',next:'hallwaypromise23'},
 hallwaypromise23:{speaker:'張佳穎',text:'「每星期五至少一起吃一次午餐。」\n\n家豪說球隊不一定放人；雨婷說班務可能很多。\n\n「那就能來的人來。」佳穎把規則改得更小，「不要因為湊不齊四個就全部取消。」',choices:[['同意不必每次等齊','agreepartial23'],['堅持四個人才算','needfour23'],['提議另設放學備用時間','backupmeet23']]},
 agreepartial23:{text:'宇軒點頭。這不是降低承諾，而是承認每個人開始有不能放下的生活。\n\n第一個星期五的約定只維持十一分鐘，卻仍被保留下來。',effect:s=>s.flags.acceptedPartialFriendMeetings=true,next:'ch23end'},
 needfour23:{speaker:'黃雨婷',text:'「如果一定要四個，有一次不能來的人就會覺得是自己害大家取消。」\n\n她說得很輕。宇軒明白，她大概早已想過自己會是最常缺席的那個。',effect:s=>s.flags.learnedNotToRequireWholeGroup=true,next:'ch23end'},
 backupmeet23:{speaker:'李家豪',text:'「星期三放學，老地方？」\n\n三個人同時提醒他星期三要練球。家豪抓抓頭，第一次發現不是所有時間都能再用一個約定補回來。',effect:s=>s.flags.triedBackupFriendTime=true,next:'ch23end'},
 ch23end:{chapter:'第二十三章・完',date:'1989年9月1日｜星期五',location:'島北高中・午後',bg:'linear-gradient(155deg,#666159,#46504c 55%,#2b3435)',text:'下午上課鐘響起，四個人各自回到三間教室。\n\n一年級時，他們以為關係只要沒有爭吵就不會改變。到了二年級才知道，沒有誰做錯任何事，距離仍會從課表、樓層、練習和打工之間慢慢長出來。\n\n維持一段友情，不再只是放學時順路同行。\n\n而是明明不再順路，仍記得在星期五中午走到同一個地方。',next:'ch24title'},

 ch24title:{chapter:'第二十四章｜走廊的三分鐘',date:'1989年9月15日｜星期五',location:'島北高中・二年五班',bg:'linear-gradient(150deg,#7b756a,#56645f 52%,#323f40)',text:'分班兩星期後，新生活開始形成固定形狀。\n\n家豪午休幾乎都在球場；雨婷成了二班班長，放學後還要趕工作。宇軒與佳穎明明在同一班，能說話的時間卻常只有兩節課之間。\n\n那天下課，佳穎把一張樂譜折在課本裡，匆匆走出教室。',next:'followhall24'},
 followhall24:{text:'宇軒在飲水機旁找到她。佳穎背對人群，用紅筆在譜上改記號。\n\n校慶音樂節目缺伴奏，新班導師推薦她參加甄選。她還沒有告訴另外兩人。',choices:[['問她是否又緊張','nervousagain24'],['說放學陪她練','practicewith24'],['先替她擋住回教室的人潮','shieldhall24']]},
 nervousagain24:{speaker:'張佳穎',text:'「不是怕上台。」\n\n她把紅筆蓋上。\n\n「是怕大家已經記得去年那次。如果今年彈不好，就像證明上次只是運氣。」\n\n原來成功也會變成下一次害怕的理由。',effect:s=>s.flags.knowsJiayingSuccessPressure=true,next:'threeMinutes24'},
 practicewith24:{speaker:'張佳穎',text:'「你又不會彈。」\n\n「我可以幫妳聽有沒有停。」\n\n「每個人都聽得出來有沒有停。」\n\n她笑了，最後仍把放學練習的時間告訴他。',effect:s=>s.flags.offeredJiayingPracticeCompany=true,next:'threeMinutes24'},
 shieldhall24:{text:'宇軒站到外側，讓抱著球具與講義的學生不會撞到她。\n\n佳穎沒有抬頭，只把身體往牆邊移了一點，替他也留出位置。兩人共享一小塊不被走廊推著走的空間。',effect:s=>s.flags.sharedHallwayShelter=true,next:'threeMinutes24'},
 threeMinutes24:{text:'預備鐘響起。距離上課只剩三分鐘。\n\n佳穎把譜塞回課本，忽然問：「如果明年我們又不同班，你還會每節下課來找我嗎？」\n\n問題來得沒有前文，卻像已經想了很久。',choices:[['「會，只是可能會遲到。」','willcome24'],['「妳也可以來找我。」','youcome24'],['問她為什麼現在就想明年','whyfuture24']]},
 willcome24:{speaker:'陳宇軒',text:'「會啊，只是可能會遲到。」\n\n「遲到多久？」\n\n「三分鐘以內。」\n\n佳穎看了一眼走廊時鐘。「那你現在還有四十秒。」',effect:s=>s.flags.promisedThreeMinuteHallway=true,next:'backclass24'},
 youcome24:{speaker:'張佳穎',text:'「我現在不是常常來找你嗎？」\n\n宇軒回想，才發現桌上的便條、抽屜裡的糖與每次下課那句「欸」，有一半都是她先走過來。',effect:s=>s.flags.realizedJiayingOftenInitiates=true,next:'backclass24'},
 whyfuture24:{speaker:'張佳穎',text:'「因為一年級結束得比我以為的快。」\n\n她把視線轉向操場。\n\n「現在先問，以後才不會來不及。」',effect:s=>s.flags.jiayingFearsTimePassingFaster=true,next:'backclass24'},
 backclass24:{text:'兩人趕在老師進門前回到座位。\n\n整段談話只有三分鐘，短得沒辦法寫進日記，卻讓宇軒一整堂課都記得走廊時鐘秒針移動的聲音。',next:'fridaymissing24'},
 fridaymissing24:{location:'福利社後方・午休',text:'那星期五，家豪被教練留下，雨婷替班上處理遺失的班費。\n\n約定地點只有宇軒與佳穎。兩人沒有因為湊不齊四個而離開，只把四瓶汽水改買成兩瓶。',choices:[['談家豪最近總缺席','talkjiahao24'],['談雨婷是不是太累','talkyuting24'],['不談缺席的人，只一起吃飯','justlunch24']]},
 talkjiahao24:{speaker:'張佳穎',text:'「他不是不想來。」\n\n佳穎用吸管戳著瓶蓋。\n\n「可是不想來和不能來，留在這裡的人有時候感覺一樣。」\n\n兩人都沒有責怪家豪，只第一次承認失望仍會存在。',effect:s=>s.flags.discussedJiahaoAbsenceWithoutBlame=true,next:'ch24end'},
