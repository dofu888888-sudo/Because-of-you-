<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#10282d" />
  <title>因你快樂，浮現笑容</title>
  <style>
    :root{--ink:#f4edda;--muted:#b9b39f;--accent:#e2ad5b;--deep:#0d2024;--panel:rgba(11,28,31,.87);--line:rgba(238,220,181,.18)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:#071416;color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;-webkit-tap-highlight-color:transparent}
    button{font:inherit}
    #app{height:100%;min-height:100dvh;position:relative;isolation:isolate;background:linear-gradient(180deg,rgba(6,19,22,.05),rgba(6,17,19,.68)),var(--scene-bg,linear-gradient(135deg,#284f56,#10282d 55%,#081719));transition:background 1s ease}
    #app::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.32;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px),radial-gradient(circle at 72% 26%,rgba(255,210,127,.22),transparent 25%);pointer-events:none}
    #app::after{content:"";position:absolute;inset:0;z-index:-1;box-shadow:inset 0 0 120px rgba(0,0,0,.78);pointer-events:none}
    .screen{display:none;height:100%;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
    .screen.active{display:flex}
    #title-screen{align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(4,18,22,.18),rgba(4,15,17,.85))}
    .title-wrap{width:min(620px,100%);animation:fade 1.6s both}
    .year-mark{letter-spacing:.34em;color:var(--accent);font:12px/1.5 ui-monospace,monospace;margin-bottom:25px}
    h1{font-weight:500;letter-spacing:.12em;font-size:clamp(31px,7vw,58px);margin:0;line-height:1.45;text-shadow:0 3px 28px #000}
    .subtitle{color:var(--muted);font-size:14px;letter-spacing:.16em;margin:16px 0 55px}
    .menu{display:grid;gap:12px;width:min(300px,90%);margin:auto}
    .menu button,.choice{border:1px solid var(--line);background:rgba(9,25,28,.72);color:var(--ink);padding:14px 18px;cursor:pointer;transition:.2s;border-radius:2px}
    .menu button:hover,.choice:hover,.choice:focus-visible{border-color:rgba(226,173,91,.68);background:rgba(32,54,54,.92);transform:translateY(-1px);outline:none}
    .menu button:disabled{opacity:.35;cursor:default;transform:none}
    .version{position:absolute;bottom:max(9px,env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));color:#748286;font:10px ui-monospace,monospace}
    #game-screen{flex-direction:column;max-width:900px;margin:auto}
    .topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding:3px 2px 13px;color:var(--muted);font:12px/1.5 ui-monospace,monospace;letter-spacing:.08em}
    .location{text-align:right;color:#d8caa9}
    .story{width:min(720px,100%);margin:auto;overflow-y:auto;padding:clamp(28px,7vh,68px) 2px 25px;scrollbar-width:none;mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 100%)}
    .story::-webkit-scrollbar{display:none}
    .chapter{color:var(--accent);font-size:12px;letter-spacing:.24em;margin-bottom:20px;text-transform:uppercase}
    .speaker{font-size:14px;color:#e6be7e;letter-spacing:.12em;margin:0 0 10px;min-height:1em}
    .text{font-size:clamp(17px,4.15vw,21px);line-height:2.05;letter-spacing:.045em;text-shadow:0 2px 12px #000;white-space:pre-line;margin:0;animation:rise .5s both}
    .choices{display:grid;gap:10px;margin-top:31px;padding-bottom:4px;animation:fade .45s both}
    .choice{text-align:left;line-height:1.55;position:relative;padding-left:44px}
    .choice span{position:absolute;left:17px;color:var(--accent);font:12px ui-monospace,monospace;top:17px}
    .continue{margin-top:31px;background:none;border:0;border-bottom:1px solid rgba(226,173,91,.55);color:#ead7b2;padding:8px 0;cursor:pointer;letter-spacing:.12em}
    .utility{display:flex;gap:10px;justify-content:flex-end;padding-top:11px;border-top:1px solid var(--line)}
    .icon-btn{border:0;background:transparent;color:#9aa8a7;padding:6px 5px;cursor:pointer;font:12px ui-monospace,monospace}
    .icon-btn:hover{color:var(--ink)}
    .overlay{position:absolute;inset:0;background:rgba(3,10,11,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:28px;z-index:10}
    .overlay.show{display:flex}
    .card{background:#102528;border:1px solid var(--line);width:min(470px,100%);padding:28px;box-shadow:0 25px 80px #000}
    .card h2{margin:0 0 19px;font-size:20px;font-weight:500;letter-spacing:.12em}
    .card p{color:var(--muted);line-height:1.8;font-size:14px}
    .card dl{display:grid;grid-template-columns:90px 1fr;gap:11px;margin:24px 0;color:#d7cdb5;font-size:14px}.card dt{color:#87999a}.card dd{margin:0}
    .card button{width:100%;margin-top:10px}
    .toast{position:absolute;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 60px));transform:translate(-50%,10px);opacity:0;background:#e5d3ac;color:#17282a;padding:8px 14px;font-size:12px;transition:.3s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @media(max-height:650px){.story{padding-top:22px}.text{line-height:1.8}.choices{margin-top:18px}.subtitle{margin-bottom:28px}}
  </style>
</head>
<body>
<main id="app">
  <section id="title-screen" class="screen active">
    <div class="title-wrap">
      <div class="year-mark">ISLAND NORTH · 1988</div>
      <h1>因你快樂，<br>浮現笑容</h1>
      <div class="subtitle">一段關於相遇、錯過，與長大的故事</div>
      <div class="menu">
        <button id="new-game">開始故事</button>
        <button id="continue-game" disabled>繼續</button>
      </div>
    </div>
    <div class="version">PROLOGUE 0.1</div>
  </section>

  <section id="game-screen" class="screen">
    <header class="topbar"><div id="date">1988年8月31日｜星期三</div><div class="location" id="location">島北市・陳家</div></header>
    <article class="story" id="story">
      <div class="chapter" id="chapter"></div><div class="speaker" id="speaker"></div><p class="text" id="text"></p><div class="choices" id="choices"></div>
    </article>
    <footer class="utility"><button class="icon-btn" id="status-btn">隨身物品</button><button class="icon-btn" id="save-btn">儲存</button><button class="icon-btn" id="title-btn">回到標題</button></footer>
  </section>

  <div class="overlay" id="overlay"><div class="card"><h2>宇軒的口袋</h2><p>這裡只會顯示宇軒自己知道的事。人的心情，沒有數字可以確認。</p><dl id="status-list"></dl><div class="menu"><button id="close-overlay">關閉</button></div></div></div>
  <div class="toast" id="toast">已儲存</div>
</main>
<script>
const SAVE_KEY='smile-novel-save-v1';
const scenes={
 intro:{chapter:'序章｜夏末',date:'1988年8月31日｜星期三',location:'島北市・陳家',bg:'linear-gradient(145deg,#31535a,#182f34 52%,#091618)',text:'在手機還不是每個人都擁有的東西以前，想見一個人，得先約好時間與地點。\n\n如果對方沒有出現，你唯一能做的，往往只有等待。',next:'radio'},
 radio:{speaker:'收音機',text:'「……明日島北地區仍為多雲午後陣雨。提醒各位聽眾，出門別忘了攜帶雨具。」\n\n主持人的聲音被一陣沙沙雜訊吞掉。陳宇軒伸手拍了拍收音機，音樂才重新浮出來。',next:'room'},
 room:{text:'錄音帶轉到盡頭，喀一聲停了。\n\n書桌上壓著島北高中的新生通知，旁邊是讀到一半的小說。明天開學；母親已經第三次提醒他早點睡。',choices:[['繼續把小說讀完','novel'],['把錄音帶翻面，再聽一次','music'],['關掉檯燈，早點睡','sleep']]},
 novel:{text:'他把通知單推遠了一點，翻回夾著公車票的那頁。\n\n故事裡的人總知道自己要去哪裡。宇軒不知道。他只希望時間走快一點，最好一眨眼就已經是個不必被管的大人。',effect:s=>{s.flags.restless=true;s.items.push('讀到一半的小說')},next:'mother'},
 music:{text:'鉛筆插進卡帶的齒輪，鬆掉的帶子被慢慢捲緊。按下播放鍵後，歌聲有些失真，卻仍填滿整個房間。\n\n宇軒想，也許長大以後，他會買一整面牆的唱片。',effect:s=>{s.flags.music=true;s.items.push('混音錄音帶')},next:'mother'},
 sleep:{text:'宇軒把鬧鐘轉到六點半。黑暗中，客廳的電視聲、妹妹削鉛筆的聲音，以及父親還沒回家的空位，都比平常清楚。\n\n他閉上眼睛，卻很久沒有睡著。',effect:s=>{s.flags.rested=true},next:'mother'},
 mother:{speaker:'媽媽',text:'「宇軒，明天第一天，不要遲到。還有，高中開始不能再像國中那樣混，聽到沒有？」\n\n她沒等回答，便替他把房門帶上。門縫的光越來越窄。',choices:[['「知道啦。」','reply'],['假裝已經睡著','silent']]},
 reply:{speaker:'陳宇軒',text:'「知道啦。」\n\n聲音比他原本想的更不耐煩。門外安靜了一會兒，腳步才離開。',effect:s=>s.flags.spoke=true,next:'morning'},
 silent:{text:'宇軒沒有出聲。\n\n門外的人似乎又站了一會兒，最後什麼也沒說。',effect:s=>s.flags.silent=true,next:'morning'},
 morning:{chapter:'第一章｜開學日',date:'1988年9月1日｜星期四',location:'島北市・清晨',bg:'linear-gradient(155deg,#c69d68,#5f7e7d 47%,#203c43)',text:'六點三十七分。\n\n窗外傳來送報機車的聲音。夏天還沒真正離開，陽光已經爬上對面公寓的水塔。',next:'sister'},
 sister:{speaker:'陳以晴',text:'「哥，你再不下來，媽要把你的早餐拿去餵狗了。」\n\n妹妹從門外探進半張臉。她的制服袖口沾著一小點沒洗掉的藍色顏料。',choices:[['問她昨晚又畫了什麼','askart'],['叫她不要亂碰房門','brush'],['抓起書包衝下樓','rush']]},
 askart:{speaker:'陳宇軒',text:'「妳昨晚又在畫什麼？」\n\n以晴愣了一下，把袖口藏到背後。\n\n「沒有啦……就隨便畫。」\n\n她笑得很輕。宇軒第一次發現，妹妹被問到畫畫時，眼睛會變得不太一樣。',effect:s=>{s.flags.sisterArt=true;s.memories.push('以晴藏在袖口的藍色顏料')},next:'street'},
 brush:{speaker:'陳宇軒',text:'「不要每次都直接開門啦。」\n\n「誰叫你都不起床。」以晴吐了吐舌頭，跑下樓。',next:'street'},
 rush:{text:'宇軒看了一眼鬧鐘，抓起書包衝出去。以晴在樓梯口笑他連制服領子都沒翻好。',effect:s=>s.flags.rushed=true,next:'street'},
 street:{location:'島北市・民生東路',bg:'linear-gradient(145deg,#c7a36d,#547174 50%,#203337)',text:'街角早餐店冒著白煙，郵差把信塞進一排鐵皮信箱。公車站前擠滿穿著不同制服的學生。\n\n宇軒走到巷口時，一顆籃球從背後輕輕撞上他的書包。',next:'jiahao'},
 jiahao:{speaker:'李家豪',text:'「陳宇軒！第一天就走這麼快，是怕我跟你同班喔？」\n\n家豪把籃球夾在腰間，笑得像暑假根本沒有結束。',choices:[['「最好別再跟你同班。」','tease'],['「你怎麼知道我走這條？」','wonder'],['把球搶過來先跑','play']]},
 tease:{speaker:'李家豪',text:'「來不及了，我昨天去看分班表——一年三班。你這輩子甩不掉我了。」\n\n他說得理直氣壯，好像「這輩子」真的能一眼看完。',effect:s=>s.flags.jiahaoTease=true,next:'dream'},
 wonder:{speaker:'李家豪',text:'「你家到學校就這條最快啊。認識你幾年了，這還要猜？」\n\n有些人出現在身邊太久，久到會忘記那也是一種被記得。',effect:s=>s.memories.push('家豪記得自己上學的路'),next:'dream'},
 play:{text:'宇軒一把抄走籃球往前跑。\n\n「喂！那顆很貴欸！」\n\n兩人的鞋底踏過昨夜留下的水窪，驚得早餐店門口的麻雀一齊飛起。',effect:s=>s.flags.playful=true,next:'dream'},
 dream:{speaker:'李家豪',text:'「欸，宇軒。」\n\n等紅燈時，家豪忽然盯著對街運動用品店裡的棒球手套。\n\n「你覺得……真的有人可以靠打球過一輩子嗎？」',choices:[['「你不是說要當國手？」','national'],['「不知道，但你可以試試看。」','support'],['「先想辦法別被當掉吧。」','deflect']]},
 national:{speaker:'陳宇軒',text:'「你不是整天說要當國手？」\n\n「講講而已啦。」家豪笑了，視線卻還留在玻璃後的手套上。',effect:s=>s.flags.heardDream=true,next:'schoolgate'},
 support:{speaker:'陳宇軒',text:'「不知道。但你真的想，就試試看啊。」\n\n家豪沒有馬上接話。綠燈亮了幾秒，他才用肩膀撞了宇軒一下。\n\n「走啦，快遲到了。」',effect:s=>{s.flags.supportedDream=true;s.memories.push('清晨路口，家豪沒有說出口的夢')},next:'schoolgate'},
 deflect:{speaker:'陳宇軒',text:'「你先想辦法不要被當掉吧。」\n\n「靠，第一天就在觸我霉頭。」家豪笑罵著往前走。那個問題也就被留在紅燈的另一邊。',effect:s=>s.flags.deflectedDream=true,next:'schoolgate'},
 schoolgate:{location:'島北高中・校門',bg:'linear-gradient(145deg,#8ea28e,#496966 48%,#1a3336)',text:'七點四十九分。\n\n島北高中的校門比國中大得多。穿制服的人潮向裡湧去，教官的哨音、腳踏車鈴與樹上的蟬聲混在一起。\n\n宇軒跨進校門。那時的他還不知道，接下來遇見的人，會在往後許多年裡，一次又一次回到他的生命。',next:'classroom'},
 classroom:{location:'島北高中・一年三班',text:'黑板上寫著座位表。家豪果然在最後一排，正隔著半間教室對他揮手。\n\n靠窗的位置，一個綁著馬尾的女生正幫老師把作業簿分成幾疊；另一個女生坐在她桌沿，笑著說了些什麼，害她慌張地差點把整疊簿子弄掉。',choices:[['先去找家豪','toJiahao'],['幫忙撿起掉落的簿子','toGirls'],['安靜找到自己的座位','toSeat']]},
 toJiahao:{text:'宇軒穿過教室走向最後一排。家豪已經在打聽班上誰會打棒球。\n\n窗邊傳來一陣笑聲。他回頭時，只看見那個外向的女生把掉落的簿子抱回桌上。',effect:s=>s.flags.firstJiahao=true,next:'teacher'},
 toGirls:{text:'一本簿子滑到宇軒鞋邊。他彎腰撿起來，放回最上面。\n\n綁馬尾的女生小聲說：「謝謝。」\n\n她旁邊的人則大方地看著他。',next:'meetGirls'},
 meetGirls:{speaker:'張佳穎',text:'「你也是三班的？我叫張佳穎。她是黃雨婷，我們國中就認識了。」\n\n雨婷像是對這種介紹方式有些無奈，只好又對宇軒點了一次頭。',choices:[['自我介紹','introduce'],['指向後排：「我朋友在叫我。」','escape']]},
 introduce:{speaker:'陳宇軒',text:'「陳宇軒。」\n\n上午的陽光越過窗框，恰好落在他的側臉。佳穎本來還想說什麼，卻忽然停了半拍。\n\n「……喔。陳宇軒。」',effect:s=>{s.flags.metProperly=true;s.memories.push('開學第一天，窗邊散落的作業簿')},next:'teacher'},
 escape:{speaker:'陳宇軒',text:'「我朋友在叫我，謝啦。」\n\n「明明是我們跟你道謝吧？」佳穎在後面笑了一聲。',effect:s=>s.flags.metBriefly=true,next:'teacher'},
 toSeat:{text:'宇軒照著座位表坐下，把書包掛在椅背。周遭的人很快聊成一片，他翻開新課本，假裝自己很忙。\n\n過了一會兒，一本簿子被遞到他桌上。右上角工整寫著：黃雨婷。',effect:s=>s.flags.observer=true,next:'teacher'},
 teacher:{speaker:'黃子芸',text:'「各位早安，我姓黃，黃子芸。接下來三年，我是你們的班導師。」\n\n講台上的年輕老師沒有立刻翻點名簿，而是拿起粉筆，在自己的名字旁寫下一句話：\n\n——你想成為什麼樣的人？',next:'question'},
 question:{speaker:'黃子芸',text:'「不用現在回答我。老實說，十五、六歲就知道答案的人才奇怪。」\n\n班上有人笑了。\n\n「但我希望畢業以前，你們至少有勇氣替自己想一次。」',choices:[['把這句話抄進課本空白處','write'],['覺得只是老師漂亮話','dismiss'],['望向窗外，沒有答案','noanswer']]},
 write:{text:'宇軒把那句話抄在國文課本的第一頁。字寫得有些歪。\n\n多年以後，他會再次翻到這一頁。',effect:s=>{s.flags.keptQuestion=true;s.items.push('寫著一句問題的國文課本');s.memories.push('黃子芸老師的第一個問題')},next:'ending'},
 dismiss:{text:'宇軒沒有動筆。大人總喜歡說一些好聽的話，最後還不是只看考試成績。\n\n他那時真心這麼相信。',effect:s=>s.flags.dismissedTeacher=true,next:'ending'},
 noanswer:{text:'窗外的雲移得很慢。宇軒想了半天，腦中仍是一片空白。\n\n他只知道，自己想快點長大。',effect:s=>s.flags.noFuture=true,next:'ending'},
 ending:{chapter:'序章・完',date:'1988年9月1日｜星期四',location:'島北高中・一年三班',bg:'linear-gradient(160deg,#bd9b69,#476767 48%,#172e33)',text:'風從走廊吹進教室，翻動桌上的課本。\n\n李家豪、張佳穎、黃雨婷、黃子芸。\n\n四個名字，在這一天以前，還沒有同時出現在陳宇軒的人生裡。\n\n而他們誰也不知道，這個看似普通的早晨，會被記得那麼久。\n\n——《第一章：放學以後》待續',end:true}
};

let state={scene:'intro',items:['零錢 42 元','學生證','家門鑰匙'],memories:[],flags:{},history:[]};
const $=s=>document.querySelector(s),title=$('#title-screen'),game=$('#game-screen'),story=$('#story'),overlay=$('#overlay');
function hasSave(){return !!localStorage.getItem(SAVE_KEY)}
function updateContinue(){ $('#continue-game').disabled=!hasSave() }
function showGame(){title.classList.remove('active');game.classList.add('active');render()}
function newGame(){state={scene:'intro',items:['零錢 42 元','學生證','家門鑰匙'],memories:[],flags:{},history:[]};showGame()}
function save(show=true){localStorage.setItem(SAVE_KEY,JSON.stringify(state));updateContinue();if(show)toast('已儲存')}
function load(){try{state=JSON.parse(localStorage.getItem(SAVE_KEY));showGame()}catch(e){newGame()}}
function go(id){const current=scenes[state.scene];state.history.push(state.scene);state.scene=id;const s=scenes[id];if(s.effect&&!state.flags['effect_'+id]){s.effect(state);state.flags['effect_'+id]=true}save(false);render()}
function render(){const s=scenes[state.scene];$('#chapter').textContent=s.chapter||'';$('#speaker').textContent=s.speaker||'';$('#text').textContent=s.text;$('#date').textContent=s.date||nearest('date');$('#location').textContent=s.location||nearest('location');if(s.bg)$('#app').style.setProperty('--scene-bg',s.bg);const c=$('#choices');c.innerHTML='';if(s.choices){s.choices.forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span>${String.fromCharCode(65+i)}</span>${x[0]}`;b.onclick=()=>go(x[1]);c.appendChild(b)})}else if(s.next){const b=document.createElement('button');b.className='continue';b.textContent='繼續 ›';b.onclick=()=>go(s.next);c.appendChild(b)}else if(s.end){const b=document.createElement('button');b.className='continue';b.textContent='回到標題';b.onclick=toTitle;c.appendChild(b)}story.scrollTop=0}
function nearest(key){let id=state.scene;const seen=new Set;while(id&&!seen.has(id)){seen.add(id);if(scenes[id][key])return scenes[id][key];const idx=state.history.lastIndexOf(id);id=idx>0?state.history[idx-1]:state.history[state.history.length-1]}return key==='date'?'1988年9月1日':'島北市'}
function toTitle(){game.classList.remove('active');title.classList.add('active');updateContinue()}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1300)}
$('#new-game').onclick=()=>{if(hasSave()&&!confirm('開始新故事會覆蓋目前進度，確定嗎？'))return;newGame()};$('#continue-game').onclick=load;$('#save-btn').onclick=()=>save(true);$('#title-btn').onclick=toTitle;
$('#status-btn').onclick=()=>{$('#status-list').innerHTML=`<dt>姓名</dt><dd>陳宇軒</dd><dt>年齡</dt><dd>16 歲</dd><dt>現金</dt><dd>42 元</dd><dt>物品</dt><dd>${state.items.join('、')}</dd><dt>記得的事</dt><dd>${state.memories.length?state.memories.join('；'):'還沒有特別記住的事'}</dd>`;overlay.classList.add('show')};
$('#close-overlay').onclick=()=>overlay.classList.remove('show');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')};updateContinue();
</script>
</body>
</html>
